           {"id":"control_remoto_back","label":{"en":"Remote control — back","zh":"遥控器 — 背面"},
            "help":{"en":"The back, in its own frame, showing the battery cover and any label.",
                    "zh":"拍摄背面，单独成图，需拍到电池盖和标签。",
                    "es":"El reverso, en su propia foto, mostrando la tapa de la batería y cualquier etiqueta."}},
           {"id":"cable_poder","label":{"en":"Power cable","zh":"电源线"},
            "help":{"en":"One photo of the whole cable with both plugs visible. There is no second side to check on a cable.",
                    "zh":"拍摄整条电源线，两端插头都要入镜。线材没有需要另行检查的另一面。"}},
           {"id":"microfonos_front","label":{"en":"Microphones — front","zh":"麦克风 — 正面"},
            "help":{"en":"The head and body of each microphone, with the grille and the brand visible.",
                    "zh":"拍摄每支麦克风的网头和机身，需拍到网罩和品牌标识。"}},
           {"id":"microfonos_back","label":{"en":"Microphones — back","zh":"麦克风 — 背面"},
            "help":{"en":"The opposite side, showing the switch, the battery compartment and the connector.",
                    "zh":"拍摄另一面，需拍到开关、电池仓和接头。"}},
           {"id":"tripode_front","label":{"en":"Tripod — front","zh":"三脚架 — 正面"},
            "help":{"en":"The tripod assembled, seen from the front: legs, column and mounting plate.",
                    "zh":"拍摄组装好的三脚架正面：支脚、立柱和安装盘。"}},
           {"id":"tripode_back","label":{"en":"Tripod — back","zh":"三脚架 — 背面"},
            "help":{"en":"The back, showing the locking knobs and the welds.",
                    "zh":"拍摄背面，需拍到锁紧旋钮和焊接部位。"}}]},

        {/* RHYME entera pasó a SUB_GRAPHICS, que es la versión con las cuatro
            páginas del manual, la guía rápida, la sílica, los icopores y el
            lector de código. Aquí quedan YISION y EAGLE. */
         /* N/A punto por punto habilitado para YISION en el plan 98, a petición
            de HOKLAN. EAGLE conserva la prohibición: no la pidió. */
         "id":"GRAPHICS","optional":false,"type":"photos","no_na":["EAG"],
         "only_factory":["YIS","EAG"],
         "skip":["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"PRINTED MATERIAL","zh":"印刷品"},
         "steps":[
           {"en":"Take a photo of each item on the list","zh":"逐项拍摄下列物品"},
           {"en":"The box has one slot per face: front, back, both sides, top and bottom","zh":"彩盒的每个面都有独立上传位：正面、背面、左右侧面、顶面和底面"},
           {"en":"Make sure the text and codes are clearly legible","zh":"确保文字和条码清晰可读"},
           {"en":"Avoid shadows and reflections on the labels","zh":"避免标签上出现阴影和反光"},
           {"en":"Mark N/A anything this reference does not include","zh":"本型号不包含的项目请标记为 N/A"}],
         "points":[
           {"id":"manual_front","label":{"en":"Manual — front cover","zh":"说明书 — 封面"},
            "help":{"en":"The front cover, readable and with no glare over the text.",
                    "zh":"拍摄封面，文字清晰可读，不得有反光遮挡。"}},
           {"id":"manual_back","label":{"en":"Manual — back cover","zh":"说明书 — 封底"},
            "help":{"en":"The back cover, readable and with no glare over the text.",
                    "zh":"拍摄封底，文字清晰可读，不得有反光遮挡。"}},
           {"id":"tag_front","label":{"en":"Tag — front","zh":"吊牌 — 正面"},
            "help":{"en":"The printed face of the tag, complete and legible.",
                    "zh":"拍摄吊牌有印刷的一面，内容完整、清晰可读。"}},
           {"id":"tag_back","label":{"en":"Tag — back","zh":"吊牌 — 背面"},
            "help":{"en":"The other face, in its own frame. The barcode and the country of origin must be legible.",
                    "zh":"拍摄另一面，单独成图。条码和产地须清晰可读。",
                    "es":"La otra cara, en su propia foto. El código de barras y el país de origen deben quedar legibles."}},
           {"id":"carta_fidelizacion","label":{"en":"Loyalty card","zh":"客户回馈卡"},
            "help":{"en":"The card inviting the customer to register the product. Photograph both faces if it is printed on both, and check the QR code or web address is legible.",
                    "zh":"拍摄邀请客户注册产品的卡片。若双面印刷则两面都要拍，并确认二维码或网址清晰可读。"}},
           {"id":"bolsa","label":{"en":"Bag the speaker is packed in","zh":"音箱的包装袋"},
            "help":{"en":"The bag the speaker itself comes wrapped in inside the box — not the small bags of the accessories. Lay it out flat and photograph it whole, with the print, the thickness and any tear visible.",
                    "zh":"拍摄彩盒内包裹音箱本体的那只袋子，不是配件的小袋。将袋子摊平整只入镜，印刷内容、厚度及任何破损均须可见。",
                    "es":"La bolsa que envuelve el parlante dentro de la caja, no las bolsitas de los accesorios. Extiéndala y fotografíela completa, con la impresión, el calibre y cualquier roto a la vista."}},
           {"id":"sello_garantia","label":{"en":"Warranty seal","zh":"保修封签"},
            "help":{"en":"The seal covering a screw or a joint of the cabinet, the one that breaks if the speaker is opened. Photograph it in place and whole. A seal that arrives already broken or badly stuck is a fail.",
                    "zh":"拍摄贴在螺丝或箱体接缝处、拆机即破的封签。须拍到封签仍贴在原位且完好。封签到货时已破损或粘贴不牢，即判定为异常。",
                    "es":"El sello que cubre un tornillo o una junta del gabinete, el que se rompe si se abre el parlante. Fotografíelo en su sitio y entero. Un sello que llega roto o mal pegado es un fallo."}},
           {"id":"sello_calidad","label":{"en":"Quality control seal","zh":"质检封签"},
            "help":{"en":"The label the factory's own inspection leaves on the unit, usually with an inspector number or a date. It is a different label from the warranty seal: this one says who passed the speaker inside the factory. Photograph it close enough to read the number.",
                    "zh":"拍摄工厂自检后贴在整机上的标签，通常带有检验员编号或日期。它与保修封签是两种不同的标签：这一枚记录的是谁在厂内判定该台合格。拍摄距离需能看清编号。"}},
           {"id":"etiqueta_esp","label":{"en":"Technical specification label","zh":"技术规格标签"},
            "help":{"en":"Close-up of the label. Voltage, power, model and serial must all be legible in the photo.",
                    "zh":"标签特写。电压、功率、型号和序列号在照片中都必须清晰可读。"}},
           {/* The certification marks differ between RHYME panels: the EPS112A1
                and the BAS115A1 carry NOM, NYCE, cULus and CCC; the DEL115B1
                shows only CE and WEEE. Which set is required depends on where
                the order is going, and the marks are silkscreened, so the answer
                has to be right before the run starts. A cabinet that reaches
                Mexican customs without NOM does not get a second chance. */
            "id":"cert_marks","only_factory":["RHY"],
            "label":{"en":"Certification marks complete for the destination","zh":"认证标志与目的地要求相符",
                     "es":"Marcas de certificación completas según el destino"},
            "help":{"en":"Photograph the row of certification marks on the panel, close enough to identify each one. Compare it against the destination on the order: CE and WEEE for Europe, NOM and NYCE for Mexico, cULus for the United States and Canada, CCC for China. A missing mark stops the shipment at customs, and it is silkscreened, so it cannot be added afterwards.",
                    "zh":"拍摄面板上一排认证标志，距离足够近以便逐个辨认。与订单的目的地核对：欧洲需 CE 和 WEEE，墨西哥需 NOM 和 NYCE，美加需 cULus，中国需 CCC。缺少标志会使货物被海关扣留，而标志为丝印，事后无法补加。",
                    "es":"Fotografíe la fila de marcas de certificación del panel, lo bastante cerca para identificar cada una. Compárela con el destino de la orden: CE y WEEE para Europa, NOM y NYCE para México, cULus para Estados Unidos y Canadá, CCC para China. Una marca que falte detiene el embarque en aduana, y como va serigrafiada, después no se puede agregar."}},
           {"id":"caja_frente","label":{"en":"Box — front","zh":"彩盒 — 正面"},
            "help":{"en":"The main printed face of the box, the one facing the buyer on the shelf.",
                    "zh":"拍摄彩盒的主展示面，即货架上朝向顾客的一面。"}},
           {"id":"caja_atras","label":{"en":"Box — back","zh":"彩盒 — 背面"},
            "help":{"en":"The opposite face, usually carrying the specifications and the barcode.",
                    "zh":"拍摄相对的一面，通常印有规格参数和条码。"}},
           {"id":"caja_lado_der","label":{"en":"Box — right side","zh":"彩盒 — 右侧面"},
            "help":{"en":"The narrow side on the right, looking at the front of the box.",
                    "zh":"面向彩盒正面时，拍摄右侧的窄面。"}},
           {"id":"caja_lado_izq","label":{"en":"Box — left side","zh":"彩盒 — 左侧面"},
            "help":{"en":"The narrow side on the left. Each face is asked for on its own so a crushed corner or a missing label can be traced to one side of the box.",
                    "zh":"拍摄左侧的窄面。六面分开拍摄，是为了在出现压角或缺标签时能准确定位是哪一面。"}},
           {"id":"caja_superior","label":{"en":"Box — top","zh":"彩盒 — 顶面"},
            "help":{"en":"The top, including the closing flaps and the tape.",
                    "zh":"拍摄顶面，需拍到封口摇盖和胶带。"}},
           {"id":"caja_inferior","label":{"en":"Box — bottom","zh":"彩盒 — 底面"},
            "help":{"en":"The bottom, including the seal and any shipping label.",
                    "zh":"拍摄底面，需拍到封口和运输标签。"}},
           {/* `photo` faltaba en las tres. La ayuda ya mandaba encuadrar los dos
                extremos de la cinta, así que pedía una foto que la app no
                recogía: el número entraba solo, sin nada detrás. En RHYME las
                mismas tres medidas sí la exigen desde que se rehizo la prueba
                CAJA, y era la misma medición con dos reglas distintas. */
            "id":"caja_ancho","photo":true,"measure":{"unit":"cm","step":"0.1"},
            "sample":"caja_ancho",
            "label":{"en":"Box — width","zh":"彩盒 — 宽"},
            "help":{"en":"The horizontal side of the front face. Hook the tape on one edge and read it at the opposite edge, with both ends inside the frame. Read the centimetre scale, not the inches.",
                    "zh":"正面的水平边。将卷尺钩在一端，在另一端读数，两端都要在画面之内。读厘米刻度，不要读英寸。",
                    "es":"El lado horizontal de la cara frontal. Enganche la cinta en un borde y lea en el borde opuesto, con los dos extremos dentro del encuadre. Lea la escala en centímetros, no las pulgadas."}},
           {"id":"caja_largo","photo":true,"measure":{"unit":"cm","step":"0.1"},
            "sample":"caja_largo",
            "label":{"en":"Box — depth","zh":"彩盒 — 深"},
            "help":{"en":"The depth: the tape crosses the top face, from the front edge to the back edge. Both ends of the tape in the photo, and centimetres.",
                    "zh":"深度：卷尺横跨顶面，从前沿量到后沿。卷尺两端都要入镜，读厘米。",
                    "es":"El largo: la cinta cruza la cara superior, del borde delantero al trasero. Los dos extremos de la cinta en la foto, y en centímetros."}},
           {"id":"caja_alto","photo":true,"measure":{"unit":"cm","step":"0.1"},
            "sample":"caja_alto",
            "label":{"en":"Box — height","zh":"彩盒 — 高"},
            "help":{"en":"The vertical side, from the base to the top. Stand the box up and run the tape down one corner. Step back until the base and the reading are both in the picture.",
                    "zh":"垂直边，从底部量到顶部。将彩盒立起，卷尺沿一条棱垂直放置。请后退，直到底部和读数同时在画面之内。",
                    "es":"El lado vertical, de la base al tope. Pare la caja y baje la cinta por una esquina. Retroceda hasta que la base y la lectura entren las dos en la foto."}}]},

        {"id":"EXT_BATTERY","optional":true,"skip_factory":["RHY"],
         "only_factory":["YIS","RHY","EAG"],
         "skip":["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"EXTERNAL BATTERY","zh":"外置电池"},
         "steps":[
           {"en":"Switch the speaker off and disconnect it from the mains","zh":"关机并断开市电"},
           {"en":"Open the speaker and disconnect the internal battery","zh":"打开箱体，断开内置电池"},
           {"en":"Connect the external battery","zh":"接上外置电池"},
           {"en":"Set the switch to external battery","zh":"将开关拨到外置电池"},
           {"en":"Switch the speaker on, insert the USB drive and play at maximum volume","zh":"开机，插入 U 盘并以最大音量播放"},
           {"en":"Then plug in the AC cable, still on the external battery, and play at maximum volume","zh":"随后在外置电池仍接入的状态下接上 AC 电源线，并以最大音量播放"}],
         "points":[
           {"id":"internal_off","code":"BAT-006","label":{"en":"Internal battery disconnected","zh":"内置电池已断开"},
            "help":{"en":"With the speaker off and unplugged from the mains, open it and unplug the internal battery connector. Leave it disconnected for the whole test.",
                    "zh":"在关机并断开市电的状态下打开箱体，拔掉内置电池插头。整个测试过程保持断开。"}},
           {"id":"external_on","code":"BAT-001","photo":true,
            "label":{"en":"External battery connected and detected","zh":"外置电池已连接并被识别"},
            "help":{"en":"Connect the external battery and set the switch to the external position. The speaker must recognise it as its power source. Photograph the battery connected, with its label readable and the wiring visible.",
                    "zh":"接上外置电池并将开关拨到外置位置。音箱应识别其为供电来源。拍摄已连接的电池，标签需清晰可读，接线须可见。",
                    "es":"Conecte la batería externa y ponga el selector en la posición externa. El parlante debe reconocerla como su fuente de alimentación. Fotografíe la batería conectada, con la etiqueta legible y el cableado a la vista."}},
           {"id":"switch","code":"BAT-003","label":{"en":"Battery switch works","zh":"电池切换开关有效"},
            "help":{"en":"Move the switch between internal and external. The speaker must respond to the change, not stay dead in one of the positions.",
                    "zh":"在内置与外置之间拨动开关。音箱应对切换有反应，不应在某一档位完全无电。"}},
           {"id":"power_on","code":"BAT-002","label":{"en":"Speaker powers on with the external battery","zh":"外置电池可以开机"},
            "help":{"en":"Switch the speaker on with the mains cable unplugged. It must start up fully on the external battery alone.",
                    "zh":"在不接市电的情况下开机。仅靠外置电池应能完整启动。"}},
           {"id":"usb_play","code":"BAT-004","label":{"en":"Plays from USB on the external battery at maximum volume","zh":"外置电池供电时可最大音量播放 U 盘"},
            "help":{"en":"Insert the USB drive and take the volume to maximum. Hold it there for at least a minute. The sound must not cut out or distort, the speaker must not switch off or restart, and the external battery must not shut down under the load.",
                    "zh":"插入 U 盘并将音量调到最大，持续至少一分钟。声音不应中断或失真，音箱不应关机或重启，外置电池也不应因大电流而保护关断。"}},
           {"id":"ac_with_battery","code":"BAT-005","label":{"en":"AC cable connected with the external battery, at maximum volume","zh":"外置电池接入时连接 AC 电源并最大音量播放"},
            "help":{"en":"With the external battery still powering the speaker and music playing, plug in the AC power cable and take the volume to maximum. The speaker must keep playing without cutting out, resetting or losing the source; the charging indicator must appear; and neither the battery nor the AC input must trip. Check the connector and the battery for heat after a minute.",
                    "zh":"在外置电池继续供电且正在播放的状态下，接入 AC 电源线并将音量调到最大。音箱应持续播放，不中断、不重启、不丢失音源；充电指示应出现；电池与 AC 输入均不应保护断电。一分钟后检查接头和电池是否发烫。"}},
           {"id":"reassemble","code":"BAT-007","label":{"en":"Internal battery reconnected and speaker closed","zh":"内置电池已复原、箱体已装回"},
            "help":{"en":"Reconnect the internal battery, set the switch back to internal and close the speaker. Confirm it still works before finishing.",
                    "zh":"重新接上内置电池，将开关拨回内置，并装回箱体。确认恢复后仍能正常工作再结束。"}}]},

        /* La prueba suelta SELECTOR DE VOLTAJE se retiró en la v11.2. Al pasar
           PARTES EXTERNAS a cubrir toda RHYME, el selector quedaba comprobado
           dos veces en las cabinas activas: allí y aquí. Vive ahora sólo en
           PARTES EXTERNAS, con su posición en el recuadro y su fotografía. */

        {/* Sin `no_na` y sin `na_ok` desde el plan 97, por decisión de HOKLAN.

              `no_na` prohibía marcar N/A punto por punto, y `na_ok` abría la
              excepción contraria: en el BAS115A1 se podía marcar N/A la sección
              entera de una vez. Entre las dos, lo único que el operario podía
              hacer era descartar los diecinueve puntos juntos o ninguno, y una
              cabina a la que le falta el preamplificador no tiene por qué
              perder también las fotos del woofer.

              Al quitar las dos, cada punto se marca N/A por su cuenta, que es
              como se comporta el resto del plan. */
         "id":"INTERNAL","optional":false,"type":"photos",
         "only_factory":["YIS","RHY","EAG"],
         /* Los subwoofers sí corren ésta: sólo tienen versión propia de las
            tres anteriores. */
         "skip":["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"INTERNAL PARTS","zh":"内部部件"},
         "steps":[
           {"en":"Remove the screws and open the speaker carefully","zh":"拆下螺丝，小心打开箱体"},
           {"en":"Photograph each component from several angles","zh":"每个部件从多个角度拍摄"},
           {"en":"Take a close-up of each component's label: brand, model and part number","zh":"拍摄每个部件标签特写：品牌、型号和料号"},
           {"skip_factory":["RHY"],
            "en":"For the FM antenna, show its full routing and fixing point","zh":"收音天线需拍出完整走线和固定位置"},
           {"en":"Mark N/A anything this reference does not include","zh":"本型号不包含的项目请标记为 N/A"}],
         "points":[
           {/* Los terminales abren la sección desde el plan 101, y el tinsel va
                detrás. Los tres puntos son lo único que exige el woofer todavía
                montado y con luz encima: una vez desmontado para pesarlo, el
                calibrador ya no entra igual y las soldaduras quedan contra la
                mesa. */
            "id":"terminals_solder","only_factory":["RHY"],
            "sample":"bas_terminales",
            "label":{"en":"Terminals — soldered","zh":"接线端子 — 已焊接","es":"Terminales — soldados"},
            "help":{"en":"Photograph the two terminals close enough to see that both are soldered, with the solder covering the joint and no loose strands.",
                    "zh":"拍摄两个接线端子，距离足够近以便确认两者均已焊接，焊锡覆盖焊点且无散股。",
                    "es":"Fotografíe los dos terminales lo bastante cerca para ver que ambos están soldados, con el estaño cubriendo la unión y sin hilos sueltos."}},
           {"id":"tinsel_gauge","only_factory":["RHY"],
            "sample":"bas_tinsel_calibre",
            "measure":{"unit":"mm","step":"0.01"},
            "label":{"en":"Tinsel lead — gauge","zh":"引出线 — 线径","es":"Tinsel — calibre"},
            "help":{"en":"Measure the gauge of the tinsel lead with a caliper and write it in the box. Photograph the caliper with the lead between the jaws and the reading visible in the same frame.",
                    "zh":"用游标卡尺测量引出线的线径并填入方框。拍摄卡尺，引出线夹在量爪之间，读数须在同一画面内清晰可见。",
                    "es":"Mida el calibre del tinsel con un calibrador y escríbalo en el recuadro. Fotografíe el calibrador con el tinsel entre las mordazas y la lectura visible en el mismo encuadre."}},
           {"id":"tinsel_solder","only_factory":["RHY"],
            "sample":"bas_tinsel_soldadura",
            "label":{"en":"Tinsel — solder point","zh":"引出线 — 焊点","es":"Tinsel — punto de soldadura"},
            "help":{"en":"Close-up of the point where the tinsel lead is soldered to the cone. Close enough to see the joint itself, not just the area around it.",
                    "zh":"拍摄引出线与振膜焊接处的特写，距离足够近以便看清焊点本身，而不只是周边区域。",
                    "es":"Primer plano del punto donde el tinsel va soldado al cono. Lo bastante cerca para ver la soldadura misma, no sólo la zona alrededor."}},
           {/* Dos puntos para la misma medición, porque la unidad no puede
                depender de la fábrica dentro de un solo punto. RHYME pesa en
                kilogramos: sus woofers de 15 y 18 pulgadas pasan de los cinco
                kilos, y anotarlos en gramos daba cifras de cinco dígitos que
                nadie lee bien. Las demás fábricas montan altavoces pequeños y
                siguen en gramos. Sólo uno de los dos le aparece al operario. */
            "id":"woofer_weight","skip_factory":["RHY"],
            "measure":{"unit":"g","step":"1"},
            "sample":"bas_woofer_peso",
            "label":{"en":"Woofer — weight","zh":"低音单元 — 重量","es":"Woofer — peso"},
            "help":{"en":"Place the woofer on the scale on its own, with no screws, gasket or cable attached. Photograph the reading and write the value in the box.",
                    "zh":"将低音单元单独放在电子秤上，不带螺丝、垫圈和引线。拍摄读数并将数值填入方框。",
                    "es":"Ponga el woofer solo sobre la balanza, sin tornillos, empaque ni cable. Fotografíe la lectura y escriba el valor en el recuadro."}},
           {"id":"woofer_weight_kg","only_factory":["RHY"],
            "measure":{"unit":"kg","step":"0.01"},
            "sample":"bas_woofer_peso",
            "label":{"en":"Woofer — weight","zh":"低音单元 — 重量","es":"Woofer — peso"},
            "help":{"en":"Place the woofer on the scale on its own, with no screws, gasket or cable attached. Photograph the reading and write the value in the box, in kilograms.",
                    "zh":"将低音单元单独放在电子秤上，不带螺丝、垫圈和引线。拍摄读数，并以千克为单位将数值填入方框。",
                    "es":"Ponga el woofer solo sobre la balanza, sin tornillos, empaque ni cable. Fotografíe la lectura y escriba el valor en el recuadro, en kilogramos."}},
           {"id":"woofer_impedance","only":["HK-BAS115A1","HK-BAS118A1"],
            "sample":"bas_impedancia","measure":{"unit":"Ω","step":"0.1"},

        /* ===== GPE · Guía de pruebas especiales =============================
           Un contenedor, no una prueba. Aquí entra lo que HOKLAN pide sólo para
           una referencia concreta: una mejora que hay que confirmar en línea, un
           componente que cambió de proveedor, un defecto que apareció en un lote
           y hay que vigilar durante los siguientes. Cosas que no pertenecen al
           plan general y que, metidas en él, obligarían a marcar N/A en las otras
           cincuenta y cuatro referencias.

           `only` la limita a los modelos que hoy tienen alguna prueba especial;
           quien no esté en esa lista no la ve. Para agregar una prueba especial
           a otro modelo: añadir el modelo aquí y, abajo, una sección con sus
           puntos, cada uno con su propio `only`. Los puntos de un modelo no le
           aparecen a los demás aunque compartan la prueba.

           Va después de PARTES INTERNAS a propósito: la primera que entró mira
           dentro de la fuente de poder, y ahí la cabina ya está abierta. Si algún
           día entra una que se hace con el producto cerrado, habrá que revisar
           esta posición. */
        {"id":"GPE","optional":false,"type":"photos",
         "only":["HK-POW102"],
         "label":{"en":"SPECIAL TEST GUIDE (GPE)",
                  "zh":"专项检验指引（GPE）",
                  "es":"GUÍA DE PRUEBAS ESPECIALES (GPE)"},
         "steps":[
           {"en":"Check what this reference asks for in particular",
            "zh":"检查本型号特别要求的项目",
            "es":"Revise lo que esta referencia pide en particular"},
           {"en":"Compare against the reference picture before deciding",
            "zh":"判定前请与参考图片核对",
            "es":"Compare con la imagen de referencia antes de decidir"},
           {"en":"Photograph what you checked","zh":"拍摄所检查的部位",
            "es":"Fotografíe lo que revisó"}],
         "points":[
           {"section":{"en":"POW102 · Power supply","zh":"POW102 · 电源板",
                       "es":"POW102 · Fuente de poder"},
            "only":["HK-POW102"],
            "help":{"en":"Inside the cabinet, on the power supply board, by the pins marked GND and 9V/15V.",
                    "zh":"位于箱体内部电源板上，靠近标注 GND 与 9V/15V 的引脚处。",
                    "es":"Dentro de la cabina, en la tarjeta de la fuente de poder, junto a los pines marcados GND y 9V/15V."}},
           {"id":"gpe_pow102_support","code":"PWR-015","only":["HK-POW102"],
            "sample":"pow102_gpe",
            "label":{"en":"Support across the GND and 9V/15V pins",
                     "zh":"GND 与 9V/15V 引脚间的支架",
                     "es":"Soporte en los pines GND y 9V/15V"},
            "help":{"en":"Photograph the four pins marked GND and 9V/15V close up, with the gap between the two rows visible. A black support must run across the middle of the pins, as in the reference picture. A power supply without it is a fail.",
                    "zh":"近距离拍摄标注 GND 与 9V/15V 的四个引脚，两排之间的间隙须清晰可见。引脚中间应横贯一条黑色支架，与参考图片一致。缺少该支架的电源板判定为异常。",
                    "es":"Fotografíe de cerca los cuatro pines marcados GND y 9V/15V, con el espacio entre las dos filas a la vista. Por la mitad de los pines debe cruzar un soporte negro, como en la imagen de referencia. Una fuente que no lo lleve es un fallo."}}]},

        /* ===== Real battery capacity ========================================
           Last in the plan, and it has to be: a 3600 mAh pack at a quarter of
           its own rating takes about four hours to empty. Nothing else can be
           waiting on it, and the operator is not meant to stand there — he sets
           the load up, answers the points down to the start, walks away, and
           comes back to write the three numbers down.

           Optional, because it is a sampling test. One pack out of a lot
           answers the question the whole lot is asking; running it on every
           unit would cost four hours each and tell nobody anything new.

           No photograph is asked for at the end. That was deliberate and it is
           being reviewed separately — the numbers are what this test produces,
           and a picture of the screen is not the same as the reading typed into
           a box that can be compared, summed and put in a column. */
        /* Hasta la versión 55 esta prueba llevaba el procedimiento completo de
           descarga en el RK8510D: doce puntos, cuatro horas de espera y tres
           cifras medidas en fábrica. La medición la hace ahora el proveedor y
           entrega su informe, así que aquí sólo queda registrar lo que declara
           y guardar el documento que lo respalda. Dejó de ser una prueba larga:
           por eso ya no lleva `first` ni el aviso `long`. El procedimiento y sus
           seis fotos de referencia quedan en el historial de git por si algún
           día vuelve a medirse en casa. */
        {"id":"BAT_CAPACITY","optional":true,"only_factory":["YIS"],
         "skip":["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],"evidence":[],
         /* Sin el prefijo «VERIFICACIÓN DE ESPECIFICACIONES ·» desde el plan 99:
            en la pantalla del teléfono ocupaba dos renglones antes de llegar a
            lo que la prueba es. */
         "label":{"en":"BATTERY CAPACITY",
                  "zh":"电池容量",
                  "es":"CAPACIDAD DE BATERÍA"},
         "steps":[
           {"en":"Ask the supplier for the report of their capacity test","zh":"向供应商索取其容量测试报告","es":"Pida al proveedor el informe de su prueba de capacidad"},
           {"en":"Write down the capacity the report declares","zh":"填写报告中声明的容量","es":"Escriba la capacidad que declara el informe"},
           {"en":"Attach the report: a photo or the PDF","zh":"上传该报告：照片或 PDF","es":"Adjunte el informe: una foto o el PDF"}],
         "points":[
           {"id":"bat_supplier","code":"BAT-009","measure":{"unit":"mAh","step":"1"},
            "label":{"en":"Capacity declared by the supplier","zh":"供应商声明的容量","es":"Capacidad de batería informada por el proveedor"},
            "help":{"en":"Write the capacity the supplier declares from their own experimental tests, exactly as it appears in their report. It is their figure, not a measurement made here.",
                    "zh":"填写供应商依据其实验测试所声明的容量，须与其报告中的数值完全一致。这是供应商提供的数据，并非本厂实测值。",
                    "es":"Escriba la capacidad que el proveedor declara según sus pruebas experimentales, tal como aparece en su informe. Es la cifra del proveedor, no una medición hecha aquí."}},
           {/* `doc` is what adds PDF to what the file picker will accept, and
                `gallery` is what keeps the phone from opening the camera: the
                report arrives by e-mail and lives in the phone's files, not in
                front of the operator. A figure typed into a box and a document
                that backs it are not the same thing — the number is what can be
                compared between packs, the document is what says where it came
                from. */
            "id":"bat_report","code":"BAT-009",
            "photo":true,"gallery":true,"doc":true,
            "label":{"en":"Supplier's report","zh":"供应商报告","es":"Informe del proveedor"},
            "help":{"en":"Attach the report of the capacity test: a photo of it, or the PDF the supplier sent. The declared capacity must be legible in it and must match the figure written above.",
                    "zh":"上传容量测试报告：可以是照片，也可以是供应商发送的 PDF。报告中声明的容量须清晰可读，并与上方填写的数值一致。",
                    "es":"Adjunte el informe de la prueba de capacidad: una foto de él, o el PDF que envió el proveedor. La capacidad declarada debe quedar legible y coincidir con la cifra escrita arriba."}}]},

        /* ===== Specification check · RMS power ==============================
           The second of the two measurements that answer a printed figure. The
           box claims watts; this is what the amplifier actually delivers into a
           load of the right impedance, with the tone controls where a customer
           would leave them and the volume as high as it goes without the
           amplifier clipping.

           The woofer comes out and a resistor goes in, so this is bench work on
           a sampled unit, not something done to a speaker that is going to be
           packed. Sampling, like the battery test, and last in the plan with
           it. */
        /* La potencia RMS de Epsilon y de los Delta la certifica el proveedor de
           amplificadores, canal por canal. Aquí no se mide con osciloscopio: se
           adjunta lo que el proveedor entrega y se anota la cifra de cada canal,
           que es lo que después se compara contra la caja y la ficha. Los BAS
           quedan fuera: llevan un solo canal y su propia prueba. */
        {"id":"RMS_SUPPLIER","optional":false,"only_factory":["RHY"],"evidence":[],"first":3,
         "only":["HK-EPS112A1","HK-DEL101","HK-DEL103P","HK-DEL105","HK-DEL110B1",
                 "HK-DEL115B1","HK-DEL210A1"],
         /* Sin el prefijo, igual que la capacidad de batería. Quedan tres pruebas
            con el mismo título —ésta, la de YISION y la de los BAS—, pero ningún
            plan lleva más de una: son 7 modelos, 37 y 2, sin cruce. */
         "label":{"en":"RMS POWER",
                  "zh":"RMS 功率",
                  "es":"POTENCIA RMS"},
         "steps":[

        /* ===== Aging · four hours ===========================================
           Four hours of continuous playing, flat out. The test either survives
           it or it does not, and what it looks for is the fault that only shows
           up once everything inside has come up to temperature.

           Ocho horas desde la v11.1, y un solo punto: la confirmación de que se
           corrió con la lista de pruebas de HOKLAN. Antes fue así:

           Recortada a dos puntos por HOKLAN: la foto del inicio y la del final.
           Salieron la temperatura del área, el sitio de trabajo, el selector de
           voltaje, la conexión AC, la USB, los controles al máximo, el arranque
           de la lista, las cuatro escuchas por hora y la revisión final. La
           prueba sigue durando cuatro horas — por eso conserva `first` y el
           aviso `long` —, pero lo que queda registrado son las dos fotografías
           y la distancia entre sus dos horas.

           Ojo con una consecuencia: el selector de voltaje ya no se lee aquí.
           En las RHYME sigue estando en ALIMENTACIÓN AC, pero el envejecimiento
           corre antes, así que la cabina se enchufa antes de que nadie lo mire.

           Sampling, like the measurement above it: a unit that has run flat out
           for four hours is not the unit that goes into the box. */
        {/* Not the subwoofers. The test runs the speaker off a playlist on the
              USB D drive, and a BAS has neither a USB socket nor a playback
              mode — its signal comes in over XLR from something else. Aging one
              is a reasonable thing to want; it is just not this procedure. */
         "id":"AGING","optional":true,"only_factory":["YIS","RHY"],
         "skip":["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330","HK-BAS115A1","HK-BAS118A1"],"evidence":[],
         /* Cuarta, no primera: en RHYME la caja se pesa y se mide cerrada antes
            de nada, y el envejecimiento necesita el producto desempacado. Sigue
            arrancando lo antes posible para que las ocho horas corran mientras
            se hace el resto. */
         "first":4,
         "long":{"t":{"en":"This test is still running","zh":"本测试仍在进行中","es":"Esta prueba sigue en curso"},
                 "n":{"en":"Come back when the eight hours are up to answer it. Meanwhile you can carry on with the rest of the plan.",
                      "zh":"八小时结束后再回来填写本项。期间可继续进行计划中的其他测试。",
                      "es":"Vuelva al cumplirse las ocho horas para responderla. Mientras tanto puede seguir con el resto del plan."}},
         "label":{"en":"AGING · 8 HOURS","zh":"老化测试 · 8 小时","es":"ENVEJECIMIENTO · 8 HORAS"},
         "steps":[
           {"en":"Run the aging following the HOKLAN test list","zh":"按 HOKLAN 测试清单执行老化","es":"Realice el envejecimiento siguiendo la lista de pruebas de HOKLAN"},
           {"en":"Leave it running eight hours without stopping it","zh":"连续运行八小时，中途不得停止","es":"Déjelo sonando ocho horas sin detenerlo"},
           {"en":"Confirm it when the eight hours are up","zh":"八小时结束后确认本项","es":"Confírmelo al cumplirse las ocho horas"}],
         "points":[
           {/* Un solo punto y sin fotografía, por ahora. Antes eran dos fotos
                separadas por cuatro horas; HOKLAN lo redujo a la confirmación
                mientras se define cómo se va a evidenciar. */
            "id":"age_done","code":"AGE-001",
            "label":{"en":"Aging completed following the HOKLAN test list","zh":"已按 HOKLAN 测试清单完成老化","es":"Envejecimiento realizado con la lista de pruebas de HOKLAN"},
            "help":{"en":"Confirm the speaker ran the eight hours following the HOKLAN test list, without being stopped, switched off or touched during them.",
                    "zh":"确认音箱已按 HOKLAN 测试清单连续运行八小时，其间未停止、未关机、未被触碰。",
                    "es":"Confirme que el parlante sonó las ocho horas siguiendo la lista de pruebas de HOKLAN, sin detenerse, apagarse ni ser tocado durante ellas."}}]},

        /* ===== LESHENG — wireless microphone system =========================
           A different product, so a different plan: two microphones and a
           receiver, and on RHO102 a bag as well. Built from the factory's own
           SOP so that what the inspector reads here and what the factory
           reviews there are the same document.
           The order is by how long each test takes the operator, shortest
           first: the identification takes two minutes and the idle shutdown
           takes twenty. Anything that goes wrong tends to go wrong early, and
           finding it in the first ten minutes saves setting up the rest. It
           also lands the three distance tests next to each other at the end,
           so the walk down the corridor is made once. */

        /* LOGOS absorbed what used to be two tests. Identification asked four
           questions — the logo on each microphone, the logo on the receiver, the
           model against the order — that all came down to the same act: looking at
           the printing. And LOGO AND ANTENNA repeated it a second time, three
           minutes later, on the same units.

           What replaced them is one photograph per face. A yes/no answer about a
           logo is a judgement nobody can review; the photograph of the front and
           the back is a record the office can check against the approved sample
           months later, and it also carries the model and the label without a
           separate question about them.

           This is the only test that still asks for a clip of itself at the end.
           Everywhere else it was a formality: a video of somebody turning a knob
           proves nothing that the point beside it does not already record. Here it
           is the walk around the set, which is what a claim about finish asks
           for. */

            "help":{"en":"The back of the second microphone, with its label and its battery cover.",
                    "zh":"第二支麦克风的背面，需拍到标签和电池盖。",
                    "es":"El respaldo del segundo micrófono, con su etiqueta y su tapa de batería."}},
           {"id":"rcv_front","code":"WMIC-014","photo":true,
            "label":{"en":"Receiver — front","zh":"接收器 — 正面","es":"Receptor — frente"},
            "help":{"en":"The front of the receiver, with its logo and its display. It must carry the same brand as the microphones: a kit with two different brands is a defect the customer sees on the table before switching anything on.",
                    "zh":"接收器正面，需拍到标志和显示窗。应与麦克风为同一品牌：一套里出现两个品牌，客户放到桌上、还没开机就会看到。",
                    "es":"El frente del receptor, con su logo y su pantalla. Debe llevar la misma marca que los micrófonos: un juego con dos marcas distintas es un defecto que el cliente ve sobre la mesa antes de encender nada."}},
           {"id":"rcv_back","code":"WMIC-014","photo":true,
            "label":{"en":"Receiver — back","zh":"接收器 — 背面","es":"Receptor — respaldo"},
            "help":{"en":"The back of the receiver, with the connectors, the label and the base of the antenna.",
                    "zh":"接收器背面，需拍到各接口、标签和天线根部。",
                    "es":"El respaldo del receptor, con los conectores, la etiqueta y la base de la antena."}},
           {"id":"antenna_len","code":"WMIC-015","photo":true,
            "measure":{"unit":"cm","step":"0.1"},
            "label":{"en":"Receiver antenna — length","zh":"接收器天线 — 长度","es":"Antena del receptor — longitud"},
            "help":{"en":"Extend the antenna fully and measure it from where it leaves the body to its tip. Photograph the tape in place with both ends in the frame, and write the value in the box. The length is what the number is for: an antenna a third shorter than the specification still looks like an antenna, and the range test three tests later will fail without saying why. While the tape is on it, check it turns at the base without wobbling and has no crack there — that is where they crack.",
                    "zh":"将天线完全拉出，从出机身处量到顶端。拍摄卷尺就位的照片，两端都要入镜，并将数值填入方框。数值的意义就在长度：比规格短三分之一的天线看起来依然像天线，而三项测试之后的距离测试会失败却说不出原因。量的同时确认天线在根部可转动而不松动、且无裂纹——裂纹就出在那里。",
                    "es":"Extienda la antena por completo y mídala desde donde sale del cuerpo hasta la punta. Fotografíe la cinta puesta con los dos extremos en el cuadro, y escriba el valor en el recuadro. Para eso sirve el número: una antena un tercio más corta que la especificación sigue pareciendo una antena, y la prueba de alcance, tres pruebas después, va a fallar sin decir por qué. Con la cinta puesta, confirme que gira en la base sin bailar y que no tiene grieta ahí — es donde se agrietan."}},
           {"id":"set_uniform","code":"WMIC-014","label":{"en":"Assembly looks uniform","zh":"整体外观一致","es":"El conjunto se ve uniforme"},
            "help":{"en":"Step back and look at the whole set beside the approved sample. Logo, body and antenna must look like one product, not like parts from two production runs, and the colour must match the sample rather than your memory of it.",
                    "zh":"退后一步，将整套产品与承认样并排观察。标志、机身和天线应像同一件产品，而不像两批生产的零件拼在一起；颜色应与承认样一致，而不是凭记忆判断。",
                    "es":"Aléjese un paso y mire el conjunto al lado de la muestra aprobada. Logo, cuerpo y antena deben verse como un solo producto, no como piezas de dos corridas, y el color debe coincidir con la muestra y no con su recuerdo."}}]},

        {"id":"MIC_ACCESSORIES","optional":false,"only_factory":["LES"],"evidence":[],
         "label":{"en":"ACCESSORIES","zh":"配件","es":"ACCESORIOS"},
         "steps":[
           {"en":"Open the box and take everything out onto a clean table","zh":"打开包装，将全部物品取出放在干净台面上","es":"Abra la caja y saque todo sobre una mesa limpia"},
           {"en":"Compare each item against the customisation details of the order","zh":"逐项与订单的定制明细核对","es":"Compare cada artículo contra el detalle de personalización de la orden"},
           {"en":"Photograph everything together before putting it back","zh":"装回之前把全部物品合影","es":"Fotografíe todo junto antes de volver a guardarlo"}],
         "points":[
           {"section":{"en":"Accessories","zh":"配件","es":"Accesorios"},
            "help":{"en":"Done with the box already open, before anything is switched on: the packing is checked once and does not have to be undone again later.",
                    "zh":"在包装已经打开、尚未开机时进行：包装只拆一次，后面不必再拆第二遍。",
                    "es":"Se hace con la caja ya abierta y antes de encender nada: el empaque se revisa una sola vez y no hay que volver a deshacerlo."}},
           {"id":"acc_cable","code":"WMIC-016","photo":true,
            "label":{"en":"Cable","zh":"线材","es":"Cable"},
            "help":{"en":"Photograph the whole cable with both ends in the frame, close enough to tell the size and the type of each plug.",
                    "zh":"拍摄整条线材，两端接头都要入镜，距离足够近以便辨认每个插头的规格和类型。",
                    "es":"Fotografíe el cable completo con los dos extremos en el cuadro, lo bastante cerca para distinguir la medida y el tipo de cada conector."}},
           {"id":"acc_aux","code":"WMIC-016","photo":true,
            "label":{"en":"AUX adapter","zh":"AUX 转接头","es":"Adaptador AUX"},
            "help":{"en":"Photograph the adapter with its connector visible, close enough to tell the size. This is the piece most often supplied in the wrong size, and it is the one nobody notices until the customer plugs it in.",
                    "zh":"拍摄转接头，接头部分要清晰可见，距离足够近以便辨认规格。这一件最常配错规格，而且客户插上之前谁也不会发现。",
                    "es":"Fotografíe el adaptador con su conector a la vista, lo bastante cerca para distinguir la medida. Es la pieza que con más frecuencia llega en la medida equivocada, y la que nadie nota hasta que el cliente la conecta."}}]},

        {"id":"MIC_BUTTONS","optional":false,"only_factory":["LES"],"evidence":[],"per_mic":true,
         "label":{"en":"BUTTONS","zh":"按键","es":"BOTONES"},
         "steps":[
           {"en":"The microphone has four buttons, counted from the top down","zh":"麦克风共四个按键，自上而下计数","es":"El micrófono tiene cuatro botones, contados de arriba hacia abajo"},
           {"en":"Press each one and confirm it responds without bounce or delay","zh":"逐个按下，确认无抖动、无延迟","es":"Pulse cada uno y confirme que responde sin rebote ni retardo"},
           {"en":"Finish with the single button on the receiver","zh":"最后测试接收器上的单个按键","es":"Termine con el único botón del receptor"},
           {"en":"Record a video covering the buttons of every microphone and of the receiver","zh":"录制视频，涵盖每支麦克风和接收器的按键","es":"Grabe un video que cubra los botones de cada micrófono y del receptor"}],
         "points":[
           {"section":{"en":"Buttons","zh":"按键","es":"Botones"},
            "help":{"en":"Five minutes with the microphone in your hand, no receiver and no distance involved.",
                    "zh":"五分钟，只需手持麦克风，不涉及接收器和距离。",
                    "es":"Cinco minutos con el micrófono en la mano, sin receptor ni distancias."}},
           {/* Split in two. One answer covering on and off hid the common defect:
                a microphone that starts on the first hold and needs three tries
                to switch off passed as "power on and off works". */
            "id":"btn_power_on","code":"WMIC-010",
            "label":{"en":"Button 1 — power on","zh":"按键 1 — 开机","es":"Botón 1 — encendido"},
            "help":{"en":"Hold it for 2 to 3 seconds. It must come up on the first try. It must not switch on with a short press, and it must not need five seconds.",
                    "zh":"长按 2 至 3 秒。应一次开机成功。短按不应开机，也不应需要按满五秒。",
                    "es":"Manténgalo 2 a 3 segundos. Debe encender al primer intento. No debe encender con un toque corto ni exigir cinco segundos."}},
           {"id":"btn_power_off","code":"WMIC-010",
            "label":{"en":"Button 1 — power off","zh":"按键 1 — 关机","es":"Botón 1 — apagado"},
            "help":{"en":"Hold it again for 2 to 3 seconds. It must switch off cleanly, on the first try, with the screen going dark rather than staying lit.",
                    "zh":"再长按 2 至 3 秒。应一次干脆关机，屏幕应熄灭而不是残亮。",
                    "es":"Manténgalo otra vez 2 a 3 segundos. Debe apagar limpio y al primer intento, con la pantalla oscureciéndose en vez de quedar prendida."}},
           {"id":"btn_mute","code":"WMIC-010",
            "label":{"en":"Button 1 — MUTE on the screen","zh":"按键 1 — 屏显 MUTE","es":"Botón 1 — mute en pantalla"},
            "help":{"en":"With the microphone on, press it once. The audio must cut and the screen must show the word MUTE. Press it again and the voice must come back.",
                    "zh":"开机状态下按一次。声音应切断，且屏幕应显示 MUTE 字样。再按一次，声音应恢复。",
                    "es":"Con el micrófono encendido, púlselo una vez. El audio debe cortarse y la pantalla debe mostrar la palabra mute. Púlselo de nuevo y la voz debe volver."}},
           {"id":"btn_vol_up","code":"WMIC-009","label":{"en":"Button 2 — volume up","zh":"按键 2 — 音量增加","es":"Botón 2 — sube el volumen"},
            "help":{"en":"On each press, check that it climbs by one level. The number on the screen must move one at a time, with no skipped steps, all the way to 16.",
                    "zh":"每按一次，确认音量上升一级。屏幕数值应逐级变化、不跳数，一直到 16。",
                    "es":"En cada pulsación verifique que aumenta un nivel. El número en pantalla debe moverse de uno en uno, sin saltarse pasos, hasta llegar a 16."}},
           {"id":"btn_vol_down","code":"WMIC-009","label":{"en":"Button 4 — volume down","zh":"按键 4 — 音量减小","es":"Botón 4 — baja el volumen"},
            "help":{"en":"On each press, check that it drops by one level. It must reach 1 and stop there, without wrapping round to 16.",
                    "zh":"每按一次，确认音量下降一级。应到达 1 并停住，不应跳回 16。",
                    "es":"En cada pulsación verifique que disminuye un nivel. Debe llegar a 1 y quedarse ahí, sin dar la vuelta hasta 16."}},
           {/* Button 3 carried three functions in one answer, so a microphone
                that changed channel but never reached IR still passed. Each of
                them is asked on its own now. */
            "id":"btn_ch_mode","code":"WMIC-005",
            "label":{"en":"Button 3 — enters channel mode","zh":"按键 3 — 进入频道设置","es":"Botón 3 — entra al modo de canal"},
            "help":{"en":"Hold it until CH XX flashes on the screen. If it does not flash, the channel cannot be changed and nothing that depends on it can be judged.",
                    "zh":"长按直至屏幕上 CH XX 闪烁。若不闪烁，则无法换台，依赖频道的项目也都无法判定。",
                    "es":"Manténgalo hasta que parpadee CH XX en la pantalla. Si no parpadea, el canal no se puede cambiar y nada de lo que dependa de él se puede juzgar."}},
           {"id":"btn_ch_ir","code":"WMIC-006",
            "label":{"en":"Button 3 — reaches IR","zh":"按键 3 — 可进入 IR","es":"Botón 3 — llega a IR"},
            "help":{"en":"Press it again until the word IR appears. That is the door to pairing by hand: without it there is no way to re-pair a microphone that lost its receiver.",
                    "zh":"再次按下，直至出现 IR 字样。这是手动对码的入口：没有它，丢失对码的麦克风就无法重新连接接收器。",
                    "es":"Púlselo de nuevo hasta que aparezca la palabra IR. Es la puerta al emparejamiento manual: sin ella no hay forma de volver a emparejar un micrófono que perdió su receptor."}},
           {"id":"btn_receiver_on","code":"WMIC-017","once":true,
            "label":{"en":"Receiver button — power on","zh":"接收器按键 — 开机","es":"Botón del receptor — encendido"},
            "help":{"en":"Hold it 2 to 3 seconds. The receiver must come up on the first try.",
                    "zh":"长按 2 至 3 秒。接收器应一次开机成功。",
                    "es":"Manténgalo 2 a 3 segundos. El receptor debe encender al primer intento."}},
           {"id":"btn_receiver_off","code":"WMIC-017","once":true,
            "label":{"en":"Receiver button — power off","zh":"接收器按键 — 关机","es":"Botón del receptor — apagado"},
            "help":{"en":"Press it once, briefly. The receiver must switch off.",
                    "zh":"短按一次。接收器应关机。",
                    "es":"Púlselo una vez, brevemente. El receptor debe apagarse."}}]},

        /* Six yes/no answers about scratches became one clip. A dent is not a
           judgement worth recording as a word — it is something you either see
           or you do not, and what the office needs is to be able to see it too.
           One video, tilted through the angles, covers both microphones and the
           receiver at once and replaces the whole list. */
        {"id":"MIC_VISUAL","optional":false,"only_factory":["LES"],"evidence":["video"],
         "label":{"en":"VISUAL INSPECTION","zh":"外观检查","es":"INSPECCIÓN VISUAL"},
         "steps":[
           {"en":"Film both microphones and the receiver in one clip","zh":"用一段视频拍摄两支麦克风和接收器","es":"Filme los dos micrófonos y el receptor en un solo video"},
           {"en":"Tilt each one through several angles under the light","zh":"在光线下将每件产品倾斜到不同角度","es":"Incline cada uno en varios ángulos bajo la luz"},
           {"en":"Cover the grille, the buttons, the screen and the connector","zh":"需涵盖网罩、按键、显示屏和接口","es":"Cubra la rejilla, los botones, la pantalla y el conector"}],
         "points":[
           {"section":{"en":"Visual inspection","zh":"外观检查","es":"Inspección visual"},
            "help":{"en":"Nothing is switched on here. A unit that fails this section is not sent on for electrical testing.",
                    "zh":"本项无需开机。本节判定为异常的整机，不再送去做电气测试。",
                    "es":"Aquí no se enciende nada. La unidad que falle esta sección no pasa a las pruebas eléctricas."}},
           {"id":"body","code":"WMIC-019",
            "label":{"en":"Body, grille and buttons free of dents and scratches","zh":"机身、网罩和按键无凹陷和划痕","es":"Cuerpo, rejilla y botones sin golpes ni rayones"},
            "help":{"en":"One clip covering both microphones and the receiver. Tilt each one through several angles under the light rather than filming it flat: a scratch and a dent are invisible head-on and obvious at forty-five degrees, which is why a still photograph of the front proves so little. Cover the grille, the buttons, the screen and the charging connector on the way round.",
                    "zh":"用一段视频拍摄两支麦克风和接收器。在光线下将每件产品倾斜到不同角度，不要平拍：划痕和凹陷正对看不见，斜四十五度就一目了然——这正是正面静态照片说明不了问题的原因。拍摄过程中需涵盖网罩、按键、显示屏和充电接口。",
                    "es":"Un solo video que cubra los dos micrófonos y el receptor. Incline cada uno en varios ángulos bajo la luz en vez de filmarlo de frente: un rayón y un golpe son invisibles de frente y evidentes a cuarenta y cinco grados, y por eso una foto fija del frente demuestra tan poco. En el recorrido cubra la rejilla, los botones, la pantalla y el conector de carga."}}]},

        {/* `evidence` was declared twice here — once empty and once asking for a
              video. JavaScript keeps the last one, so the behaviour was right by
              accident, but the object was ambiguous to read and would be
              rejected outright by any JSON validator. */
         "id":"MIC_POWER_LIGHT","optional":false,"only_factory":["LES"],
         "evidence":["video"],"per_mic":true,
         "label":{"en":"POWER ON AND LIGHTS","zh":"开机与灯光","es":"ENCENDIDO Y LUCES"},
         "steps":[
           {"en":"Hold button 1 for 2 to 3 seconds to switch the microphone on","zh":"长按按键 1 约 2 至 3 秒开机","es":"Mantenga el botón 1 durante 2 a 3 segundos para encender el micrófono"},
           {"en":"Check the screen backlight and that it is not muted","zh":"检查屏幕背光，并确认未处于静音","es":"Revise la retroiluminación de la pantalla y que no quede en silencio"},
           {"en":"Step through the light colours with button 3","zh":"用按键 3 逐一切换灯光颜色","es":"Recorra los colores de la luz con el botón 3"},
           {"en":"Repeat the whole thing on every microphone the reference carries","zh":"在该型号配备的每支麦克风上重复全部步骤","es":"Repita todo en cada micrófono que traiga la referencia"}],
         "points":[
           {"section":{"en":"Power on and lights","zh":"开机与灯光","es":"Encendido y luces"},
            "help":{"en":"The first test that needs power. Everything is done with the microphone alone, without the receiver, so a fault found here is the microphone's and not the link's.",
                    "zh":"第一项需要通电的测试。全部只用麦克风本体完成，不接接收器，因此这里发现的问题属于麦克风，而不是无线链路。",
                    "es":"La primera prueba que necesita energía. Todo se hace con el micrófono solo, sin receptor, así que un fallo aquí es del micrófono y no del enlace."}},
           {"id":"power_on","code":"WMIC-001","label":{"en":"Switches on with a 2 to 3 second hold","zh":"长按 2 至 3 秒可开机","es":"Enciende con 2 a 3 segundos de pulsación"},
            "help":{"en":"The screen must come up and stay up. A microphone that needs two attempts to start is a fail even when it works afterwards.",
                    "zh":"屏幕应点亮并保持。需要按两次才能启动的麦克风，即使随后正常工作也判定为异常。",
                    "es":"La pantalla debe encender y mantenerse. Un micrófono que necesita dos intentos para arrancar es un fallo aunque después funcione."}},
           {"id":"backlight","code":"WMIC-002","label":{"en":"Screen backlight even","zh":"屏幕背光均匀","es":"Retroiluminación de la pantalla pareja"},
            "help":{"en":"Look at the screen in shade. The light must be even across it, with no darker corner and no flicker.",
                    "zh":"在阴影处观察屏幕。背光应整屏均匀，不应有暗角或闪烁。",
                    "es":"Mire la pantalla en sombra. La luz debe ser pareja en todo el ancho, sin una esquina más oscura ni parpadeos."}},
           {"id":"not_muted","code":"WMIC-004","label":{"en":"Does not start muted","zh":"开机不应处于静音","es":"No arranca en silencio"},
            "help":{"en":"Speak into it as soon as it starts. A microphone that comes up muted looks broken to whoever picks it up on stage.",
                    "zh":"开机后立即对着说话。开机即静音的麦克风，在台上拿起来的人会以为它坏了。",
                    "es":"Hable apenas arranque. Un micrófono que enciende en silencio parece dañado para quien lo toma en tarima."}},
           {/* One test for the whole cycle, on both microphones, filmed rather
                than photographed: eight states cannot be shown in one still, and
                eight separate points would be eight answers about the same press
                of the same button. The eighth state is the light off, and it is
                the one that gets forgotten — a cycle that never returns to off
                leaves the customer with a lamp he cannot turn out. */
            "id":"colours","code":"WMIC-003","once":true,
            "label":{"en":"Light — the eight states, both microphones","zh":"灯光 — 八种状态，两支麦克风","es":"Luz — los ocho estados, los dos micrófonos"},
            "help":{"en":"Press button 3 through the whole cycle on each microphone and film it in one clip. There must be eight states in this order: blue, red, green, yellow, orange, cyan, fuchsia, and then the light off. All eight must appear, and the cycle must come back to off rather than starting again at blue. A missing colour is a defect even though the microphone works.",
                    "zh":"在每支麦克风上按按键 3 走完整轮，并用一段视频录下。应有八种状态，顺序为：蓝、红、绿、黄、橙、青、玫红，最后是熄灭。八种都必须出现，且循环应回到熄灭，而不是直接回到蓝色。缺少一种颜色即为缺陷，即使麦克风仍能正常使用。",
                    "es":"Pulse el botón 3 hasta completar el ciclo en cada micrófono y fílmelo en un solo video. Deben ser ocho estados, en este orden: azul, rojo, verde, amarillo, naranja, cian, fucsia, y por último la luz apagada. Los ocho deben aparecer, y el ciclo debe volver a apagado en vez de arrancar de nuevo en azul. Un color que falta es un defecto aunque el micrófono funcione."}},
           {"id":"power_off","code":"WMIC-001","label":{"en":"Switches off with a 2 to 3 second hold","zh":"长按 2 至 3 秒可关机","es":"Apaga con 2 a 3 segundos de pulsación"},
            "help":{"en":"It must switch off cleanly, without the screen staying lit.",
                    "zh":"应干净地关机，屏幕不应残亮。",
                    "es":"Debe apagar limpio, sin que la pantalla quede prendida."}}]},

        {"id":"RECEIVER_CHARGE","optional":false,"only_factory":["LES"],"evidence":[],
         "label":{"en":"RECEIVER CHARGING","zh":"接收器充电","es":"CARGA DEL RECEPTOR"},
         "steps":[
           {"en":"Switch the receiver on","zh":"打开接收器","es":"Encienda el receptor"},
           {"en":"Connect the charger or the USB cable","zh":"接上充电器或 USB 线","es":"Conecte el cargador o el cable USB"},
           {"en":"Watch the charging LED, then unplug it","zh":"观察充电指示灯，然后拔掉","es":"Observe el LED de carga y luego desconecte"}],
         "points":[
           {"section":{"en":"Receiver charging","zh":"接收器充电","es":"Carga del receptor"},
            "help":{"en":"Charging is checked on the receiver first and on the microphones straight after, so the chargers are plugged in once and both tests share the same bench.",
                    "zh":"先测接收器充电，紧接着测麦克风充电，这样充电器只接一次，两项测试共用同一个工位。",
                    "es":"La carga se revisa primero en el receptor y enseguida en los micrófonos, así los cargadores se conectan una sola vez y las dos pruebas comparten el mismo puesto."}},
           {"id":"rcv_on","code":"WMIC-017","label":{"en":"Receiver switches on","zh":"接收器可开机","es":"El receptor enciende"},
            "help":{"en":"Hold its button 2 to 3 seconds. Its indicator must come up in green before you connect anything.",
                    "zh":"长按其按键 2 至 3 秒。在连接任何线之前，指示灯就应亮起绿色。",
                    "es":"Mantenga su botón 2 a 3 segundos. Su indicador debe encender en color verde."}},
           {"id":"rcv_led_on","code":"LED-002","photo":true,
            "label":{"en":"Charging LED — green and red together","zh":"充电指示 — 绿红同时亮起","es":"LED de carga — verde y rojo a la vez"},
            "help":{"en":"Plug the cable in and photograph the LED lit green and red at the same time. It must come on within a few seconds, not after a minute.",
                    "zh":"接上线，拍摄指示灯同时亮起绿色和红色的照片。应在几秒内亮起，而不是过一分钟才亮。",
                    "es":"Conecte el cable y fotografíe el LED encendido de color verde-rojo al mismo tiempo. Debe encender en pocos segundos, no al cabo de un minuto."}},
           {"id":"rcv_led_off","code":"LED-002","photo":true,
            "label":{"en":"The LED changes or goes out when unplugged","zh":"拔线后指示灯变色或熄灭","es":"El LED cambia o se apaga al desconectar"},
            "help":{"en":"Unplug the cable and photograph the LED again. It must react: an indicator that stays red with nothing connected tells the customer nothing.",
                    "zh":"拔掉线并再拍一次指示灯。它必须有反应：未接任何线却仍然常红的指示灯对客户毫无意义。",
                    "es":"Desconecte el cable y vuelva a fotografiar el LED. Debe reaccionar: un indicador que sigue en rojo sin nada conectado no le dice nada al cliente."}}]},

        {"id":"MIC_CHARGE","optional":false,"only_factory":["LES"],"evidence":["video"],"per_mic":true,
         "label":{"en":"MICROPHONE CHARGING","zh":"麦克风充电","es":"CARGA DEL MICRÓFONO"},
         "steps":[
           {"en":"Switch the microphone on and read the battery level","zh":"开机并读取电量","es":"Encienda el micrófono y lea el nivel de batería"},
           {"en":"Connect the charger or the USB cable","zh":"接上充电器或 USB 线","es":"Conecte el cargador o el cable USB"},
           {"en":"Watch the three lines rotating on the screen","zh":"观察屏幕上转动的三格电量条","es":"Observe las tres rayas girando en la pantalla"},
           {"en":"Repeat on the second microphone","zh":"在第二支麦克风上重复","es":"Repita en el segundo micrófono"}],
         "points":[
           {"section":{"en":"Microphone charging","zh":"麦克风充电","es":"Carga del micrófono"},
            "help":{"en":"Same bench as the receiver, one test later. Leave the microphones charging while the battery test below is prepared.",
                    "zh":"与接收器同一工位，紧随其后。可让麦克风继续充电，同时准备下面的电池测试。",
                    "es":"El mismo puesto que el receptor, una prueba después. Deje los micrófonos cargando mientras prepara la prueba de batería siguiente."}},
           {"id":"chg_level","code":"WMIC-012","label":{"en":"Battery level shown on the screen","zh":"屏幕显示电量","es":"El nivel de batería aparece en pantalla"},
            "help":{"en":"Read it before connecting anything. A microphone that ships with an empty battery arrives at the customer unusable on the first day.",
                    "zh":"在连接任何线之前先读数。出厂时电量为空的麦克风，客户第一天拿到就用不了。",
                    "es":"Léalo antes de conectar nada. Un micrófono que sale con la batería vacía llega al cliente inservible el primer día."}},
           {/* Filmed once, with both microphones in the frame, rather than
                photographed on each. What has to be seen is movement — the lines
                cycling while the cable is in, and the level standing still the
                moment it is pulled out — and a still photograph shows neither.
                The point about the indicator at the end of the charge is gone:
                nobody waits three hours at the bench for it. */
            "id":"chg_lines","code":"CHG-001","once":true,
            "label":{"en":"Charging — one clip of both microphones","zh":"充电 — 两支麦克风一段视频","es":"Carga — un video de los dos micrófonos"},
            "help":{"en":"Connect both microphones and film them in one clip. While the cable is in, the three lines must cycle to show they are charging. Then unplug and keep filming: the level must stop moving and stand at a fixed figure. A microphone whose lines keep rotating with nothing connected is reporting a charge it is not receiving.",
                    "zh":"同时接上两支麦克风，用一段视频录下。接线状态下，三格电量条应循环滚动表示正在充电。随后拔掉线并继续录制：电量显示应停止滚动并停在一个固定数值。未接线却仍在滚动的麦克风，是在显示一个它并没有在接收的充电状态。",
                    "es":"Conecte los dos micrófonos y fílmelos en un solo video. Con el cable puesto, las tres rayas deben ir rotando para indicar que están cargando. Luego desconecte y siga filmando: el nivel debe dejar de moverse y quedarse estático en una cifra fija. Un micrófono cuyas rayas siguen girando sin nada conectado está informando una carga que no está recibiendo."}}]},

        /* HK-RHO101 is one microphone, HK-RHO102 is two, and HK-RHO102-BAG is
           that same pair sold with its bag. So the bag reference runs the whole
           microphone plan and this test on top: it is the one test the other two
           do not carry, not a plan of its own. */
        {"id":"RHO102_BAG","optional":false,"only_factory":["LES"],"evidence":[],
         "only":["HK-RHO102-BAG"],
         "label":{"en":"RHO102 BAG","zh":"RHO102 收纳包","es":"BOLSA RHO102"},
         "steps":[
           {"en":"Take the bag out and put it on a clean table","zh":"取出收纳包放在干净台面上","es":"Saque la bolsa y póngala sobre una mesa limpia"},
           {"en":"Go over surface, seams, zippers, shape and finish","zh":"依次检查表面、缝线、拉链、形状和整体做工","es":"Recorra superficie, costuras, cremalleras, forma y acabado"},
           {"en":"Photograph each of the five checks","zh":"五个检查项各拍一张照片","es":"Fotografíe cada una de las cinco revisiones"}],
         "points":[
           {"section":{"en":"General appearance","zh":"整体外观","es":"Aspecto general"},
            "help":{"en":"Judge the bag by looking at it, pressing it and pulling on it. Nothing here needs power or a bench, and it can be done while the microphones are charging.",
                    "zh":"通过看、按和拉来检查收纳包。本节无需通电或工位，可在麦克风充电期间完成。",
                    "es":"Juzgue la bolsa mirándola, presionándola y tirando de ella. Nada aquí necesita energía ni puesto de trabajo, y se puede hacer mientras los micrófonos cargan."}},
           {"id":"bag_surface","code":"BAG-001","photo":true,
            "label":{"en":"Surface without tears, scratches or stains","zh":"表面无破损、划痕或污渍","es":"Superficie sin rasgaduras, rayones ni manchas"},
            "help":{"en":"Go over the whole outside under a lamp, including the base, which is the part that is always forgotten and the one that rubs.",
                    "zh":"在灯光下检查整个外表面，包括包底——这是最容易被忽略、也最容易磨损的部位。",
                    "es":"Recorra todo el exterior bajo una lámpara, incluida la base: es la parte que siempre se olvida y la que roza."}},
           {"id":"bag_threads","code":"BAG-002","label":{"en":"No loose threads or visible glue","zh":"无线头外露或胶痕","es":"Sin hilos sueltos ni pegante a la vista"},
            "help":{"en":"Look along every edge. A thread left hanging says the bag was not trimmed, and glue that shows says it was assembled in a hurry.",
                    "zh":"沿每条边缘查看。留有线头说明未修剪，胶痕外露说明装配仓促。",
                    "es":"Mire a lo largo de cada borde. Un hilo colgando dice que no se recortó, y el pegante a la vista dice que se armó con prisa."}},
           {"id":"bag_logo","code":"BAG-008","label":{"en":"Relief logo complete and clean","zh":"浮雕标志完整清洁","es":"Logo en relieve completo y limpio"},
            "help":{"en":"The relief must be sharp all the way round, with no flattened letters and no dirt caught in the grooves.",
                    "zh":"浮雕应整圈清晰，字母不应被压平，凹槽内不应积污。",
                    "es":"El relieve debe estar nítido en todo su contorno, sin letras aplastadas ni suciedad atrapada en los surcos."}},
           {"section":{"en":"Seams and assembly","zh":"缝线与装配","es":"Costuras y ensamble"},
            "help":{"en":"Check everything below by pulling gently, not by looking only.",
                    "zh":"以下各项都要轻轻拉拽检查，而不是只看。",
                    "es":"Todo lo de abajo se revisa tirando con suavidad, no sólo mirando."}},
           {"id":"bag_seams","code":"BAG-003","photo":true,
            "label":{"en":"Seams straight and firm","zh":"缝线笔直牢固","es":"Costuras rectas y firmes"},
            "help":{"en":"The stitching must run straight with an even pitch. Uneven stitches are the point where the seam opens first.",
                    "zh":"缝线应笔直、针距均匀。针距不均之处就是缝线最先开裂的地方。",
                    "es":"La puntada debe ir recta y con paso parejo. La puntada despareja es el punto por donde la costura se abre primero."}},
           {"id":"bag_reinforced","code":"BAG-003","label":{"en":"Reinforced areas intact","zh":"加固部位完好","es":"Zonas reforzadas íntegras"},
            "help":{"en":"Pull gently where the handles and straps are anchored. That is where the whole weight goes.",
                    "zh":"在提手和背带的固定处轻轻拉拽。整包的重量都由这些点承受。",
                    "es":"Tire suavemente donde se anclan asas y correas. Ahí va todo el peso."}},
           {"id":"bag_panels","code":"BAG-003","label":{"en":"Panels properly joined","zh":"各片料拼接到位","es":"Paneles bien unidos"},
            "help":{"en":"There must be no gaps between panels and no gap at a corner where the lining shows through.",
                    "zh":"各片之间不应有缝隙，转角处也不应露出内衬。",
                    "es":"No debe haber huecos entre paneles ni aberturas en una esquina por donde asome el forro."}},
           {"section":{"en":"Zippers and hardware","zh":"拉链与五金","es":"Cremalleras y herrajes"},
            "help":{"en":"The part with moving pieces, and the one that generates most of the claims after the sale.",
                    "zh":"这是唯一有活动件的部分，也是售后客诉最集中的部分。",
                    "es":"La parte con piezas móviles, y la que genera la mayoría de los reclamos después de la venta."}},
           {"id":"bag_zip","code":"BAG-004","photo":true,
            "label":{"en":"Zippers run smoothly","zh":"拉链顺畅","es":"Las cremalleras corren bien"},
            "help":{"en":"Open and close each one from end to end, twice. It must not catch or need a second hand to hold the fabric.",
                    "zh":"每条拉链从头到尾开合两次。不应卡顿，也不应需要另一只手压住面料。",
                    "es":"Abra y cierre cada una de extremo a extremo, dos veces. No debe trabarse ni necesitar la otra mano para sostener la tela."}},
           {"id":"bag_teeth","code":"BAG-004","label":{"en":"Zipper teeth aligned","zh":"链齿对齐","es":"Dientes de la cremallera alineados"},
            "help":{"en":"Look at the closed zipper against the light. A tooth out of line is where it will split open under load.",
                    "zh":"对光观察已拉合的拉链。错位的链齿就是受力时崩开的位置。",
                    "es":"Mire la cremallera cerrada a contraluz. Un diente desalineado es por donde se va a abrir con carga."}},
           {"id":"bag_hardware","code":"BAG-005","label":{"en":"Buckles, straps and handles secure","zh":"扣具、背带和提手牢固","es":"Hebillas, correas y asas firmes"},
            "help":{"en":"Click every buckle and pull on every strap. Nothing must be deformed and nothing must come away.",
                    "zh":"逐个扣合扣具并拉拽每条背带。不应有变形，也不应脱开。",
                    "es":"Encaje cada hebilla y tire de cada correa. Nada debe estar deformado ni soltarse."}},
           {"section":{"en":"Shape and material","zh":"形状与材质","es":"Forma y material"},
            "help":{"en":"An empty bag that has already lost its shape on the shelf will not hold a microphone kit.",
                    "zh":"空包在货架上就已经塌形的，装不住一套麦克风。",
                    "es":"Una bolsa vacía que ya perdió la forma en el estante no va a sostener un juego de micrófonos."}},
           {"id":"bag_shape","code":"BAG-006","photo":true,
            "label":{"en":"Keeps its shape when pressed","zh":"按压后能恢复形状","es":"Mantiene la forma al presionar"},
            "help":{"en":"Press gently on each face and let go. It must come back, not stay dented.",
                    "zh":"轻按各面后松手。应能回弹，而不是留下凹痕。",
                    "es":"Presione suavemente cada cara y suelte. Debe volver, no quedarse hundida."}},
           {"id":"bag_padding","code":"BAG-007","label":{"en":"Padding uniform","zh":"衬垫均匀","es":"Acolchado uniforme"},
            "help":{"en":"Feel the whole surface with the flat of your hand. A soft spot means the padding shifted or was cut short there.",
                    "zh":"用手掌摊平摸遍整个表面。有软塌处说明衬垫移位或该处裁短了。",
                    "es":"Recorra toda la superficie con la palma. Una zona blanda significa que el acolchado se corrió o quedó corto ahí."}},
           {"id":"bag_material","code":"BAG-007","label":{"en":"Material consistent throughout","zh":"整包材质一致","es":"Material consistente en toda la bolsa"},
            "help":{"en":"Texture and thickness must be the same everywhere. A panel from another roll shows up as a different sheen.",
                    "zh":"纹理和厚度应处处一致。用了另一卷料的片区会呈现不同的光泽。",
                    "es":"Textura y grosor deben ser iguales en todas partes. Un panel de otro rollo se nota como un brillo distinto."}},
           {"section":{"en":"Final check","zh":"最终确认","es":"Revisión final"},
            "help":{"en":"The last look, with everything already checked: the question here is no longer whether each part is right but whether the bag is fit to ship.",
                    "zh":"在各项都已检查完毕后的最后一看：这里的问题不再是每个部位是否合格，而是这只包能否出货。",
                    "es":"La última mirada, con todo ya revisado: aquí la pregunta ya no es si cada parte está bien, sino si la bolsa está para despachar."}},
           {"id":"bag_final","code":"BAG-001","photo":true,
            "label":{"en":"Ready to pack and ship","zh":"可以装箱出货","es":"Lista para empacar y despachar"},
            "help":{"en":"Look at the bag as the customer will see it when the box is opened. Photograph it whole. If anything above was marked as a finding, this point cannot pass.",
                    "zh":"以客户开箱时看到的角度审视这只包，并拍摄整体照片。若上面任何一项判定为异常，本项不能通过。",
                    "es":"Mire la bolsa como la verá el cliente al abrir la caja. Fotografíela entera. Si algo de lo anterior quedó marcado como novedad, este punto no puede aprobar."}}]},

        /* Two microphones on one receiver at the same time, so it exists only
           where there are two: HK-RHO101 ships a single microphone and there is
           nothing here it could be asked to do. */
        {"id":"SIMULTANEOUS","optional":false,"only_factory":["LES"],"evidence":["video"],
         "skip":["HK-RHO101"],
         "label":{"en":"SIMULTANEOUS CONNECTION","zh":"双麦同时连接","es":"CONEXIÓN SIMULTÁNEA"},
         "steps":[
           {"en":"Connect the receiver to a speaker at medium volume","zh":"将接收器接到音箱，音量置于中等","es":"Conecte el receptor a un parlante en volumen medio"},
           {"en":"Switch off both microphones and the receiver","zh":"关闭两支麦克风和接收器","es":"Apague los dos micrófonos y el receptor"},
           {"en":"Switch them back on and touch nothing else","zh":"重新开机，之后不要再按任何键","es":"Vuelva a encenderlos y no toque nada más"},
           {"en":"Film the whole sequence in one clip","zh":"用一段视频录下整个过程","es":"Filme toda la secuencia en un solo video"}],
         "points":[
           {"section":{"en":"Simultaneous connection","zh":"双麦同时连接","es":"Conexión simultánea"},
            "help":{"en":"This is the customer's first morning, reproduced: everything was switched off last night and switched on again today, and it has to work without anybody pressing anything. Film it in one clip — what has to be seen is that nothing was touched between switching on and hearing both voices.",
                    "zh":"这一项复现的是客户的第一个早晨：昨晚全部关机，今天重新开机，必须无需按任何键就能正常工作。用一段视频录下——需要看到的正是从开机到听见两个人声之间没有任何操作。",
                    "es":"Esto reproduce la primera mañana del cliente: anoche se apagó todo y hoy se vuelve a encender, y tiene que funcionar sin que nadie pulse nada. Fílmelo en un solo video: lo que hay que ver es que entre encender y oír las dos voces no se tocó nada."}},
           {"id":"both_on","code":"WMIC-001","label":{"en":"Everything switches back on","zh":"全部可重新开机","es":"Todo vuelve a encender"},
            "help":{"en":"Switch off the two microphones and the receiver, then switch the three of them on again. All three must come up on the first try.",
                    "zh":"关闭两支麦克风和接收器，然后将三者重新开机。三者都应一次开机成功。",
                    "es":"Apague los dos micrófonos y el receptor, y vuelva a encender los tres. Los tres deben arrancar al primer intento."}},
           {"id":"auto_pair","code":"WMIC-006","label":{"en":"Both reconnect on their own","zh":"两支均能自动重新连接","es":"Ambos se vuelven a conectar solos"},
            "help":{"en":"They must find the receiver again without the IR procedure and without a single key being pressed. Having to pair by hand after a power cycle is a fail: the customer does not read the manual before every event.",
                    "zh":"应无需红外对码、也无需按任何键，即可重新连上接收器。关机再开机后还要手动对码即判定为异常：客户不会在每场演出前都翻说明书。",
                    "es":"Deben volver a encontrar el receptor sin el procedimiento de IR y sin pulsar una sola tecla. Tener que emparejar a mano después de apagar es un fallo: el cliente no lee el manual antes de cada evento."}},
           {"id":"diff_channels","code":"WMIC-005","photo":true,
            "label":{"en":"One on channel A and the other on channel B","zh":"一支在 A 频道、另一支在 B 频道","es":"Uno en canal A y el otro en canal B"},
            "help":{"en":"Read both screens and photograph them together with the channels visible. One must come back on A and the other on B: two microphones that land on the same channel cancel each other, and on stage that looks like a broken microphone rather than a pairing fault.",
                    "zh":"读取两块屏幕，并拍摄一张能同时看到两个频道的照片。一支应回到 A、另一支回到 B：落在同一频道的两支会互相抵消，在台上看起来像是麦克风坏了，而不像对码问题。",
                    "es":"Lea las dos pantallas y fotografíelas juntas con los canales visibles. Uno debe volver en A y el otro en B: dos micrófonos que caen en el mismo canal se anulan entre sí, y en tarima eso parece un micrófono dañado y no un problema de emparejamiento."}},
           {"id":"audio_both","code":"WMIC-008",
            "label":{"en":"Both are heard without pressing anything","zh":"无需按键即可听到两支的声音","es":"Se oyen los dos sin pulsar nada"},
            "help":{"en":"With the receiver connected to a speaker at medium volume, speak into one and then the other. Both must be heard, at the same level, without touching a single key on either microphone or on the receiver.",
                    "zh":"接收器接到音箱、音量置于中等，先对一支说话，再对另一支说话。两支都应被听到且音量一致，期间不得触碰麦克风或接收器上的任何按键。",
                    "es":"Con el receptor conectado a un parlante en volumen medio, hable por uno y luego por el otro. Los dos deben oírse, al mismo nivel, sin tocar una sola tecla ni en los micrófonos ni en el receptor."}},
           {"id":"alternate","code":"WMIC-008","label":{"en":"Alternating speech comes through clean","zh":"交替讲话时声音清晰","es":"Hablar alternando sale limpio"},
            "help":{"en":"Speak a few seconds into one and then into the other. Both must be heard at the same level, with no delay in taking over.",
                    "zh":"先对一支说几秒，再换另一支。两者音量应一致，接替时不应有延迟。",
                    "es":"Hable unos segundos por uno y luego por el otro. Los dos deben oírse al mismo nivel, sin retardo al tomar el relevo."}},
           {"id":"together","code":"WMIC-008","label":{"en":"Speaking into both at once, no interference","zh":"两支同时讲话无干扰","es":"Hablando por los dos a la vez, sin interferencia"},
            "help":{"en":"Two people speak at the same time, one into each microphone. Both voices must be heard separately, with no whistling, no signals mixing and neither one cutting the other off.",
                    "zh":"两人同时讲话，各对一支麦克风。两个人声应各自清晰可辨，不应有啸叫、串音，也不应互相切断。",
                    "es":"Dos personas hablan a la vez, una por cada micrófono. Deben oírse las dos voces por separado, sin pitidos, sin señales mezcladas y sin que una corte a la otra."}}]},

        {"id":"CHANNELS","optional":false,"only_factory":["LES"],"evidence":[],"per_mic":true,
         "label":{"en":"CHANNELS","zh":"频道","es":"CANALES"},
         "steps":[
           {"en":"With the receiver on and connected to the test speaker","zh":"保持接收器开启并接到测试音箱","es":"Con el receptor encendido y conectado al parlante de prueba"},
           {"en":"Hold button 3 until CH# starts flashing","zh":"长按按键 3 直至 CH# 开始闪烁","es":"Mantenga el botón 3 hasta que CH# empiece a parpadear"},
           {"en":"Change channel with buttons 2 and 4","zh":"用按键 2 和 4 切换频道","es":"Cambie de canal con los botones 2 y 4"},
           {"en":"Go through every channel the microphone has","zh":"遍历该麦克风的全部频道","es":"Recorra todos los canales que tenga el micrófono"}],
         "points":[
           {"section":{"en":"Channels","zh":"频道","es":"Canales"},
            "help":{"en":"The setup from the previous test is left exactly as it is. What is being checked is not that one channel works but that all of them do: the customer who buys four kits for one venue needs every channel.",
                    "zh":"沿用上一项的布置，不做任何改动。这里要确认的不是某一个频道可用，而是全部可用：为同一场地购买四套的客户，每个频道都要能用。",
                    "es":"El montaje de la prueba anterior se deja tal cual. Lo que se comprueba no es que funcione un canal, sino todos: el cliente que compra cuatro juegos para un mismo local necesita cada canal."}},
           {"id":"ch_enter","code":"WMIC-005","label":{"en":"Enters channel mode","zh":"可进入频道设置","es":"Entra en el modo de canal"},
            "help":{"en":"Hold button 3 until CH# flashes. If it does not flash, the channel cannot be changed and nothing below can be tested.",
                    "zh":"长按按键 3 至 CH# 闪烁。若不闪烁，则无法换台，下面的项目也无法测试。",
                    "es":"Mantenga el botón 3 hasta que CH# parpadee. Si no parpadea, el canal no se puede cambiar y nada de lo de abajo se puede probar."}},
           {"id":"ch_change","code":"WMIC-005","label":{"en":"Buttons 2 and 4 change the channel","zh":"按键 2 和 4 可切换频道","es":"Los botones 2 y 4 cambian el canal"},
            "help":{"en":"One goes up and the other down, one channel at a time. It must not skip numbers or jump back to the first.",
