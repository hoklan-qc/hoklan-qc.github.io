   The ZIP is written by hand, stored (no compression). Photos and videos are
   already compressed formats, so deflating them would cost seconds of phone
   CPU to save almost nothing; and writing "stored" needs no library, which is
   what keeps this app a single offline file.
--------------------------------------------------------------------------- */
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function makeZip(entries){
  const enc = new TextEncoder();
  const now = new Date();
  const time = ((now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1)) & 0xFFFF;
  const date = (((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate()) & 0xFFFF;

  const parts = [], dir = [];
  let offset = 0;

  for(const e of entries){
    const blob = e.data instanceof Blob ? e.data : new Blob([e.data]);
    // Read one file at a time and push the Blob, not the bytes: the browser can
    // spill Blobs to disk, so a 200 MB video never sits in memory as an array.
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const name = enc.encode(e.name);
    const crc = crc32(bytes), size = bytes.length;

    const lfh = new Uint8Array(30 + name.length);
    const h = new DataView(lfh.buffer);
    h.setUint32(0, 0x04034b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 0x0800, true);      // names are UTF-8
    h.setUint16(8, 0, true);           // stored
    h.setUint16(10, time, true);
    h.setUint16(12, date, true);
    h.setUint32(14, crc, true);
    h.setUint32(18, size, true);
    h.setUint32(22, size, true);
    h.setUint16(26, name.length, true);
    lfh.set(name, 30);

    parts.push(lfh, blob);
    dir.push({name, crc, size, offset});
    offset += lfh.length + size;
  }

  const cd = [];
  let dirSize = 0;
  for(const e of dir){
    const rec = new Uint8Array(46 + e.name.length);
    const h = new DataView(rec.buffer);
    h.setUint32(0, 0x02014b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 20, true);
    h.setUint16(8, 0x0800, true);
    h.setUint16(10, 0, true);
    h.setUint16(12, time, true);
    h.setUint16(14, date, true);
    h.setUint32(16, e.crc, true);
    h.setUint32(20, e.size, true);
    h.setUint32(24, e.size, true);
    h.setUint16(28, e.name.length, true);
    h.setUint32(42, e.offset, true);
    rec.set(e.name, 46);
    cd.push(rec); dirSize += rec.length;
  }

  const eocd = new Uint8Array(22);
  const h = new DataView(eocd.buffer);
  h.setUint32(0, 0x06054b50, true);
  h.setUint16(8, dir.length, true);
  h.setUint16(10, dir.length, true);
  h.setUint32(12, dirSize, true);
  h.setUint32(16, offset, true);

  return new Blob(parts.concat(cd, [eocd]), {type:"application/zip"});
}

/* Every photo and video with the context it was taken in, so the file name can
   say what it shows without anyone having to open it. */
function mediaList(){
  const out = [];
  allUnits().forEach(u => unitRows(u).forEach((r,i)=>{
    if(!r) return;
    const t = tests()[i];
    (r.media || []).forEach(m => {
      const p = m.slot && t ? realPoints(t).find(x => x.id === m.slot) : null;
      out.push({
        m, unit:u,
        test: t ? t.id : (r.id || "TEST"),
        point: p ? p.id : "",
        verdict: p ? (r.points[p.id] || "") : "",
        // Photo tests document the shipment, not one unit: their pictures are
        // filed on speaker 1 for storage reasons only, so the file name must
        // not claim they show speaker 1 in particular.
        lot: !!(t && t.type === "photos")
      });
    });
  }));
  return out;
}
/* Naming rule, as agreed with quality:
     evidence of a point   TEST_point_FAIL_speaker2_01.jpg
     evidence of the test  TEST_01.jpg
   The point-level file carries its verdict because that is the one somebody
   goes looking for months later; the test-level one documents the whole test
   and needs nothing more than the test name.
   The unit token follows the factory, like the word on screen does: a file
   named speaker2.jpg inside a folder of microphone evidence is the kind of
   detail that makes somebody doubt the whole pack. It stays in English and
   unaccented because it is a file name that travels between operating
   systems, not something the inspector reads. */
const UNIT_FILE = {LES:"set"};
function mediaName(v, n){
  const slug = s => String(s||"").replace(/[^A-Za-z0-9]+/g,"_")
                                 .replace(/^_+|_+$/g,"").toUpperCase();
  const bits = [slug(v.test)];
  if(v.point){
    bits.push(slug(v.point));
    if(v.verdict === "PASS" || v.verdict === "FAIL") bits.push(v.verdict);
    if(S.units > 1 && !v.lot){
      bits.push((UNIT_FILE[S.factory] || "speaker") + (v.unit + 1));
    }
  }
  bits.push(String(n).padStart(2,"0"));
  return bits.join("_");
}

function dataUrlToBlob(url){
  const cut = url.indexOf(",");
  const type = (url.slice(0, cut).match(/data:([^;]+)/) || [,"image/jpeg"])[1];
  const bin = atob(url.slice(cut + 1));
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], {type});
}

function packetName(){
  return fileName().replace(/\.html$/, "");
}

/* Run something with the report language forced, then put it back. The whole
   report is built from tr()/L(), so this is all it takes to issue it twice. */
function inLang(code, fn){
  const prev = LANG;
  LANG = code;
  try{ return fn(); }
  finally{ LANG = prev; }
}

async function buildPacket(){
  const base = packetName();

  let lost = 0, photos = 0, videos = 0, docs = 0;
  const files = [];
  const seen = {};   // same name twice would silently overwrite in some tools
  /* The clips that could not be packed, by the name they would have carried.
     A count on its own — "2 videos could not be included" — leaves the operator
     with no way to know which two, and the recordings are still sitting in the
     phone's gallery. Named, they can be found there and sent by hand. */
  const lostVideos = [];

  mediaList().forEach(v => {
    const isVideo = v.m.kind === "video";
    let stem = mediaName(v, 1), n = 1;
    while(seen[stem]) stem = mediaName(v, ++n);
    seen[stem] = true;

    if(isVideo){
      // A video only survives while the page is open: what is stored is an
      // object URL, and reloading the page invalidates it. Tested with
      // `instanceof Blob`, not for truthiness — JSON.stringify turns a File
      // into `{}`, which is truthy, and a restored draft would then pack a
      // 15-byte file containing "[object Object]" and report nothing lost.
      if(!(v.m.file instanceof Blob)){
        lost++;
        lostVideos.push(stem + (v.m.at ? "  ·  " + shotStamp(v.m.at) : ""));
        return;
      }
      const ext = (v.m.name && v.m.name.indexOf(".") >= 0)
        ? v.m.name.split(".").pop().toLowerCase().slice(0,4) : "mp4";
      files.push({name: `${base}/videos/${stem}.${ext}`, data: v.m.file});
      videos++;
    } else {
      // Photos also travel as files, not only embedded in the report: named
      // this way they can be browsed, forwarded or attached to a claim
      // without opening anything.
      //
      // Guarded one by one. A single unreadable photo used to abort the whole
      // packet from inside atob(); losing one picture and saying so is a far
      // better outcome than losing the videos and the report with it.
      try{
        if(!v.m.url || v.m.url.indexOf("data:") !== 0) throw new Error("no data");
        /* A PDF travels as a photo everywhere inside the app, but not here: in
           the packet it has to land as a .pdf in a folder of its own, or the
           supplier's report arrives named .jpg and opens in nothing.
           `dataUrlToBlob` already reads the real type out of the data URL, so
           only the name and the folder need saying. */
        if(isPdfMedia(v.m)){
          files.push({name: `${base}/docs/${stem}.pdf`,
                      data: dataUrlToBlob(v.m.url)});
          docs++;
        } else {
          files.push({name: `${base}/photos/${stem}.jpg`,
                      data: dataUrlToBlob(v.m.url)});
          photos++;
        }
      }catch(err){ lost++; }
    }
  });

  // Both languages, always. The factory fills the checklist in Chinese and the
  // office in Colombia reads English; issuing only the operator's language
  // means somebody has to translate a quality record by hand.
  const entries = [
    {name: base + "/REPORT_ES.html",
     data: new Blob([inLang("es", reportHtml)], {type:"text/html;charset=utf-8"})},
    {name: base + "/REPORT_EN.html",
     data: new Blob([inLang("en", reportHtml)], {type:"text/html;charset=utf-8"})},
    {name: base + "/REPORT_ZH.html",
     data: new Blob([inLang("zh", reportHtml)], {type:"text/html;charset=utf-8"})},
    // The spreadsheet carries the full packet name, not "DATA": it is the file
    // that gets pulled out of the folder and opened on its own, and a Downloads
    // folder with four files called DATA.csv identifies nothing.
    /* Always in Spanish, whatever language the inspection was filled in. The
       reports come in three because three audiences read them; the spreadsheet
       has one reader — the office in Colombia, which consolidates every factory
       into the same file. A column heading that changes with the operator's
       phone is what turns two identical inspections into two different columns
       when the sheets are put together. The *_key columns stay untouched
       either way, so nothing depends on this to be grouped correctly. */
    {name: base + "/" + base + ".csv",
     data: new Blob([inLang("es", reportCsv)], {type:"text/csv;charset=utf-8"})},
    {name: base + "/READ_ME.txt",
     data: new Blob([packetReadme(photos, videos, lost, lostVideos, docs)],
                    {type:"text/plain;charset=utf-8"})}
  ].concat(files);

  return {blob: await makeZip(entries), name: base + ".zip",
          videos, photos, lost, lostVideos, docs};
}

function packetReadme(photos, videos, lost, lostVideos, docs){
  const out = [];   // not `L`: that is the localisation helper
  out.push("HOKLAN QC — " + S.testId + " — " + S.model);
  out.push(inspectionDate(S.startedAt) + "  ·  " + S.operator);
  out.push(S.units > 1 ? S.units + " speakers" : "1 speaker");
  const sc = partialScope();
  if(sc) out.push("!! " + fmt("scope_part",{n:sc.n, tot:sc.tot}));
  out.push("");
  out.push("REPORT_ES.html  " + tr("rm_report_es"));
  out.push("REPORT_EN.html  " + tr("rm_report_en"));
  out.push("REPORT_ZH.html  " + tr("rm_report_zh"));
  out.push(packetName() + ".csv");
  out.push("                " + tr("rm_csv"));
  if(photos) out.push("photos/         " + fmt("rm_photos",{n:photos}));
  if(videos) out.push("videos/         " + fmt("rm_videos",{n:videos}));
  if(docs)   out.push("docs/           " + fmt("rm_docs",{n:docs}));
  out.push("");
  out.push(tr("rm_naming"));
  /* Named here too, and not only on the screen: whoever opens this folder in
     Colombia is the one who will notice a clip is missing, and this is the
     file that tells him it was never packed rather than lost in transit. */
  if(lost){
    out.push("");
    out.push("!! " + fmt("lost_head",{n:lost}));
    (lostVideos || []).forEach(n => out.push("   · " + n));
    out.push("   " + tr("lost_wechat"));
  }
  out.push("");
  out.push(tr("rm_pdf"));
  // Moved out of the report's closing line and kept here, next to the folder of
  // photographs it is talking about.
  out.push("");
  out.push(tr("footer_note"));
  // BOM: Notepad on Windows shows the Chinese and the em-dashes as mojibake
  // without it.
  return "﻿" + out.join("\r\n") + "\r\n";
}

function saveBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 20000);
}

function showSaved(html){
  const el = document.getElementById("saved");
  if(!el) return;
  // An empty string hides the box, so callers can clear it without knowing
  // anything about how it is shown.
  el.innerHTML = html || "";
  el.classList.toggle("hidden", !html);
}

let packing = false;
async function withPacket(use){
  if(packing) return;
  packing = true;
  const btns = Array.prototype.slice.call(actions.querySelectorAll("button"));
  btns.forEach(b => b.disabled = true);
  showSaved(tr("packing"));
  try{
    // Last chance to fill in any English line the debounce did not catch: after
    // this the report is written and the ZIP is closed.
    await ensureTranslations();
    await ensureRefImg();
    const p = await buildPacket();
    await use(p);
  }catch(err){
    showSaved(tr("a_pack_fail") + " " + esc(err && err.message ? err.message : err));
  }finally{
    packing = false;
    btns.forEach(b => b.disabled = false);
  }
}

/* What ended up in the file, and — when something did not — what is missing and
   what to do about it. A clip that could not be packed is not lost: it is in the
   phone's gallery, where it was recorded. The operator has to be told that, by
   name, at the moment he is about to send the packet and assume it is complete. */
function packetSummary(p){
  const head = fmt("packet_done",{f:esc(p.name), s:humanSize(p.blob.size),
                                  n:p.photos, v:p.videos});
  if(!p.lost) return head;
  const list = (p.lostVideos || []).length
    ? `<br>${(p.lostVideos || []).map(n => "· " + esc(n)).join("<br>")}` : "";
  return head +
    `<div class="warn" style="margin-top:10px;text-align:left">` +
    `<b>${fmt("lost_head",{n:p.lost})}</b>${list}<br><br>` +
    `${tr("lost_wechat")}</div>`;
}

/* ---------- respaldo en Drive ---------------------------------------------
   El paquete se descarga al teléfono y además se sube a una carpeta de HOKLAN
   en Google Drive. La descarga manda: es la copia que no depende de la red, y
   es la única que exige la app antes de dejar volver al inicio. El respaldo
   ocurre después, aparte, y su fracaso no atrapa a nadie — una fábrica sin
   señal no puede quedarse con el operario de pie frente a una barra de
   progreso.

   Cómo funciona, en dos pasos. El teléfono le pide al buzón —una función de
   HOKLAN en Cloudflare— un permiso de subida, presentando el código de la
   cuenta con la que se inspecciona. El buzón, que es quien guarda las
   credenciales de Google, devuelve una URL de un solo uso. El ZIP viaja del
   teléfono directo a Google por esa URL: no pasa por el buzón, así que ni el
   tamaño del paquete ni el tráfico son problema de nadie.

   Vacío desactiva el respaldo por completo, sin tocar nada más. */
const BUZON = "https://buzon-hoklan.esneyder-q.workers.dev/";

/* Callado en los dos sentidos, por decisión de HOKLAN: ni avisa que sube, ni
   avisa que falló, ni ofrece reintentar. Para el operario esto no existe.

   La razón es que no es su problema. Él ya hizo lo que tenía que hacer —la
   inspección está descargada en su teléfono— y el respaldo es una comodidad de
   la oficina. Un aviso rojo por una red de fábrica que se cayó sólo consigue
   que alguien crea que perdió el trabajo, o que se quede intentando arreglar
   algo que no puede arreglar.

   Lo que esto cuesta, y hay que saberlo: si falla, nadie se entera en el
   momento. Quien lo nota es HOKLAN, al ver que ese informe no llegó a la
   carpeta. Por eso aquí se reintenta tres veces antes de rendirse, con esperas
   crecientes: el corte de red de una fábrica suele durar segundos, y quien no
   va a pedir ayuda más vale que insista solo. */
async function subirRespaldo(p){
  if(!BUZON) return;

  for(let intento = 0; intento < 3; intento++){
    if(intento) await new Promise(r => setTimeout(r, intento * 4000));
    if(navigator.onLine === false) continue;
    try{
      const r = await fetch(BUZON, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code: S.testId, filename: p.name, size: p.blob.size })
      });
      const s = await r.json();
      if(!s || !s.url) throw new Error((s && s.error) || "buzon");

      const up = await fetch(s.url, { method: "PUT", body: p.blob });
      if(!up.ok) throw new Error("drive " + up.status);
      return;                                   // subido
    }catch(e){
      /* A la consola y a ningún sitio más. Sirve para diagnosticar con el
         teléfono en la mano; el operario no lo ve. */
      try{ console.warn("respaldo Drive:", e); }catch(_){}
    }
  }
}

function downloadPacket(){
  if(!CAN_DOWNLOAD){ alert(tr("a_no_download")); return; }
  withPacket(async p => {
    saveBlob(p.blob, p.name);
    showSaved(packetSummary(p) + tr("saved_hint"));
    clearDraft();
    /* Después de `clearDraft`, que no toca esta bandera, y con un render para
       que el botón cambie a verde en el acto. */
    PACKET_SAVED = true;
    render();
    /* Sin `await`: la descarga ya ocurrió y el operario no tiene por qué
       esperar a que termine el respaldo para seguir con lo suyo. */
    subirRespaldo(p);
  });
}

/* There is no SHARE button: the packet is downloaded and attached by hand. The
   system share sheet was removed on request — on iOS that made the download the
   only route off the phone, which is why CAN_DOWNLOAD no longer excludes it. */

/* ---------- screens ------------------------------------------------------- */
function render(){
  if(S.screen === "setup")  renderSetup();
  else if(S.screen === "admin") renderAdmin();
  else if(S.screen === "test")   renderTest();
  else if(S.screen === "index")  renderIndex();
  else if(S.screen === "report") renderReport();
  else renderDone();
  updateTopBtn();
}

/* ---------- admin ---------------------------------------------------------
   A second tab where the whole reference catalogue is listed and a single test
   can be launched on its own — a re-test of one defect without walking the
   entire plan again.

   The way in is the Test ID field on the start screen: typing the admin code
   there opens this tab instead of starting an inspection. There is no extra
   box on the screen, and the app looks untouched until somebody knows the code.

   What that is worth: the code sits in a file anyone can read, next to the
   catalogue it guards. It stops an operator from wandering in; it stops nobody
   who opens the page source. Actually restricting Admin would need a server.
--------------------------------------------------------------------------- */
/* ---------- order numbers for admin inspections ---------------------------
   An inspection launched from Admin has nobody typing a purchase order, so the
   app assigns a running number: HK001 for HOKLAN, 001 for a factory account.
   The factory letter is added when the report is printed, not stored.

   The counter lives in this phone's storage, which is worth saying out loud:
   two phones running factory inspections will each start at 001 and produce the
   same numbers. It identifies an inspection within a device, not across a
   company. A shared sequence would need a server.
------------------------------------------------------------------------- */
const PO_SEQ_KEY = "hoklan_qc_po_";
const poSeqName = () => PO_SEQ_KEY + (ADMIN_FACTORY || "HK");
const poDigits = n => String(n).padStart(3, "0");

/* What the next inspection will get, without consuming it: shown on the screen
   where the tests are chosen, so an abandoned selection does not burn a number. */
function peekPo(){
  let n = 0;
  try{ n = parseInt(localStorage.getItem(poSeqName()), 10) || 0; }catch(e){}
  return n + 1;
}
/* Sólo los dígitos. El prefijo se pone al imprimir, no al guardar: HOKLAN lo
   quiere en el idioma del informe —OC en español, PO en inglés y chino—, y un
   número guardado como OC000123 en un teléfono y PO000123 en otro sería el
   mismo dato escrito de dos formas, imposible de buscar en la hoja de cálculo.
   Guardado va limpio; rotulado se ve en cada idioma. */
function takePo(){
  const n = peekPo();
  try{ localStorage.setItem(poSeqName(), String(n)); }catch(e){}
  return poDigits(n);
}
/* The order number as the report prints it. A factory inspection carries the
   initial of its factory there — and only there, so `S.po` stays the value the
   spreadsheet and the dashboard can be searched by.

   `poAuto` distingue el número que generó la app del que la fábrica copió de la
   orden del cliente: a un PO-88213 ajeno no se le antepone nada. */
const poPrinted = () => (S.poAuto ? tr("po_prefix") + " " : "") +
                        (S.poLetter || "") + (S.po || "");

const ADMIN_ID = {digits:"365", code:"365-H8Q2K7L4"};

/* ---------- assignments ---------------------------------------------------
   One permanent three-digit code that opens whatever HOKLAN decided the
   factory should run. The code never changes. What changes is a small file
   published next to the app, asignacion.json, naming the reference and the
   tests.

   Why a file and not something carried inside the code the operator types: the
   selection has to travel from the phone that decided it to the phone that
   will run it, and those two are in different countries with nothing between
   them. The repository that already publishes this app is the only storage
   both sides can reach, so it is the one used. The cost is worth saying out
   loud rather than hiding: a new assignment means uploading a two-line file.

   Tests are named, never numbered. A list of positions would quietly point at
   different tests the day one is added to the plan; a list of ids either still
   matches or is reported as missing, and reporting it is the whole point.
--------------------------------------------------------------------------- */
const ASSIGN_ID = {digits:"800", code:"800-T5N9R3W"};
const ASSIGN_URL = "asignacion.json";
const ASSIGN_CACHE = "hoklan_qc_assign";
/* What was read and validated, and how the reading went. The state drives what
   the start screen says: a code that reached nothing must not look like a code
   that reached an empty assignment. */
let ASSIGN = null;
let ASSIGN_STATE = "";
/* Counts the times the assignment code has been typed. A reply carrying an old
   number is a reply to a question the operator has already moved on from, and
   is dropped instead of being applied. */
let ASSIGN_SEQ = 0;

async function fetchAssignment(){
  let raw = null, fromCache = false;
  try{
    const res = await fetch(ASSIGN_URL + "?nc=" + Date.now(), {cache:"no-store"});
    if(res.ok){
      const txt = await res.text();
      // GitHub Pages answers a missing file with an HTML page and a 200, so
      // what came back has to parse as JSON before it can be trusted.
      raw = JSON.parse(txt);
      try{ localStorage.setItem(ASSIGN_CACHE, txt); }catch(e){}
    }
  }catch(e){}
  if(!raw){
    // The last one read on this phone. A factory with the network down at eight
    // in the morning still runs what it was given yesterday.
    try{
      raw = JSON.parse(localStorage.getItem(ASSIGN_CACHE) || "null");
      fromCache = !!raw;
    }catch(e){}
  }
  return raw ? Object.assign({}, raw, {fromCache}) : null;
}

/* Checked against the plan as it stands now, with the reference in place —
   exactly the filter the inspection itself will apply. A test the reference
   does not carry cannot be assigned to it, and a test that no longer exists is
   named in the message instead of disappearing. */
function validateAssignment(a){
  if(!a || typeof a !== "object") return {err:"assign_none"};
  const ref = String(a.ref || "");
  if(!CONFIG.models[ref]) return {err:"assign_ref", ref};
  const keepM = S.model, keepF = S.factory;
  S.model = ref; S.factory = keyOfModel(ref);
  const valid = planTests().map(t => t.id);
  S.model = keepM; S.factory = keepF;
  const want = Array.isArray(a.tests) ? a.tests.map(String) : [];
  const ok = want.filter(id => valid.indexOf(id) >= 0);
  if(!ok.length) return {err:"assign_tests", ref};
  // How many units go on the bench is HOKLAN's call too: a re-inspection of one
  // defect on one speaker and a check of five out of a shipment are different
  // instructions, and the count is what makes them different. Clamped rather
  // than trusted — a hand-edited file could say 0, or 400.
  const units = Math.min(MAX_UNITS, Math.max(1, parseInt(a.units, 10) || 1));
  return {ref, tests:ok, units, gone: want.filter(id => valid.indexOf(id) < 0),
          note:String(a.note || ""), issued:String(a.issued || ""),
          fromCache:!!a.fromCache};
}

/* The reference and the test list arrive fixed. The order number and the
   operator do not: those belong to whoever is standing at the bench, and the
   factory has the order on the papers in front of it. */
function applyAssignment(a){
  S.model = a.ref;
  S.factory = keyOfModel(a.ref);
  S.idDigits = digitsOfKey(S.factory);
  S.testId = S.idDigits ? CONFIG.test_ids[S.idDigits].code : "";
  S.pick = a.tests.slice();
  S.units = a.units;
  S.assigned = true;
  S.fromAdmin = false;
  S.selfCheck = false;
  ASSIGN = a;
}

/* Not offered as a button. It runs when the operator types another test code
   over the assignment — a deliberate act, not a tap — and when the app is taken
   back to the start screen through HOME. */
function clearAssignment(){
  S.assigned = false; S.pick = null; ASSIGN = null; ASSIGN_STATE = "";
}

/* Factory accounts. Same door as the admin code, less behind it: each one only
   ever sees the references of its own factory, so a supplier cannot browse what
   another one makes or read another one's test ID. They exist so a factory can
   run one or two tests on the unit in front of it, which is a different act from
   a HOKLAN inspection — and the report says so.
   Not in CONFIG.test_ids: these are not factories to inspect, they are ways in,
   and a code here must never appear in a report as the inspection's test ID. */
/* Los administradores de fábrica se retiraron en la v12.1. Eran 711 · YISION,
   722 · RHYME y 733 · EAGLE: daban a cada fábrica un administrador restringido
   a su catálogo, con autoinspección y serie de orden propia. Quedan sólo el
   administrador de HOKLAN y las cuentas con las que los operarios inspeccionan.

   En la v12.1 el mapa se dejó vacío y las ramas que lo consultaban se quedaron
   en pie, cayendo todas por el camino de HOKLAN. En la v13.2 se retiraron esas
   ramas: eran código que ya no podía ejecutarse, y en una lectura del archivo
   hacían creer que la cuenta de fábrica seguía existiendo.

   Para volver a dar de alta una fábrica hay que reponer el mapa y el punto de
   entrada de `openCode`, no sólo escribir una línea. */

/* Only for the group headings of the reference dropdown, and only inside Admin.
   These names never reach a report, a file name or the spreadsheet — there the
   factory travels as its test ID and nothing else, which is the whole reason the
   test IDs exist. */
const FACTORY_NAMES = {
  YIS:"YISION", RHY:"RHYME", LES:"LESHENG", EAG:"EAGLE"
};

let ADMIN_OK = false;      // per session on purpose: never remembered on disk
/* "" while the full admin code is in use; the factory key for a factory
   account. Deliberately not cleared when Admin is left: once the phone has been
   handed to a factory in this session, it keeps the narrower permissions until
   the page is reloaded.

   ATENCIÓN — desde la v12.1 esta variable ya no puede dejar de ser "". El único
   sitio que la ponía era la rama de las cuentas de administrador de fábrica, y
   esas cuentas se retiraron. En consecuencia `isFactoryUser()` devuelve siempre
   falso y `S.selfCheck` nunca se activa, de modo que la autoinspección de
   fábrica —el rótulo FACTORY en el nombre del archivo, el origen «fábrica» del
   informe, la letra de fábrica en el número de orden— está fuera de servicio.
   Se conserva entera, sin ejecutarse, a la espera de que HOKLAN decida si la
   reactiva o se retira también. No es código olvidado: está aquí a propósito y
   documentado. */
let ADMIN_FACTORY = "";
const isFactoryUser = () => !!ADMIN_FACTORY;

const inAdmin = () => S.screen === "admin";

/* Inside Admin only. The start screen has to be the same screen it is when the
   app is opened — nothing added, nothing highlighted — so the tabs live here,
   where they say which mode you are in and offer the way out. */
function tabBar(){
  if(!inAdmin()) return "";
  return `<div class="tabs noprint">
    <button onclick="exitAdmin()">${tr("tab_factory")}</button>
    <button class="on">${tr("tab_admin")}</button>
  </div>`;
}

/* Leaving Admin locks it again: the way back in is the code, the same way in as
   the first time. Everything Admin touched is cleared, so what appears is the
   start screen exactly as it opens — no reference chosen, no test selection
   left behind, no field pre-filled. */
/* El código en uso, para el encabezado. Antes elegía entre el de HOKLAN y el de
   la fábrica; retiradas las cuentas de fábrica sólo queda uno. */
function adminCode(){ return ADMIN_ID.code; }

function exitAdmin(){
  ADMIN_OK = false;
  // ADMIN_FACTORY is left alone on purpose: see where it is declared.
  S.adminTests = false;
  S.pick = null; S.fromAdmin = false;
  goHomeReset();
  S.screen = "setup";
  window.scrollTo(0,0);
  render();
}

function renderAdmin(){
  // Reached only through the code. A reload drops the session flag, so this
  // sends anyone who lands here without it back to the start screen.
  if(!ADMIN_OK){ S.screen = "setup"; renderSetup(); return; }

  const list = refList();
  // Built before the template so the header of the fold can carry the count
  // whether or not the list below it is open.
  const all = S.model ? planTests() : [];
  const picked = S.pick || [];
  const rows = all.map(t => {
    const on = picked.indexOf(t.id) >= 0;
    const n = realPoints(t).length;
    return `<button class="pk ${on?"on":""}" onclick="togglePick('${t.id}')">
      <i>${on?"✓":""}</i><b>${esc(L(t.label))}</b>
      <em>${fmt("points_n",{n})}${t.optional?" · "+tr("is_optional"):""}</em>
    </button>`;
  }).join("");

  app.innerHTML = `
    ${langBar()}
    <h1>HOKLAN QC</h1>
    <p class="sub">${tr("tab_admin")}</p>
    ${tabBar()}
    <div class="card">
      <div class="tag">${esc(adminCode())}</div>
      ${isFactoryUser()?`<div class="tag" style="background:rgba(245,185,66,.16);
        border-color:var(--amber);color:var(--amber)">${tr("factory_mode")}</div>`:""}
      ${/* What this account will stamp on the next report. Shown here rather
            than on the start screen, where it belonged to nobody, and read with
            peekPo so that looking at it does not consume a number. */""}
      <div class="tag">${esc(fmt("next_po",{
        p: tr("po_prefix") + " " +
           (isFactoryUser() ? ADMIN_FACTORY.charAt(0) : "") + poDigits(peekPo()),
        /* The name of the account, translated. It used to be built here in
           Spanish whatever language the app was in, so a Chinese operator read
           "ADMIN HOKLAN" and "FÁBRICA Y" on his own screen. What goes into
           `S.operator`, and from there into the report, stays Spanish on
           purpose: that is a record, and a record that changes wording with the
           phone's language cannot be searched. */
        o: isFactoryUser() ? fmt("acct_factory",{f: ADMIN_FACTORY.charAt(0)})
                           : tr("acct_admin")}))}</div>
      <label>${tr("reference")}</label>
      <select id="aref" onchange="setAdminModel(this.value)">${refOptions()}</select>
      <p class="hint" style="margin-top:6px">${
        S.model ? esc(S.testId) : fmt("admin_refs_pick",{n:list.length})}</p>
      ${/* Said again once the reference is chosen, because the group label in
            the dropdown is gone from view by then and an inspection filed
            against a product that does not exist yet is worth one more line. */""}
      ${isDevRef(S.model) ? `<div class="tag" style="background:rgba(245,185,66,.16);
        border-color:var(--amber);color:var(--amber)">${tr("dev_tag")}</div>
        <p class="hint" style="margin-top:6px;color:var(--amber)">${tr("dev_note")}</p>` : ""}
      ${S.model ? refImageRow(S.model) : ""}

      ${!S.model ? "" : `
      ${/* The tests, folded, with their count in the header. Fifteen toggles are
            what made this screen a scroll, and the operator who wants all of
            them — which is most of the time — never has to open it. */""}
      <label>${tr("tests_pick")}</label>
      <button class="fold" onclick="toggleAdminTests()">
        <b>${fmt("n_selected_short",{n:picked.length, tot:all.length})}</b>
        <i>${S.adminTests ? "▾" : "▸"}</i>
      </button>
      ${S.adminTests ? `
        <div class="row" style="margin:8px 0">
          <button onclick="pickAll(true)">${tr("all_on")}</button>
          <button onclick="pickAll(false)">${tr("all_off")}</button>
        </div>
        ${rows}` : ""}

      <label>${tr("units")}</label>
      <div class="units">${Array.from({length:MAX_UNITS},(_,i)=>
        `<button class="${S.units===i+1?"on":""}"
          onclick="setUnitsAdmin(${i+1})">${i+1}</button>`).join("")}</div>

      ${isFactoryUser() ? `
      <label>${tr("po")}</label>
      <input id="adminPo" value="${esc(S.po)}" maxlength="12" autocomplete="off"
        placeholder="${tr("po_ph")}" oninput="setAdminPo(this.value)">
      <p class="hint" style="margin-top:6px">${fmt("po_factory",{
        p: tr("po_prefix") + " " + ADMIN_FACTORY.charAt(0) +
           poDigits(peekPo())})}</p>` : ""}`}
    </div>

    ${S.model && canAssign() ? `
    <div class="card">
      <label style="margin-top:0">${tr("assign_make")}</label>
      <p class="hint" style="margin:0 0 10px">${
        fmt("assign_code_is",{d: ASSIGN_ID.digits})}</p>
      <button onclick="showAssignFile()">${tr("assign_make")}</button>
      <div id="asgfile" class="hidden">
        <p class="hint" style="margin:12px 0 6px">${tr("assign_file")}</p>
        <textarea id="asgtext" readonly rows="8"
          style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px"
          >${esc(assignJson())}</textarea>
        <button id="asgcopy" onclick="copyAssign()">${tr("assign_copy")}</button>
      </div>
    </div>` : ""}

    ${isFactoryUser()?"":`<p style="text-align:center">
      <button class="jump" style="text-align:center;width:100%;opacity:.7"
        onclick="wipeData()">${tr("wipe")}</button></p>`}`;

  actions.innerHTML = S.model
    ? `<button style="flex:0 0 34%" onclick="exitAdmin()">${tr("to_start")}</button>
       <button class="primary" style="flex:4${picked.length?"":";opacity:.5"}"
         onclick="adminStart()">${tr("admin_start")}</button>`
    : `<button onclick="exitAdmin()">${tr("to_start")}</button>`;
}

/* The references the filter currently leaves. A factory account never sees past
   its own catalogue: the filter is applied before the text search, so no query
   can reach a reference that belongs to somebody else. */
function refList(){
  let all = Object.keys(CONFIG.models).sort();
  /* A factory Admin account is still the factory. Development references are
     HOKLAN's to inspect until they are released, so they come out here too —
     the only list that shows them is HOKLAN's own Admin. */
  if(ADMIN_FACTORY) all = all.filter(m => keyOfModel(m) === ADMIN_FACTORY && !isDevRef(m));
  return all;
}
/* The search box and the list of buttons are gone with the second screen. The
   dropdown holds all fifty-three grouped by factory, and a native picker on a
   phone is faster to reach one of them than a text filter that needs the
   keyboard. refList is kept because the grouping is built from it, and because
   it is where the factory restriction lives. */

/* The reference decides the factory, and each factory has exactly one test ID,
   so picking a reference in Admin fills in the code the report has to carry —
   there is nothing for the operator to type and nothing to get wrong. */
const keyOfModel = m => CONFIG.models[m] || "";
function digitsOfKey(key){
  return Object.keys(CONFIG.test_ids)
    .find(d => CONFIG.test_ids[d].key === key) || "";
}

/* Choosing the reference no longer changes screen. Admin used to be two: a list
   of fifty-three references, and then the tests of the one you tapped. Two
   screens for what is one decision, and neither of them said on arrival whether
   you were about to inspect or about to assign. Now it is one screen and the
   reference is a dropdown, which is also the only control on a phone that can
   hold fifty-three options without becoming a scroll. */
function adminOpen(model){
  S.model = model;
  S.factory = keyOfModel(model);
  S.idDigits = digitsOfKey(S.factory);
  S.testId = S.idDigits ? CONFIG.test_ids[S.idDigits].code : "";
  // Everything ticked to begin with: the common case is "all of it, on this
  // reference", and unticking three is less work than ticking eleven.
  S.pick = planTests().map(t => t.id);
  // A reference just chosen folds the test list away and shows its count. The
  // operator who wants all of them — most of them — never has to open it.
  S.adminTests = false;
  render();
}

/* Empty means "none chosen": the tests, the units and the buttons all wait for
   a reference, because none of them mean anything without one. */
function setAdminModel(value){
  if(!value){
    S.model = ""; S.factory = ""; S.idDigits = ""; S.testId = "";
    S.pick = null; S.adminTests = false;
    render();
    return;
  }
  adminOpen(value);
}

function toggleAdminTests(){
  S.adminTests = !S.adminTests;
  render();
}

/* The dropdown, grouped by factory. The groups are what make a list of this
   length navigable without a search box: a reference is remembered as "one of
   RHYME's" long before its code comes to mind. A factory account sees one group
   — its own — and the label is dropped, because naming the only group there is
   would be telling it something it already knows. */
/* El código con el que la fábrica conoce cada producto, que no es el nuestro.
   Se muestra entre paréntesis junto a la referencia, sólo para elegirla: nunca
   entra en el informe, ni en el nombre del archivo, ni en la hoja de cálculo,
   donde el producto viaja siempre por su referencia HOKLAN. */
const FACTORY_SKU = {
  "HK-DEC115A1":{zh:"新款EV15寸",   sku:"EV15D",   amp:"E300+K221"},
  "HK-BAS115A1":{zh:"15寸低音炮",   sku:"1560",    amp:"E600+H159"},
  "HK-BAS118A1":{zh:"18寸低音炮",   sku:"1860",    amp:"E600+H159"},
  "HK-EPS112A1":{zh:"12寸音柱",     sku:"X404",    amp:"E750+H158"},
  "HK-DEL110B1":{zh:"单10寸低配版", sku:"LG10D-2", amp:"E200+K221"},
  "HK-DEL101":  {zh:"单12寸",       sku:"LG12D",   amp:"E520+K221"},
  "HK-DEL115B1":{zh:"单15寸新程序版",sku:"LG15D",  amp:"E520+K221"},
  "HK-DEL105":  {zh:"双15寸",       sku:"LG215D",  amp:"E1000+K221"},
  "HK-DEL210A1":{zh:"双10寸",       sku:"LG210D",  amp:"E520+K221"},
  "HK-DEL103P": {zh:"单15寸无源",   sku:"LG15",    amp:"PASSIVE"}
};
const refLabel = m => {
  const f = FACTORY_SKU[m];
  return f ? m + " (" + f.zh + " - " + f.sku + " - " + f.amp + ")" : m;
};

function refOptions(){
  const byKey = {};
  refList().forEach(m => {
    /* A development reference is grouped by that and not by its factory. It is
       what matters about it: which factory will build it is settled, but it is
       not being built yet, and mixing it into YISION's list is how somebody
       picks it by mistake looking for the reference above it. */
    const k = isDevRef(m) ? "__DEV__" : (keyOfModel(m) || "—");
    (byKey[k] = byKey[k] || []).push(m);
  });
  /* Development last, whatever it sorts as. It is the group nobody is looking
     for, and putting it under the factories keeps the list reading the way it
     always has. */
  const keys = Object.keys(byKey).sort()
    .filter(k => k !== "__DEV__")
    .concat(byKey.__DEV__ ? ["__DEV__"] : []);
  const opt = m => `<option value="${esc(m)}"${
    m === S.model ? " selected" : ""}>${esc(refLabel(m))}</option>`;
  const head = `<option value="">${tr("select")}</option>`;
  if(keys.length <= 1) return head + (byKey[keys[0]] || []).map(opt).join("");
  return head + keys.map(k =>
    `<optgroup label="${esc(k === "__DEV__" ? tr("dev_group")
                                            : (FACTORY_NAMES[k] || k))}">${
      byKey[k].map(opt).join("")}</optgroup>`).join("");
}

/* No form to read back on this screen any more: the order number is assigned by
   the app and the operator is the account. Only the speaker count is chosen, and
   that is a button, not a field. */
function togglePick(id){
  S.pick = S.pick || [];
  const i = S.pick.indexOf(id);
  if(i >= 0) S.pick.splice(i,1); else S.pick.push(id);
  render();
}
function pickAll(on){
  S.pick = on ? planTests().map(t => t.id) : [];
  render();
}

/* The same selection, sent instead of run. Only the full admin gets this: what
   the factory should inspect is HOKLAN's decision, and a factory account
   writing its own assignment would be deciding its own scope. */
const canAssign = () => ADMIN_OK && !ADMIN_FACTORY;

function assignJson(){
  return JSON.stringify({
    ref: S.model,
    tests: (S.pick || []).slice(),
    units: S.units,
    plan: plan().plan_version,
    issued: inspectionDate().slice(0, 10),
    note: ""
  }, null, 1);
}

function showAssignFile(){
  if(!(S.pick || []).length){ alert(tr("a_pick_tests")); return; }
  const box = document.getElementById("asgfile");
  if(box){ box.classList.remove("hidden"); box.scrollIntoView({block:"center"}); }
}

/* Clipboard first, selection as the fallback: the copy API needs a secure
   context and a real tap, and when it is refused the operator still has to be
   able to get the text out. Selecting it is what a phone offers next. */
function copyAssign(){
  const ta = document.getElementById("asgtext");
  if(!ta) return;
  const done = () => {
    const b = document.getElementById("asgcopy");
    if(b) b.textContent = tr("assign_copied");
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); });
    return;
  }
  ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
}

/* Never renders: the field would be rebuilt under the operator's fingers. */
function setAdminPo(v){ S.po = String(v || ""); }

function setUnitsAdmin(n){
  S.units = Math.min(MAX_UNITS, Math.max(1, parseInt(n,10) || 1));
  // Read back before the screen is rebuilt, or the order number typed just
  // above these buttons is silently cleared by pressing one of them.
  S.po = (document.getElementById("adminPo")||{}).value || S.po;
  render();
}

function adminStart(){
  if(!S.model || !S.testId){ alert(tr("a_select_model")); return; }
  if(!planTests().length){ alert(tr("a_no_plan")); return; }
  if(!S.pick || !S.pick.length){ alert(tr("a_pick_tests")); return; }

  /* HOKLAN's own number is assigned now — consumed only at this point, so
     abandoning the screen leaves no gap in the series. A factory writes the
     customer's order number instead, and only falls back to the series when it
     leaves the field empty; taking the number in that case too keeps the series
     honest, since a report did go out under it. */
  const typed = isFactoryUser() ? String(S.po || "").trim() : "";
  /* Empty still means "number it for me", which is why the floor is not applied
     to an empty field here. What it does catch is the half-typed one: a factory
     that starts copying the customer's order and stops at two digits gets a
     number that looks deliberate and is not. */
  if(typed && typed.length < PO_MIN){
    alert(fmt("a_po_min",{n:PO_MIN}));
    const box = document.getElementById("adminPo");
    if(box){ box.focus(); box.scrollIntoView({block:"center"}); }
    return;
  }
  S.po = typed || takePo();
  S.poAuto = !typed;   // ver poPrinted(): sólo el número propio lleva prefijo
  /* The letter belongs to the series, not to the account: it is what tells Y004
     apart from R004 when three factories number their own inspections from 001.
     A number the factory copied from the customer's order is already unique and
     already theirs — prefixing it turned PO-88213 into YPO-88213, which matches
     nothing in anybody's system. Which account ran it is recorded in the
     operator field either way. */
  S.poLetter = (isFactoryUser() && !typed) ? ADMIN_FACTORY.charAt(0) : "";
  S.operator = isFactoryUser() ? "FÁBRICA " + ADMIN_FACTORY.charAt(0)
                               : "ADMIN HOKLAN";

  S.fromAdmin = true;
  S.selfCheck = isFactoryUser();
  S.index = 0; S.open = {};
  S.data = Array.from({length:S.units}, () => []);
  S.startedAt = Date.now(); S.finishedAt = null; S.screen = "test";
  window.scrollTo(0,0);
  render(); save();
}

/* Abort throws the inspection away on purpose — that is what it is for. It asks
   first, because what it discards is an hour of somebody's work. */
function abortTest(){
  if(!confirm(tr("a_abort"))) return;
  clearDraft();
  S.data = [[]]; S.index = 0; S.open = {};
  S.startedAt = null; S.finishedAt = null; S.mediaDropped = false;
  S.fromAdmin = false; S.selfCheck = false; S.poLetter = ""; S.poAuto = false;
  /* An assignment survives being aborted, and it has to: HOKLAN said this
     inspection is required, and abandoning one unit does not withdraw that. The
     reference, the tests and the unit count are put back exactly as they came, so
     the operator lands on the start screen with the same instruction waiting.
     Clearing `pick` here while leaving `assigned` standing used to hand back the
     whole plan under the banner of an assignment for two tests. */
  if(S.assigned && ASSIGN){
    S.pick = ASSIGN.tests.slice();
    S.units = ASSIGN.units;
  } else {
    /* `assigned` has to come down with them. It used to survive on its own here,
       and after a reload it always reached this branch: `ASSIGN` is a plain
       global, it is not part of the draft, and nothing rebuilds it — so a phone
       that had been closed and reopened aborted into `pick = null` with
       `assigned` still standing. The reference stayed locked, START ran the
       entire plan because start() leaves `pick` alone while assigned, and the
       report came out headed INSPECTION REQUESTED BY HOKLAN with full scope.
       An inspection nobody ordered, signed as if HOKLAN had ordered it. */
    S.pick = null;
    S.units = 1;
    S.assigned = false;
  }
  S.screen = ADMIN_OK ? "admin" : "setup";
  window.scrollTo(0,0);
  render();
}

function langBar(mini){
  return `<div class="lang${mini?" mini noprint":""}">
    <button class="${LANG==="es"?"on":""}" onclick="setLang('es')">Español</button>
    <button class="${LANG==="en"?"on":""}" onclick="setLang('en')">English</button>
    <button class="${LANG==="zh"?"on":""}" onclick="setLang('zh')">中文</button>
  </div>`;
}

/* The row itself. Rendered only once a reference is chosen: before that there is
   nothing to show and an empty frame would just be furniture. */
function refImageRow(model){
  if(!model) return "";
  return `<div class="refimg" id="refimg">
      <div class="ri-thumb" onclick="zoomRef()">
        <img id="riImg" src="${refImgUrl(model)}" alt=""
          onload="refImgOk()" onerror="refImgFail(this)">
      </div>
      <div class="ri-txt"><b>${esc(model)}</b>
        <span id="riMsg">${tr("ref_img_loading")}</span></div>
    </div>`;
}

/* The control panel with its buttons named, on the checklist itself. Not the
   reference photograph: that one is per reference and shows the product from
   the outside, which confirms you picked the right box and nothing more. This
   is the map the points are written against — a plan that says B1 is unreadable
   without it, because the number is printed nowhere on the cabinet.

   One file for every development reference, on purpose. The KAPPA models share
   a panel, so a copy per reference would be the same picture twice and two
   places to forget when a button moves. The day a development reference turns
   up with a different panel, this is where the exception goes. */
const PANEL_BASE = REF_IMG_DIR + "panel";
const CONN_BASE  = REF_IMG_DIR + "Conectores";

/* Which map a test needs, worked out from the test itself rather than declared
   twice. Every point already carries the control it is about — B1 to B8, P1,
   S1 for the top panel, C1 to C6 for the connector plate — so the tags say
   which picture the operator has to be looking at, and they stay right on their
   own when a point moves from one test to another.

   A test can want both: USB and SD name the buttons that drive playback and the
   two sockets the media goes into, and the microphone test names the knob and
   the two jacks. Those get both pictures, in the order the operator uses them —
   the panel first, because that is where the hands are. */
function refShotsFor(t){
  const tags = realPoints(t).map(p => String(p.tag || ""));
  const out = [];
  /* B1 to B8 and the knob P1 are on the top panel. S1 is not: the on/off
     switch sits on the connector plate, down beside the sockets, and that is
     the picture that shows it. Grouping it with the buttons because its name
     starts with a letter sent the operator of the POWER test to a photograph
     that does not contain the only control that test is about. */
  if(tags.some(x => /(^|\s)(B\d|P\d)/.test(x)))
    out.push({base: PANEL_BASE, label: tr("panel_ref")});
  if(tags.some(x => /(^|\s)(C\d|S\d)/.test(x)))
    out.push({base: CONN_BASE, label: tr("conn_ref")});
  return out;
}

function panelRow(t){
  return refShotsFor(t).map(s => `<div class="card panel-ref">
      <label style="margin-top:0">${esc(s.label)}</label>
      <div class="pr-box" onclick="zoomSample(this.firstElementChild)">
        <img src="${esc(s.base)}${IMG_EXTS[0]}" data-base="${esc(s.base)}" alt=""
          onerror="panelFail(this)">
      </div>
    </div>`).join("");
}
/* Walks the three extensions first, and only then removes its own card rather
   than leaving an empty frame. A picture that is not there must not take up the
   top of the checklist, and the other one must still show. */
function panelFail(img){
  const base = img.getAttribute("data-base") || "";
  const at = (img.dataset.ext | 0) + 1;
  if(base && at < IMG_EXTS.length){
    img.dataset.ext = at;
    img.src = base + IMG_EXTS[at];
    return;
  }
  const card = img.closest(".panel-ref");
  if(card) card.remove();
}

function refImgOk(){
  const row = document.getElementById("refimg");
  const msg = document.getElementById("riMsg");
  if(row) row.classList.add("ok");
  if(msg) msg.textContent = tr("ref_img_tap");
}

function refImgFail(img){
  /* Retried through the same three extensions as the example photographs, in
     the same order: jpg, jpeg, png. Whoever exports a photo should not have to
     care which one the phone chose. */
  const at = (img.dataset.ext | 0) + 1;
  if(at < IMG_EXTS.length){
    img.dataset.ext = at;
    img.src = refImgUrl(S.model, IMG_EXTS[at].slice(1));
    return;
  }
  const row = document.getElementById("refimg");
  const msg = document.getElementById("riMsg");
  if(row) row.classList.add("miss");
  // A 404 and a dead network both arrive here as the same event, so the wording
  // is chosen by what the browser knows about the connection.
  if(msg) msg.textContent = navigator.onLine === false
    ? tr("ref_img_off") : tr("ref_img_none");
}

/* Any piece of evidence, opened full screen from its thumbnail. A photograph of
   a sound level meter is unreadable at 62 px, and the operator has to be able to
   check the reading he is about to write down — and to see whether the shot came
   out at all — without leaving the test. Closes on a tap anywhere, like the
   reference photo: one hand is holding a speaker.

   The × keeps working because it stops the event before it reaches here. */
/* Straight through the records rather than through mediaList(): that one
   returns wrappers built for naming files in the packet — {m, unit, test…} —
   so looking for a uid on them never matched anything and the viewer opened
   on nothing at all. */
function findMedia(uid){
  let hit = null;
  allUnits().forEach(u => unitRows(u).forEach(r => {
    if(!r) return;
    (r.media || []).forEach(m => { if(!hit && m.uid === uid) hit = m; });
  }));
  return hit;
}

function zoomMedia(uid){
  const m = findMedia(uid);
  if(!m) return;
  const box = document.createElement("div");
  box.className = "ri-zoom";
  box.onclick = () => box.remove();
  box.innerHTML = isPdfMedia(m)
    // A document cannot be enlarged, so the zoom offers the only thing worth
    // doing with it: opening it in whatever reads PDFs on this phone.
    ? `<a class="doc-open" href="${m.url}" target="_blank" rel="noopener"
         download="${esc(docName(m))}"
         onclick="event.stopPropagation()">${esc(docName(m))}</a>`
    : m.kind === "photo"
    ? `<img src="${m.url}" alt="">`
    // Controls and no autoplay: the operator decides when it runs, and a clip
    // that starts by itself in a quiet workshop is startling.
    : `<video src="${m.url}" controls playsinline
         onclick="event.stopPropagation()"></video>`;
  box.innerHTML += `<span>${esc(thumbTag(m))} · ${esc(tr("tap_close"))}</span>`;
  document.body.appendChild(box);
}

function zoomRef(){
  const img = document.getElementById("riImg");
  if(!img || !img.complete || !img.naturalWidth) return;   // nothing loaded yet
  zoomUrl(img.src, S.model + " · " + tr("ref_img"));
}
/* The full-screen view, shared by the reference photograph and the panel. Both
   want the same thing — the picture as large as the phone allows, and a tap
   anywhere to close — and they had two copies of it. */
function zoomUrl(src, caption){
  const box = document.createElement("div");
  box.className = "ri-zoom";
  box.onclick = () => box.remove();
  box.innerHTML = `<img src="${esc(src)}" alt="">
    <span>${esc(caption || tr("panel_ref"))}</span>`;
  document.body.appendChild(box);
}

/* Choosing a reference re-renders: the photo has to appear, and the test count
   in the hint below depends on the model too — some tests only apply to one
   reference, so before this the line could claim eleven tests for a model that
   runs ten. Whatever is already typed is read back first, as setUnits does. */
function setModel(value){
  S.model = value;
  S.po = (document.getElementById("po")||{}).value || S.po;
  S.operator = (document.getElementById("operator")||{}).value || S.operator;
  render();
}

function renderSetup(){
  const valid = !!S.testId;
  const bad = S.idDigits.length === 3 && !valid;
  const list = valid ? modelsOf(S.factory) : [];
  const models = `<option value="">${tr("select")}</option>` +
    list.map(m=>`<option value="${esc(m)}"${m===S.model?" selected":""}>${
      esc(refLabel(m))}</option>`).join("");

  // Nothing about the references is shown until the code is valid: an invalid
  // code must reveal no part of the catalogue.
  const codeLine = valid
    ? `<div class="code ok">${esc(S.testId)}</div>`
    : bad ? `<div class="code bad">${tr("bad_id")}</div>` : "";

  /* What the assignment code found, said in the place where the code was typed.
     A network that answered nothing and an assignment that is empty are two
     different problems and get two different messages: the first one is fixed
     by finding signal, the second one by HOKLAN publishing the file. */
  const assignBox = !ASSIGN_STATE ? "" :
    ASSIGN_STATE === "load" ? `<div class="asg">${tr("assign_load")}</div>`
  : ASSIGN_STATE === "assign_none" ? `<div class="asg bad">${tr("assign_none")}</div>`
  : ASSIGN_STATE === "assign_ref" ? `<div class="asg bad">${
      fmt("assign_ref",{r: (ASSIGN && ASSIGN.ref) || "—"})}</div>`
  : ASSIGN_STATE === "assign_tests" ? `<div class="asg bad">${tr("assign_tests")}</div>`
  : `<div class="asg ok">
      <b>${tr("assign_ok")}</b>
      <span>${esc(ASSIGN.ref)} · ${esc(S.testId)}</span>
      <span>${fmt("assign_n",{n: ASSIGN.tests.length})}: ${
        esc(ASSIGN.tests.map(id => {
          const t = planTests().find(x => x.id === id);
          return t ? L(t.label) : id;
        }).join(", "))}</span>
      <span>${fmt("units_tag",{n: ASSIGN.units})}</span>
      ${ASSIGN.note ? `<span>${esc(ASSIGN.note)}</span>` : ""}
      ${ASSIGN.gone && ASSIGN.gone.length
        ? `<span class="w">${fmt("assign_gone",{n:ASSIGN.gone.length})}</span>` : ""}
      ${ASSIGN.fromCache ? `<span class="w">${tr("assign_cached")}</span>` : ""}
      ${/* No way out from here on purpose. An assignment is an instruction, not
            a suggestion: a one-tap discard next to it turns the whole mechanism
            into something the factory can decline. Recovering is still
            possible, but it costs a deliberate act — typing another test code
            over this one, or leaving through HOME. */""}
      <span class="req">${tr("assign_must")}</span>
    </div>`;

  app.innerHTML = `
    ${langBar()}
    <h1>HOKLAN QC</h1>
    <p class="sub">${tr("subtitle")}</p>
    ${/* Shown on the start screen and nowhere else: once an inspection is
          running the advice is useless, because moving browsers now would throw
          the work away. It is placed above the code field so it is read before
          anything is typed rather than after. */""}
    <div class="brw"><b>${tr("browser_hint_t")}</b>
      <u class="no">${tr("browser_hint_no")}</u></div>
    <div class="card">
      <label>${tr("test_id")}</label>
      <input id="idDigits" inputmode="numeric" maxlength="3" autocomplete="off"
        placeholder="000" value="${esc(S.idDigits)}" oninput="setTestId(this.value)"
        class="${bad?"bad":""}"
        style="letter-spacing:6px;font-size:22px;text-align:center;font-weight:700">
      ${codeLine}
      ${assignBox}
      ${/* An assigned inspection shows its reference, it does not offer a list:
            choosing another one is exactly what the assignment exists to
            prevent. Dropping the assignment is one tap away, and then the
            normal flow comes back. */""}
      ${S.assigned ? refImageRow(S.model) : valid?`
      <label>${tr("reference")}</label>
      <select id="model" onchange="setModel(this.value)">${models}</select>
      ${refImageRow(S.model)}`:""}
      <label>${tr("inspection")}</label>
      <input value="${esc(inspectionDate())}" readonly
             style="color:var(--muted);background:#0a1523">
      <label>${tr("po")}</label>
      <input id="po" value="${esc(S.po)}" placeholder="${tr("po_ph")}"
        inputmode="numeric" maxlength="12" minlength="${PO_MIN}" autocomplete="off"
        oninput="onlyDigits(this)">
      ${/* Said before the operator types, not only after pressing START. An
            alert that explains a rule nobody was told is a rule discovered by
            being stopped. */""}
      <p class="hint" style="margin-top:6px">${fmt("po_min_hint",{n:PO_MIN})}</p>
      <label>${tr("operator")}</label>
      <input id="operator" value="${esc(S.operator)}" maxlength="40"
        placeholder="${tr("operator_ph")}"
        autocomplete="off" oninput="onlyLetters(this)">
      <label>${tr("units")}</label>
      ${/* Fixed when it came in an assignment. The count is part of the
            instruction — one unit to re-check a defect, five to sample a
            shipment — so it is shown, not offered. The hidden field stays
            either way, because that is what start() reads. */""}
      ${S.assigned
        ? `<div class="units fixed"><button class="on">${S.units}</button></div>`
        : `<div class="units">${Array.from({length:MAX_UNITS},(_,i)=>
        `<button class="${S.units===i+1?"on":""}"
          onclick="setUnits(${i+1})">${i+1}</button>`).join("")}</div>`}
      <input id="units" class="hidden" value="${S.units}">
      <p class="hint">${fmt(S.units>1?"plan_info_n":"plan_info",
        {n:tests().length, u:S.units, tot:tests().length*S.units})}<br>
      ${tr("report_note")}</p>
    </div>
    ${/* The name, and the plan version. The app's own number is internal: it
          lives in the meta tag at the top of this file, where anybody who needs
          it can read it, and it answers a question — which build is this — that
          nobody standing in front of a speaker is asking. The plan version is
          different: it says what was inspected. */""}
    <p class="hint" style="text-align:center;opacity:.55;font-size:10.5px">
      HOKLAN QC · KŌHIN v${plan().plan_version}</p>`;
  /* No wipe button here any more. Erasing every answer and every photo on the
     phone does not belong one tap away from the screen an operator opens forty
     times a day; it lives in Admin, behind the code. */
  actions.innerHTML = `<button class="primary" onclick="start()">${tr("start")}</button>`;
}

/* How many speakers this inspection covers. Kept on the setup screen only —
   changing it once the checklist has started would orphan answers already
   given, so the control is not offered later. */
function setUnits(n){
  S.units = Math.min(MAX_UNITS, Math.max(1, parseInt(n,10) || 1));
  // Everything already typed has to be read back before the form is rebuilt,
  // the reference select included — it sits above these buttons, so it is
  // normally filled in first and would otherwise be silently cleared.
  S.model = (document.getElementById("model")||{}).value || S.model;
  S.po = (document.getElementById("po")||{}).value || S.po;
  S.operator = (document.getElementById("operator")||{}).value || S.operator;
  render();
}

/* Typed characters are filtered as they are typed, without re-rendering: the
   caret is put back where it was, or the cursor jumps to the end mid-word on
   every keystroke. A purely numeric keypad is not enough — the operator can
   still paste, and some Chinese keyboards ignore inputmode entirely. */
function filterInput(el, re){
  const at = el.selectionStart;
  const before = el.value;
  const after = before.replace(re, "");
  if(after === before) return;
  el.value = after;
  const back = before.length - after.length;
  try{ el.setSelectionRange(Math.max(0, at - back), Math.max(0, at - back)); }
  catch(e){}
}
function onlyDigits(el){ filterInput(el, /[^0-9]/g); }
// Letters of any script, plus what a person's name legitimately contains.
function onlyLetters(el){ filterInput(el, /[^\p{L}\p{M} .'’-]/gu); }

function setTestId(value){
  const digits = String(value).replace(/\D/g,"").slice(0,3);

  // The admin code is not a factory. It is consumed here — the field is left
  // empty and nothing is stored — so it can never reach a report, a file name
  // or the spreadsheet the way a real test ID does.
  if(digits === ADMIN_ID.digits){
    ADMIN_OK = true; ADMIN_FACTORY = "";
    S.idDigits = ""; S.testId = ""; S.factory = ""; S.model = "";
    S.screen = "admin";
    window.scrollTo(0,0);
    render();
    return;
  }

  // The assignment code. Consumed like the admin one — the field is emptied, so
  // it can never reach a report: what the report carries is the real test ID of
  // the reference's factory, which is what the office searches by.
  if(digits === ASSIGN_ID.digits){
    S.idDigits = ""; S.testId = ""; S.factory = ""; S.model = "";
    S.assigned = false; S.pick = null;
    ASSIGN = null; ASSIGN_STATE = "load";
    render();
    /* The fetch is stamped, and only the newest stamp is allowed to land. On a
       factory network this call can take a long time, and what the operator does
       meanwhile is type another code — a test ID to get on with the work, or the
       admin one. Without this the late answer walked in over whatever screen he
       had reached and overwrote the reference, the factory, the test ID and the
       unit count, then saved it. */
    const ticket = ++ASSIGN_SEQ;
    fetchAssignment().then(raw => {
      if(ticket !== ASSIGN_SEQ) return;
      const a = validateAssignment(raw);
      if(a.err){ ASSIGN_STATE = a.err; ASSIGN = a; render(); return; }
      applyAssignment(a);
      ASSIGN_STATE = "ok";
      render(); save();
    }).catch(() => {
      /* fetchAssignment resolves rather than rejects on a dead network, so this
         only catches a fault in the handling above. Reported as an unreadable
         assignment instead of leaving the screen spinning on "loading". */
      if(ticket !== ASSIGN_SEQ) return;
      ASSIGN_STATE = "assign_none"; ASSIGN = null; render();
    });
    return;
  }

  /* Aquí entraban las cuentas de administrador de fábrica, 711, 722 y 733.
     Retiradas en la v12.1; la rama se quitó en la v13.2. Un operario que teclee
     uno de esos tres números cae ahora donde cae cualquier código que no
     existe, que es lo correcto: la cuenta ya no existe. */

  // Typing a code by hand over an assignment replaces it. This is the only way
  // back to the normal flow from this screen, and it costs deliberate effort:
  // there is no button, and no accident produces it.
  if(S.assigned) clearAssignment();

  const entry = CONFIG.test_ids[digits];
  const newKey = entry ? entry.key : "";

  const wasBad = S.idDigits.length === 3 && !S.testId;
  const isBad = digits.length === 3 && !entry;

  S.idDigits = digits;
  S.testId = entry ? entry.code : "";

  // Rebuild only when what is on screen actually changes: the reference list
  // appearing or disappearing, or the error state flipping. Re-rendering on
  // every keystroke would fight the operator typing.
  if(newKey !== S.factory || isBad !== wasBad){
    S.factory = newKey;
    S.model = "";
    S.po = (document.getElementById("po")||{}).value || S.po;
    S.operator = (document.getElementById("operator")||{}).value || S.operator;
    render();
    const box = document.getElementById("idDigits");
    if(box && !entry){
      box.focus();
      box.setSelectionRange(box.value.length, box.value.length);
    }
  }
}

function start(){
  const sel = document.getElementById("model");
  // An assigned inspection has no reference selector on this screen — the
  // reference arrived fixed, and reaching it from here is what the assignment
  // exists to prevent. Reading a select that is not there used to blank the
  // model and stop the inspection with "select the reference".
  if(sel) S.model = sel.value;
  else if(!S.assigned) S.model = "";
  S.po = document.getElementById("po").value.replace(/[^0-9]/g,"").trim();
  S.operator = document.getElementById("operator").value
    .replace(/[^\p{L}\p{M} .'’-]/gu,"").replace(/\s+/g," ").trim();
  if(!S.testId){ alert(tr("a_select_factory")); return; }
  if(!S.model){ alert(tr("a_select_model")); return; }
  // A reference whose plan has not been written yet. Stopped here rather than
  // opening a checklist with nothing in it, which reports as a completed
  // inspection of zero tests.
  if(!planTests().length){ alert(tr("a_no_plan")); return; }
  /* The order number is what every report, file name and spreadsheet row is
     filed under, so a short one is not a small problem: "7" cannot be found
     again, and two shipments numbered 1 and 1 are indistinguishable in the
     dashboard. Checked before the operator name on purpose — the fields are
     read top to bottom, and being sent back up is worse than being stopped at
     the first gap. */
  if(S.po.length < PO_MIN){
    alert(fmt("a_po_min",{n:PO_MIN}));
    const box = document.getElementById("po");
    if(box){ box.focus(); box.scrollIntoView({block:"center"}); }
    return;
  }
  if(!S.operator){ alert(tr("a_operator")); return; }
  const un = document.getElementById("units");
  S.units = un ? Math.min(MAX_UNITS, Math.max(1, parseInt(un.value,10)||1)) : 1;
  // The factory flow always runs the whole plan: any selection left over from
  // an Admin session is dropped here, or a partial plan would leak into a
  // normal inspection and report as if it were complete. An assignment is the
  // one exception — its selection is the whole point, and it survives.
  if(!S.assigned) S.pick = null;
  S.fromAdmin = false; S.selfCheck = false; S.poLetter = "";
  /* El número que escribe el operario es la orden de compra del despacho, así
     que se rotula OC o PO según el idioma del informe, igual que el que genera
     la app. Lo que no lleva prefijo es el número que una fábrica copia de la
     orden de su cliente, que ya viene rotulado de origen. */
  S.poAuto = true;
  S.index = 0; S.open = {};
  S.data = Array.from({length:S.units}, () => []);
  S.startedAt = Date.now(); S.finishedAt = null; S.screen = "test";
  render(); save();
}

/* The start screen as it looks the first time. The order number and the
   operator go too: after an inspection launched from Admin they hold "HK013"
   and "ADMIN HOKLAN", which are the account's, not this screen's. Left behind
   they would be offered to whoever types a factory code next, and an inspection
   would be filed under a number that belongs to another account. */
function goHomeReset(){
  S.idDigits = ""; S.testId = ""; S.factory = ""; S.model = "";
  S.po = ""; S.operator = ""; S.poLetter = ""; S.poAuto = false;
  // The assignment goes with it: the next operator on this phone must type the
  // code again and get whatever is published then, not what was published when
  // somebody else opened the app this morning.
  S.assigned = false; S.pick = null;
  ASSIGN = null; ASSIGN_STATE = "";
}

/* ---------- erasing what the phone keeps ----------------------------------
   Three kinds of thing live in this device's storage: the inspection in
   progress, one order-number counter per account, and the language. The dialog
   lists them with what each one currently holds, because "erase data" without
   saying what data is how somebody deletes an afternoon of photographs.

   The language is not offered: it is a preference, not data, and erasing it
   would flip the app to another language for no reason anyone asked for. The
   full wipe does take it, since that is what "everything" means.
------------------------------------------------------------------------- */
function draftSummary(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); }catch(e){}
  if(!d || !d.model) return null;
  const shots = (d.data || []).reduce((a,unit) =>
    a + (unit || []).reduce((b,r) => b + ((r && r.media) || []).length, 0), 0);
  return {model:d.model, units:d.units || 1,
          when:inspectionDate(d.startedAt), shots};
}

function seqRows(){
  /* `key` es la serie en el almacenamiento y no cambia; `prefix` es sólo lo que
     se muestra. La serie de HOKLAN ya no se rotula HK: el prefijo del número lo
     pone el idioma del informe. */
  /* Una sola serie desde que se retiraron las cuentas de fábrica. Se deja como
     lista, y no como un valor suelto, porque la pantalla de borrado la recorre
     y porque reponer una fábrica es volver a añadir una fila aquí. */
  const rows = [{key:"HK", label:"Admin HOKLAN · " + ADMIN_ID.digits, prefix:""}];
  return rows.map(r => {
    let n = 0;
    try{ n = parseInt(localStorage.getItem(PO_SEQ_KEY + r.key), 10) || 0; }catch(e){}
    return Object.assign(r, {n});
  });
}

function wipeData(){
  const box = document.createElement("div");
  box.className = "sheet";
  box.id = "wipeSheet";
  const d = draftSummary();

  const row = (title, detail, action, on) => `
    <div class="wrow${on?"":" off"}">
      <div><b>${title}</b><span>${detail}</span></div>
      ${on?`<button onclick="${action}">${tr("wipe_do")}</button>`
          :`<button disabled>${tr("wipe_do")}</button>`}
    </div>`;

  box.innerHTML = `
    <div class="sheet-in">
      <h3>${tr("wipe")}</h3>
      <p>${tr("wipe_intro")}</p>
      ${row(tr("wipe_draft"),
            d ? `${esc(d.model)} · ${fmt("units_tag",{n:d.units})} · ${esc(d.when)}`
                + (d.shots ? `<em>${fmt("wipe_shots",{n:d.shots})}</em>` : "")
              : tr("wipe_draft_none"),
            "wipeDraft()", !!d)}
      <h4>${tr("wipe_seqs")}</h4>
      ${seqRows().map(s => row(esc(s.label),
          s.n ? fmt("wipe_seq_at",{v: tr("po_prefix") + " " + s.prefix + poDigits(s.n),
                                   next: tr("po_prefix") + " " + s.prefix +
                                         poDigits(s.n + 1)})
              : tr("wipe_seq_none"),
          `wipeSeq('${s.key}')`, !!s.n)).join("")}
      <div class="wall">
        <button onclick="wipeAll()">${tr("wipe_all")}</button>
        <span>${tr("wipe_all_note")}</span>
      </div>
      <button class="sheet-x" onclick="closeWipe()">${tr("close")}</button>
    </div>`;
  document.body.appendChild(box);
}

function closeWipe(){
  const box = document.getElementById("wipeSheet");
  if(box) box.remove();
}

/* Redrawn in place so the numbers on screen match what is left. */
function reopenWipe(){ closeWipe(); wipeData(); }

function wipeDraft(){
  if(!confirm(tr("a_wipe_draft"))) return;
  clearDraft();
  S.data = [[]]; S.units = 1; S.index = 0; S.open = {};
  S.po = ""; S.operator = ""; S.startedAt = null; S.finishedAt = null; S.mediaDropped = false;
  S.pick = null; S.fromAdmin = false; S.selfCheck = false; S.poLetter = ""; S.poAuto = false;
  // Back to Admin, which is where the button now lives: dropping to the start
  // screen would mean typing the code again to carry on doing what you were.
  S.screen = ADMIN_OK ? "admin" : "setup";
  goHomeReset();
  window.scrollTo(0,0);
  render();
  reopenWipe();
}

/* One account's counter. Kept separate from the draft on purpose: resetting a
   numbering series and throwing away an inspection are different decisions. */
function wipeSeq(key){
  if(!confirm(fmt("a_wipe_seq",{k:key}))) return;
  try{ localStorage.removeItem(PO_SEQ_KEY + key); }catch(e){}
  reopenWipe();
}

/* Everything the app has ever written here, including the language. Anything
   starting with the app's prefix goes, so a key added later cannot survive a
   wipe that promised to leave nothing behind. */
function wipeAll(){
  if(!confirm(tr("a_wipe"))) return;
  try{
    Object.keys(localStorage)
      .filter(k => k.indexOf("hoklan_qc") === 0)
      .forEach(k => localStorage.removeItem(k));
  }catch(e){}
  S.data = [[]]; S.units = 1; S.index = 0; S.open = {};
  S.po = ""; S.operator = ""; S.startedAt = null; S.finishedAt = null; S.mediaDropped = false;
  S.pick = null; S.fromAdmin = false; S.selfCheck = false; S.poLetter = ""; S.poAuto = false;
  S.screen = ADMIN_OK ? "admin" : "setup";
  goHomeReset();
  closeWipe();
  window.scrollTo(0,0);
  render();
  alert(tr("a_wiped"));
}

function header(t, done, total){
  return `
    ${langBar(true)}
    ${S.units > 1 ? `<div class="unit-tag">${
      fmt("units_tag",{n:S.units})}</div>` : ""}
    <div class="tag">${esc(S.testId)}</div><div class="tag">${esc(S.model)}</div>
    ${/* Carried through the whole inspection, not just shown once in Admin. An
          inspector who picks up the phone mid-shift has no other way of knowing
          this is a prototype, and a report filed against a product that has not
          been released must not look like any other report six months later. */""}
    ${isDevRef(S.model) ? `<div class="tag" style="background:rgba(245,185,66,.16);
      border-color:var(--amber);color:var(--amber)">${tr("dev_tag")}</div>` : ""}
    <div class="tag">${esc(inspectionDate(S.startedAt))}</div>
    <div class="bar"><i style="width:${(done/total*100).toFixed(0)}%"></i></div>
    <h2>${done+1} / ${total} · ${esc(L(t.label))}${
      /* The N/A of a whole test used to live at the foot of the screen, beside
         NEXT, and pressing it jumped straight to the next test. Two problems in
         one gesture: the operator could not see afterwards that the test had
         been skipped, and there was no way back — undoing it meant answering
         thirty-three points by hand. Here it sits with the name it applies to,
         it says what it did, and it is a switch. */
      canTestNA(t) ? `<button class="na-test${allNA(t) ? " on" : ""}"
        onclick="toggleTestNA()">${
        allNA(t) ? tr("na_test_undo") : tr("na_test")}</button>` : ""}</h2>
    <button class="jump" onclick="showIndex()">${tr("go_other")}</button>
    ${storageWarning()}`;
}

/* Both storage failures, said where the operator is working rather than
   discovered on the reload tomorrow. The draft one comes first and outranks the
   other: if the answers are not being written, the photographs are the smaller
   half of the problem. */
function storageWarning(){
  if(DRAFT_FAILED) return `<div class="swarn bad"><b>${tr("sto_draft_t")}</b>
    <span>${tr("sto_draft")}</span></div>`;
  if(SHOTS_FAILED) return `<div class="swarn"><b>${tr("sto_shots_t")}</b>
    <span>${tr("sto_shots")}</span></div>`;
  return "";
}

/* Only a targeted inspection launched from Admin can be walked out of. In the
   factory flow the way out is finishing, or the home button with its warning —
   an operator does not get a one-tap discard next to the checklist. */
/* Available in every inspection now, not only in one launched from Admin. It
   used to be held back on the grounds that an operator should not have a
   one-tap discard beside the checklist — but the way out without it was the HOME
   button, which does the same thing while saying something else, and an
   inspector who has to abandon a unit ends up there anyway. Better to name the
   act than to have it happen through a door labelled for something else.

   What guards it is not its absence but the confirmation: it says plainly that
   every answer and every photograph will be thrown away and that no report will
   be produced. That warning is the whole safety mechanism, so it is asked even
   when there is nothing yet to lose. */
function abortBlock(){
  return `<p style="text-align:center;margin:0">
    <button class="jump" style="width:100%;color:var(--red);border-color:#7a3a36"
      onclick="abortTest()">${tr("abort")}</button></p>`;
}

function mediaBlock(r){
  return `<div class="media">${r.media.filter(m=>!m.slot).map(m=>`
    <div class="thumb" onclick="zoomMedia('${m.uid}')">
      ${thumbFace(m)}
      <b>${thumbTag(m)}</b>
      <span onclick="event.stopPropagation();dropMedia('${m.uid}')">×</span>
    </div>`).join("")}</div>`;
}

/* One point, one speaker: the label, the three buttons, and — when it failed —
   its own evidence box. Rendered once per speaker under the same question, so
   the operator answers the question for each unit on the bench without losing
   sight of what the question is. */

/* An example of the photograph being asked for, next to the camera button.

   A sentence describing where to put the tape measure is read once and
   interpreted five ways; the picture of somebody doing it is not. These live in
   the same img/ folder as the reference photos, are never evidence, and never
   travel into the report or the packet — they are instructions.

   Missing on purpose is a fallback: if the file is not there the block simply
   does not appear, exactly like a reference photo that has not been uploaded
   yet. A point can be added today and its example the week after. */
function sampleBox(p){
  if(!p.sample) return "";
  const base = REF_IMG_DIR + encodeURIComponent(p.sample);
  /* Two different jobs, and until now one sentence for both. Where the point
     asks for a photograph, the example shows how to take it — "take the photo
     like this" is right. Where it does not, the example shows how the thing
     should look, and telling the operator to take a photograph he is not being
