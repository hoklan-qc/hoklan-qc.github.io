            "label":{"en":"Quick guide","zh":"快速指南","es":"Guía rápida"},
            "help":{"en":"One photograph: it is printed on one side only. Flat and square on, with the text readable. Compare it against the example before photographing it.",
                    "zh":"仅需一张照片：本页为单面印刷。摊平并正对拍摄，文字须清晰可读。拍摄前请与示例核对。",
                    "es":"Una sola foto: viene impresa por una sola cara. Plana y de frente, con el texto legible. Compárela con el ejemplo antes de fotografiarla."}},
           /* La etiqueta colgante y el sticker de garantía se fotografían en
              PARTES EXTERNAS: van pegados al producto, y el operador los tiene
              delante mientras recorre el gabinete. */
           {"id":"sub_card","photo":true,"sample":"bas_carta",
            "label":{"en":"Loyalty card","zh":"客户回馈卡","es":"Carta de fidelización"},
            "help":{"en":"Check the QR code or the web address is legible, and that the card matches the example.",
                    "zh":"确认二维码或网址清晰可读，且卡片与示例一致。",
                    "es":"Compruebe que el código QR o la dirección web queda legible, y que la carta coincide con el ejemplo."}},
           {"id":"sub_bag","photo":true,
            "label":{"en":"Bag the cabinet is packed in","zh":"包裹音箱的塑料袋","es":"Bolsa en que viene la cabina"},
            "help":{"en":"The bag around the cabinet itself, not the small accessory ones. Lay it flat and photograph it whole.",
                    "zh":"拍摄包裹音箱本体的袋子，不是配件小袋。摊平后整只入镜。",
                    "es":"La bolsa que envuelve la cabina, no las pequeñas de los accesorios. Extiéndala y fotografíela entera."}},
           {"id":"sub_silica","photo":true,
            "label":{"en":"Silica gel bag","zh":"干燥剂袋","es":"Bolsa de sílica gel"},
            "help":{"en":"Photograph the desiccant bag with its printing readable, and check it is whole and not burst.",
                    "zh":"拍摄干燥剂袋，印字需清晰可读，并确认袋体完好未破裂。",
                    "es":"Fotografíe la bolsa desecante con su impresión legible, y compruebe que está entera y no reventada."}},
           {"id":"sub_foam_top","photo":true,
            "label":{"en":"Top foam support","zh":"上部泡沫支撑","es":"Icopor de soporte superior"},
            "help":{"en":"Take it out of the box and photograph it whole, on a clear surface. Check the corners and edges for breaks, dents or crumbling.",
                    "zh":"从箱中取出，放在干净台面上整块入镜拍摄。检查边角是否有破损、压陷或掉渣。",
                    "es":"Sáquelo de la caja y fotografíelo entero sobre una superficie despejada. Revise esquinas y bordes por roturas, hundimientos o desmoronamiento."}},
           {"id":"sub_foam_bottom","photo":true,
            "label":{"en":"Bottom foam support","zh":"下部泡沫支撑","es":"Icopor de soporte inferior"},
            "help":{"en":"The same photograph on the other piece. The two are photographed separately.",
                    "zh":"对另一块做同样的拍摄。两块须分开拍摄。",
                    "es":"La misma foto en la otra pieza. Los dos se fotografían por separado."}},
           /* El código del panel se fotografía en PARTES EXTERNAS, junto al resto
              de lo que va impreso en el producto. El de la caja, en CAJA. Aquí
              queda sólo lo que viaja dentro del empaque. */]},

        {"id":"USB","optional":false,"only_factory":["YIS","RHY","EAG"],
         "skip":["HK-BAS115A1","HK-BAS118A1","HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"USB","zh":"USB","es":"USB"},
         "steps":[
           {"en":"Insert the HOKLAN test USB drive into the speaker","zh":"将 HOKLAN 测试 U 盘插入音箱","es":"Inserte la memoria USB de prueba HOKLAN en el parlante"},
           {"en":"Select USB mode on the speaker","zh":"在音箱上切换到 USB 模式","es":"Seleccione el modo USB en el parlante"},
           {"en":"Wait until it reads the USB drive and starts playing","zh":"等待识别 U 盘并开始播放","es":"Espere hasta que lea la memoria y empiece a reproducir"},
           {"en":"Let the HOKLAN USB play, listening for dropouts","zh":"让测试音频播放，注意是否有中断","es":"Deje reproducir la USB HOKLAN, atento a cortes"},
           {"en":"With the USB drive playing, check each control on the list","zh":"在播放状态下，逐项检查下列功能","es":"Con la memoria reproduciendo, verifique cada control de la lista"},
           {"en":"Switch it off and on twice: on battery and on mains","zh":"关机再开机两次：一次用电池，一次接市电","es":"Apague y encienda dos veces: con batería y conectado a la red"},
           {"en":"Finish with Testing_Vol_Max at maximum volume","zh":"最后以最大音量播放 Testing_Vol_Max","es":"Termine con Testing_Vol_Max a volumen máximo"}],
         "points":[
           {"section":{"en":"Playback","zh":"播放","es":"Reproducción"},
            "help":{"en":"Insert the HOKLAN test USB and select USB mode. Wait until it reads the USB drive and plays. At the end, switch the speaker off and on to see whether it starts in USB by itself.",
                    "zh":"插入 HOKLAN 测试 U 盘并切换到 USB 模式，等待识别并播放。最后重新开机，确认是否自动进入 USB 播放。",
                    "es":"Inserte la USB de prueba HOKLAN y seleccione el modo USB. Espere hasta que lea la memoria y reproduzca. Al final, apague y encienda el parlante para ver si arranca en USB por sí solo."}},
           {"id":"recognized","code":"USB-001","label":{"en":"Speaker reads the USB drive and shows USB mode","zh":"识别 U 盘并显示 USB 模式","es":"El parlante lee la memoria USB y muestra el modo USB"},
            "help":{"en":"Insert the USB drive. Within a few seconds the display must switch to USB and show a track number. If it stays blank or keeps searching, it is a fail.",
                    "zh":"插入 U 盘后几秒内，显示屏应切换到 USB 并显示曲目编号。若一直空白或持续搜索，判定为异常。",
                    "es":"Inserte la memoria. En pocos segundos la pantalla debe cambiar a USB y mostrar un número de pista. Si queda en blanco o sigue buscando, no conforme."}},
           {"id":"playback","code":"USB-002","label":{"en":"Plays the audio from the USB drive","zh":"播放 U 盘音频","es":"Reproduce el audio de la memoria USB"},
            "help":{"en":"Sound must start on its own, or after pressing play. Confirm it really comes out of the speaker, not from another speaker nearby.",
                    "zh":"应自动开始播放，或按播放键后出声。确认声音确实来自本机，而不是旁边的音箱。",
                    "es":"El sonido debe iniciar solo, o al pulsar reproducir. Confirme que sale realmente de este parlante y no de otro que esté al lado."}},
           {"id":"continuous","code":"USB-003","label":{"en":"No dropouts during playback","zh":"播放过程无中断","es":"Sin cortes durante la reproducción"},
            "help":{"en":"Let one full track play without touching anything. Listen for cuts, stutters or moments of silence.",
                    "zh":"完整播放一首曲目，中途不做任何操作。注意是否有断音、卡顿或瞬间静音。",
                    "es":"Deje sonar una pista completa sin tocar nada. Escuche si hay cortes, saltos o momentos de silencio."}},
           {"id":"quality","code":"USB-007","label":{"en":"No hum or interference","zh":"无杂音或干扰","es":"Sin zumbido ni interferencia"},
            "help":{"en":"Listen close to the grille at medium volume. Behind the music there must be no hum, hiss or crackle.",
                    "zh":"中等音量下靠近网罩细听，音乐背景不应有嗡嗡声、嘶声或爆音。",
                    "es":"Escuche cerca de la malla a volumen medio. Detrás de la música no debe haber zumbido, siseo ni crujidos."}},
           {/* The list used to end "…repeat, record and mode". Recording is not
                in this group — it is two sections further down, and on RHYME it
                is not in the plan at all — so the operator was told to press a
                key that has no line to answer on. */
            "section":{"en":"Playback controls","zh":"播放控制","es":"Controles de reproducción"},
            "help":{"en":"With audio playing, press each button on the speaker and confirm it reacts: track, folder, play/pause, repeat and mode.",
                    "zh":"在播放状态下逐个按下音箱按键并确认反应：切歌、切文件夹、播放/暂停、循环和模式。",
                    "es":"Con el audio sonando, pulse cada tecla del parlante y confirme que responde: pista, carpeta, reproducir/pausar, repetición y modo."}},
           {"id":"song_next","code":"USB-006","label":{"en":"Next track button","zh":"下一曲按键","es":"Tecla de pista siguiente"},
            "help":{"en":"Press it three times. The track number must advance one at a time and the music must change with each press.",
                    "zh":"连续按三次。曲目编号应逐一递增，每按一次音乐都要随之切换。",
                    "es":"Púlsela tres veces. El número de pista debe avanzar de uno en uno y la música debe cambiar con cada pulsación."}},
           {"id":"song_prev","code":"USB-006","label":{"en":"Previous track button","zh":"上一曲按键","es":"Tecla de pista anterior"},
            "help":{"en":"Press it three times. The track number must go back one at a time, not jump or restart from the beginning.",
                    "zh":"连续按三次。曲目编号应逐一递减，不应跳号或跳回第一首。",
                    "es":"Púlsela tres veces. El número de pista debe retroceder de uno en uno, sin saltos ni volver a la primera."}},
           {"id":"folder_next","code":"USB-011","label":{"en":"Next folder button","zh":"下一文件夹按键","es":"Tecla de carpeta siguiente"},
            "help":{"en":"Press it and confirm the folder number changes and playback jumps to a different folder on the USB drive.",
                    "zh":"按下后确认文件夹编号变化，并跳到 U 盘上的另一个文件夹播放。",
                    "es":"Púlsela y confirme que el número de carpeta cambia y la reproducción salta a otra carpeta de la memoria."}},
           {"id":"folder_prev","code":"USB-011","label":{"en":"Previous folder button","zh":"上一文件夹按键","es":"Tecla de carpeta anterior"},
            "help":{"en":"Press it and confirm it returns to the previous folder, not to the start of the USB drive.",
                    "zh":"按下后确认返回上一个文件夹，而不是回到 U 盘开头。",
                    "es":"Púlsela y confirme que vuelve a la carpeta anterior, no al inicio de la memoria."}},
           {"id":"play_pause","code":"USB-010","label":{"en":"PLAY / PAUSE button","zh":"播放/暂停按键","es":"Tecla PLAY / PAUSE"},
            "help":{"en":"Press once: the sound must stop and the display must show pause. Press again: it must resume from the same point, not from the start.",
                    "zh":"按一次，声音应停止且屏幕显示暂停；再按一次应从原位置继续，而不是从头播放。",
                    "es":"Pulse una vez: el sonido debe detenerse y la pantalla mostrar pausa. Pulse otra vez: debe continuar desde el mismo punto, no desde el inicio."}},
           {"id":"repeat","code":"USB-012","label":{"en":"Repeat one / all button","zh":"单曲/全部循环按键","es":"Tecla de repetición una / todas"},
            "help":{"en":"Set repeat-one and let the track end: the same track must play again. Then set repeat-all: at the end it must move to the next track.",
                    "zh":"设为单曲循环，让曲目播完：应重复播放同一首。再设为全部循环：播完应自动进入下一首。",
                    "es":"Ponga repetir-una y deje terminar la pista: debe volver a sonar la misma. Luego ponga repetir-todas: al terminar debe pasar a la siguiente."}},
           {"id":"modes","code":"DSP-005","label":{"en":"Mode button","zh":"模式按键","es":"Tecla de modo"},
            "help":{"en":"Press the mode button through the full cycle until it returns to USB. The display must follow every change.",
                    "zh":"反复按模式键走完一轮回到 USB。显示屏应随每一次切换变化。",
                    "es":"Pulse la tecla de modo un ciclo completo hasta volver a USB. La pantalla debe seguir cada cambio."}},
           {"section":{"en":"Audio controls","zh":"音频控制","es":"Controles de audio"},
            "help":{"en":"Move each control through its full range and listen. If the reference shows the level on screen, the indicator must follow the knob.",
                    "zh":"将每个旋钮从最小转到最大并细听。若本型号在屏幕上显示数值，指示应随旋钮同步变化。",
                    "es":"Mueva cada control en todo su recorrido y escuche. Si la referencia muestra el nivel en pantalla, el indicador debe seguir a la perilla."}},
           {"id":"treble","code":"AUD-007","label":{"en":"Treble level","zh":"高音调节","es":"Nivel de agudos"},
            "help":{"en":"With music playing, take the treble fully down and fully up. The change must be clearly audible across the whole travel, with no dead spots and no scratchy noise as the knob turns. Where there is an on-screen indicator, it must follow.",
                    "zh":"播放音乐时，将高音从最小调到最大。全程声音变化应清晰可辨，无死区，旋转时无刮擦杂音。若有屏幕指示，应同步变化。",
                    "es":"Con música sonando, lleve los agudos al mínimo y al máximo. El cambio debe oírse con claridad en todo el recorrido, sin zonas muertas ni ruido rasposo al girar. Donde haya indicador en pantalla, debe seguirlo."}},
           {"id":"bass","code":"AUD-008","label":{"en":"Bass level","zh":"低音调节","es":"Nivel de graves"},
            "help":{"en":"Same check on the bass control, across its whole travel. Where there is an on-screen indicator, it must follow.",
                    "zh":"对低音旋钮做同样的检查，走完全程。若有屏幕指示，应同步变化。",
                    "es":"La misma verificación en la perilla de graves, en todo su recorrido. Donde haya indicador en pantalla, debe seguirlo."}},
           {"id":"xbass","code":"AUD-010","only":["HK-BRA210B1"],
            "label":{"en":"X-BASS function","zh":"X-BASS 功能","es":"Función X-BASS"},
            "help":{"en":"Playing from the USB drive, switch X-BASS on and off several times. The low end must jump noticeably when it is on and go back when it is off, and the display must show the change. Then raise the volume to maximum with X-BASS on: the bass must stay clean, with no distortion and no rattle from the woofer.",
                    "zh":"用 U 盘播放时，反复开关 X-BASS。开启时低音应明显增强，关闭时恢复原状，屏幕应显示状态变化。随后在开启 X-BASS 的状态下将音量调到最大：低音应保持干净，不失真，低音单元不应有异响。",
                    "es":"Reproduciendo desde la memoria USB, active y desactive X-BASS varias veces. El bajo debe aumentar notoriamente al activarlo y volver a su estado al desactivarlo, y la pantalla debe mostrar el cambio. Luego suba el volumen al máximo con X-BASS activo: el bajo debe mantenerse limpio, sin distorsión y sin traqueteo del woofer."}},
           {"id":"volume_max","code":"AUD-006","label":{"en":"Volume to maximum","zh":"音量调到最大","es":"Volumen al máximo"},
            "help":{"en":"Take the volume from minimum to maximum slowly. It must rise continuously the whole way, with no jumps, dead spots or scratchy sound, and where there is a number on the display it must follow. Leave it at maximum: the next group is listened to like this.",
                    "zh":"缓慢将音量从最小调到最大。全程应连续上升，不应跳变、无死区、无刮擦杂音；若屏幕显示数值，应同步变化。保持最大音量：下一组就是在这个状态下听的。",
                    "es":"Lleve el volumen del mínimo al máximo lentamente. Debe crecer de forma continua en todo el recorrido, sin saltos, zonas muertas ni sonido rasposo, y donde haya número en pantalla debe seguirlo. Déjelo en el máximo: el grupo siguiente se escucha así."}},
           {"section":{"en":"Sound quality","zh":"音质","es":"Calidad de sonido"},
            "help":{"en":"With the volume still at maximum from the group above. Listen, then put your hand on the speaker to feel for abnormal vibration or rattles.",
                    "zh":"承接上一组，音量保持最大。先听，再用手触摸箱体，感受是否有异常振动或杂音。",
                    "es":"Con el volumen aún en el máximo del grupo anterior. Escuche y luego ponga la mano sobre el gabinete para sentir vibraciones anormales o traqueteos."}},
           {"id":"woofer","code":"AUD-001","label":{"en":"Woofer sounds","zh":"低音单元出声","es":"El woofer suena"},
            "help":{"en":"Play a track with bass. Hold your hand in front of the woofer and feel it move. The low end must be present and clean, not weak or muffled.",
                    "zh":"播放有低音的曲目，手放在低音单元前感受振动。低频应饱满干净，不应无力或发闷。",
                    "es":"Reproduzca una pista con graves. Ponga la mano frente al woofer y sienta el movimiento. El bajo debe estar presente y limpio, no débil ni apagado."}},
           {"id":"tweeter","code":"AUD-002","label":{"en":"Tweeter sounds","zh":"高音单元出声","es":"El tweeter suena"},
            "help":{"en":"Listen for cymbals and high detail. Cover the woofer with your hand: the treble must still be clearly audible.",
                    "zh":"注意听镲片和高频细节。用手挡住低音单元，高音仍应清晰可闻。",
                    "es":"Escuche los platillos y el detalle agudo. Tape el woofer con la mano: los agudos deben seguir oyéndose con claridad."}},
           {"id":"distortion","code":"AUD-003","label":{"en":"No distortion at high volume","zh":"大音量无失真","es":"Sin distorsión a volumen alto"},
            "help":{"en":"At the maximum volume already set. The sound must stay clean, without breaking up, buzzing or going harsh.",
                    "zh":"在已调到最大的音量下。声音应保持干净，不破音、不嗡响、不刺耳。",
                    "es":"Al volumen máximo ya puesto. El sonido debe mantenerse limpio, sin quebrarse, zumbar ni volverse estridente."}},
           {"id":"vibration","code":"AUD-004","label":{"en":"No abnormal speaker vibration","zh":"箱体无异常振动","es":"Sin vibración anormal del gabinete"},
            "help":{"en":"At high volume run your hand over the speaker, grille and back panel. Nothing must rattle, buzz or feel loose.",
                    "zh":"大音量时用手抚过箱体、网罩和后盖。不应有松动、嗡响或异常抖动。",
                    "es":"A volumen alto pase la mano por el gabinete, la malla y la tapa trasera. Nada debe traquetear, zumbar ni sentirse flojo."}},
           {"id":"strange_noise","code":"AUD-005","label":{"en":"No abnormal noise","zh":"无异响","es":"Sin ruidos anormales"},
            "help":{"en":"Pause the track with the speaker still on. The speakers must be silent: no hiss, hum or clicking.",
                    "zh":"保持开机并暂停播放。喇叭应完全安静，无嘶声、嗡声或咔哒声。",
                    "es":"Pause la pista con el parlante encendido. Los altavoces deben quedar en silencio: sin siseo, zumbido ni chasquidos."}},
           {"skip_factory":["RHY"],
            "section":{"en":"Microphones and guitar","zh":"麦克风与吉他","es":"Micrófonos y guitarra"},
            "help":{"en":"Plug a microphone into MIC1 and speak while you adjust volume, echo and priority. Repeat with MIC2, then connect the guitar. Mark N/A for whatever this reference does not have.",
                    "zh":"将麦克风插入 MIC1，一边说话一边调节音量、混响和优先键；MIC2 重复同样操作，最后接上吉他。本型号没有的功能标记为“不适用”。",
                    "es":"Conecte un micrófono en MIC1 y hable mientras ajusta volumen, eco y prioridad. Repita con MIC2 y luego conecte la guitarra. Marque N/A lo que esta referencia no tenga."}},
           {"id":"mic1_priority","code":"MIC-005","skip_factory":["RHY"],"label":{"en":"MIC1 priority button","zh":"麦克风 1 优先键","es":"Tecla de prioridad de MIC1"},
            "help":{"en":"With music playing, press priority and speak into MIC1. The music must drop to about 10% of its level and come back to full level when you stop. A drop you have to strain to notice is a fail.",
                    "zh":"在播放音乐时按下优先键并对麦克风 1 说话。音乐应降到原音量的约 10%，停止说话后恢复原音量。若需要仔细分辨才能察觉衰减，即判定为异常。",
                    "es":"Con música sonando, pulse prioridad y hable por MIC1. La música debe bajar a un 10% de su nivel y volver a su nivel completo al dejar de hablar. Una caída que haya que esforzarse en notar es un fallo."}},
           {"id":"mic1_volume","code":"MIC-006","skip_factory":["RHY"],"label":{"en":"MIC1 volume","zh":"麦克风 1 音量","es":"Volumen de MIC1"},
            "help":{"en":"Speak continuously into MIC1 while turning its volume from minimum to maximum. The level must rise smoothly, without cutting out or crackling.",
                    "zh":"对麦克风 1 持续说话，同时把音量从最小调到最大。音量应平滑上升，不应中断或有爆音。",
                    "es":"Hable de forma continua por MIC1 mientras gira su volumen del mínimo al máximo. El nivel debe subir de forma suave, sin cortes ni crujidos."}},
           {"id":"mic1_echo","code":"MIC-007","skip_factory":["RHY"],"label":{"en":"MIC1 echo","zh":"麦克风 1 回声","es":"Eco de MIC1"},
            "help":{"en":"Say short words into MIC1 and turn the echo from minimum to maximum. The repetition must go from none to clearly audible, and the delay must stay within 0 to 280 ms: at maximum the echo must still follow the voice closely, not lag like a separate second voice. Anything longer than that stops sounding like reverberation and starts sounding like a fault.",
                    "zh":"对麦克风 1 说短词，并将回声从最小调到最大。重复声应从无到明显可闻，延时须在 0～280 毫秒范围内：即使调到最大，回声也应紧跟人声，而不应拖成第二个人声。超过该范围就不再像混响，而像故障。",
                    "es":"Diga palabras cortas por MIC1 y lleve el eco del mínimo al máximo. La repetición debe pasar de nula a claramente audible, y el retardo debe mantenerse entre 0 y 280 ms: incluso al máximo, el eco debe seguir de cerca a la voz, no arrastrarse como una segunda voz aparte. Más allá de ese rango deja de sonar a reverberación y empieza a sonar a defecto."}},
           {"id":"mic1_reverb","code":"MIC-008","skip_factory":["RHY"],"label":{"en":"MIC1 reverb","zh":"麦克风 1 混响","es":"Reverberación de MIC1"},
            "help":{"en":"Speak into MIC1 and raise the reverb. The voice must gain body and depth, not repeat like the echo. Both controls must act independently.",
                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。",
                    "es":"Hable por MIC1 y suba la reverberación. La voz debe ganar cuerpo y profundidad, no repetirse como el eco. Los dos controles deben actuar de forma independiente."}},
           {"id":"mic2_priority","code":"MIC-005","skip_factory":["RHY"],"label":{"en":"MIC2 priority button","zh":"麦克风 2 优先键","es":"Tecla de prioridad de MIC2"},
            "help":{"en":"Unplug MIC1 and plug the microphone into MIC2. Same test, and the same criterion: the music must drop to about 10% of its level while you speak. Mark N/A, here and in the three points below, if this reference has only one microphone input.",
                    "zh":"拔下 MIC1，将麦克风插入 MIC2。测试方法和判定标准相同：说话时音乐应降到原音量的约 10%。本型号只有一个麦克风接口时，本项及以下三项均标记为“不适用”。",
                    "es":"Desconecte MIC1 y conecte el micrófono en MIC2. La misma prueba y el mismo criterio: la música debe bajar a un 10% de su nivel mientras habla. Marque N/A, aquí y en los tres puntos siguientes, si esta referencia tiene una sola entrada de micrófono."}},
           {"id":"mic2_volume","code":"MIC-006","skip_factory":["RHY"],"label":{"en":"MIC2 volume","zh":"麦克风 2 音量","es":"Volumen de MIC2"},
            "help":{"en":"Speak continuously into MIC2 while turning its volume from minimum to maximum.",
                    "zh":"对麦克风 2 持续说话，同时把音量从最小调到最大。",
                    "es":"Hable de forma continua por MIC2 mientras gira su volumen del mínimo al máximo."}},
           {"id":"mic2_echo","code":"MIC-007","skip_factory":["RHY"],"label":{"en":"MIC2 echo","zh":"麦克风 2 回声","es":"Eco de MIC2"},
            "help":{"en":"Say short words into MIC2 and turn the echo up. Same range: 0 to 280 ms.",
                    "zh":"对麦克风 2 说短词并加大回声。范围相同：0～280 毫秒。",
                    "es":"Diga palabras cortas por MIC2 y suba el eco. El mismo rango: 0 a 280 ms."}},
           {"id":"mic2_reverb","code":"MIC-008","skip_factory":["RHY"],"label":{"en":"MIC2 reverb","zh":"麦克风 2 混响","es":"Reverberación de MIC2"},
            "help":{"en":"Speak into MIC2 and raise the reverb. Echo and reverb must act independently on this input too.",
                    "zh":"对麦克风 2 说话并加大混响。该接口上回声与混响也应各自独立起作用。",
                    "es":"Hable por MIC2 y suba la reverberación. En esta entrada el eco y la reverberación también deben actuar de forma independiente."}},
           {"id":"guitar","code":"AUD-009","skip_factory":["RHY"],"label":{"en":"Guitar volume","zh":"吉他音量","es":"Volumen de guitarra"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。",
                    "es":"Conecte la guitarra en su entrada y toque mientras mueve su control de volumen del mínimo al máximo. Marque N/A si esta referencia no tiene entrada de guitarra."}},
           {"id":"record","code":"USB-013","skip_factory":["RHY"],"label":{"en":"REC button: records and saves to the USB drive","zh":"REC 录音按键：保存到 U 盘","es":"Tecla REC: graba y guarda en la memoria USB"},
            "help":{"en":"With the microphone still connected from the points above. Press REC, speak for a few seconds, then stop. Play the recording back on the speaker to confirm the file was really saved.",
                    "zh":"麦克风保持上面几项测试的连接状态。按 REC，说几秒后停止。在音箱上回放该录音，确认文件确实已保存。",
                    "es":"Con el micrófono aún conectado de los puntos anteriores. Pulse REC, hable unos segundos y detenga. Reproduzca la grabación en el parlante para confirmar que el archivo quedó guardado."}},
           {"skip_factory":["RHY"],
            "section":{"en":"Lights","zh":"灯光","es":"Luces"},
            "help":{"en":"Switch the light on and off, and step through the light modes if the speaker has them.",
                    "zh":"开关灯光，如有多种灯光模式请逐一切换确认。",
                    "es":"Encienda y apague la luz, y recorra los modos de luz si el parlante los tiene."}},
           {"id":"light","code":"LED-006","skip_factory":["RHY"],"label":{"en":"Light on / off","zh":"灯光开关","es":"Encendido / apagado de la luz"},
            "help":{"en":"Press the light button several times. It must switch on and off cleanly every time, with no flicker and no LED left lit.",
                    "zh":"多次按下灯光键。每次都应干脆地开和关，不闪烁，也不应有个别灯珠残亮。",
                    "es":"Pulse la tecla de luz varias veces. Debe encender y apagar de forma limpia cada vez, sin parpadeos y sin que quede ningún LED prendido."}},
           {"id":"light_pattern","code":"LED-007","skip_factory":["RHY"],"label":{"en":"Light pattern change","zh":"灯光模式切换","es":"Cambio de patrón de luz"},
            "help":{"en":"Step through every light pattern and back to the first. Each one must be visibly different, with no dead LEDs in any pattern.",
                    "zh":"逐一切换所有灯光模式并回到第一个。每种模式应有明显区别，且任何模式下都不应有不亮的灯珠。",
                    "es":"Recorra todos los patrones de luz y vuelva al primero. Cada uno debe ser visiblemente distinto, sin LED apagados en ningún patrón."}},
           {"skip_factory":["RHY"],
            "section":{"en":"AC charging","zh":"AC 充电","es":"Carga AC"},
            "help":{"en":"Connect the AC charging cable with the speaker switched on and watch the display.",
                    "zh":"在开机状态下接上 AC 充电线，观察显示屏。",
                    "es":"Conecte el cable de carga AC con el parlante encendido y observe la pantalla."}},
           {"id":"ac_charge","code":"CHG-002","skip_factory":["RHY"],"label":{"en":"Charging indicator","zh":"充电指示","es":"Indicador de carga"},
            "help":{"en":"Plug the AC cable in. The charging indicator must appear on the display within a few seconds, and stay on while the cable is connected.",
                    "zh":"接上 AC 充电线。几秒内显示屏应出现充电指示，并在连接期间保持显示。",
                    "es":"Conecte el cable AC. El indicador de carga debe aparecer en la pantalla en pocos segundos y mantenerse mientras el cable esté conectado."}},
           {"section":{"en":"Power on","zh":"开机","es":"Encendido"},
            "help":{"en":"The only power cycle of this test, kept for the end so that nothing already set up has to be built again.",
                    "zh":"本测试中唯一一次关机再开机，放在最后，以免已经搭好的状态需要重做。",
                    "es":"Dos apagados, uno con batería y otro conectado a la red, dejados para el final para no tener que volver a montar nada de lo ya dispuesto."}},
           {/* Two power cycles, not one, and the difference between them is the
                point. A speaker can come back into USB on battery and fail to
                on mains, or the other way round: the two paths are different
                firmware branches, and one of them ships untested if only one is
                checked. The battery one comes first because it needs the cable
                out, and pulling it is easier than finding a socket. */
            "id":"autostart","code":"USB-014","skip_factory":["RHY"],
            "label":{"en":"Starts in USB on power on — on battery","zh":"电池供电开机自动进入 USB 播放","es":"Arranca en USB al encender — con batería"},
            "help":{"en":"Unplug the AC cable so the speaker runs on its battery alone, with the USB drive still inserted. Switch it off and on. It must return to USB mode and start playing without pressing anything.",
                    "zh":"拔掉 AC 电源线，使音箱仅由电池供电，U 盘保持插入。关机后再开机，应自动回到 USB 模式并开始播放，无需按任何键。",
                    "es":"Desconecte el cable AC para que el parlante quede solo con su batería, con la memoria aún insertada. Apague y encienda. Debe volver al modo USB y empezar a reproducir sin pulsar nada."}},
           {"id":"autostart_ac","code":"USB-014",
            "label":{"en":"Starts in USB on power on — connected to AC","zh":"接入市电开机自动进入 USB 播放","es":"Arranca en USB al encender — conectado a AC"},
            "help":{"en":"Now with the AC cable connected and the USB drive still inserted, switch it off and on again. It must do the same: back into USB mode, playing, with nothing pressed.",
                    "zh":"再接上 AC 电源线，U 盘保持插入，关机后再开机。结果应相同：自动回到 USB 模式并开始播放，无需按任何键。",
                    "es":"Ahora con el cable AC conectado y la memoria aún insertada, apague y encienda otra vez. Debe hacer lo mismo: volver al modo USB y reproducir, sin pulsar nada."}},
           {"section":{"en":"Maximum volume","zh":"最大音量","es":"Volumen máximo"},
            "help":{"en":"Left for last on purpose: it is the loudest thing in the test and it is where a speaker that has passed everything else still breaks up.",
                    "zh":"特意放在最后：这是本测试中声音最大的一项，也是通过了其他所有项目的音箱仍可能破音的地方。",
                    "es":"Se deja de último a propósito: es lo más fuerte de la prueba y es donde un parlante que pasó todo lo demás todavía se quiebra."}},
           {"id":"usb_vol_max","code":"AUD-003",
            "label":{"en":"Maximum volume functional — Testing_Vol_Max","zh":"最大音量正常 — Testing_Vol_Max","es":"Volumen máximo funcional — Testing_Vol_Max"},
            "help":{"en":"Play the Testing_Vol_Max track from the USB drive and take the volume to maximum. It must hold there: no distortion, no crackling, no cutting out and no shutting down. Leave it playing for a minute before judging it — the fault usually appears after a few seconds, not at once.",
                    "zh":"播放 U 盘中的 Testing_Vol_Max 曲目，并将音量调到最大。应能稳定播放：不失真、无爆音、不断续、不关机。判定前先让其播放一分钟——此类问题通常在数秒后才出现，而非立即。",
                    "es":"Reproduzca la pista Testing_Vol_Max de la memoria USB y suba el volumen al máximo. Debe sostenerse ahí: sin distorsión, sin crujidos, sin cortes y sin apagarse. Déjelo sonando un minuto antes de juzgarlo — la falla suele aparecer a los pocos segundos, no de inmediato."}}]},

        {/* RHYME's cabinets carry no SD slot, so the test is filtered out rather
              than left for the inspector to mark N/A thirty times. */
         "id":"SD","optional":true,"only_factory":["YIS","RHY","EAG"],
         "skip_factory":["RHY"],"skip":["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"SD CARD","zh":"SD 卡"},
         "steps":[
           {"en":"Insert the HOKLAN test SD card into the speaker","zh":"将 HOKLAN 测试 SD 卡插入音箱"},
           {"en":"Select SD mode on the speaker","zh":"在音箱上切换到 SD 模式"},
           {"en":"Wait until it reads the card and starts playing","zh":"等待识别 SD 卡并开始播放"},
           {"en":"Let the HOKLAN SD play, listening for dropouts","zh":"让测试音频播放，注意是否有中断"},
           {"en":"With the SD playing, check each control on the list","zh":"在播放状态下，逐项检查下列功能"},
           {"en":"Finally, switch the speaker off and on to see if it starts in SD","zh":"最后重新开机，确认是否自动进入 SD 模式"}],
         "points":[
           {"section":{"en":"Playback","zh":"播放"},
            "help":{"en":"Insert the HOKLAN test SD card and select SD mode. Wait until it reads the card and plays.",
                    "zh":"插入 HOKLAN 测试 SD 卡并切换到 SD 模式，等待识别并播放。",
                    "es":"Inserte la tarjeta SD de prueba HOKLAN y seleccione el modo SD. Espere hasta que lea la tarjeta y reproduzca."}},
           {"id":"recognized","code":"SD-001","label":{"en":"Speaker reads the card and shows SD mode","zh":"识别 SD 卡并显示 SD 模式"},
            "help":{"en":"Insert the card fully until it clicks. Within a few seconds the display must switch to SD and show a track number.",
                    "zh":"将卡完全插入至卡扣到位。几秒内显示屏应切换到 SD 并显示曲目编号。"}},
           {"id":"playback","code":"SD-002","label":{"en":"Plays the audio from the card","zh":"播放 SD 卡音频"},
            "help":{"en":"Sound must start on its own, or after pressing play. Confirm it really comes out of the speaker.",
                    "zh":"应自动开始播放，或按播放键后出声。确认声音确实来自本机。"}},
           {"id":"continuous","code":"SD-003","label":{"en":"No dropouts during playback","zh":"播放过程无中断"},
            "help":{"en":"Let one full track play without touching anything. Listen for cuts, stutters or moments of silence.",
                    "zh":"完整播放一首曲目，中途不做任何操作。注意是否有断音、卡顿或瞬间静音。"}},
           {"id":"quality","code":"SD-007","label":{"en":"No hum or interference","zh":"无杂音或干扰"},
            "help":{"en":"Listen close to the grille at medium volume. Behind the music there must be no hum, hiss or crackle.",
                    "zh":"中等音量下靠近网罩细听，音乐背景不应有嗡嗡声、嘶声或爆音。"}},
           {"section":{"en":"Playback controls","zh":"播放控制"},
            "help":{"en":"With audio playing, press each button on the speaker and confirm it reacts: track, folder, play/pause, repeat and mode.",
                    "zh":"在播放状态下逐个按下音箱按键并确认反应：切歌、切文件夹、播放/暂停、循环和模式。",
                    "es":"Con el audio sonando, pulse cada tecla del parlante y confirme que responde: pista, carpeta, reproducir/pausar, repetición y modo."}},
           {"id":"song_next","code":"SD-006","label":{"en":"Next track button","zh":"下一曲按键"},
            "help":{"en":"Press it three times. The track number must advance one at a time and the music must change with each press.",
                    "zh":"连续按三次。曲目编号应逐一递增，每按一次音乐都要随之切换。"}},
           {"id":"song_prev","code":"SD-006","label":{"en":"Previous track button","zh":"上一曲按键"},
            "help":{"en":"Press it three times. The track number must go back one at a time, not jump or restart from the beginning.",
                    "zh":"连续按三次。曲目编号应逐一递减，不应跳号或跳回第一首。"}},
           {"id":"folder_next","code":"SD-011","label":{"en":"Next folder button","zh":"下一文件夹按键"},
            "help":{"en":"Press it and confirm the folder number changes and playback jumps to a different folder on the card.",
                    "zh":"按下后确认文件夹编号变化，并跳到卡上的另一个文件夹播放。"}},
           {"id":"folder_prev","code":"SD-011","label":{"en":"Previous folder button","zh":"上一文件夹按键"},
            "help":{"en":"Press it and confirm it returns to the previous folder, not to the start of the card.",
                    "zh":"按下后确认返回上一个文件夹，而不是回到卡的开头。"}},
           {"id":"play_pause","code":"SD-010","label":{"en":"PLAY / PAUSE button","zh":"播放/暂停按键"},
            "help":{"en":"Press once: the sound must stop and the display must show pause. Press again: it must resume from the same point.",
                    "zh":"按一次，声音应停止且屏幕显示暂停；再按一次应从原位置继续播放。"}},
           {"id":"repeat","code":"SD-012","label":{"en":"Repeat one / all button","zh":"单曲/全部循环按键"},
            "help":{"en":"Set repeat-one and let the track end: the same track must play again. Then set repeat-all: at the end it must move to the next track.",
                    "zh":"设为单曲循环，让曲目播完：应重复播放同一首。再设为全部循环：播完应自动进入下一首。"}},
           {"id":"modes","code":"DSP-005","label":{"en":"Mode button","zh":"模式按键"},
            "help":{"en":"Press the mode button through the full cycle until it returns to SD. The display must follow every change.",
                    "zh":"反复按模式键走完一轮回到 SD。显示屏应随每一次切换变化。"}},
           {"section":{"en":"Audio controls","zh":"音频控制"},
            "help":{"en":"Move each control through its full range and listen. If the reference shows the level on screen, the indicator must follow the knob.",
                    "zh":"将每个旋钮从最小转到最大并细听。若本型号在屏幕上显示数值，指示应随旋钮同步变化。"}},
           {"id":"volume_max","code":"AUD-006","label":{"en":"Volume to maximum","zh":"音量调到最大"},
            "help":{"en":"Take the volume from minimum to maximum slowly. It must rise continuously the whole way, with no jumps, dead spots or scratchy sound, and where there is a number on the display it must follow.",
                    "zh":"缓慢将音量从最小调到最大。全程应连续上升，不应跳变、无死区、无刮擦杂音；若屏幕显示数值，应同步变化。"}},
           {"id":"treble","code":"AUD-007","label":{"en":"Treble level","zh":"高音调节"},
            "help":{"en":"With music playing, take the treble fully down and fully up. The change must be clearly audible across the whole travel, with no dead spots and no scratchy noise as the knob turns. Where there is an on-screen indicator, it must follow.",
                    "zh":"播放音乐时，将高音从最小调到最大。全程声音变化应清晰可辨，无死区，旋转时无刮擦杂音。若有屏幕指示，应同步变化。"}},
           {"id":"bass","code":"AUD-008","label":{"en":"Bass level","zh":"低音调节"},
            "help":{"en":"Same check on the bass control, across its whole travel. Where there is an on-screen indicator, it must follow.",
                    "zh":"对低音旋钮做同样的检查，走完全程。若有屏幕指示，应同步变化。"}},
           {"id":"xbass","code":"AUD-010","only":["HK-BRA210B1"],
            "label":{"en":"X-BASS function","zh":"X-BASS 功能"},
            "help":{"en":"Playing from the SD card, switch X-BASS on and off several times. The low end must jump noticeably when it is on and go back when it is off, and the display must show the change. Then raise the volume to maximum with X-BASS on: the bass must stay clean, with no distortion and no rattle from the woofer.",
                    "zh":"用 SD 卡播放时，反复开关 X-BASS。开启时低音应明显增强，关闭时恢复原状，屏幕应显示状态变化。随后在开启 X-BASS 的状态下将音量调到最大：低音应保持干净，不失真，低音单元不应有异响。"}},
           {/* The microphone controls are exercised in USB and in Bluetooth and
                 nowhere else. They belong to the mixer, not to the source: an echo
                 knob that works on USB and fails on SD is not a thing the hardware
                 can do, so asking again here only bought the same answer three more
                 times. Recording still needs a microphone, so it says so itself
                 rather than leaning on points that are no longer above it. */
            "id":"record","code":"SD-013","label":{"en":"REC button: records and saves to the SD","zh":"REC 录音按键：保存到 SD 卡"},
            "help":{"en":"Plug a microphone in. Press REC, speak for a few seconds, then stop. Play the recording back on the speaker to confirm the file was really saved.",
                    "zh":"接上麦克风。按 REC，说几秒后停止。在音箱上回放该录音，确认文件确实已保存。",
                    "es":"Conecte un micrófono. Pulse REC, hable unos segundos y detenga. Reproduzca la grabación en el parlante para confirmar que el archivo quedó guardado."}},
           {"id":"erase","code":"SD-015","label":{"en":"Delete recordings button","zh":"删除录音按键"},
            "help":{"en":"Delete the recording you just made and confirm it no longer plays back. The music tracks must remain untouched.",
                    "zh":"删除刚才的录音并确认无法再回放。音乐曲目不应被一并删除。"}},
           {"skip_factory":["RHY"],
            "section":{"en":"Lights","zh":"灯光"},
            "help":{"en":"Switch the light on and off, and step through the light modes if the speaker has them.",
                    "zh":"开关灯光，如有多种灯光模式请逐一切换确认。"}},
           {"id":"light","code":"LED-006","skip_factory":["RHY"],"label":{"en":"Light on / off","zh":"灯光开关"},
            "help":{"en":"Press the light button several times. It must switch on and off cleanly every time, with no flicker and no LED left lit.",
                    "zh":"多次按下灯光键。每次都应干脆地开和关，不闪烁，也不应有个别灯珠残亮。"}},
           {"id":"light_pattern","code":"LED-007","skip_factory":["RHY"],"label":{"en":"Light pattern change","zh":"灯光模式切换"},
            "help":{"en":"Step through every light pattern and back to the first. Each one must be visibly different, with no dead LEDs in any pattern.",
                    "zh":"逐一切换所有灯光模式并回到第一个。每种模式应有明显区别，且任何模式下都不应有不亮的灯珠。"}},
           {"section":{"en":"Power on","zh":"开机","es":"Encendido"},
            "help":{"en":"The only power cycle of this test, kept for the end so that nothing already set up has to be built again.",
                    "zh":"本测试中唯一一次关机再开机，放在最后，以免已经搭好的状态需要重做。",
                    "es":"El único apagado de esta prueba, dejado para el final para no tener que volver a montar nada de lo ya dispuesto."}},
           {"id":"autostart","code":"SD-014","label":{"en":"Starts in SD automatically on power on","zh":"开机自动进入 SD 播放"},
            "help":{"en":"With the card still inserted, switch the speaker off and on. It must return to SD mode and start playing without pressing anything.",
                    "zh":"SD 卡保持插入，关机后再开机。应自动回到 SD 模式并开始播放，无需按任何键。"}}]},

        {"id":"BLUETOOTH","optional":false,"only_factory":["YIS","RHY","EAG"],
         "skip":["HK-BAS115A1","HK-BAS118A1","HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"BLUETOOTH","zh":"蓝牙"},
         "steps":[
           {"en":"Put the speaker in Bluetooth mode and leave it discoverable","zh":"将音箱切换到蓝牙模式并保持可被搜索"},
           {"en":"Pair an iPhone and play audio","zh":"配对 iPhone 并播放音频"},
           {"en":"Disconnect, pair an Android phone and play audio","zh":"断开后配对安卓手机并播放音频"},
           {"en":"Switch the speaker off and on to see if it reconnects by itself","zh":"重新开机，确认是否自动回连"},
           {"en":"With the audio playing, check each control on the list","zh":"在播放状态下，逐项检查下列功能"},
           {"en":"Finally, enable TWS mode and link it to a second speaker","zh":"最后开启 TWS 模式，与第二台音箱串联"},
           {"en":"Set every level, switch the speaker off and on, and check they were kept","zh":"调好各项音效后关机再开机，确认设置是否保留"}],
         "points":[
           {"section":{"en":"Connection","zh":"连接"},
            "help":{"en":"Put the speaker in Bluetooth mode. Pair an iPhone and play; then disconnect and pair an Android. Finally switch the speaker off and on to see whether it reconnects by itself.",
                    "zh":"将音箱切换到蓝牙模式。先配对 iPhone 播放，断开后再配对安卓手机。最后重新开机，确认是否自动回连。"}},
           {"id":"iphone","code":"BT-006","label":{"en":"Connection with iPhone","zh":"连接 iPhone"},
            "help":{"en":"Search from the iPhone. The speaker must appear in the list, pair without a PIN and connect within a few seconds.",
                    "zh":"用 iPhone 搜索。音箱应出现在列表中，无需 PIN 码即可配对，并在几秒内连接成功。"}},
           {"id":"android","code":"BT-007","label":{"en":"Connection with Android","zh":"连接安卓手机"},
            "help":{"en":"Disconnect the iPhone first, then pair an Android. Both must work: it is common for a speaker to connect with one and fail with the other.",
                    "zh":"先断开 iPhone，再配对安卓手机。两者都必须正常：只连其中一种的情况很常见。"}},
           {"id":"name_match","code":"BT-012","label":{"en":"Bluetooth name matches the product","zh":"蓝牙名称与产品一致"},
            "help":{"en":"Read the name exactly as the phone lists it and confirm it against the name printed in the user manual. They must say the same thing, character by character. The manual is the one source to check against: the logo on the grille and the logo on the panel can disagree with each other, and when they do there is no way to tell which one is right. A speaker sold as one model that announces itself as another is a defect the customer sees before switching it on. Photograph the phone's list if it does not match.",
                    "zh":"按手机列表中显示的名称逐字读取，并与用户手册上印制的名称核对确认，两者必须逐字一致。以手册为唯一比对依据：网罩标志与面板标志之间也可能不一致，一旦不一致就无从判断哪个才是对的。以某型号出售却以另一个名称广播的音箱，客户开机之前就会发现。若不一致，请拍摄手机列表。",
                    "es":"Lea el nombre tal como lo lista el teléfono y confírmelo contra el nombre que aparece en el manual de usuario. Deben decir lo mismo, carácter por carácter. El manual es la única fuente contra la cual comparar: el logo de la rejilla y el del panel pueden contradecirse entre sí, y cuando eso pasa no hay forma de saber cuál de los dos tiene razón. Un parlante que se vende como un modelo y se anuncia como otro es un defecto que el cliente ve antes de encenderlo. Fotografíe la lista del teléfono si no coincide."}},
           {"id":"autoconnect","code":"BT-008","label":{"en":"Reconnects automatically on power on","zh":"开机自动回连"},
            "help":{"en":"With the phone paired and nearby, switch the speaker off and on. It must reconnect by itself, without pairing again.",
                    "zh":"手机保持已配对且在附近，关机后再开机。音箱应自动回连，无需重新配对。"}},
           {"id":"stable","code":"BT-003","label":{"en":"Does not disconnect during playback","zh":"播放中不断开"},
            "help":{"en":"Play for at least 30 seconds with the phone about 3 metres away. There must be no dropouts or disconnections.",
                    "zh":"手机放在约 3 米外，持续播放至少 30 秒。不应出现断音或断开连接。"}},
           {"section":{"en":"Playback","zh":"播放"},
            "help":{"en":"Play the test track from the phone and listen for at least 30 seconds, checking for dropouts and hum.",
                    "zh":"用手机播放测试音乐，至少试听 30 秒，注意是否有断音或杂音。"}},
           {"id":"audio","code":"BT-004","label":{"en":"Audio comes out of the speaker","zh":"音箱正常出声"},
            "help":{"en":"Play music and confirm it really comes out of this speaker, not the phone or a nearby speaker.",
                    "zh":"播放音乐并确认声音确实来自本机，而不是手机或旁边的音箱。",
                    "es":"Reproduzca música y confirme que sale realmente de este parlante, no del teléfono ni de otro parlante cercano."}},
           {"id":"quality","code":"BT-011","label":{"en":"No hum or interference","zh":"无杂音或干扰"},
            "help":{"en":"Listen close to the grille at medium volume. Behind the music there must be no hum, hiss or digital crackle.",
                    "zh":"中等音量下靠近网罩细听，音乐背景不应有嗡嗡声、嘶声或数字爆音。"}},
           {"id":"play_pause","code":"BT-009","label":{"en":"PLAY / PAUSE button","zh":"播放/暂停按键"},
            "help":{"en":"Press it on the speaker, not on the phone. The music must pause and the phone must show it paused too.",
                    "zh":"在音箱上按，不要在手机上按。音乐应暂停，手机端也应显示暂停。"}},
           {"id":"modes","code":"DSP-005","label":{"en":"Mode button","zh":"模式按键"},
            "help":{"en":"Press the mode button through the full cycle until it returns to Bluetooth. The connection must survive the round trip.",
                    "zh":"反复按模式键走完一轮回到蓝牙。切换一圈后连接不应断开。"}},
           {"section":{"en":"Audio controls","zh":"音频控制"},
            "help":{"en":"Move each control through its full range and listen. If the reference shows the level on screen, the indicator must follow the knob.",
                    "zh":"将每个旋钮从最小转到最大并细听。若本型号在屏幕上显示数值，指示应随旋钮同步变化。"}},
           {"id":"volume_max","code":"AUD-006","label":{"en":"Volume to maximum","zh":"音量调到最大"},
            "help":{"en":"Take the volume from minimum to maximum slowly. It must rise continuously the whole way, with no jumps, dead spots or scratchy sound, and where there is a number on the display it must follow.",
                    "zh":"缓慢将音量从最小调到最大。全程应连续上升，不应跳变、无死区、无刮擦杂音；若屏幕显示数值，应同步变化。"}},
           {"id":"treble","code":"AUD-007","label":{"en":"Treble level","zh":"高音调节"},
            "help":{"en":"With music playing, take the treble fully down and fully up. The change must be clearly audible across the whole travel, with no dead spots and no scratchy noise as the knob turns. Where there is an on-screen indicator, it must follow.",
                    "zh":"播放音乐时，将高音从最小调到最大。全程声音变化应清晰可辨，无死区，旋转时无刮擦杂音。若有屏幕指示，应同步变化。"}},
           {"id":"bass","code":"AUD-008","label":{"en":"Bass level","zh":"低音调节"},
            "help":{"en":"Same check on the bass control, across its whole travel. Where there is an on-screen indicator, it must follow.",
                    "zh":"对低音旋钮做同样的检查，走完全程。若有屏幕指示，应同步变化。"}},
           {"id":"xbass","code":"AUD-010","only":["HK-BRA210B1"],
            "label":{"en":"X-BASS function","zh":"X-BASS 功能"},
            "help":{"en":"Playing over Bluetooth, switch X-BASS on and off several times. The low end must jump noticeably when it is on and go back when it is off, and the display must show the change. Then raise the volume to maximum with X-BASS on: the bass must stay clean, with no distortion and no rattle from the woofer.",
                    "zh":"通过蓝牙播放时，反复开关 X-BASS。开启时低音应明显增强，关闭时恢复原状，屏幕应显示状态变化。随后在开启 X-BASS 的状态下将音量调到最大：低音应保持干净，不失真，低音单元不应有异响。"}},
           {"section":{"en":"Sound pressure level at 1 kHz","zh":"1 kHz 声压级测量"},
            "help":{"en":"Measure over Bluetooth, with the volume at maximum on the speaker and on the phone.",
                    "zh":"通过蓝牙测量，音箱和手机的音量均需开到最大。",
                    "es":"Mida por Bluetooth, con el volumen al máximo en el parlante y en el teléfono."}},
           {"id":"spl_1khz","code":"AUD-012","photo":true,
            "measure":{"unit":"dB","step":"0.1"},
            "label":{"en":"SPL at 1 kHz, one metre","zh":"1 kHz 声压级（1 米）"},
            "help":{"en":"Turn everything to maximum before measuring: bass, treble, the volume on the speaker and the volume on the phone. No control may be left halfway. Then take the sound level meter and set it to PEAK and SLOW. Place it one metre from the speaker, at the same height as the woofer and pointing at it. From the phone, over Bluetooth, play a 1 kHz tone with a signal generator app. Photograph the meter with the reading visible and write the value in the box.",
                    "zh":"测量前全部调到最大：低音、高音、音箱音量和手机音量。任何一个旋钮都不得停在中间。然后取声级计，设置为峰值（PEAK）和慢档（SLOW），置于距音箱一米处，与低音单元同高并正对。用手机通过蓝牙，以信号发生器 App 播放 1 kHz 正弦音。拍摄声级计读数清晰可见的照片，并将数值填入方框。",
                    "es":"Ponga todo al máximo antes de medir: graves, agudos, el volumen de la cabina y el volumen del celular. Ningún control puede quedar a media marcha. Luego tome el sonómetro y configúrelo en PICO (PEAK) y LENTA (SLOW). Ubíquelo a un metro del parlante, a la misma altura del woofer y apuntando hacia él. Desde el celular, por Bluetooth, reproduzca un tono de 1 kHz con una aplicación generadora de señal. Fotografíe el sonómetro con la lectura visible y escriba el valor en el recuadro."}},
           {"skip_factory":["RHY"],
            "section":{"en":"Microphones and guitar","zh":"麦克风与吉他"},
            "help":{"en":"Plug a microphone into MIC1 and speak while you adjust volume, echo and priority. Repeat with MIC2, then connect the guitar. Mark N/A for whatever this reference does not have.",
                    "zh":"将麦克风插入 MIC1，一边说话一边调节音量、混响和优先键；MIC2 重复同样操作，最后接上吉他。本型号没有的功能标记为“不适用”。"}},
           {"id":"mic1_priority","code":"MIC-005","skip_factory":["RHY"],"label":{"en":"MIC1 priority button","zh":"麦克风 1 优先键"},
            "help":{"en":"With music playing, press priority and speak into MIC1. The music must drop to about 10% of its level and come back to full level when you stop. A drop you have to strain to notice is a fail.",
                    "zh":"在播放音乐时按下优先键并对麦克风 1 说话。音乐应降到原音量的约 10%，停止说话后恢复原音量。若需要仔细分辨才能察觉衰减，即判定为异常。",
                    "es":"Con música sonando, pulse prioridad y hable por MIC1. La música debe bajar a un 10% de su nivel y volver a su nivel completo al dejar de hablar. Una caída que haya que esforzarse en notar es un fallo."}},
           {"id":"mic1_volume","code":"MIC-006","skip_factory":["RHY"],"label":{"en":"MIC1 volume","zh":"麦克风 1 音量"},
            "help":{"en":"Speak continuously into MIC1 while turning its volume from minimum to maximum. The level must rise smoothly, without cutting out or crackling.",
                    "zh":"对麦克风 1 持续说话，同时把音量从最小调到最大。音量应平滑上升，不应中断或有爆音。"}},
           {"id":"mic1_echo","code":"MIC-007","skip_factory":["RHY"],"label":{"en":"MIC1 echo","zh":"麦克风 1 回声"},
            "help":{"en":"Say short words into MIC1 and turn the echo from minimum to maximum. The repetition must go from none to clearly audible, and the delay must stay within 0 to 280 ms: at maximum the echo must still follow the voice closely, not lag like a separate second voice. Anything longer than that stops sounding like reverberation and starts sounding like a fault.",
                    "zh":"对麦克风 1 说短词，并将回声从最小调到最大。重复声应从无到明显可闻，延时须在 0～280 毫秒范围内：即使调到最大，回声也应紧跟人声，而不应拖成第二个人声。超过该范围就不再像混响，而像故障。"}},
           {"id":"mic1_reverb","code":"MIC-008","skip_factory":["RHY"],"label":{"en":"MIC1 reverb","zh":"麦克风 1 混响"},
            "help":{"en":"Speak into MIC1 and raise the reverb. The voice must gain body and depth, not repeat like the echo. Both controls must act independently.",
                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。"}},
           {"id":"mic2_priority","code":"MIC-005","skip_factory":["RHY"],"label":{"en":"MIC2 priority button","zh":"麦克风 2 优先键"},
            "help":{"en":"Unplug MIC1 and plug the microphone into MIC2. Same test, and the same criterion: the music must drop to about 10% of its level while you speak. Mark N/A, here and in the three points below, if this reference has only one microphone input.",
                    "zh":"拔下 MIC1，将麦克风插入 MIC2。测试方法和判定标准相同：说话时音乐应降到原音量的约 10%。本型号只有一个麦克风接口时，本项及以下三项均标记为“不适用”。"}},
           {"id":"mic2_volume","code":"MIC-006","skip_factory":["RHY"],"label":{"en":"MIC2 volume","zh":"麦克风 2 音量"},
            "help":{"en":"Speak continuously into MIC2 while turning its volume from minimum to maximum.",
                    "zh":"对麦克风 2 持续说话，同时把音量从最小调到最大。"}},
           {"id":"mic2_echo","code":"MIC-007","skip_factory":["RHY"],"label":{"en":"MIC2 echo","zh":"麦克风 2 回声"},
            "help":{"en":"Say short words into MIC2 and turn the echo up. Same range: 0 to 280 ms.",
                    "zh":"对麦克风 2 说短词并加大回声。范围相同：0～280 毫秒。"}},
           {"id":"mic2_reverb","code":"MIC-008","skip_factory":["RHY"],"label":{"en":"MIC2 reverb","zh":"麦克风 2 混响"},
            "help":{"en":"Speak into MIC2 and raise the reverb. Echo and reverb must act independently on this input too.",
                    "zh":"对麦克风 2 说话并加大混响。该接口上回声与混响也应各自独立起作用。"}},
           {"id":"guitar","code":"AUD-009","skip_factory":["RHY"],"label":{"en":"Guitar volume","zh":"吉他音量"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。"}},
           {"skip_factory":["RHY"],
            "section":{"en":"Lights","zh":"灯光"},
            "help":{"en":"Switch the light on and off, and step through the light modes if the speaker has them.",
                    "zh":"开关灯光，如有多种灯光模式请逐一切换确认。"}},
           {"id":"light","code":"LED-006","skip_factory":["RHY"],"label":{"en":"Light on / off","zh":"灯光开关"},
            "help":{"en":"Press the light button several times. It must switch on and off cleanly every time, with no flicker and no LED left lit.",
                    "zh":"多次按下灯光键。每次都应干脆地开和关，不闪烁，也不应有个别灯珠残亮。"}},
           {"id":"light_pattern","code":"LED-007","skip_factory":["RHY"],"label":{"en":"Light pattern change","zh":"灯光模式切换"},
            "help":{"en":"Step through every light pattern and back to the first. Each one must be visibly different, with no dead LEDs in any pattern.",
                    "zh":"逐一切换所有灯光模式并回到第一个。每种模式应有明显区别，且任何模式下都不应有不亮的灯珠。"}},
           {"skip_factory":["RHY"],
            "section":{"en":"AC charging","zh":"AC 充电"},
            "help":{"en":"Connect the AC charging cable with the speaker switched on and watch the display.",
                    "zh":"在开机状态下接上 AC 充电线，观察显示屏。"}},
           {"id":"ac_charge","code":"CHG-002","skip_factory":["RHY"],"label":{"en":"Charging indicator","zh":"充电指示"},
            "help":{"en":"Plug the AC cable in. The charging indicator must appear on the display within a few seconds, and stay on while the cable is connected.",
                    "zh":"接上 AC 充电线。几秒内显示屏应出现充电指示，并在连接期间保持显示。"}},
           {"section":{"en":"TWS","zh":"TWS"},
            "help":{"en":"Enable TWS mode and link the speaker to a second speaker. Confirm both play together. Mark N/A if this reference has no TWS.",
                    "zh":"开启 TWS 模式，与第二台音箱串联，确认两台同时出声。本型号没有 TWS 时标记为“不适用”。"}},
           {"id":"tws","code":"BT-010","label":{"en":"TWS mode: link with a second speaker","zh":"TWS 模式：与第二台音箱串联"},
            "help":{"en":"Enable TWS on both speakers and wait for them to pair with each other. Play music: both must sound together and in sync. Mark N/A if this reference has no TWS.",
                    "zh":"在两台音箱上都开启 TWS，等待互相配对。播放音乐：两台应同时出声且同步。本型号没有 TWS 时标记为“不适用”。"}},
           {"skip_factory":["RHY"],
            "section":{"en":"Settings memory","zh":"设置记忆"},
            "help":{"en":"Move every level to a position that is easy to recognise — not centred, not at the end — and write down where you left each one. Switch the speaker off, wait ten seconds, switch it on and check them one by one. A speaker that returns to factory levels on every power cycle is one the customer has to set up again every single time.",
                    "zh":"将每个音效调到容易辨认的位置——不要居中，也不要到底——并记下各自的位置。关机，等待十秒后开机，逐项核对。若每次开机都恢复出厂设置，客户每次使用都得重新调一遍。"}},
           {/* On RHYME's panels BASS and TREBLE are analogue pots: the knob
                 position is the setting, so there is nothing for the speaker to
                 remember and nothing to check. What those cabinets do keep
                 across a power cycle is the DSP mode, and that is checked in
                 its own test. */
            "id":"mem_bass","code":"AUD-011","skip_factory":["RHY"],"label":{"en":"Bass level is kept after power off","zh":"关机后保留低音设置"},
            "help":{"en":"Leave the bass clearly above or below the middle, switch off and on. It must come back exactly where it was, on the control and on the display.",
                    "zh":"将低音明显调高或调低于中间位置，关机再开机。旋钮位置和屏幕显示都应回到原来的数值。"}},
           {"id":"mem_treble","code":"AUD-011","skip_factory":["RHY"],"label":{"en":"Treble level is kept after power off","zh":"关机后保留高音设置"},
            "help":{"en":"Same check on the treble. Testing one level and assuming the rest is how a speaker ships remembering the bass and forgetting everything else.",
                    "zh":"对高音做同样的检查。只测一项就推断其余，正是音箱只记住低音、其他全忘的出厂原因。"}},
           {"id":"mem_mid","code":"AUD-011","skip_factory":["RHY"],"label":{"en":"Mid level is kept after power off","zh":"关机后保留中音设置"},
            "help":{"en":"Same check on the mids. Mark N/A if this reference has no mid control.",
                    "zh":"对中音做同样的检查。本型号没有中音调节时标记为“不适用”。"}},
           {"id":"mem_echo","code":"AUD-011","skip_factory":["RHY"],"label":{"en":"Echo level is kept after power off","zh":"关机后保留回声设置"},
            "help":{"en":"Same check on the echo. Speak into the microphone after switching on again: the repetition must sound the same as before.",
                    "zh":"对回声做同样的检查。重新开机后对麦克风说话，重复声应与之前一致。"}},
           {"id":"mem_mic_bass","code":"AUD-011","skip_factory":["RHY"],"label":{"en":"Microphone bass is kept after power off","zh":"关机后保留麦克风低音设置"},
            "help":{"en":"Same check on the microphone bass. Mark N/A if this reference has no separate microphone tone controls.",
                    "zh":"对麦克风低音做同样的检查。本型号没有独立的麦克风音调调节时标记为“不适用”。"}},
           {"id":"mem_mic_treble","code":"AUD-011","skip_factory":["RHY"],"label":{"en":"Microphone treble is kept after power off","zh":"关机后保留麦克风高音设置"},
            "help":{"en":"Same check on the microphone treble. Mark N/A if this reference has no separate microphone tone controls.",
                    "zh":"对麦克风高音做同样的检查。本型号没有独立的麦克风音调调节时标记为“不适用”。"}}]},

        /* ===== Compatibility · wireless receiver against FM =================
           Compatibilidad, no función. El receptor de micrófono inalámbrico va
           montado a centímetros del sintonizador y su propio oscilador cae
           dentro de la banda de radiodifusión: un módulo perfectamente bueno
           por sí solo puede hacer silbar la radio en cuanto se le da corriente.

           Se comprueba sobre una emisora débil porque una fuerte tapa la
           interferencia por completo. El que sufre la falla es el cliente
           lejos del transmisor, que es justamente el que nunca se prueba.

           Y se comprueba en cada inspección, no solo en la muestra: la muestra
           es lo que se aprueba, pero el proveedor del módulo cambia entre lotes
           y el lote es lo que se embarca. */
        {"id":"RX_FM_COMPAT","optional":false,"only_factory":["YIS"],
         "skip":["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],"evidence":[],
         "label":{"en":"COMPATIBILITY · WIRELESS RECEIVER AND FM",
                  "zh":"兼容性 · 无线接收模块与调频",
                  "es":"COMPATIBILIDAD · RECEPTOR INALÁMBRICO Y FM"},
         "steps":[
           {"en":"Fit the wireless microphone receiver module as it ships","zh":"按出厂状态装入无线麦克风接收模块","es":"Instale el módulo receptor de micrófono inalámbrico tal como sale de fábrica"},
           {"en":"Tune a weak FM station, not a strong local one","zh":"调到一个信号较弱的电台，不要用本地强台","es":"Sintonice una emisora FM débil, no una local fuerte"},
           {"en":"Listen with the receiver off, then switch it on","zh":"先在接收模块关闭时试听，再将其开启","es":"Escuche con el receptor apagado y luego enciéndalo"},
           {"en":"Judge the difference between the two","zh":"比较两者的差异后判定","es":"Juzgue la diferencia entre los dos"}],
         "points":[
           {"section":{"en":"Setting it up","zh":"准备","es":"Preparación"},
            "help":{"en":"The module fitted, and a station chosen for being weak. Do not use a strong station.",
                    "zh":"装好模块，并选择一个信号弱的电台。不要使用强台。",
                    "es":"El módulo instalado, y una emisora elegida por ser débil. No use una emisora fuerte."}},
           {"id":"rx_fitted","code":"FM-010",
            "label":{"en":"Receiver module fitted as it ships","zh":"接收模块按出厂状态装好","es":"Módulo receptor instalado como sale de fábrica"},
            "help":{"en":"In its place inside the speaker, with its own wiring and its antenna routed as production routes it. A module held in the hand beside the cabinet is a different measurement.",
                    "zh":"装在机内应有的位置，线束与天线走向与量产一致。用手拿在箱体旁边测得的是另一回事。",
                    "es":"En su sitio dentro del parlante, con su cableado y su antena tendida como la tiende producción. Un módulo sostenido en la mano junto a la cabina es otra medición."}},
           {"id":"rx_station","code":"FM-002","measure":{"unit":"MHz","step":"0.1"},
            "label":{"en":"Weak station tuned — frequency","zh":"已调到的弱信号电台 — 频率","es":"Emisora débil sintonizada — frecuencia"},
            "help":{"en":"Tune a station that comes in weak but intelligible, and write its frequency in the box.",
                    "zh":"调到一个信号较弱但仍可听清的电台，并将其频率填入方框。",
                    "es":"Sintonice una emisora que entre débil pero se entienda, y escriba su frecuencia en el recuadro."}},
           {"id":"rx_baseline","code":"FM-010",
            "label":{"en":"Reference heard with the receiver off","zh":"已在接收模块关闭时听取基准","es":"Referencia escuchada con el receptor apagado"},
            "help":{"en":"With the module unpowered, listen to that station for twenty seconds and keep in mind how it sounds. Without this the noise of a distant station and the noise of the module cannot be told apart.",
                    "zh":"在模块未通电的状态下，试听该电台二十秒，记住其声音。缺少这一步，就无法区分远距离电台本身的噪声与模块产生的噪声。",
                    "es":"Con el módulo sin corriente, escuche esa emisora veinte segundos y retenga cómo suena. Sin esto no se distingue el ruido de una emisora lejana del ruido del módulo."}},
           {"section":{"en":"With the receiver on","zh":"接收模块开启后","es":"Con el receptor encendido"},
            "help":{"en":"Switch the module on without touching the tuning or the volume. Anything that appears now comes from the module.",
                    "zh":"在不改动调台与音量的前提下开启模块。此时出现的任何变化都来自模块。",
                    "es":"Encienda el módulo sin tocar la sintonía ni el volumen. Lo que aparezca ahora viene del módulo."}},
           {"id":"rx_no_noise","code":"FM-010",
            "label":{"en":"No added background noise","zh":"未增加背景噪声","es":"Sin ruido de fondo añadido"},
            "help":{"en":"The station must sound the same as it did with the module off. A hiss that rises, or reception that becomes unstable, is the module.",
                    "zh":"电台的声音应与模块关闭时一致。若嘶声变大，或接收变得不稳定，即为模块所致。",
                    "es":"La emisora debe sonar igual que con el módulo apagado. Un siseo que sube, o una recepción que se vuelve inestable, es el módulo."}},
           {"id":"rx_no_whistle","code":"FM-010",
            "label":{"en":"No whistle or tone","zh":"无啸叫或单音干扰","es":"Sin silbido ni tono"},
            "help":{"en":"Listen for a fixed tone behind the programme, of the kind that does not change with the music. It usually appears at some points of the dial and not at others, so go over the band before passing this.",
                    "zh":"注意节目声背后是否有固定的单音，且不随音乐变化。它通常只出现在频段的某些位置，因此判定合格前应在整个频段上扫查。",
                    "es":"Escuche si aparece un tono fijo detrás del programa, de los que no cambian con la música. Suele salir en unos puntos del dial y no en otros, así que recorra la banda antes de aprobar esto."}}]},

        {/* RHYME's back panels carry no antenna, no antenna connector, no dial
              and no band markings: the four LEDs that look like a source
              selector are DSP modes. The reference plan was written expecting an
              FM section that does not exist on any of the three panels
              received - which is also why INTERNAL asked for a photograph of the
              FM antenna routing. Both come out together. */
         "id":"RADIO_FM","optional":true,"only_factory":["YIS","RHY","EAG"],
         "skip_factory":["RHY"],"skip":["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"FM RADIO","zh":"调频收音"},
         "steps":[
           {"en":"Select radio mode on the speaker","zh":"将音箱切换到收音模式"},
           {"en":"Run the auto search and store the stations","zh":"执行自动搜台并保存电台"},
           {"en":"Step through the stations with the next and back buttons","zh":"用上/下一台按键切换电台"},
           {"en":"Switch off and on to see if it keeps the last station","zh":"重新开机，确认是否记忆上次电台"},
           {"en":"With the radio playing, check each control on the list","zh":"在收音状态下，逐项检查下列功能"},
           {"en":"Check that the lights stay off in radio mode","zh":"确认收音模式下灯光保持关闭"}],
         "points":[
           {"section":{"en":"Tuning","zh":"调台"},
            "help":{"en":"Select radio mode and run the auto search to store stations. Step through them with next and back. Then switch the speaker off and on to check it keeps the last station.",
                    "zh":"切换到收音模式并执行自动搜台保存电台，用上/下一台按键切换。之后重新开机，确认是否记忆上次电台。"}},
           {"id":"search","code":"FM-005","photo":true,
            "measure":{"unit":{"en":"stations","zh":"个电台","es":"emisoras"},"step":"1"},
            "label":{"en":"Searches and stores stations","zh":"搜索并保存电台"},
            "help":{"en":"Run the auto search and let it finish. It must find several stations and store them; one or none is a fail. Write in the box how many it stored and photograph the list of stored stations on the display.",
                    "zh":"执行自动搜台并等待完成。应搜到多个电台并保存；只搜到一个或搜不到即判定为异常。请在方框中填写实际保存的电台数量，并拍摄显示屏上已保存的电台列表。",
                    "es":"Ejecute la búsqueda automática y déjela terminar. Debe encontrar varias emisoras y guardarlas; una o ninguna es un fallo. Escriba en el recuadro cuántas guardó y fotografíe en la pantalla las emisoras almacenadas."}},
           {"id":"station_next","code":"FM-007","label":{"en":"Next station button","zh":"下一台按键"},
            "help":{"en":"Press it several times. The frequency must move to the next stored station each time, not scan endlessly.",
                    "zh":"连续按几次。每次应跳到下一个已存电台，而不是一直扫描。"}},
           {"id":"station_prev","code":"FM-007","label":{"en":"Previous station button","zh":"上一台按键"},
            "help":{"en":"Press it several times. It must go back through the stored stations one at a time.",
                    "zh":"连续按几次。应逐一退回到上一个已存电台。"}},
           {"id":"memory","code":"FM-008","label":{"en":"Keeps the last station after power off","zh":"关机后记忆上次电台"},
            "help":{"en":"Select the station stored in preset 2 and write down its frequency. Switch the speaker off, wait a few seconds and switch it on again. It must come back on preset 2, on the same frequency — not on preset 1 and not scanning.",
                    "zh":"切换到第 2 个预存电台并记下其频率。关机，等待几秒后再开机。开机后应回到第 2 个预存电台、同一频率，而不是回到第 1 个电台，也不应重新搜台。"}},
           {"id":"reception","code":"FM-002","label":{"en":"Stable reception","zh":"信号稳定"},
            "help":{"en":"Listen to one station for 30 seconds without touching the speaker. The signal must not drift, fade or fill with static.",
                    "zh":"固定一个电台听 30 秒，不要触碰音箱。信号不应漂移、忽强忽弱或出现噪声。"}},
           {"id":"audio","code":"FM-003","label":{"en":"Clean audio, no noise","zh":"声音清晰无杂音"},
            "help":{"en":"On a strong station the voice must be clear. Constant hiss on every station points to the tuner or the antenna, not the broadcast.",
                    "zh":"在信号强的电台上人声应清晰。如果每个台都有持续嘶声，问题在调谐器或天线，而不是电台。"}},
           {"section":{"en":"Modes","zh":"模式"},
            "help":{"en":"Press the mode button and confirm the speaker changes source and the display follows.",
                    "zh":"按模式键，确认音箱切换音源且显示屏同步变化。"}},
           {"id":"modes","code":"DSP-005","label":{"en":"Mode button","zh":"模式按键"}},
           {"section":{"en":"Audio controls","zh":"音频控制"},
            "help":{"en":"Move each control through its full range and listen. If the reference shows the level on screen, the indicator must follow the knob.",
                    "zh":"将每个旋钮从最小转到最大并细听。若本型号在屏幕上显示数值，指示应随旋钮同步变化。"}},
           {"id":"volume_max","code":"AUD-006","label":{"en":"Volume to maximum","zh":"音量调到最大"},
            "help":{"en":"Take the volume from minimum to maximum slowly. It must rise continuously the whole way, with no jumps, dead spots or scratchy sound, and where there is a number on the display it must follow.",
                    "zh":"缓慢将音量从最小调到最大。全程应连续上升，不应跳变、无死区、无刮擦杂音；若屏幕显示数值，应同步变化。"}},
           {"id":"treble","code":"AUD-007","label":{"en":"Treble level","zh":"高音调节"},
            "help":{"en":"With music playing, take the treble fully down and fully up. The change must be clearly audible across the whole travel, with no dead spots and no scratchy noise as the knob turns. Where there is an on-screen indicator, it must follow.",
                    "zh":"播放音乐时，将高音从最小调到最大。全程声音变化应清晰可辨，无死区，旋转时无刮擦杂音。若有屏幕指示，应同步变化。"}},
           {"id":"bass","code":"AUD-008","label":{"en":"Bass level","zh":"低音调节"},
            "help":{"en":"Same check on the bass control, across its whole travel. Where there is an on-screen indicator, it must follow.",
                    "zh":"对低音旋钮做同样的检查，走完全程。若有屏幕指示，应同步变化。"}},
           {"skip_factory":["RHY"],
            "section":{"en":"Lights","zh":"灯光"},
            "help":{"en":"Switch the light on and off, and step through the light modes if the speaker has them.",
                    "zh":"开关灯光，如有多种灯光模式请逐一切换确认。"}},
           {"id":"lights_off","code":"FM-009","label":{"en":"Lights stay off in radio mode","zh":"收音模式下灯光保持关闭"},
            "help":{"en":"In radio mode the lights must stay off by design: the LED drivers interfere with FM reception. If they come on, it is a firmware fault.",
                    "zh":"收音模式下灯光应按设计保持关闭：灯板驱动会干扰调频接收。若灯亮起，属于固件缺陷。"}},
           /* Mismo bloque que en BLUETOOTH, ahora también aquí. Sólo YISION. */
           {"only_factory":["YIS"],
            "section":{"en":"Microphones and guitar","zh":"麦克风与吉他"},
            "help":{"en":"Plug a microphone into MIC1 and speak while you adjust volume, echo and priority. Repeat with MIC2, then connect the guitar. Mark N/A for whatever this reference does not have.",
                    "zh":"将麦克风插入 MIC1，一边说话一边调节音量、混响和优先键；MIC2 重复同样操作，最后接上吉他。本型号没有的功能标记为“不适用”。"}},
           {"id":"mic1_priority","code":"MIC-005","only_factory":["YIS"],"label":{"en":"MIC1 priority button","zh":"麦克风 1 优先键"},
            "help":{"en":"With music playing, press priority and speak into MIC1. The music must drop to about 10% of its level and come back to full level when you stop. A drop you have to strain to notice is a fail.",
                    "zh":"在播放音乐时按下优先键并对麦克风 1 说话。音乐应降到原音量的约 10%，停止说话后恢复原音量。若需要仔细分辨才能察觉衰减，即判定为异常。",
                    "es":"Con música sonando, pulse prioridad y hable por MIC1. La música debe bajar a un 10% de su nivel y volver a su nivel completo al dejar de hablar. Una caída que haya que esforzarse en notar es un fallo."}},
           {"id":"mic1_volume","code":"MIC-006","only_factory":["YIS"],"label":{"en":"MIC1 volume","zh":"麦克风 1 音量"},
            "help":{"en":"Speak continuously into MIC1 while turning its volume from minimum to maximum. The level must rise smoothly, without cutting out or crackling.",
                    "zh":"对麦克风 1 持续说话，同时把音量从最小调到最大。音量应平滑上升，不应中断或有爆音。"}},
           {"id":"mic1_echo","code":"MIC-007","only_factory":["YIS"],"label":{"en":"MIC1 echo","zh":"麦克风 1 回声"},
            "help":{"en":"Say short words into MIC1 and turn the echo from minimum to maximum. The repetition must go from none to clearly audible, and the delay must stay within 0 to 280 ms: at maximum the echo must still follow the voice closely, not lag like a separate second voice. Anything longer than that stops sounding like reverberation and starts sounding like a fault.",
                    "zh":"对麦克风 1 说短词，并将回声从最小调到最大。重复声应从无到明显可闻，延时须在 0～280 毫秒范围内：即使调到最大，回声也应紧跟人声，而不应拖成第二个人声。超过该范围就不再像混响，而像故障。"}},
           {"id":"mic1_reverb","code":"MIC-008","only_factory":["YIS"],"label":{"en":"MIC1 reverb","zh":"麦克风 1 混响"},
            "help":{"en":"Speak into MIC1 and raise the reverb. The voice must gain body and depth, not repeat like the echo. Both controls must act independently.",
                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。"}},
           {"id":"mic2_priority","code":"MIC-005","only_factory":["YIS"],"label":{"en":"MIC2 priority button","zh":"麦克风 2 优先键"},
            "help":{"en":"Unplug MIC1 and plug the microphone into MIC2. Same test, and the same criterion: the music must drop to about 10% of its level while you speak. Mark N/A, here and in the three points below, if this reference has only one microphone input.",
                    "zh":"拔下 MIC1，将麦克风插入 MIC2。测试方法和判定标准相同：说话时音乐应降到原音量的约 10%。本型号只有一个麦克风接口时，本项及以下三项均标记为“不适用”。"}},
           {"id":"mic2_volume","code":"MIC-006","only_factory":["YIS"],"label":{"en":"MIC2 volume","zh":"麦克风 2 音量"},
            "help":{"en":"Speak continuously into MIC2 while turning its volume from minimum to maximum.",
                    "zh":"对麦克风 2 持续说话，同时把音量从最小调到最大。"}},
           {"id":"mic2_echo","code":"MIC-007","only_factory":["YIS"],"label":{"en":"MIC2 echo","zh":"麦克风 2 回声"},
            "help":{"en":"Say short words into MIC2 and turn the echo up. Same range: 0 to 280 ms.",
                    "zh":"对麦克风 2 说短词并加大回声。范围相同：0～280 毫秒。"}},
           {"id":"mic2_reverb","code":"MIC-008","only_factory":["YIS"],"label":{"en":"MIC2 reverb","zh":"麦克风 2 混响"},
            "help":{"en":"Speak into MIC2 and raise the reverb. Echo and reverb must act independently on this input too.",
                    "zh":"对麦克风 2 说话并加大混响。该接口上回声与混响也应各自独立起作用。"}},
           {"id":"guitar","code":"AUD-009","only_factory":["YIS"],"label":{"en":"Guitar volume","zh":"吉他音量"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。"}}]},

            "help":{"en":"Speak continuously into MIC1 while turning its volume from minimum to maximum. The level must rise smoothly, without cutting out or crackling.",

           {"id":"mic1_echo","code":"MIC-007","only_factory":["YIS"],"label":{"en":"MIC1 echo","zh":"麦克风 1 回声"},
            "help":{"en":"Say short words into MIC1 and turn the echo from minimum to maximum. The repetition must go from none to clearly audible, and the delay must stay within 0 to 280 ms: at maximum the echo must still follow the voice closely, not lag like a separate second voice. Anything longer than that stops sounding like reverberation and starts sounding like a fault.",
                    "zh":"对麦克风 1 说短词，并将回声从最小调到最大。重复声应从无到明显可闻，延时须在 0～280 毫秒范围内：即使调到最大，回声也应紧跟人声，而不应拖成第二个人声。超过该范围就不再像混响，而像故障。"}},
           {"id":"mic1_reverb","code":"MIC-008","only_factory":["YIS"],"label":{"en":"MIC1 reverb","zh":"麦克风 1 混响"},
            "help":{"en":"Speak into MIC1 and raise the reverb. The voice must gain body and depth, not repeat like the echo. Both controls must act independently.",
                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。"}},
           {"id":"mic2_priority","code":"MIC-005","only_factory":["YIS"],"label":{"en":"MIC2 priority button","zh":"麦克风 2 优先键"},
            "help":{"en":"Unplug MIC1 and plug the microphone into MIC2. Same test, and the same criterion: the music must drop to about 10% of its level while you speak. Mark N/A, here and in the three points below, if this reference has only one microphone input.",
                    "zh":"拔下 MIC1，将麦克风插入 MIC2。测试方法和判定标准相同：说话时音乐应降到原音量的约 10%。本型号只有一个麦克风接口时，本项及以下三项均标记为“不适用”。"}},
           {"id":"mic2_volume","code":"MIC-006","only_factory":["YIS"],"label":{"en":"MIC2 volume","zh":"麦克风 2 音量"},
            "help":{"en":"Speak continuously into MIC2 while turning its volume from minimum to maximum.",
                    "zh":"对麦克风 2 持续说话，同时把音量从最小调到最大。"}},
           {"id":"mic2_echo","code":"MIC-007","only_factory":["YIS"],"label":{"en":"MIC2 echo","zh":"麦克风 2 回声"},
            "help":{"en":"Say short words into MIC2 and turn the echo up. Same range: 0 to 280 ms.",
                    "zh":"对麦克风 2 说短词并加大回声。范围相同：0～280 毫秒。"}},
           {"id":"mic2_reverb","code":"MIC-008","only_factory":["YIS"],"label":{"en":"MIC2 reverb","zh":"麦克风 2 混响"},
            "help":{"en":"Speak into MIC2 and raise the reverb. Echo and reverb must act independently on this input too.",
                    "zh":"对麦克风 2 说话并加大混响。该接口上回声与混响也应各自独立起作用。"}},
           {"id":"guitar","code":"AUD-009","only_factory":["YIS"],"label":{"en":"Guitar volume","zh":"吉他音量"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。"}}]},
