                    "zh":"一个向上、一个向下，每次一个频道。不应跳号，也不应跳回第一个。",
                    "es":"Uno sube y el otro baja, de un canal a la vez. No debe saltarse números ni volver al primero."}},
           {"id":"ch_display","code":"WMIC-005","photo":true,
            "label":{"en":"The screen follows every change","zh":"屏幕随每次切换更新","es":"La pantalla sigue cada cambio"},
            "help":{"en":"The number must change with each press, with no lag and no leftover digit. Photograph the screen on one of the channels tested.",
                    "zh":"每按一次数字都应变化，不应延迟或残留笔段。拍摄其中一个已测频道的屏幕。",
                    "es":"El número debe cambiar con cada pulsación, sin retardo ni dígitos que queden pegados. Fotografíe la pantalla en uno de los canales probados."}},
           {"id":"ch_repair","code":"WMIC-006","label":{"en":"The receiver picks it up again after each change","zh":"每次换台后接收器都能重新接上","es":"El receptor lo vuelve a tomar tras cada cambio"},
            "help":{"en":"Speak after each change and confirm the sound comes through. A channel that appears on the screen but does not reach the receiver is a channel the customer cannot use.",
                    "zh":"每次换台后说话确认有声音。屏幕上能显示但接收器收不到的频道，客户实际上用不了。",
                    "es":"Hable después de cada cambio y confirme que el sonido llega. Un canal que aparece en pantalla pero no llega al receptor es un canal que el cliente no puede usar."}},
           {"id":"ch_all","code":"WMIC-005","label":{"en":"All the channels were checked","zh":"全部频道均已检查","es":"Se recorrieron todos los canales"},
            "help":{"en":"Go round the full cycle until it returns to the first one, without skipping any and without stopping part way.",
                    "zh":"走完一整轮直到回到第一个频道，不得跳过，中途不得停止。",
                    "es":"Dé la vuelta completa hasta volver al primero, sin saltarse ninguno y sin detenerse a mitad de camino."}}]},

        {"id":"AUDIO_VOLUME","optional":false,"only_factory":["LES"],"evidence":[],"per_mic":true,
         "label":{"en":"AUDIO AND VOLUME","zh":"音质与音量","es":"AUDIO Y VOLUMEN"},
         "steps":[
           {"en":"With the microphone paired, speak at a medium volume","zh":"在已对码状态下，用中等音量讲话","es":"Con el micrófono emparejado, hable a volumen medio"},
           {"en":"Move the volume through its whole range","zh":"将音量从最小调到最大","es":"Recorra el volumen en todo su rango"},
           {"en":"Change channel and confirm the audio stays the same","zh":"切换频道并确认音质不变","es":"Cambie de canal y confirme que el audio se mantiene"},
           {"en":"Walk to 15 metres and speak again","zh":"走到 15 米处再次讲话","es":"Camine hasta 15 metros y vuelva a hablar"}],
         "points":[
           {"section":{"en":"Audio and volume","zh":"音质与音量","es":"Audio y volumen"},
            "help":{"en":"The first of the three tests that need distance. From here to the end of the plan the operator is walking, which is why they are grouped: the corridor is measured and marked once.",
                    "zh":"这是三项需要距离的测试中的第一项。从这里到计划结束，操作员都在走动，因此把它们放在一起：走廊只量一次、只标一次。",
                    "es":"La primera de las tres pruebas que necesitan distancia. De aquí al final del plan el operario camina, y por eso van juntas: el corredor se mide y se marca una sola vez."}},
           {"id":"aud_clean","code":"AUD-005","label":{"en":"Clear voice at medium volume","zh":"中等音量下人声清晰","es":"Voz clara a volumen medio"},
            "help":{"en":"Speak normally, close to the microphone. The voice must come out clean, with no hiss behind it and no crackle.",
                    "zh":"靠近麦克风正常讲话。人声应干净，背景不应有嘶声或爆音。",
                    "es":"Hable normal, cerca del micrófono. La voz debe salir limpia, sin siseo de fondo ni chasquidos."}},
           {"id":"aud_volume","code":"WMIC-009","photo":true,
            "label":{"en":"Volume control works across its range","zh":"音量在全程可调","es":"El control de volumen funciona en todo el rango"},
            "help":{"en":"Take it from 1 to 16 while speaking continuously. The level must rise smoothly, with no dead steps and no jump. Photograph the screen showing the level.",
                    "zh":"一边持续讲话，一边从 1 调到 16。音量应平滑上升，不应有失效档位或突跳。拍摄显示音量值的屏幕。",
                    "es":"Llévelo de 1 a 16 mientras habla de forma continua. El nivel debe subir de forma suave, sin escalones muertos ni saltos. Fotografíe la pantalla mostrando el nivel."}},
           {"id":"aud_noise","code":"AUD-005","label":{"en":"No noise or hum","zh":"无噪声或嗡嗡声","es":"Sin ruido ni zumbido"},
            "help":{"en":"Stop speaking and listen with the microphone still on. The line must be silent: no hiss, no hum, no crackle.",
                    "zh":"停止讲话，但保持麦克风开启并倾听。线路应安静：无嘶声、无交流声、无杂音。",
                    "es":"Deje de hablar y escuche con el micrófono aún encendido. La línea debe quedar en silencio: sin siseo, sin zumbido, sin crujidos."}},
           {"id":"aud_channel_stable","code":"WMIC-007","label":{"en":"Audio holds when the channel changes","zh":"换台后音质保持一致","es":"El audio se mantiene al cambiar de canal"},
            "help":{"en":"Change channel and speak again. The sound must be the same on every channel: one channel quieter than the rest is a fault, not a setting.",
                    "zh":"切换频道后再讲话。各频道音质应一致：某个频道明显偏小是故障，而不是设置问题。",
                    "es":"Cambie de canal y hable de nuevo. El sonido debe ser el mismo en todos los canales: un canal más bajo que los demás es una falla, no un ajuste."}},
           {"id":"aud_15m","code":"WMIC-007","label":{"en":"Audio holds at 15 metres","zh":"15 米处音质保持","es":"El audio se mantiene a 15 metros"},
            "help":{"en":"Walk away to 15 metres, keeping the microphone pointing at the receiver, and speak. The voice must arrive with the same quality, with no dropouts and no crackle.",
                    "zh":"走到 15 米外，麦克风保持朝向接收器，并讲话。人声应保持同样的质量，不应断续或有爆音。",
                    "es":"Aléjese hasta 15 metros, manteniendo el micrófono apuntando al receptor, y hable. La voz debe llegar con la misma calidad, sin cortes ni crujidos."}}]},

        {"id":"WIRELESS_RANGE","optional":false,"only_factory":["LES"],"evidence":[],"per_mic":true,
         "label":{"en":"WIRELESS CONNECTION AND RANGE","zh":"无线连接与距离","es":"CONEXIÓN INALÁMBRICA Y ALCANCE"},
         "steps":[
           {"en":"Hold button 3 until CH XX flashes","zh":"长按按键 3 直至 CH XX 闪烁","es":"Mantenga el botón 3 hasta que parpadee CH XX"},
           {"en":"Press button 4 twice, then button 3 again until IR appears","zh":"按两次按键 4，再按按键 3 直至出现 IR","es":"Pulse dos veces el botón 4 y luego el botón 3 hasta que aparezca IR"},
           {"en":"Point the microphone at the receiver's IR LED, 8 to 15 cm away","zh":"将麦克风对准接收器的红外灯，距离 8 至 15 厘米","es":"Apunte el micrófono al LED infrarrojo del receptor, a 8 a 15 cm"},
           {"en":"Then walk away, testing the audio as far as the range allows","zh":"随后逐步走远，边走边测试音频直至极限距离","es":"Después aléjese probando el audio hasta donde llegue el alcance"}],
         "points":[
           {"section":{"en":"Pairing and range","zh":"对码与距离","es":"Emparejamiento y alcance"},
            "help":{"en":"Use the corridor already measured in the previous test, with the receiver left on the bench. Pair manually first, then walk.",
                    "zh":"沿用上一项已量好的走廊，接收器保持在工位上。先手动对码，再开始行走。",
                    "es":"Use el corredor que ya quedó medido en la prueba anterior, con el receptor en el puesto. Empareje a mano primero, y después camine."}},
           {"id":"ir_mode","code":"WMIC-006","label":{"en":"IR appears on the screen","zh":"屏幕显示 IR","es":"Aparece IR en la pantalla"},
            "help":{"en":"Hold button 3 until CH XX flashes, press button 4 twice and press button 3 again. The word IR must appear: if it does not, there is no way to pair by hand.",
                    "zh":"长按按键 3 至 CH XX 闪烁，按两次按键 4，再按一次按键 3。屏幕应出现 IR 字样；若不出现，则无法手动对码。",
                    "es":"Mantenga el botón 3 hasta que parpadee CH XX, pulse dos veces el botón 4 y vuelva a pulsar el botón 3. Debe aparecer la palabra IR: si no aparece, no hay forma de emparejar a mano."}},
           {"id":"ir_pair","code":"WMIC-006","label":{"en":"Pairs at 8 to 15 cm","zh":"在 8 至 15 厘米处完成对码","es":"Empareja entre 8 y 15 cm"},
            "help":{"en":"Hold the microphone pointing at the receiver's IR LED, at that distance. Closer or further away it will not read, and it looks like a fault when it is only the distance.",
                    "zh":"将麦克风对准接收器的红外灯，保持该距离。距离过近或过远都读不到，看起来像故障，其实只是距离问题。",
                    "es":"Sostenga el micrófono apuntando al LED infrarrojo del receptor, a esa distancia. Más cerca o más lejos no lee, y parece una falla cuando es solo la distancia."}},
           {"id":"ir_led","code":"WMIC-006","label":{"en":"The red LED goes out when it takes","zh":"对码成功后红灯熄灭","es":"El LED rojo se apaga al tomar"},
            "help":{"en":"Wait without moving the microphone. The red LED on the screen going out is the signal that the pairing took; taking the microphone away too early leaves it half done.",
                    "zh":"保持麦克风不动等待。屏幕上的红灯熄灭即表示对码成功；过早移开麦克风会导致对码只完成一半。",
                    "es":"Espere sin mover el micrófono. Que se apague el LED rojo de la pantalla es la señal de que el emparejamiento tomó; retirar el micrófono antes lo deja a medias."}},
           {"id":"ir_channel","code":"WMIC-005","photo":true,
            "label":{"en":"The paired channel stays on the screen","zh":"屏幕保留已对码的频道","es":"El canal emparejado queda en pantalla"},
            "help":{"en":"Read the channel and photograph the screen. That photo is what proves which channel this unit was left on.",
                    "zh":"读取频道并拍摄屏幕。这张照片就是本机最终停留在哪个频道的凭证。",
                    "es":"Lea el canal y fotografíe la pantalla. Esa foto es la que prueba en qué canal quedó esta unidad."}},
           {"id":"range","code":"WMIC-007","photo":true,
            "measure":{"unit":"m","step":"1"},
            "label":{"en":"Range at which the audio still holds","zh":"音频仍稳定的最远距离","es":"Alcance al que el audio se mantiene"},
            "help":{"en":"Walk away speaking continuously and in a straight line, without walls in between, until the sound starts breaking up. Write down the last distance where it was still clean, not the one where it failed. Photograph the point you reached, with the receiver in view if you can. The specification is up to 40 metres: anything well below that is a fail even if the microphone works perfectly on the bench.",
                    "zh":"一边持续讲话一边直线走远，中间不隔墙体，直到声音开始断续。记录声音仍然干净的最后一个距离，而不是出现异常的那个距离。拍摄所到达的位置，若可能请让接收器入镜。规格为最远 40 米：明显达不到即判定为异常，即使麦克风在工位上完全正常。",
                    "es":"Aléjese hablando de forma continua y en línea recta, sin paredes de por medio, hasta que el sonido empiece a cortarse. Anote la última distancia en la que se oía limpio, no aquella en la que falló. Fotografíe el punto al que llegó, con el receptor a la vista si puede. La especificación es hasta 40 metros: quedarse muy por debajo es un fallo aunque el micrófono funcione perfecto en el puesto."}}]},

        {"id":"DISTORTION","optional":false,"only_factory":["LES"],"evidence":[],"per_mic":true,
         "label":{"en":"DISTORTION","zh":"失真测试","es":"DISTORSIÓN"},
         "steps":[
           {"en":"Turn the microphone volume up to 10","zh":"将麦克风音量调到 10","es":"Suba el volumen del micrófono a 10"},
           {"en":"Speak from 1, 5, 10 and 15 metres","zh":"分别在 1、5、10 和 15 米处讲话","es":"Hable a 1, 5, 10 y 15 metros"},
           {"en":"Then go above 10 and listen again","zh":"随后调到 10 以上再听一次","es":"Luego pase de 10 y vuelva a escuchar"},
           {"en":"Repeat on every microphone the reference carries","zh":"该型号配备的每支麦克风都要重复","es":"Repita con cada micrófono que traiga la referencia"}],
         "points":[
           {"section":{"en":"Distortion","zh":"失真测试","es":"Distorsión"},
            "help":{"en":"Four distances on every microphone the reference carries. Use the marks already on the floor from the two tests before it.",
                    "zh":"该型号配备的每支麦克风都要走四个距离。沿用前两项已经在地面标好的位置。",
                    "es":"Cuatro distancias por cada micrófono que traiga la referencia. Use las marcas que ya quedaron en el piso en las dos pruebas anteriores."}},
           {"id":"dist_1m","code":"AUD-003","label":{"en":"No distortion at 1 metre","zh":"1 米处无失真","es":"Sin distorsión a 1 metro"},
            "help":{"en":"With the volume at 10, speak close. This is the harshest case: the loudest signal at the shortest distance is where clipping shows first.",
                    "zh":"音量置于 10，靠近讲话。这是最苛刻的情况：最大信号加最近距离，削波最先在这里出现。",
                    "es":"Con el volumen en 10, hable de cerca. Es el caso más exigente: la señal más fuerte a la distancia más corta es donde primero aparece el recorte."}},
           {"id":"dist_5m","code":"AUD-003","label":{"en":"No distortion at 5 metres","zh":"5 米处无失真","es":"Sin distorsión a 5 metros"},
            "help":{"en":"Same volume, five metres away. Listen to the consonants: distortion shows up on them before it shows on the vowels.",
                    "zh":"同样音量，距离 5 米。注意听辅音：失真会先出现在辅音上，然后才是元音。",
                    "es":"El mismo volumen, a cinco metros. Escuche las consonantes: la distorsión aparece en ellas antes que en las vocales."}},
           {"id":"dist_10m","code":"AUD-003","label":{"en":"No distortion at 10 metres","zh":"10 米处无失真","es":"Sin distorsión a 10 metros"},
            "help":{"en":"Same volume, ten metres away, in a straight line and without obstacles in between.",
                    "zh":"同样音量，距离 10 米，直线且中间无遮挡。",
                    "es":"El mismo volumen, a diez metros, en línea recta y sin obstáculos de por medio."}},
           {"id":"dist_15m","code":"AUD-003","photo":true,
            "label":{"en":"No distortion at 15 metres","zh":"15 米处无失真","es":"Sin distorsión a 15 metros"},
            "help":{"en":"The furthest of the four. Photograph the measured distance: without that photo the report says fifteen metres and nobody can tell whether it was ten.",
                    "zh":"四个距离中最远的一个。拍摄已测量的距离：没有这张照片，报告写着十五米，但谁也说不清是不是十米。",
                    "es":"La más lejana de las cuatro. Fotografíe la distancia medida: sin esa foto el informe dice quince metros y nadie puede saber si fueron diez."}},
           {"id":"dist_over10","code":"AUD-003","label":{"en":"No distortion above volume 10","zh":"音量超过 10 时无失真","es":"Sin distorsión por encima del volumen 10"},
            "help":{"en":"Go above 10 and listen again. A microphone that is clean up to 10 and breaks up at 12 is a microphone that will be used at 12 on stage.",
                    "zh":"将音量调到 10 以上再听一次。在 10 以内干净、到 12 就破音的麦克风，在台上恰恰会被开到 12。",
                    "es":"Pase de 10 y vuelva a escuchar. Un micrófono limpio hasta 10 que se rompe en 12 es un micrófono que en tarima se va a usar en 12."}}]},

        {"id":"AUTO_OFF","optional":true,"only_factory":["LES"],"evidence":[],
         "label":{"en":"IDLE SHUTDOWN","zh":"自动关机","es":"APAGADO AUTOMÁTICO"},
         "steps":[
           {"en":"Switch on every microphone and the receiver","zh":"打开每支麦克风和接收器","es":"Encienda cada micrófono y el receptor"},
           {"en":"Speak into each one to confirm they are working","zh":"分别对每支说话，确认工作正常","es":"Hable por cada uno para confirmar que funcionan"},
           {"en":"Leave them switched on and untouched for 20 minutes","zh":"保持开启并静置 20 分钟不做任何操作","es":"Déjelos encendidos y sin tocar durante 20 minutos"},
           {"en":"Check that they switched off and switch them back on","zh":"确认已自动关机后再重新开机","es":"Compruebe que se apagaron y vuelva a encenderlos"}],
         "points":[
           {"section":{"en":"Idle shutdown","zh":"自动关机","es":"Apagado automático"},
            "help":{"en":"Twenty minutes of waiting, which is why it is last: nothing else in the plan is left to do while the clock runs, so the wait costs only the wait. Leave the microphones on the bench and do not touch them, do not knock the table and do not speak nearby. Any sound resets the timer and the twenty minutes start again.",
                    "zh":"需要等待二十分钟，因此放在最后：计时期间计划里已无其他事项，等待的代价就只是等待本身。将麦克风放在工位上不要触碰，不要碰撞桌面，也不要在旁边说话。任何声音都会重置计时，二十分钟要从头开始。",
                    "es":"Veinte minutos de espera, y por eso va de última: no queda nada más del plan por hacer mientras corre el reloj, así que la espera cuesta solo la espera. Deje los micrófonos en el puesto sin tocarlos, sin golpear la mesa y sin hablar cerca. Cualquier sonido reinicia el conteo y los veinte minutos empiezan de nuevo."}},
           {"id":"both_work","code":"WMIC-001","label":{"en":"Every microphone works before the wait","zh":"等待前每支均正常","es":"Cada micrófono funciona antes de la espera"},
            "help":{"en":"Speak into each one for a few seconds and confirm the sound comes through before starting the timer.",
                    "zh":"开始计时前，分别对每支说几秒并确认有声音。",
                    "es":"Hable unos segundos por cada uno y confirme que el sonido llega antes de iniciar el conteo."}},
           {"id":"off_20","code":"WMIC-011","photo":true,
            "label":{"en":"They switch off on their own after 20 minutes","zh":"20 分钟后自动关机","es":"Se apagan solos a los 20 minutos"},
            "help":{"en":"After the twenty minutes, every screen must be off. Photograph or film them off. A microphone that stays on drains the battery in the customer's bag and arrives at the show dead.",
                    "zh":"二十分钟后，每块屏幕都应熄灭。拍摄或录下已关机的状态。不会自动关机的麦克风会在客户包里耗尽电量，到了演出现场就是没电的。",
                    "es":"Pasados los veinte minutos, cada pantalla debe estar apagada. Fotografíelos o fílmelos apagados. Un micrófono que se queda encendido consume la batería en el bolso del cliente y llega sin carga al evento."}},
           {"id":"back_on","code":"WMIC-001","label":{"en":"They come back on and work","zh":"可重新开机并正常工作","es":"Vuelven a encender y funcionan"},
            "help":{"en":"Switch each one on again and speak. They must come up as normal and be heard: switching off is only correct if waking up works too.",
                    "zh":"逐支重新开机并说话。应正常启动并有声音：只有能正常唤醒，自动关机才算正确。",
                    "es":"Vuelva a encender cada uno y hable. Deben arrancar con normalidad y oírse: apagarse solo está bien si también sabe volver."}}]},

        /* Genuinely last now. It is the only test that opens the product, and
           everything that can be judged with it closed has been judged by the
           time it runs — which is the whole point of putting it here.

           It used to sit eighth of fifteen, carrying this same justification
           while audio, channels, range, distortion and the twenty-minute idle
           shutdown all ran after it. Every one of those was measured on a set
           that had just been taken apart and screwed back together: a pinched
           antenna lead or a battery connector left half seated does not look
           like a defect in the unit, it looks like a defect in the design, and
           it would have been reported as one.

           Not per_mic — it covers the whole set, batteries and boards, in one
           pass with the screwdriver already in hand. */
        {"id":"MIC_BATTERY","optional":false,"only_factory":["LES"],"evidence":[],
         "label":{"en":"INTERNAL PARTS","zh":"内部部件","es":"PARTES INTERNAS"},
         "steps":[
           {"en":"Open the microphones and the receiver","zh":"拆开麦克风和接收器","es":"Abra los micrófonos y el receptor"},
           {"en":"Photograph each battery and each board","zh":"拍摄每块电池和每块电路板","es":"Fotografíe cada batería y cada placa"},
           {"en":"The boards go on both faces: components and solder","zh":"电路板需拍两面：元件面和焊接面","es":"Las placas por las dos caras: componentes y soldadura"},
           {"en":"Put everything back exactly as it was","zh":"完全按原样装回","es":"Vuelva a montar todo exactamente como estaba"}],
         "points":[
           {"section":{"en":"Internal parts","zh":"内部部件","es":"Partes internas"},
            "help":{"en":"Photographs, not verdicts. What is inside cannot be judged from the bench in the time available, but it can be recorded: the day a batch fails in the field, these are the pictures that say whether the cell or the board changed halfway through the order.",
                    "zh":"这里要的是照片，不是判定。内部状况无法在工位上以现有时间做出判断，但可以留存记录：将来某批货在市场上出问题时，正是这些照片能说明电芯或电路板是否在订单中途被换过。",
                    "es":"Fotografías, no veredictos. Lo que hay dentro no se puede juzgar en el puesto con el tiempo disponible, pero sí se puede registrar: el día que un lote falle en el mercado, estas son las fotos que dicen si la celda o la placa cambiaron a mitad de la orden."}},
           {"id":"bat_mic1","code":"WMIC-013","photo":true,
            "label":{"en":"Microphone 1 — battery","zh":"麦克风 1 — 电池","es":"Micrófono 1 — batería"},
            "help":{"en":"Photograph the cell out of its compartment, on the face that carries the specification: voltage, capacity in mAh and manufacturer. Look for swelling, a torn wrap or marks of heat while it is out.",
                    "zh":"将电芯取出电池仓后拍摄带规格的一面：电压、容量（mAh）和生产厂家。取出时注意是否鼓包、外皮破损或过热痕迹。",
                    "es":"Fotografíe la celda fuera de su compartimento, por la cara que trae la especificación: voltaje, capacidad en mAh y fabricante. Con ella afuera, busque abombamiento, envoltura rota o marcas de calor."}},
           {"id":"bat_mic2","code":"WMIC-013","photo":true,"skip":["HK-RHO101"],
            "label":{"en":"Microphone 2 — battery","zh":"麦克风 2 — 电池","es":"Micrófono 2 — batería"},
            "help":{"en":"The same photograph on the second microphone. Two cells from different makers inside one box is the thing this pair of photographs exists to catch.",
                    "zh":"对第二支麦克风拍同样的照片。同一箱内装入两个不同厂家的电芯，正是这两张照片要发现的问题。",
                    "es":"La misma foto en el segundo micrófono. Dos celdas de fabricantes distintos dentro de una misma caja es justo lo que este par de fotos existe para detectar."}},
           {"id":"bat_rcv","code":"WMIC-013","photo":true,
            "label":{"en":"Receiver — battery","zh":"接收器 — 电池","es":"Receptor — batería"},
            "help":{"en":"The receiver's cell, out of its compartment and with its printing readable.",
                    "zh":"接收器的电芯，取出电池仓后拍摄，印字需清晰可读。",
                    "es":"La celda del receptor, fuera de su compartimento y con su impresión legible."}},
           {"id":"pcb_mic_front","code":"WMIC-019","photo":true,
            "label":{"en":"Microphone board — component side","zh":"麦克风电路板 — 元件面","es":"Placa del micrófono — cara de componentes"},
            "help":{"en":"The side carrying the chips. The board reference and the main IC markings must be readable in the photograph.",
                    "zh":"拍摄有芯片的一面。板号和主要芯片丝印必须在照片中清晰可读。",
                    "es":"La cara que lleva los chips. El número de placa y las marcas del circuito principal deben quedar legibles en la foto."}},
           {"id":"pcb_mic_back","code":"WMIC-019","photo":true,
            "label":{"en":"Microphone board — solder side","zh":"麦克风电路板 — 焊接面","es":"Placa del micrófono — cara de soldadura"},
            "help":{"en":"The solder side, in its own frame. Look for reworked joints, bridges and flux residue.",
                    "zh":"拍摄焊接面，单独成图。检查是否有补焊、连锡和助焊剂残留。",
                    "es":"La cara de soldadura, en su propia foto. Busque soldaduras retocadas, puentes y residuos de fundente."}},
           {"id":"pcb_rcv_front","code":"WMIC-019","photo":true,
            "label":{"en":"Receiver board — component side","zh":"接收器电路板 — 元件面","es":"Placa del receptor — cara de componentes"},
            "help":{"en":"The side carrying the chips, with the board reference readable.",
                    "zh":"拍摄有芯片的一面，板号需清晰可读。",
                    "es":"La cara de los chips, con el número de placa legible."}},
           {"id":"pcb_rcv_back","code":"WMIC-019","photo":true,
            "label":{"en":"Receiver board — solder side","zh":"接收器电路板 — 焊接面","es":"Placa del receptor — cara de soldadura"},
            "help":{"en":"The solder side of the receiver board.",
                    "zh":"接收器电路板的焊接面。",
                    "es":"La cara de soldadura de la placa del receptor."}}]},

        /* ===== HK-PHI — microphone and receiver module ======================
           A LESHENG product, and nothing like the RHO: one microphone, one
           receiver module, and no screen at all. Everything it has to say it
           says with a single LED — green, red, blinking or steady — so most of
           these points are about reading that light correctly, and the help text
           spells out what each pattern means. An inspector who does not know the
           code cannot tell a fault from normal behaviour.

           Tagged "plan":"PHI", so these tests reach HK-PHI and nothing else, and
           HK-PHI reaches nothing but these. Ordered by how long each takes: the
           link is set up first because nothing can be judged by ear until the
           receiver is on a speaker, and the range walk is left for the end. */

        {"id":"PHI_VISUAL","plan":"PHI","optional":false,"evidence":[],
         "label":{"en":"VISUAL INSPECTION","zh":"外观检查","es":"INSPECCIÓN VISUAL"},
         "steps":[
           {"en":"Photograph the receiver, front and back","zh":"拍摄接收器的正面与背面","es":"Fotografíe el receptor, frente y atrás"},
           {"en":"Photograph the microphone, front and back","zh":"拍摄麦克风的正面与背面","es":"Fotografíe el micrófono, frente y atrás"},
           {"en":"Under a lamp, not against a window","zh":"在灯光下拍摄，不要逆光","es":"Con luz de lámpara, no a contraluz"}],
         "points":[
           {"section":{"en":"Visual inspection","zh":"外观检查","es":"Inspección visual"},
            "help":{"en":"Four photographs and no verdicts. Nothing is switched on here. Brand, model, label and any mark must all be visible across the four frames.",
                    "zh":"四张照片，不作判定。本项无需开机。品牌、型号、标签和任何痕迹均须在这四张画面中可见。",
                    "es":"Cuatro fotos y ningún veredicto. Aquí no se enciende nada. Marca, modelo, etiqueta y cualquier marca deben verse entre los cuatro encuadres."}},
           {"id":"phi_rcv_front","code":"WMIC-014","photo":true,
            "label":{"en":"Receiver — front","zh":"接收器 — 正面","es":"Receptor — frente"},
            "help":{"en":"The face with the logo and the LED, straight on and under a lamp. The printing has to be readable in the photograph.",
                    "zh":"拍摄带标志和指示灯的一面，正对拍摄并使用灯光。照片中的印字必须清晰可读。",
                    "es":"La cara del logo y el LED, de frente y con luz de lámpara. La impresión tiene que quedar legible en la foto."}},
           {"id":"phi_rcv_back","code":"WMIC-014","photo":true,
            "label":{"en":"Receiver — back","zh":"接收器 — 背面","es":"Receptor — atrás"},
            "help":{"en":"The opposite face, in its own frame, with the connector and the label.",
                    "zh":"拍摄另一面，单独成图，需拍到接口和标签。",
                    "es":"La cara opuesta, en su propia foto, con el conector y la etiqueta."}},
           {"id":"phi_mic_front","code":"WMIC-014","photo":true,
            "label":{"en":"Microphone — front","zh":"麦克风 — 正面","es":"Micrófono — frente"},
            "help":{"en":"The face with the grille, the button and the LED. Tilt it slightly rather than shooting it flat: a scratch is invisible head-on and obvious at an angle.",
                    "zh":"拍摄带网罩、按键和指示灯的一面。略微倾斜拍摄，不要完全平拍：划痕正对看不见，斜着一看就很明显。",
                    "es":"La cara de la rejilla, el botón y el LED. Inclínelo un poco en vez de fotografiarlo plano: un rayón es invisible de frente y evidente en ángulo."}},
           {"id":"phi_mic_back","code":"WMIC-014","photo":true,
            "label":{"en":"Microphone — back","zh":"麦克风 — 背面","es":"Micrófono — atrás"},
            "help":{"en":"The back, with the charging connector and the label.",
                    "zh":"拍摄背面，需拍到充电接口和标签。",
                    "es":"El respaldo, con el conector de carga y la etiqueta."}},
           {"id":"phi_label","code":"WMIC-020","photo":true,
            "label":{"en":"Label on the underside","zh":"底部标签","es":"Etiqueta en la parte inferior"},
            "help":{"en":"Turn the unit over and photograph the label underneath, close enough to read it. The model and the batch must be legible.",
                    "zh":"将产品翻过来，拍摄底部标签，距离足够近以便辨认内容。型号和批号须清晰可读。",
                    "es":"Voltee la unidad y fotografíe la etiqueta de abajo, lo bastante cerca para leerla. El modelo y el lote deben quedar legibles."}},
           {"id":"phi_cable","code":"WMIC-016","photo":true,
            "label":{"en":"Connectors","zh":"接头","es":"Conectores"},
            "help":{"en":"Uncoil the cable and photograph both connectors, close enough to tell the size and the type.",
                    "zh":"将线材展开，拍摄两个接头，距离足够近以便辨认规格和类型。",
                    "es":"Desenrolle el cable y fotografíe los dos conectores, lo bastante cerca para distinguir la medida y el tipo."}},
           {"id":"phi_cable_len","code":"WMIC-016","photo":true,
            "measure":{"unit":"cm","step":"1"},
            "label":{"en":"Cable — length","zh":"线材 — 长度","es":"Cable — medición"},
            "help":{"en":"Stretch the cable out and measure it end to end, connectors included. Photograph the tape with both ends in the frame and write the value in the box.",
                    "zh":"将线材拉直，连同接头从一端量到另一端。拍摄卷尺照片，两端都要入镜，并将数值填入方框。",
                    "es":"Estire el cable y mídalo de punta a punta, conectores incluidos. Fotografíe la cinta con los dos extremos en el cuadro y escriba el valor en el recuadro."}}]},

        {"id":"PHI_LINK","plan":"PHI","optional":false,"evidence":["photo","video"],
         "label":{"en":"CONNECTION TO THE RECEIVER","zh":"与接收器连接","es":"CONEXIÓN AL RECEPTOR"},
         "steps":[
           {"en":"Connect the receiver module to a cabinet, speaker or audio device","zh":"将接收模块接到音箱、喇叭或其他音频设备","es":"Conecte el módulo receptor a una cabina, parlante u otro dispositivo de audio"},
           {"en":"Switch the microphone on","zh":"打开麦克风","es":"Encienda el micrófono"},
           {"en":"Watch the green LED stop blinking","zh":"观察绿灯由闪烁转为常亮","es":"Observe que el LED verde deja de parpadear"}],
         "points":[
           {"section":{"en":"Connection","zh":"连接","es":"Conexión"},
            "help":{"en":"The setup every later test runs on, so it is built once and left standing. The LED is the only thing this product has to report with: blinking green means looking for the receiver, steady green means it found it.",
                    "zh":"后面所有测试都在这套布置上进行，因此一次搭好后保持不动。本产品唯一的状态输出就是这颗灯：绿灯闪烁表示正在寻找接收器，绿灯常亮表示已经连上。",
                    "es":"El montaje sobre el que corren todas las pruebas siguientes, así que se arma una vez y se deja puesto. El LED es lo único con lo que este producto puede informar: verde parpadeando es que busca el receptor, verde fijo es que lo encontró."}},
           {"id":"phi_rcv_hooked","code":"WMIC-017",
            "label":{"en":"Receiver connected to the audio device","zh":"接收器已接入音频设备","es":"Receptor conectado al dispositivo de audio"},
            "help":{"en":"Plug the receiver module into a cabinet, a speaker or any audio device, and leave the volume at medium. Medium on purpose: at the top a fault is drowned in level, and at the bottom it cannot be heard at all.",
                    "zh":"将接收模块接入音箱、喇叭或任意音频设备，音量置于中等。特意用中等音量：开到最大，问题会被音量掩盖；开得太小，则根本听不出来。",
                    "es":"Conecte el módulo receptor a una cabina, un parlante o cualquier dispositivo de audio, y deje el volumen en medio. Medio a propósito: al tope una falla queda tapada por el nivel, y al mínimo no se alcanza a oír."}},
           {"id":"phi_link_ok","code":"WMIC-006",
            "label":{"en":"The green LED stops blinking","zh":"绿灯停止闪烁","es":"El LED verde deja de parpadear"},
            "help":{"en":"Switch the microphone on and watch its LED. It blinks green while it searches and must go steady within a few seconds. A light that keeps blinking never found the receiver, and no audio test after this one means anything until it does.",
                    "zh":"开启麦克风并观察指示灯。搜索时绿灯闪烁，应在几秒内转为常亮。持续闪烁说明始终没有连上接收器，在连上之前，后面所有音频测试都没有意义。",
                    "es":"Encienda el micrófono y mire su LED. Parpadea en verde mientras busca y debe quedarse fijo en pocos segundos. Una luz que sigue parpadeando nunca encontró el receptor, y ninguna prueba de audio posterior significa nada hasta que lo haga."}},
           {"id":"phi_audio","code":"WMIC-008",
            "label":{"en":"Audio comes out of the device","zh":"设备正常出声","es":"Sale audio por el dispositivo"},
            "help":{"en":"Speak into the microphone. The voice must come out of the cabinet, clean and without hiss behind it. A steady LED with no sound is a link that connected and an audio path that did not.",
                    "zh":"对麦克风说话。声音应从音箱传出，干净且背景无嘶声。灯亮但没有声音，说明链路连上了而音频通路没有。",
                    "es":"Hable por el micrófono. La voz debe salir por la cabina, limpia y sin siseo de fondo. Un LED fijo sin sonido es un enlace que conectó y una ruta de audio que no."}}]},

        {"id":"PHI_BUTTONS","plan":"PHI","optional":false,"evidence":["video"],
         "//":"video only: the LED blink patterns cannot be counted from a still",
         "label":{"en":"MICROPHONE BUTTONS","zh":"麦克风按键","es":"BOTONES DEL MICRÓFONO"},
         "steps":[
           {"en":"With the microphone on, hold the button to switch it off","zh":"开机状态下长按按键关机","es":"Con el micrófono encendido, pulsación sostenida para apagarlo"},
           {"en":"Hold it again until the LED shows green","zh":"再次长按，直至指示灯变绿","es":"Vuelva a sostenerla hasta que el LED muestre verde"},
           {"en":"Press volume up five times, in short presses","zh":"短按加音量键五次","es":"Pulse subir volumen cinco veces, pulsaciones cortas"},
           {"en":"Press volume down five times, in short presses","zh":"短按减音量键五次","es":"Pulse bajar volumen cinco veces, pulsaciones cortas"},
           {"en":"Film the whole sequence in one clip","zh":"用一段视频录下整个过程","es":"Filme toda la secuencia en un solo video"}],
         "points":[
           {"section":{"en":"Buttons","zh":"按键","es":"Botones"},
            "help":{"en":"Read every answer here off the LED: one red blink per step, two together at each end of the range. Film it, with the LED in frame.",
                    "zh":"本组每一项都看指示灯判断：每调一级红闪一次，到达上下限时红闪两次。请录像，指示灯须在画面之内。",
                    "es":"Todo lo de aquí se lee en el LED: un parpadeo rojo por paso, dos juntos en cada extremo del rango. Fílmelo, con el LED dentro del encuadre."}},
           {"id":"phi_btn_off","code":"WMIC-010",
            "label":{"en":"Power button — held press switches it off","zh":"电源键 — 长按可关机","es":"Botón de power — pulsación sostenida lo apaga"},
            "help":{"en":"The button marked with the power symbol. With the microphone on, hold it down. It must switch off on the first try, and the LED must go out rather than stay lit.",
                    "zh":"带电源符号的按键。开机状态下按住它。应一次关机成功，指示灯应熄灭而不是残亮。",
                    "es":"El botón que tiene el símbolo de power. Con el micrófono encendido, manténgalo pulsado. Debe apagarse al primer intento, y el LED debe apagarse en vez de quedarse prendido."}},
           {"id":"phi_btn_on","code":"WMIC-001",
            "label":{"en":"Power button — held press switches it on, LED green","zh":"电源键 — 长按可开机，指示灯为绿","es":"Botón de power — pulsación sostenida lo enciende, LED verde"},
            "help":{"en":"The same button with the power symbol. Hold it again until the LED shows green. Green is the confirmation that it started: a microphone that comes up with any other colour, or with none, has not started properly however it sounds afterwards.",
                    "zh":"仍是带电源符号的那个键。再次按住，直至指示灯显示绿色。绿色就是启动成功的确认：开机后显示其他颜色或不亮的麦克风，无论随后声音如何，都不算正常启动。",
                    "es":"El mismo botón del símbolo de power. Vuelva a sostenerlo hasta que el LED muestre verde. El verde es la confirmación de que arrancó: un micrófono que enciende con otro color, o sin ninguno, no arrancó bien por más que después suene."}},
           {"id":"phi_vol_up","code":"WMIC-009",
            "label":{"en":"Button + — five presses to maximum","zh":"加号键 — 五次按至最大","es":"Botón + — cinco pulsaciones al máximo"},
            "help":{"en":"The button marked with the plus symbol. Press it five times, in short presses, and listen. The sound must grow with each press. On reaching the top the green LED must blink red twice.",
                    "zh":"带加号的按键。短按五次并注意听。每按一次声音都应变大。到达最大时，绿灯应红闪两次。",
                    "es":"El botón que tiene el símbolo más. Púlselo cinco veces, con pulsaciones cortas, y escuche. El sonido debe aumentar con cada pulsación. Al llegar al tope el LED verde debe parpadear en rojo dos veces."}},
           {"id":"phi_vol_down","code":"WMIC-009",
            "label":{"en":"Button − — five presses to minimum","zh":"减号键 — 五次按至最小","es":"Botón − — cinco pulsaciones al mínimo"},
            "help":{"en":"The button marked with the minus symbol. Press it five times, in short presses. The LED must blink red once on each press, and the sound must drop each time. At the minimum it must blink red twice, the same double blink that marks the other end of the range.",
                    "zh":"带减号的按键。短按五次。每按一次指示灯应红闪一次，声音也应随之减小。到达最小时应红闪两次——与另一端相同的双闪。",
                    "es":"El botón que tiene el símbolo menos. Púlselo cinco veces, con pulsaciones cortas. El LED debe parpadear en rojo una vez en cada pulsación, y el sonido debe bajar cada vez. Al llegar al mínimo debe parpadear en rojo dos veces, el mismo doble parpadeo que marca el otro extremo del rango."}}]},

        {"id":"PHI_MIC_OFF","plan":"PHI","optional":false,"evidence":["video"],
         "label":{"en":"MICROPHONE SWITCHED OFF","zh":"麦克风关机状态","es":"MICRÓFONO APAGADO"},
         "steps":[
           {"en":"Switch the microphone off","zh":"关闭麦克风","es":"Apague el micrófono"},
           {"en":"Watch the receiver module","zh":"观察接收模块","es":"Observe el módulo receptor"}],
         "points":[
           {"section":{"en":"Microphone switched off","zh":"麦克风关机","es":"Micrófono apagado"},
            "help":{"en":"Two minutes, and it is the other half of the connection test: the module has to say when it has lost the microphone, not only when it has found it.",
                    "zh":"只需两分钟，这是连接测试的另一半：模块不仅要能表示已连上，也要能表示已经失去麦克风。",
                    "es":"Dos minutos, y es la otra mitad de la prueba de conexión: el módulo tiene que decir cuándo perdió el micrófono, no solo cuándo lo encontró."}},
           {"id":"phi_module_red","code":"LED-003",
            "label":{"en":"The module starts blinking red","zh":"模块开始红灯闪烁","es":"El módulo empieza a parpadear en rojo"},
            "help":{"en":"Switch the microphone off and look at the receiver module. It must start blinking red within a few seconds. A module that does not go red with no microphone on tells the customer the system is working when it is not.",
                    "zh":"关闭麦克风并观察接收模块。应在几秒内开始红灯闪烁。麦克风已关闭而模块没有转为红灯，会让客户以为系统正常，而实际上并非如此。",
                    "es":"Apague el micrófono y mire el módulo receptor. Debe empezar a parpadear en rojo en pocos segundos. Un módulo que no se pone en rojo sin micrófono encendido le está diciendo al cliente que el sistema funciona cuando no es así."}}]},

        {"id":"PHI_CHARGE","plan":"PHI","optional":false,"evidence":[],
         "label":{"en":"MICROPHONE CHARGING","zh":"麦克风充电","es":"CARGA DEL MICRÓFONO"},
         "steps":[
           {"en":"Connect the microphone to the charger","zh":"将麦克风接上充电器","es":"Conecte el micrófono al cargador"},
           {"en":"Photograph the LED once it lights: it must be red","zh":"待指示灯亮起后拍照：应为红色","es":"Fotografíe el LED cuando encienda: debe ser rojo"}],
         "points":[
           {/* The step and the section help used to run on past the end of the
                test: both told the operator to unplug the charger and confirm the
                LED turned green, and the help called that comparison "the whole
                test" — when the point that recorded it had already been removed
                at HOKLAN's request. There was no box on screen to answer it in.
                An instruction with nowhere to land teaches the inspector to read
                past the instructions. */
            "section":{"en":"Charging","zh":"充电","es":"Carga"},
            "help":{"en":"The indicator must come on red while the microphone is charging. A charging light that never lights, or that shows the same colour charging and charged, leaves the customer unable to tell whether the microphone is ready before an event.",
                    "zh":"充电过程中指示灯应亮红色。若指示灯始终不亮，或充电中与充满后颜色相同，客户在演出前就无法判断麦克风是否可用。",
                    "es":"El indicador debe encender en rojo mientras el micrófono carga. Una luz de carga que nunca enciende, o que muestra el mismo color cargando y cargado, deja al cliente sin saber si el micrófono está listo antes de un evento."}},
           {"id":"phi_chg_red","code":"LED-002","photo":true,
            "label":{"en":"LED red while charging","zh":"充电时指示灯为红色","es":"LED en rojo durante la carga"},
            "help":{"en":"Connect the charger and photograph the lit LED. It must be red, and it must come on within a few seconds of plugging in.",
                    "zh":"接上充电器并拍摄亮起的指示灯。应为红色，且应在接上后几秒内亮起。",
                    "es":"Conecte el cargador y fotografíe el LED encendido. Debe ser rojo, y debe encender pocos segundos después de conectar."}},
           /* The point about the LED turning green on unplugging was removed at
              HOKLAN's request. The charging colour above still covers whether the
              indicator works at all. */]},

        {"id":"PHI_RECONNECT","plan":"PHI","optional":false,"evidence":["video"],
         "label":{"en":"AUTOMATIC RECONNECTION","zh":"自动重连","es":"RECONEXIÓN AUTOMÁTICA"},
         "steps":[
           {"en":"Leave the receiver connected to the cabinet","zh":"接收器保持接在音箱上","es":"Deje el receptor conectado a la cabina"},
           {"en":"Switch the microphone off and on again, three times","zh":"将麦克风关机再开机，重复三次","es":"Apague y encienda el micrófono, tres veces"},
           {"en":"Each time, confirm it reconnects on its own","zh":"每一次都要确认能自动重连","es":"Cada vez, confirme que se reconecta solo"}],
         "points":[
           {"section":{"en":"Automatic reconnection","zh":"自动重连","es":"Reconexión automática"},
            "help":{"en":"Run it three times, not once. It must reconnect on all three; two out of three is a fail.",
                    "zh":"要做三次，不是一次。三次都必须重连成功；三次中只成功两次即判定为异常。",
                    "es":"Hágalo tres veces, no una. Debe reconectar las tres; dos de tres es un fallo."}},
           {"id":"phi_reconnect","code":"WMIC-006",
            "label":{"en":"Reconnects on its own, three times out of three","zh":"三次均能自动重连","es":"Se reconecta solo, tres de tres"},
            "help":{"en":"With the receiver still on the cabinet, switch the microphone off and on three times. Each time the green LED must stop blinking and the voice must come back through the speaker, without touching the module and without pressing anything else. Any one of the three that needs help is a fail.",
                    "zh":"接收器保持接在音箱上，将麦克风关机再开机，共三次。每一次绿灯都应停止闪烁、声音都应从音箱恢复，期间不得触碰模块，也不得按任何其他按键。三次中只要有一次需要人工干预，即判定为异常。",
                    "es":"Con el receptor todavía en la cabina, apague y encienda el micrófono tres veces. Cada vez el LED verde debe dejar de parpadear y la voz debe volver por el parlante, sin tocar el módulo y sin pulsar nada más. Cualquiera de las tres que necesite ayuda es un fallo."}}]},

        {"id":"PHI_POWER_CUT","plan":"PHI","optional":false,"evidence":["video"],
         "label":{"en":"RECEIVER POWER CUT","zh":"接收器断电","es":"CORTE DE ALIMENTACIÓN DEL RECEPTOR"},
         "steps":[
           {"en":"Leave the microphone switched on","zh":"麦克风保持开机","es":"Deje el micrófono encendido"},
           {"en":"Unplug the module from its power supply","zh":"将模块从电源上拔下","es":"Desconecte el módulo de la alimentación"},
           {"en":"Wait about ten seconds","zh":"等待约十秒","es":"Espere unos diez segundos"},
           {"en":"Plug it back in and watch it reconnect","zh":"重新接上电源并观察重连","es":"Vuelva a conectarlo y observe la reconexión"}],
         "points":[

/* ---------- one test, two microphones -------------------------------------
   A LESHENG kit ships two microphones, and almost everything that can be wrong
   with one can be right with the other: a button that sticks, a screen that
   starts muted, a cell that will not charge. Asking those questions once, of
   "the microphones", is how a defect on the second one gets recorded as a pass.

   So the affected tests are marked `"per_mic": true` and written once. This
   expands each of them into the same list twice, once per microphone, with the
   group heading carrying the number and the point ids suffixed `_m1` and `_m2`
   so the two sets of answers, photographs and readings never collide.

   Written as an expansion rather than as duplicated JSON on purpose: doing it by
   hand would be some two thousand lines in three languages, and every later
   correction would have to be made twice — which is exactly the kind of edit
   where one of the two gets forgotten and nobody notices for months.

   A point marked `"once": true` inside such a test is not duplicated: the
   receiver has one button, not one per microphone. The second microphone's
   copies carry `skip` for the single-microphone references, so HK-RHO101 shows
   one list and the pair shows two, decided by `fits` at render time.
------------------------------------------------------------------------- */
const ONE_MIC_REFS = ["HK-RHO101"];
const MIC_TAG = {
  1:{en:"Microphone 1", zh:"麦克风 1", es:"Micrófono 1"},
  2:{en:"Microphone 2", zh:"麦克风 2", es:"Micrófono 2"}
};

function expandPerMic(){
  const list = CONFIG.plans["default"].tests;
  list.forEach(t => {
    if(!t.per_mic || !Array.isArray(t.points)) return;
    const base = t.points;
    const out = [];
    [1, 2].forEach(n => {
      base.forEach(p => {
        if(p.once) return;
        const c = JSON.parse(JSON.stringify(p));
        if(c.section){
          // The heading the author wrote, plus which microphone it is about.
          c.section = Object.keys(MIC_TAG[n]).reduce((acc, lg) => {
            const head = (p.section && p.section[lg]) || (p.section && p.section.en) || "";
            acc[lg] = head ? head + " · " + MIC_TAG[n][lg] : MIC_TAG[n][lg];
            return acc;
          }, {});
        }
        if(c.id) c.id = c.id + "_m" + n;
        if(n === 2) c.skip = (c.skip || []).concat(ONE_MIC_REFS);
        out.push(c);
      });
    });
    // Whatever belongs to the set rather than to a microphone goes last, once.
    base.forEach(p => { if(p.once) out.push(JSON.parse(JSON.stringify(p))); });
    t.points = out;
    delete t.per_mic;
  });
}
expandPerMic();

/* ---------- reference photos ----------------------------------------------
   One file per reference, next to the app: img/HK-ARC101.jpg. Loaded on demand,
   never embedded — fifty-three photos inside this file would multiply its weight
   by ten so that every phone downloads all of them to look at one.

   The photo confirms the right model was selected, and identifies the product
   at the head of the report. It is never evidence — nothing about the unit on
   the bench is proved by a catalogue picture — and its absence never blocks an
   inspection. Photos will not all arrive on the same day, and a missing one has
   to be a quiet blank rather than a broken page.
------------------------------------------------------------------------- */
const REF_IMG_DIR = "img/";
/* The extensions a photograph can arrive as, tried in the order they actually
   turn up. .jpeg was missing and it cost a round of uploads: a phone that
   writes .jpeg is not doing anything wrong, and nobody should have to rename
   six files to satisfy a list in here. One list, used by the reference photos,
   the example photos and the panel alike, so the screen and the report never
   disagree about which file exists. */
const IMG_EXTS = [".jpg", ".jpeg", ".png"];
/* JPG first, PNG second. It used to be the other way round, on the theory that
   the catalogue exports PNG — and it does, at three megabytes and sometimes at
   fifteen. What actually gets published is the resized JPG, sixty kilobytes of
   it. The order matters because the second format is only tried after the first
   has failed, so getting it wrong costs one wasted request per reference. It
   costs far more than that when both files exist: the app would download the
   fifteen-megabyte PNG and never reach the JPG sitting beside it. */
const refImgUrl = (model, ext) =>
  REF_IMG_DIR + encodeURIComponent(String(model || "")) + "." + (ext || "jpg");

/* The same photo again, this time as a data URL, because the report has to
   carry it. A report is read from inside the ZIP, on a PC that may never reach
   this server: a linked photo would print as a broken frame in the PDF. Fetched
   once per reference, when the report is asked for and not before — the
   inspection itself does not need it, and it is a payment the phone should only
   make if a document is actually going to be issued.

   Held outside `S` on purpose. Saved in the draft it would add its own weight to
   every write, and localStorage is the one place in this app that runs out. */
const REF_IMG_MAX = 480;   // printed at ~1.3 in, so this is 4x the print grain
let REF_IMG_DATA = {model:"", url:""};

/* Redrawn small before it is embedded. The catalogue exports at 1800 px and
   three megabytes, and nothing stops somebody from publishing one of those
   straight to the img folder — that photo would weigh four times the entire
   rest of the report, three times over, once per language. Shrinking here
   rather than trusting the file means the packet stays a sane size whatever
   arrives in that folder. */
function shrinkToDataUrl(blob){
  return new Promise(ok => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      try{
        const k = Math.min(1, REF_IMG_MAX / (img.naturalWidth || REF_IMG_MAX));
        const cv = document.createElement("canvas");
        cv.width  = Math.max(1, Math.round((img.naturalWidth  || 1) * k));
        cv.height = Math.max(1, Math.round((img.naturalHeight || 1) * k));
        const cx = cv.getContext("2d");
        // Catalogue photos are cut out on white; a transparent PNG would print
        // black behind the product without this.
        cx.fillStyle = "#ffffff";
        cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL("image/jpeg", 0.82));
      }catch(e){ ok(""); }
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(""); };
    img.src = url;
  });
}

async function ensureRefImg(){
  const m = String(S.model || "");
  if(!m || REF_IMG_DATA.model === m) return;
  REF_IMG_DATA = {model:m, url:""};
  // Same three extensions, same order, as everywhere else that looks for a
  // photograph. Kept as one list so the report and the screen never disagree
  // about which file exists.
  const exts = IMG_EXTS.map(e => e.slice(1));
  for(let i = 0; i < exts.length; i++){
    try{
      const res = await fetch(refImgUrl(m, exts[i]));
      if(!res.ok) continue;
      const blob = await res.blob();
      // A missing file on GitHub Pages answers with an HTML page, not a 404, so
      // the type is what says whether this is really a photo.
      if(!/^image\//.test(blob.type || "")) continue;
      const small = await shrinkToDataUrl(blob);
      if(!small) continue;
      // The model may have changed while the photo was in flight.
      if(REF_IMG_DATA.model !== m) return;
      REF_IMG_DATA.url = small;
      break;
    }catch(e){}
  }
}
/* Empty whenever the reference has no photo, or the model changed after the
   last fetch — never a stale picture of another product. */
const refImgForReport = () =>
  REF_IMG_DATA.model === String(S.model || "") ? REF_IMG_DATA.url : "";
