  "Set repeat-one and let the track end: the same track must play again. Then set repeat-all: at the end it must move to the next track.":"Ponga repetir-una y deje terminar la pista: debe volver a sonar la misma. Luego ponga repetir-todas: al terminar debe pasar a la siguiente.",
  "Delete the recording you just made and confirm it no longer plays back. The music tracks must remain untouched.":"Borre la grabación que acaba de hacer y confirme que ya no se reproduce. Las pistas de música deben quedar intactas.",
  "Press the mode button through the full cycle until it returns to USB. The display must follow every change.":"Pulse la tecla de modo un ciclo completo hasta volver a USB. La pantalla debe seguir cada cambio.",
  "Press the mode button through the full cycle until it returns to SD. The display must follow every change.":"Pulse la tecla de modo un ciclo completo hasta volver a SD. La pantalla debe seguir cada cambio.",
  "Press the mode button through the full cycle until it returns to Bluetooth. The connection must survive the round trip.":"Pulse la tecla de modo un ciclo completo hasta volver a Bluetooth. La conexión debe sobrevivir el recorrido.",
  "Press the mode button through the full cycle until it returns to AUX. The display must follow every change.":"Pulse la tecla de modo un ciclo completo hasta volver a AUX. La pantalla debe seguir cada cambio.",
  "Move each control through its full range and listen. If the reference shows the level on screen, the indicator must follow the knob.":"Mueva cada control en todo su recorrido y escuche. Si la referencia muestra el nivel en pantalla, el indicador debe seguir a la perilla.",
  "Take the volume from minimum to maximum slowly. It must rise continuously the whole way, with no jumps, dead spots or scratchy sound, and where there is a number on the display it must follow.":"Lleve el volumen del mínimo al máximo lentamente. Debe crecer de forma continua en todo el recorrido, sin saltos, zonas muertas ni sonido rasposo, y donde haya número en pantalla debe seguirlo.",
  "With music playing, take the treble fully down and fully up. The change must be clearly audible across the whole travel, with no dead spots and no scratchy noise as the knob turns. Where there is an on-screen indicator, it must follow.":"Con música sonando, lleve los agudos al mínimo y al máximo. El cambio debe oírse con claridad en todo el recorrido, sin zonas muertas ni ruido rasposo al girar. Donde haya indicador en pantalla, debe seguirlo.",
  "Same check on the bass control, across its whole travel. Where there is an on-screen indicator, it must follow.":"La misma verificación en la perilla de graves, en todo su recorrido. Donde haya indicador en pantalla, debe seguirlo.",
  "Playing from the USB drive, switch X-BASS on and off several times. The low end must jump noticeably when it is on and go back when it is off, and the display must show the change. Then raise the volume to maximum with X-BASS on: the bass must stay clean, with no distortion and no rattle from the woofer.":"Reproduciendo desde la memoria USB, active y desactive X-BASS varias veces. El bajo debe aumentar notoriamente al activarlo y volver a su estado al desactivarlo, y la pantalla debe mostrar el cambio. Luego suba el volumen al máximo con X-BASS activo: el bajo debe mantenerse limpio, sin distorsión y sin traqueteo del woofer.",
  "Playing from the SD card, switch X-BASS on and off several times. The low end must jump noticeably when it is on and go back when it is off, and the display must show the change. Then raise the volume to maximum with X-BASS on: the bass must stay clean, with no distortion and no rattle from the woofer.":"Reproduciendo desde la tarjeta SD, active y desactive X-BASS varias veces. El bajo debe aumentar notoriamente al activarlo y volver a su estado al desactivarlo, y la pantalla debe mostrar el cambio. Luego suba el volumen al máximo con X-BASS activo: el bajo debe mantenerse limpio, sin distorsión y sin traqueteo del woofer.",
  "Playing over Bluetooth, switch X-BASS on and off several times. The low end must jump noticeably when it is on and go back when it is off, and the display must show the change. Then raise the volume to maximum with X-BASS on: the bass must stay clean, with no distortion and no rattle from the woofer.":"Reproduciendo por Bluetooth, active y desactive X-BASS varias veces. El bajo debe aumentar notoriamente al activarlo y volver a su estado al desactivarlo, y la pantalla debe mostrar el cambio. Luego suba el volumen al máximo con X-BASS activo: el bajo debe mantenerse limpio, sin distorsión y sin traqueteo del woofer.",
  "Plug a microphone into MIC1 and speak while you adjust volume, echo and priority. Repeat with MIC2, then connect the guitar. Mark N/A for whatever this reference does not have.":"Conecte un micrófono en MIC1 y hable mientras ajusta volumen, eco y prioridad. Repita con MIC2 y luego conecte la guitarra. Marque N/A lo que esta referencia no tenga.",
  "Speak continuously into MIC2 while turning its volume from minimum to maximum.":"Hable de forma continua por MIC2 mientras gira su volumen del mínimo al máximo.",
  "Say short words into MIC2 and turn the echo up.":"Diga palabras cortas por MIC2 y suba el eco.",
  "Speak into MIC2 and raise the reverb. Echo and reverb must act independently on this input too.":"Hable por MIC2 y suba la reverberación. En esta entrada el eco y la reverberación también deben actuar de forma independiente.",
  "Speak continuously into MIC1 while turning its volume from minimum to maximum. The level must rise smoothly, without cutting out or crackling.":"Hable de forma continua por MIC1 mientras gira su volumen del mínimo al máximo. El nivel debe subir de forma suave, sin cortes ni crujidos.",
  "Speak into MIC1 and raise the reverb. The voice must gain body and depth, not repeat like the echo. Both controls must act independently.":"Hable por MIC1 y suba la reverberación. La voz debe ganar cuerpo y profundidad, no repetirse como el eco. Los dos controles deben actuar de forma independiente.",
  "Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.":"Conecte la guitarra en su entrada y toque mientras mueve su control de volumen del mínimo al máximo. Marque N/A si esta referencia no tiene entrada de guitarra.",
  "Switch the light on and off, and step through the light modes if the speaker has them.":"Encienda y apague la luz, y recorra los modos de luz si el parlante los tiene.",
  "Press the light button several times. It must switch on and off cleanly every time, with no flicker and no LED left lit.":"Pulse la tecla de luz varias veces. Debe encender y apagar de forma limpia cada vez, sin parpadeos y sin que quede ningún LED prendido.",
  "Step through every light pattern and back to the first. Each one must be visibly different, with no dead LEDs in any pattern.":"Recorra todos los patrones de luz y vuelva al primero. Cada uno debe ser visiblemente distinto, sin LED apagados en ningún patrón.",
  "Connect the AC charging cable with the speaker switched on and watch the display.":"Conecte el cable de carga AC con el parlante encendido y observe la pantalla.",
  "Plug the AC cable in. The charging indicator must appear on the display within a few seconds, and stay on while the cable is connected.":"Conecte el cable AC. El indicador de carga debe aparecer en la pantalla en pocos segundos y mantenerse mientras el cable esté conectado.",

  "Move every level to a position that is easy to recognise — not centred, not at the end — and write down where you left each one. Switch the speaker off, wait ten seconds, switch it on and check them one by one. A speaker that returns to factory levels on every power cycle is one the customer has to set up again every single time.":"Lleve cada nivel a una posición fácil de reconocer —ni centrada ni al tope— y anote dónde dejó cada una. Apague el parlante, espere diez segundos, enciéndalo y verifíquelos uno por uno. Un parlante que vuelve a los niveles de fábrica en cada encendido es uno que el cliente tiene que reconfigurar cada vez que lo usa.",
  "Leave the bass clearly above or below the middle, switch off and on. It must come back exactly where it was, on the control and on the display.":"Deje los graves claramente por encima o por debajo del centro, apague y encienda. Deben volver exactamente donde estaban, tanto en el control como en la pantalla.",
  "Same check on the treble. Testing one level and assuming the rest is how a speaker ships remembering the bass and forgetting everything else.":"La misma verificación en los agudos. Probar un solo nivel y dar por hecho el resto es como sale de fábrica un parlante que recuerda los graves y olvida todo lo demás.",
  "Same check on the mids. Mark N/A if this reference has no mid control.":"La misma verificación en los medios. Marque N/A si esta referencia no tiene control de medios.",
  "Same check on the echo. Speak into the microphone after switching on again: the repetition must sound the same as before.":"La misma verificación en el eco. Hable al micrófono después de encender de nuevo: la repetición debe sonar igual que antes.",
  "Same check on the microphone bass. Mark N/A if this reference has no separate microphone tone controls.":"La misma verificación en los graves del micrófono. Marque N/A si esta referencia no tiene controles de tono independientes para micrófono.",
  "Same check on the microphone treble. Mark N/A if this reference has no separate microphone tone controls.":"La misma verificación en los agudos del micrófono. Marque N/A si esta referencia no tiene controles de tono independientes para micrófono.",

  "The display is what the customer reads to know what the speaker is doing, and a misspelled mode is a defect that ships on every unit of the batch. Photograph each mode: the photo is what lets the office check the spelling without the speaker in front of them.":"La pantalla es lo que el cliente lee para saber qué está haciendo el parlante, y un modo mal escrito es un defecto que sale en todas las unidades del lote. Fotografíe cada modo: esa foto es lo que permite a la oficina revisar la escritura sin tener el parlante delante.",
  "Look at the display straight on, in shade. Every character must be white, all of them the same white. A segment that reads bluish or yellowish next to the others is a fault even when the word is legible.":"Mire la pantalla de frente y a la sombra. Todos los caracteres deben ser blancos, y del mismo blanco. Un segmento que se vea azulado o amarillento junto a los demás es un defecto aunque la palabra se lea bien.",
  "Select USB mode and read what the display shows, letter by letter. Photograph it. Compare against the specification: USB, not U5B or U58.":"Cambie a modo USB y lea lo que muestra la pantalla, letra por letra. Fotografíelo. Compare contra la especificación: USB, no U5B ni U58.",
  "Select Bluetooth mode and read what the display shows, letter by letter. Photograph it. Whether it says BLUETOOTH, BT or BLUE, it must be spelled the way the specification requires.":"Cambie a modo Bluetooth y lea lo que muestra la pantalla, letra por letra. Fotografíelo. Diga BLUETOOTH, BT o BLUE, debe estar escrito como lo exige la especificación.",
  "With the card inserted, select SD mode, read the display and photograph it. Mark N/A if this reference has no SD slot.":"Con la tarjeta insertada, cambie a modo SD, lea la pantalla y fotografíela. Marque N/A si esta referencia no tiene ranura SD.",
  "With the cable connected, select the auxiliary input, read the display and photograph it. Some references write AUX and others LINE: either is correct as long as it matches the specification for this model and is spelled properly. Mark N/A if this reference has no auxiliary input.":"Con el cable conectado, seleccione la entrada auxiliar, lea la pantalla y fotografíela. Unas referencias escriben AUX y otras LINE: cualquiera de las dos es correcta mientras coincida con la especificación de ese modelo y esté bien escrita. Marque N/A si esta referencia no tiene entrada auxiliar."
});

/* Help texts, continued: Bluetooth, radio, AUX, remote, battery and the photo
   sections. */
Object.assign(ES_PLAN, {
  "Put the speaker in Bluetooth mode. Pair an iPhone and play; then disconnect and pair an Android. Finally switch the speaker off and on to see whether it reconnects by itself.":"Ponga el parlante en modo Bluetooth. Empareje un iPhone y reproduzca; luego desconecte y empareje un Android. Al final apague y encienda el parlante para ver si se reconecta solo.",
  "Search from the iPhone. The speaker must appear in the list, pair without a PIN and connect within a few seconds.":"Busque desde el iPhone. El parlante debe aparecer en la lista, emparejarse sin PIN y conectar en pocos segundos.",
  "Disconnect the iPhone first, then pair an Android. Both must work: it is common for a speaker to connect with one and fail with the other.":"Primero desconecte el iPhone y luego empareje un Android. Los dos deben funcionar: es común que un parlante conecte con uno y falle con el otro.",
  "With the phone paired and nearby, switch the speaker off and on. It must reconnect by itself, without pairing again.":"Con el teléfono emparejado y cerca, apague y encienda el parlante. Debe reconectarse solo, sin volver a emparejar.",
  "Play for at least 30 seconds with the phone about 3 metres away. There must be no dropouts or disconnections.":"Reproduzca al menos 30 segundos con el teléfono a unos 3 metros. No debe haber cortes ni desconexiones.",
  "Play the test track from the phone and listen for at least 30 seconds, checking for dropouts and hum.":"Reproduzca la pista de prueba desde el teléfono y escuche al menos 30 segundos, atento a cortes y zumbidos.",
  "A connected phone does not prove sound. Play music and confirm it really comes out of this speaker, not the phone or a nearby speaker.":"Que el teléfono esté conectado no prueba que haya sonido. Reproduzca música y confirme que sale realmente de este parlante, no del teléfono ni de otro parlante cercano.",
  "Press it on the speaker, not on the phone. The music must pause and the phone must show it paused too.":"Púlsela en el parlante, no en el teléfono. La música debe pausarse y el teléfono también debe mostrarla en pausa.",
  "Enable TWS mode and link the speaker to a second speaker. Confirm both play together. Mark N/A if this reference has no TWS.":"Active el modo TWS y enlace el parlante con un segundo parlante. Confirme que ambos suenan juntos. Marque N/A si esta referencia no tiene TWS.",
  "Enable TWS on both speakers and wait for them to pair with each other. Play music: both must sound together and in sync. Mark N/A if this reference has no TWS.":"Active TWS en los dos parlantes y espere a que se emparejen entre sí. Reproduzca música: ambos deben sonar juntos y sincronizados. Marque N/A si esta referencia no tiene TWS.",
  "Select radio mode and run the auto search to store stations. Step through them with next and back. Then switch the speaker off and on to check it keeps the last station.":"Seleccione el modo radio y ejecute la búsqueda automática para guardar emisoras. Recórralas con siguiente y anterior. Luego apague y encienda el parlante para comprobar que conserva la última emisora.",
  "Run the auto search and let it finish. It must find several stations and store them; a speaker that finds one or none has an antenna problem.":"Ejecute la búsqueda automática y déjela terminar. Debe encontrar varias emisoras y guardarlas; un parlante que encuentra una o ninguna tiene problema de antena.",
  "Press it several times. The frequency must move to the next stored station each time, not scan endlessly.":"Púlsela varias veces. La frecuencia debe pasar a la siguiente emisora guardada cada vez, sin quedarse buscando sin fin.",
  "Press it several times. It must go back through the stored stations one at a time.":"Púlsela varias veces. Debe retroceder por las emisoras guardadas de una en una.",
  "Select the station stored in preset 2 and write down its frequency. Switch the speaker off, wait a few seconds and switch it on again. It must come back on preset 2, on the same frequency — not on preset 1 and not scanning.":"Seleccione la emisora guardada en la memoria 2 y anote su frecuencia. Apague el parlante, espere unos segundos y vuelva a encenderlo. Debe volver en la memoria 2, en la misma frecuencia — no en la memoria 1 ni buscando.",
  "Listen to one station for 30 seconds without touching the speaker. The signal must not drift, fade or fill with static.":"Escuche una emisora durante 30 segundos sin tocar el parlante. La señal no debe desviarse, desvanecerse ni llenarse de estática.",
  "On a strong station the voice must be clear. Constant hiss on every station points to the tuner or the antenna, not the broadcast.":"En una emisora de señal fuerte la voz debe ser clara. Un siseo constante en todas las emisoras apunta al sintonizador o a la antena, no a la transmisión.",
  "Press the mode button and confirm the speaker changes source and the display follows.":"Pulse la tecla de modo y confirme que el parlante cambia de fuente y la pantalla lo sigue.",
  "In radio mode the lights must stay off by design: the LED drivers interfere with FM reception. If they come on, it is a firmware fault.":"En modo radio las luces deben permanecer apagadas por diseño: los controladores de LED interfieren con la recepción FM. Si se encienden, es una falla de firmware.",
  "Connect the AUX cable between the test source and the speaker, select AUX mode and play audio.":"Conecte el cable AUX entre la fuente de prueba y el parlante, seleccione el modo AUX y reproduzca audio.",
  "First select AUX mode on the speaker and confirm the display shows it. Only then connect the cable and play from the source: the sound must come through.":"Primero seleccione el modo AUX en el parlante y confirme que la pantalla lo muestra. Solo entonces conecte el cable y reproduzca desde la fuente: el sonido debe pasar.",
  "Play from the source and confirm sound in both channels. Wiggle the plug gently: the sound must not cut out.":"Reproduzca desde la fuente y confirme sonido en ambos canales. Mueva el conector con suavidad: el sonido no debe cortarse.",
  "With the cable connected but the source paused, listen close to the grille. There must be no hum or buzz from the cable or the mains.":"Con el cable conectado pero la fuente en pausa, escuche cerca de la malla. No debe haber zumbido proveniente del cable ni de la red eléctrica.",
  "Press it on the speaker. The sound must stop and resume. Mark N/A if this reference does not control the AUX source.":"Púlsela en el parlante. El sonido debe detenerse y reanudarse. Marque N/A si esta referencia no controla la fuente AUX.",
  "Check the remote has a battery and remove the insulator if new. Point at the speaker from about 3 metres.":"Verifique que el control tenga batería y retire el aislante si es nuevo. Apunte al parlante desde unos 3 metros.",
  "Press it to switch the speaker off, then again to switch it on. Both directions must work from 3 metres.":"Púlsela para apagar el parlante y otra vez para encenderlo. Ambos sentidos deben funcionar a 3 metros.",
  "With music playing, press MUTE: the sound must stop instantly. Press again: it must come back at the same volume.":"Con música sonando, pulse MUTE: el sonido debe cortarse al instante. Pulse otra vez: debe volver al mismo volumen.",
  "Press each source key and confirm the speaker switches to it. Mark N/A for sources this reference does not have.":"Pulse cada tecla de fuente y confirme que el parlante cambia a ella. Marque N/A las fuentes que esta referencia no tenga.",
  "Press it from another source. The speaker must switch straight to radio and the display must show it.":"Púlsela desde otra fuente. El parlante debe pasar directo a radio y la pantalla debe mostrarlo.",
  "With the USB drive inserted, press it from another source. The speaker must switch to USB and start playing.":"Con la memoria USB insertada, púlsela desde otra fuente. El parlante debe cambiar a USB y empezar a reproducir.",
  "Press it from another source. The speaker must switch to Bluetooth and become discoverable or reconnect to the phone.":"Púlsela desde otra fuente. El parlante debe cambiar a Bluetooth y quedar visible o reconectarse al teléfono.",
  "With the card inserted, press it from another source. Mark N/A if this reference has no SD slot.":"Con la tarjeta insertada, púlsela desde otra fuente. Marque N/A si esta referencia no tiene ranura SD.",
  "With the AUX cable connected, press it from another source. The speaker must switch to AUX.":"Con el cable AUX conectado, púlsela desde otra fuente. El parlante debe cambiar a AUX.",
  "Press it repeatedly. The speaker must step through every source in order and return to the first.":"Púlsela repetidamente. El parlante debe recorrer todas las fuentes en orden y volver a la primera.",
  "With a source playing, press each key and confirm the speaker reacts.":"Con una fuente reproduciendo, pulse cada tecla y confirme que el parlante responde.",
  "Press once: the sound must stop. Press again: it must resume from the same point, not from the start.":"Pulse una vez: el sonido debe detenerse. Pulse otra vez: debe continuar desde el mismo punto, no desde el inicio.",
  "Press it three times. The track number must advance one at a time from the remote, just as it does from the panel.":"Púlsela tres veces. El número de pista debe avanzar de uno en uno desde el control, igual que desde el panel.",
  "Press it three times. The track number must go back one at a time, without jumping or restarting.":"Púlsela tres veces. El número de pista debe retroceder de uno en uno, sin saltos ni reinicios.",
  "Hold it down during a track. The music must move forward while held and carry on normally when released.":"Manténgala pulsada durante una pista. La música debe avanzar mientras la sostiene y continuar normal al soltarla.",
  "Hold it down during a track. The music must move backward while held and carry on normally when released.":"Manténgala pulsada durante una pista. La música debe retroceder mientras la sostiene y continuar normal al soltarla.",
  "Press it and check the repeat icon changes on the display, then let a track end to confirm the mode really applies.":"Púlsela y verifique que el ícono de repetición cambia en la pantalla; luego deje terminar una pista para confirmar que el modo realmente se aplica.",
  "Press it and confirm the folder number changes and playback jumps to another folder.":"Púlsela y confirme que el número de carpeta cambia y la reproducción salta a otra carpeta.",
  "Press it and confirm it returns to the previous folder.":"Púlsela y confirme que vuelve a la carpeta anterior.",
  "Type a track number, for example 005. The speaker must jump straight to that track. Test every digit from 0 to 9, not just one.":"Escriba un número de pista, por ejemplo 005. El parlante debe saltar directo a esa pista. Pruebe todos los dígitos del 0 al 9, no solo uno.",
  "Hold VOL + and VOL − and confirm the level moves on the display. Press EQ and check the preset changes.":"Mantenga VOL + y VOL − y confirme que el nivel se mueve en la pantalla. Pulse EQ y verifique que el preajuste cambia.",
  "Press it several times and hold it once. The level must rise step by step on the display and the sound must follow.":"Púlsela varias veces y manténgala una vez. El nivel debe subir paso a paso en la pantalla y el sonido debe seguirlo.",
  "Press it several times and hold it once. The level must fall step by step, all the way down to zero.":"Púlsela varias veces y manténgala una vez. El nivel debe bajar paso a paso, hasta llegar a cero.",
  "Press it through every preset. The display must show the name change and the sound must be audibly different between presets.":"Recórrala por todos los preajustes. La pantalla debe mostrar el cambio de nombre y el sonido debe ser audiblemente distinto entre preajustes.",
  "Record a few seconds with REC, play it back with REC PLAY. Retest some keys at an angle, not only straight on.":"Grabe unos segundos con REC y reprodúzcalo con REC PLAY. Vuelva a probar algunas teclas en ángulo, no solo de frente.",
  "Press REC and speak for a few seconds. The display must show it is recording, and pressing it again must stop the recording.":"Pulse REC y hable unos segundos. La pantalla debe indicar que está grabando, y al pulsarla otra vez la grabación debe detenerse.",
  "Press it and confirm the recording you just made plays back clearly through the speaker.":"Púlsela y confirme que la grabación que acaba de hacer se reproduce con claridad por el parlante.",
  "Press it while speaking into the microphone and listen for the change in the voice effect. Mark N/A if this reference has no VOICE OUT.":"Púlsela mientras habla al micrófono y escuche el cambio en el efecto de voz. Marque N/A si esta referencia no tiene VOICE OUT.",
  "With the speaker off and unplugged from the mains, open it and unplug the internal battery connector. Leave it disconnected for the whole test.":"Con el parlante apagado y desconectado de la red, ábralo y desconecte el conector de la batería interna. Déjela desconectada durante toda la prueba.",
  "Connect the external battery and set the switch to the external position. The speaker must recognise it as its power source. Photograph the battery connected, with its label readable: the picture is what says which battery was used and how it was wired, and no other point in the plan records that.":"Conecte la batería externa y ponga el switch en la posición externa. El parlante debe reconocerla como su fuente de energía. Fotografíe la batería conectada, con su etiqueta legible: la foto es lo que dice qué batería se usó y cómo quedó conectada, y ningún otro punto del plan registra eso.",
  "Connect the external battery and set the switch to the external position. The speaker must recognise it as its power source.":"Conecte la batería externa y ponga el selector en la posición externa. El parlante debe reconocerla como su fuente de alimentación.",
  "Move the switch between internal and external. The speaker must respond to the change, not stay dead in one of the positions.":"Mueva el selector entre interna y externa. El parlante debe responder al cambio, no quedar muerto en una de las posiciones.",
  "Switch the speaker on with the mains cable unplugged. It must start up fully on the external battery alone.":"Encienda el parlante con el cable de red desconectado. Debe arrancar por completo solo con la batería externa.",
  "Insert the USB drive and take the volume to maximum. Hold it there for at least a minute. The sound must not cut out or distort, the speaker must not switch off or restart, and the external battery must not shut down under the load.":"Inserte la memoria USB y suba el volumen al máximo. Manténgalo así al menos un minuto. El sonido no debe cortarse ni distorsionar, el parlante no debe apagarse ni reiniciarse, y la batería externa no debe protegerse por la carga.",
  "With the external battery still powering the speaker and music playing, plug in the AC power cable and take the volume to maximum. The speaker must keep playing without cutting out, resetting or losing the source; the charging indicator must appear; and neither the battery nor the AC input must trip. Check the connector and the battery for heat after a minute.":"Con la batería externa alimentando el parlante y música sonando, conecte el cable AC y suba el volumen al máximo. El parlante debe seguir reproduciendo sin cortes, sin reiniciarse y sin perder la fuente; el indicador de carga debe aparecer; y ni la batería ni la entrada AC deben protegerse. Al minuto, revise si el conector y la batería se calientan.",
  "Reconnect the internal battery, set the switch back to internal and close the speaker. Confirm it still works before finishing.":"Reconecte la batería interna, vuelva a poner el selector en interna y cierre el parlante. Confirme que sigue funcionando antes de terminar.",
  "Stand at the right of the speaker, looking at it from the front. Photograph the whole side, including the handle and the joint with the front and back panels.":"Párese al lado derecho del parlante, mirándolo de frente. Fotografíe todo el costado, incluyendo el asa y la unión con los paneles frontal y trasero.",
  "Same photo on the opposite side. Both sides are asked for separately because a scratch on only one of them is easy to miss in a single picture.":"La misma foto del lado opuesto. Se piden los dos costados por separado porque un rayón que está en uno solo se pasa por alto fácilmente en una sola foto.",
  "Close-up of the logo on the grille. It must be straight, complete, well fixed and with no scratched or faded lettering.":"Primer plano del logo en la malla. Debe estar derecho, completo, bien fijado y sin letras rayadas ni desvanecidas.",

/* Language: what the operator chose last, and failing that what the phone is
   set to. Guessing from the device is right here because the three audiences are
   in different countries — the factory in China, the office in Colombia — and
   each one picks up the app already in its own language. The choice, once made,
   always wins over the guess. */
let LANG = "";
try{ LANG = localStorage.getItem("hoklan_qc_lang") || ""; }catch(e){}
if(!LANG){
  const nav = String(navigator.language || navigator.userLanguage || "").toLowerCase();
  LANG = nav.indexOf("es") === 0 ? "es"
       : nav.indexOf("zh") === 0 ? "zh" : "en";
}
if(!T[LANG]) LANG = "en";

/* What one inspected unit is called changes with the factory: a speaker for the
   ones that build speakers, a set for LESHENG, whose product is a receiver with
   one or two microphones and, on one reference, a bag. Rather than branching at
   the twenty-odd places that print that word — the setup screen, the checklist
   header, the summary table, the findings, the report — the lookup itself tries
   the suffixed key first: "speaker_n_les" before "speaker_n". A factory that
   builds something else again needs a handful of strings and no code.
   S is read at call time, never while this file is still being evaluated. */
const UNIT_SFX = {LES:"_les"};
const tr = k => {
  const sfx = UNIT_SFX[S.factory];
  if(sfx){
    const alt = (T[LANG] && T[LANG][k + sfx]) || T.en[k + sfx];
    if(alt) return alt;
  }
  return (T[LANG] && T[LANG][k]) || T.en[k] || k;
};
/* Localised value of a {en, zh, es} pair. Plain strings pass through unchanged.
   When the pair carries nothing for the current language, the Spanish table of
   plan strings is consulted before falling back to English — that is where the
   Spanish for the generated config lives. */
const L = v => {
  if(!v) return "";
  if(typeof v === "string") return v;
  if(v[LANG]) return v[LANG];
  const en = v.en || "";
  if(LANG === "es" && ES_PLAN[en]) return ES_PLAN[en];
  return en;
};
const fmt = (k, map) => {
  let s = tr(k);
  // Longest placeholder first, or %t would eat the start of %tot.
  Object.keys(map || {}).sort((a,b) => b.length - a.length)
    .forEach(key => { s = s.split("%" + key).join(map[key]); });
  return s;
};

function setLang(code){
  LANG = code;
  try{ localStorage.setItem("hoklan_qc_lang", code); }catch(e){}
  document.documentElement.lang = code === "zh" ? "zh-CN" : code;
  render();
}

/* ---------- state --------------------------------------------------------- */
const S = {
  screen:"setup",
  idDigits:"",   // what the operator typed
  testId:"",     // the completed code — this is what gets recorded
  factory:"",    // internal key, only to filter references; never displayed
  model:"", po:"", operator:"",
  // A targeted inspection launched from Admin: `pick` is the list of test ids
  // to run, and `fromAdmin` is what puts the ABORT button on the screen. Both
  // null/false in the normal factory flow, which always runs the whole plan.
  pick:null, fromAdmin:false, poLetter:"", poAuto:false,
  // Whether the test list is unfolded in Admin. Folded by default: the common
  // case is running all of them and never opening it.
  adminTests:false,
  // Started from a factory account: the factory checked its own product. Travels
  // into the report, the spreadsheet and the file name, because the reader has to
  // know that the one who inspected is the one who built it.
  selfCheck:false,
  // Run against a scope HOKLAN published and the factory typed in: neither a
  // HOKLAN inspection nor a self-inspection, and the report says which.
  assigned:false,
  units:1,       // how many speakers are on the bench
  data:[[]],     // data[speaker][testIndex] — every speaker's own answers
  // `finishedAt` is stamped when the inspection is closed, not when the report
  // is printed: the report can be reopened days later and must still say how
  // long the inspection took, not how long ago it was.
  index:0, open:{}, startedAt:null, finishedAt:null,
  // Consecutivo del día para el nombre del archivo. Ver daySeq().
  seq:null
};

/* The checklist is walked once and each question is answered for every speaker
   on the bench, so `data` is read by speaker index everywhere; there is no
   "current speaker". Test-level evidence and notes are kept on speaker 1,
   because they document the test rather than any one unit. */
const MAX_UNITS = 5;

/* Shortest order number the app will accept. Not a format check — the customer's
   numbering is the customer's business and it is stored exactly as typed — but a
   floor, because everything downstream is filed under it: the report, the name of
   the ZIP, and the column the dashboard groups by. A one-digit order number is
   one nobody can search for six months later, and two shipments both numbered 1
   are indistinguishable in the spreadsheet. */
const PO_MIN = 4;

const app = document.getElementById("app");
const actions = document.getElementById("actions");

const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const UA = navigator.userAgent || "";
const IS_WECHAT = /MicroMessenger/i.test(UA);
const IS_IOS = /iPad|iPhone|iPod/.test(UA) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
/* iOS is no longer excluded: Safari has downloaded blobs to the Files app since
   iOS 13, and with the SHARE button gone this is the only way off the phone.
   WeChat's in-app browser stays out — there the download silently does nothing,
   and the operator has to open the page in a real browser first. */
const CAN_DOWNLOAD = !IS_WECHAT &&
  "download" in document.createElement("a");

const plan = () => CONFIG.plans["default"];

/* Not every reference carries every test. Four filters, all optional:
     "only":["HK-BRA210B1"]        — this reference and no other
     "skip":["HK-RHO102-BAG"]      — every reference except these
     "skip_factory":["RHY"]        — everyone except these factories
     "only_factory":["LES"]        — these factories and nobody else
   They apply to whole tests and to single points alike. Filtering the plan is
   better than asking the operator to mark N/A: a speaker that has no external
   battery should not carry a row saying its battery was "not applicable".

   `only_factory` is what separates the two plans that now live in this file.
   It is written as an allow list and not as a longer `skip_factory` on purpose:
   the day a fifth factory is added, a test that says "this belongs to LESHENG"
   leaves it out by itself, while a test that says "this is not for LESHENG"
   would hand it the whole speaker plan without anyone deciding so.

   `skip` is what keeps the microphone plan off HK-RHO102-BAG, which is the bag
   on its own. Written as an exclusion and not as an `only` list of the two
   microphone references on purpose: the day a RHO103 is added it inherits the
   microphone plan by itself, while fifteen `only` lists would each have to be
   edited and the one that was missed would silently drop a whole test. */
/* A reference can run a plan of its own instead of its factory's. HK-PHI is a
   LESHENG product but not a RHO: one microphone, one receiver module, no screen
   — everything it does, it says with a single LED. Sharing the RHO plan would
   ask it about screens it does not have.

   The tag is exclusive in both directions: a reference that has one sees only
   tests carrying it, and a reference that has none never sees a tagged test. One
   line each way, instead of a `skip` on every test of the factory — fourteen
   skips is fourteen chances to miss one, and the one missed is the test the new
   reference gets inspected against, silently, as if it were a product it is
   not. */
const REF_PLAN = {"HK-PHI":"PHI"};
const planTagOf = m => REF_PLAN[m] || "";
/* The RHYME subwoofers are not tagged here on purpose. A tag is exclusive, and
   the two BAS references still run the photographic sections — external parts,
   accessories, printed material, internal parts — exactly like every other
   cabinet. Tagging them would have meant duplicating those four tests under a
   second tag, and a correction made twice is a correction made once. They are
   scoped instead by name: `only` on the three tests that are theirs, `skip` on
   the ones that assume a full-range cabinet. */

function fits(o){
  if(o.only && o.only.indexOf(S.model) < 0) return false;
  if(o.skip && o.skip.indexOf(S.model) >= 0) return false;
  if(o.skip_factory && o.skip_factory.indexOf(S.factory) >= 0) return false;
  if(o.only_factory && o.only_factory.indexOf(S.factory) < 0) return false;
  return true;
}
/* Every test this reference carries. This is the whole plan, and it is what
   Admin offers to choose from. */
/* Every test this reference carries, in the order it is meant to be run.

   `first` pulls a test to the front without moving it in the file. The three
   sampling tests — aging, battery capacity, RMS power — belong at the start of
   the plan and are written at the end of it: aging and the discharge each take
   four hours, so they are set going first and the rest of the inspection is
   worked through while they run. Moving four hundred lines of plan to say that
   would be four hundred lines of risk for an ordering decision that may change
   again next month.

   Sort is stable, so everything without `first` keeps the order it has in the
   file, which is the order it was written in. */
const planTests = () => plan().tests
  .filter(t => (t.plan || "") === planTagOf(S.model) && fits(t))
  .sort((a, b) => (a.first || 99) - (b.first || 99));
/* The tests this inspection actually runs. Same thing, unless Admin picked a
   subset — then the checklist, the progress bar, the verdict and the report all
   work off the subset, which is why the filter lives here and nowhere else. */
const tests = () => {
  const all = planTests();
  if(!S.pick || !S.pick.length) return all;
  return all.filter(t => S.pick.indexOf(t.id) >= 0);
};
/* The test being answered. It clamps rather than trusting `S.index`, because
   the index is restored from a draft written against a plan that may since have
   been republished: a reference that lost two tests came back with the index
   pointing past the end, `current()` returned undefined, and the checklist
   threw on `t.type` before drawing anything. A blank page with the work still
   on the phone and no way to reach it. Null is returned only when the reference
   has no tests at all, which the checklist handles by going back to the start
   screen and saying so. */
const current = () => {
  const all = tests();
  if(!all.length) return null;
  if(S.index < 0 || S.index >= all.length)
    S.index = Math.min(Math.max(0, S.index | 0), all.length - 1);
  return all[S.index];
};
/* Null on a complete inspection; otherwise how much of the plan was covered.
   Read by the report and the spreadsheet: a PASS on two tests out of fourteen
   must never be filed as if the speaker had passed everything. */
function partialScope(){
  const tot = planTests().length, n = tests().length;
  return n < tot ? {n, tot} : null;
}
/* References that exist in the catalogue but are not in production. HOKLAN's own
   Admin sees them, flagged; the factory does not see them at all — neither on
   the start screen nor from a factory Admin account. The point is that a
   development reference must not be inspectable by mistake: an inspection filed
   against a product that has not been released is a record of nothing, and it
   would sit in the dashboard next to real ones.

   Taking a reference out of here is what releases it. Nothing else changes. */
const DEV_REFS = ["HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"];
const isDevRef = m => DEV_REFS.indexOf(m) >= 0;

/* What the factory can choose on the start screen. Development references are
   filtered out here, which is the single place that decides it. */
const modelsOf = f => Object.keys(CONFIG.models)
  .filter(m => CONFIG.models[m] === f && !isDevRef(m)).sort();
/* Tolerates a missing test on purpose. Half a dozen callers reach for the
   points of `current()`, and `current()` can be null on a draft whose reference
   was left without a plan; every one of them wants an empty list there, not a
   thrown error in the middle of drawing the screen. */
/* `no_na` prohíbe marcar N/A punto por punto en una sección fotográfica: cada
   foto es obligatoria.

   Admite dos formas desde la v13.3.

     true            — nadie puede marcar N/A punto por punto.
     ["EAG", ...]    — sólo esas fábricas lo tienen prohibido; en las demás el
                       botón de N/A aparece con normalidad.

   La lista hizo falta cuando HOKLAN pidió el N/A en MATERIAL IMPRESO para
   YISION. Esa prueba la comparten YISION y EAGLE, y `no_na` era un sí o un no
   para toda la prueba: quitarlo habría cambiado también a EAGLE, que no lo
   pidió. Se resuelve por fábrica y no por referencia porque la decisión es de
   la fábrica, no del producto. */
const noNA = t => {
  const v = t && t.no_na;
  if(!v) return false;
  return Array.isArray(v) ? v.indexOf(S.factory) >= 0 : true;
};

/* Quién puede marcar N/A la prueba entera, desde su propio encabezado. Las
   opcionales siempre; y las que nombren la referencia en `na_ok`, para el caso
   en que una sección compartida cubre un producto al que le faltan piezas de
   verdad. Es una decisión sobre toda la sección, no sobre cada punto: por eso
   vive arriba, junto al nombre, y no repartida en diecinueve botones. */
const canTestNA = t => !!t && (t.optional ||
  (t.na_ok || []).indexOf(S.model) >= 0);

const pointsOf = t => ((t && t.points) || []).filter(fits);
const realPoints = t => pointsOf(t).filter(p => p.id);
/* A point can name the control it belongs to — B1, P1, C4. On screen that name
   is drawn as a badge beside the label, because an operator standing at the
   panel looks for the marking before he reads the sentence. Everywhere else —
   report, spreadsheet, alerts, photo captions — it has to travel inside the
   text, or a finding filed against "pulsación corta entra en modo BT" would not
   say which of eight buttons that was. */
const pLab = p => (p && p.tag ? p.tag + " · " : "") + L(p && p.label);
const ANSWERED = ["PASS","FAIL","NA"];

function codeText(code){
  const e = CONFIG.failure_codes[code];
  return e ? L(e) : "";
}

function inspectionDate(ms){
  const d = new Date(ms || Date.now());
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ` +
         `${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* The day on its own, and the clock on its own. The report prints them in
   different fields now: the date identifies the inspection, the two times
   measure it. */
const dayOnly = ms => inspectionDate(ms).slice(0, 10);
const clockOnly = ms => inspectionDate(ms).slice(11);

/* Wall clock, start to finish — pauses, lunch and interruptions included. Said
   out loud in the report, because the first thing anybody does with a duration
   on a signed document is compare it with another one. */
function durationText(from, to){
  if(!from || !to || to < from) return "—";
  const mins = Math.round((to - from) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? fmt("dur_hm",{h, m}) : fmt("dur_m",{m});
}
/* How long one test took, printed to the second. The app has always recorded
   this - it is stamped on the row when the test is closed - and never showed it
   anywhere, so nobody could see where the operator's shift actually goes. To
   the second and not to the minute because most tests finish inside two, and
   rounded to minutes half the plan would read the same number. */
function secondsText(sec){
  /* Zero and missing print the same: nothing. A record from a build that did
     not stamp the time has no time, and no test is finished in under a second,
     so there is no case where the two need telling apart. */
  if(!sec) return "";
  const s = Math.max(0, Math.round(sec));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  const pad = n => String(n).padStart(2, "0");
  if(h) return fmt("dur_hms",{h, m:pad(m), s:pad(r)});
  if(m) return fmt("dur_ms",{m, s:pad(r)});
  return fmt("dur_s",{s:r});
}
/* The seconds a test took across the inspection. A photographic section is
   documented once for the whole lot, so its time belongs to the first unit and
   adding the others would multiply a number nobody measured; every other test
   is run on each unit in turn, so those do add up. */
function testSeconds(b){
  if(b.isDoc){ const r0 = unitRows(0)[b.i]; return (r0 && r0.seconds) || 0; }
  let s = 0;
  allUnits().forEach(u => {
    const r = unitRows(u)[b.i];
    if(r && r.seconds) s += r.seconds;
  });
  return s;
}
/* When the inspection was closed. Kept on the record rather than recomputed, so
   a report printed again tomorrow shows the same duration as the first one. */
const finishedAt = () => S.finishedAt || null;

function sectionsOf(t){
  const out = []; let cur = null;
  pointsOf(t).forEach(p => {
    if(p.section){
      cur = {name:L(p.section), help:L(p.help), points:[]}; out.push(cur); return;
    }
    if(!cur){ cur = {name:"", help:"", points:[]}; out.push(cur); }
    cur.points.push(p);
  });
  return out.filter(s => s.points.length);
}

/* Per-section instructions, folded away behind a + . The old single block of
   steps at the top of the test was read once and then scrolled past; the help
   an operator actually needs is the one attached to the group in front of
   them. */
function toggleHelp(name){
  const k = "h|" + secKey(name);
  S.open[k] = !S.open[k];
  render();
}
const helpOpen = name => !!S.open["h|" + secKey(name)];

/* Evidence box for a failed point. Default: open while something is missing,
   folded once photo and note are both there. Storing the flag only when the
   operator overrides it means the box goes back to folding itself as soon as
   they move on. */
const failKey = (u, id) => "f|" + S.index + "|" + u + "|" + id;
const failBoxOpen = (u, id, ok) => {
  const e = S.open[failKey(u, id)];
  return e !== undefined ? e : !ok;
};
function toggleFail(u, id, ok){
  S.open[failKey(u, id)] = !failBoxOpen(u, id, ok);
  render();
}

/* Called when the operator leaves the note field — on a short delay, so that a
   tap on the camera button lands on the live button instead of on an element
   this render has already replaced. Folds only when nothing is missing. */
function closeFail(u, id){
  const t = current();
  if(!t || t.type === "photos") return;
  const p = realPoints(t).find(x => x.id === id);
  if(!p || failOpen(row(u), p)) return;
  if(!document.getElementById("pfw_" + u + "_" + id)) return;   // already folded
  delete S.open[failKey(u, id)];
  const folded = collapseIfDone(id);
  render();
  if(folded >= 0) focusNextGroup(folded);
}
function evSummary(shots, note){
  const ph = shots.filter(m => m.kind === "photo").length;
  const vd = shots.length - ph;
  const bits = [];
  if(ph) bits.push(fmt("n_photos",{n:ph}));
  if(vd) bits.push(fmt("n_videos",{n:vd}));
  const txt = note.trim().replace(/\s+/g," ");
  bits.push(txt.length > 42 ? txt.slice(0,42) + "…" : txt);
  return bits.join(" · ");
}

function togglePointHelp(id){
  const k = "p|" + S.index + "|" + id;
  S.open[k] = !S.open[k];
  render();
}
const pointHelpOpen = id => !!S.open["p|" + S.index + "|" + id];

const secKey = name => S.index + "|" + name;

/* What is still owed in a section, across every speaker. Not just unanswered
   points: a point can be answered and still be incomplete, because it owes its
   own photograph or its own reading. Folding on "answered" alone presented
   those sections as finished, and the operator only found out at NEXT — with
   the box hidden behind a heading he had watched close. */
function secNeedsWork(sec){
  if(!sec) return false;
  return allUnits().some(u => {
    const r = row(u);
    return sec.points.some(p => {
      if(ANSWERED.indexOf(r.points[p.id]) < 0) return true;
      if(failOpen(r, p)) return true;
      if(valueMissing(r, p)) return true;
      return p.photo && r.points[p.id] !== "NA" &&
        shotsFor(r, p.id).filter(m => m.kind === "photo").length === 0;
    });
  });
}
const secByName = name => sectionsOf(current())
  .find(s => String(s.name) === String(name) ||
             String(s.name).replace(/['"\\]/g,"") === String(name));

function sectionOpen(name, sec){
  const e = S.open[secKey(name)];
  return e !== undefined ? e : secNeedsWork(sec || secByName(name));
}
function toggleSection(name){
  const sec = secByName(name);
  S.open[secKey(sec ? sec.name : name)] = !sectionOpen(name, sec);
  render();
}

/* ---------- persistence --------------------------------------------------- */
const DRAFT_KEY = "hoklan_qc_draft";

/* ---------- where the photographs live -------------------------------------
   localStorage is capped at about 5 MB. A photograph is kept as a data URL, so
   its own weight plus a third for the encoding, and a RHYME plan asks for
   around fifty of them per speaker: the draft used to fill up somewhere near
   the twentieth and the app would drop every picture to save the answers. It
   said so, which is the only reason this was ever survivable, but an inspector
   who reloaded the page halfway through lost a morning of photography.

   IndexedDB has room for hundreds of megabytes, so the pictures go there,
   keyed by the uid the record already carries, and localStorage keeps only the
   answers and each photograph's description. The pictures never change shape in
   memory - `m.url` is still a data URL - so the checklist, the report and the
   packet are untouched by any of this.

   Every failure path here ends at the old behaviour rather than at an error:
   a browser with no IndexedDB, a private window that blocks it, a store that
   will not open. The app has always known how to carry on without the
   photographs; what it must never do is fail to start. */
const MEDIA_DB = "hoklan_qc_media", MEDIA_STORE = "shots";
let mediaDb = null, mediaDbTried = false;
/* Set when a write of the photographs failed, cleared when one succeeds. The
   only reason it exists is that this failure is otherwise invisible until the
   next reload. */
let SHOTS_FAILED = false;
/* Set when even the answers could not be written. This is the last line: past
   here the inspection exists only in this tab, and closing it loses everything.
   Both are shown on the checklist, where the operator can still act on them. */
let DRAFT_FAILED = false;

/* Si el paquete que se descargó sigue valiendo. Se enciende al terminar la
   descarga y se apaga en `save()`, es decir en cuanto el operario cambia
   cualquier cosa: una respuesta corregida deja obsoleto el ZIP que ya está en
   la carpeta de descargas, y el operario no tiene forma de notarlo — los dos
   archivos se llaman casi igual.

   Vive en memoria y no en el borrador a propósito: `downloadPacket` borra el
   borrador al terminar, y además una inspección reabierta al día siguiente hay
   que volver a descargarla de todos modos. */
let PACKET_SAVED = false;

function openMediaDb(){
  if(mediaDbTried) return Promise.resolve(mediaDb);
  mediaDbTried = true;
  return new Promise(ok => {
    let settled = false;
    const done = v => { if(!settled){ settled = true; mediaDb = v; ok(v); } };
    /* A store that never answers is the one failure that would hang the start
       screen, and the start screen is the way in to everything. Three seconds
       and the app carries on without it. */
    setTimeout(() => done(mediaDb), 3000);
    try{
      if(!self.indexedDB) return done(null);
      const rq = indexedDB.open(MEDIA_DB, 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if(!db.objectStoreNames.contains(MEDIA_STORE)) db.createObjectStore(MEDIA_STORE);
      };
      rq.onsuccess = () => done(rq.result);
      rq.onerror = () => done(null);
      rq.onblocked = () => done(null);
    }catch(e){ done(null); }
  });
}

function mediaTx(mode){
  if(!mediaDb) return null;
  try{ return mediaDb.transaction(MEDIA_STORE, mode).objectStore(MEDIA_STORE); }
  catch(e){ return null; }
}

/* Written after the answers, and never awaited by anything the operator is
   waiting on: the answers are already safe in localStorage by then, and a
   picture that has not finished being written is one that is still on screen. */
function saveShots(){
  const st = mediaTx("readwrite");
  if(!st){ SHOTS_FAILED = true; return; }
  try{
    const keep = {};
    allUnits().forEach(u => unitRows(u).forEach(r => {
      if(!r) return;
      (r.media || []).forEach(m => {
        if(m.kind !== "photo" || !m.url) return;
        keep[m.uid] = true;
        st.put(m.url, m.uid);
      });
    }));
    /* This is the only place photographs are written, so a failure here is a
       failure nobody sees: the pictures stay on screen because they are in
       memory, the answers save normally, and the loss only surfaces hours
       later, on the reload, as a list of photographs to take again. The store
       fills up or the transaction aborts and the app used to say nothing at
       all. It says it now, and the finish screen refuses to call the packet
       complete while it is set. */
    st.transaction.onabort = () => { SHOTS_FAILED = true; render(); };
    st.transaction.onerror = () => { SHOTS_FAILED = true; render(); };
    st.transaction.oncomplete = () => {
      if(SHOTS_FAILED){ SHOTS_FAILED = false; render(); }
    };
    /* A photograph the inspector deleted has to leave the store too, or the
       draft shrinks on screen while the phone fills up regardless. */
    const all = st.getAllKeys();
    all.onsuccess = () => {
      const st2 = mediaTx("readwrite");
      if(!st2) return;
      (all.result || []).forEach(k => { if(!keep[k]) st2.delete(k); });
    };
  }catch(e){ SHOTS_FAILED = true; }
}

/* Reattaches each picture to its description. Anything missing simply stays
   missing: the record keeps its place in the report and the operator is told
   which ones have to be taken again. */
/* True when at least one photograph could not be put back. Asked of the draft
   itself and not of the store, because the two ways of losing a picture look
   identical from here: a store that would not open and a store that opened
   empty both leave a description with nothing attached to it. Reporting only
   the second would let an inspection resume on a phone that blocks IndexedDB
   with the operator believing the photographs are still there. */
const shotsMissing = () => allUnits().some(u => unitRows(u).some(r =>
  r && (r.media || []).some(m => m.kind === "photo" && !m.url)));

function loadShots(){
  return new Promise(ok => {
    const st = mediaTx("readonly");
    if(!st) return ok(shotsMissing());
    let missing = false;
    try{
      const rq = st.getAll(), rk = st.getAllKeys();
      let got = 0;
      const finish = () => {
        if(++got < 2) return;
        const byId = {};
        (rk.result || []).forEach((k, i) => { byId[k] = (rq.result || [])[i]; });
        allUnits().forEach(u => unitRows(u).forEach(r => {
          if(!r) return;
          (r.media || []).forEach(m => {
            if(m.kind !== "photo" || m.url) return;
            if(byId[m.uid]) m.url = byId[m.uid]; else missing = true;
          });
        }));
        ok(missing);
      };
      rq.onsuccess = finish; rq.onerror = () => ok(shotsMissing());
      rk.onsuccess = finish; rk.onerror = () => ok(shotsMissing());
      /* Same reason as opening the store: a read that never answers must not
         hold the start screen. Whatever came back by now is what there is. */
      setTimeout(() => ok(shotsMissing()), 4000);
    }catch(e){ ok(shotsMissing()); }
  });
}

function clearShots(){
  const st = mediaTx("readwrite");
  if(st) try{ st.clear(); }catch(e){}
}

/* The draft as it goes into localStorage: every photograph reduced to its
   description. The video keeps `size` and `name` and loses its object URL,
   which was never worth anything after a reload anyway. */
function draftForStorage(state){
  return Object.assign({}, state, {
    data: (state.data || []).map(unit => (unit || []).map(r => r
      ? Object.assign({}, r, {media: (r.media || []).map(m => ({
          uid:m.uid, kind:m.kind, at:m.at, slot:m.slot,
          name:m.name, size:m.size
        }))})
      : r))
  });
}

function withoutMedia(state){
  return Object.assign({}, state, {
    mediaDropped:true,
    data: (state.data || []).map(unit =>
      (unit || []).map(r => r ? Object.assign({}, r, {media:[]}) : r))
  });
}
function save(){
  /* Cualquier cambio invalida el paquete ya descargado. Va aquí y no en cada
     mutador porque `save` es el único sitio por el que pasan todos: responder un
     punto, escribir una medida, adjuntar una foto, marcar N/A. */
  PACKET_SAVED = false;
  /* Descriptions first and pictures second, in that order on purpose. The
     answers are what an inspection is; if the phone is going to fail at
     anything, it should fail at the part that can be taken again. */
  let ok = false;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(draftForStorage(S))); ok = true; }
  catch(e){}
  if(!ok){
    /* The last line. If this one fails too, the inspection exists only in this
       tab: closing it, or the phone reclaiming the page, takes the whole thing.
       It used to fail exactly as silently as it succeeded — the function
       returned either way and no screen ever said a word. */
    try{
      localStorage.setItem(DRAFT_KEY, JSON.stringify(withoutMedia(S)));
      DRAFT_FAILED = false;
    }catch(e){ DRAFT_FAILED = true; }
    return;
  }
  DRAFT_FAILED = false;
  /* Only complains when there is something to lose. Before the store has
     finished opening, and on an inspection that has not been photographed yet,
     "the pictures could not be saved" would be a warning about nothing. */
  if(mediaDb) saveShots();
  else if(hasShots()) SHOTS_FAILED = true;
}
const hasShots = () => allUnits().some(u => unitRows(u).some(r =>
  r && (r.media || []).some(m => m.kind === "photo" && m.url)));
function restore(){
  // Taken before anything is touched: `S` is still the small initial literal at
  // this point, so the copy is cheap and it is the only way back if the draft
  // turns out to be unusable half way through.
  const pristine = JSON.parse(JSON.stringify(S));
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    // "done" belongs here too. The draft is saved on that screen, and leaving it
    // out meant an inspection closed but not yet downloaded — the moment when
    // every answer and every photo already exist — could never be recovered if
    // the phone closed the page.
    if(d && ["test","index","done"].indexOf(d.screen) >= 0 && d.model){
      // A draft written before speakers existed carries `results`, not `data`,
      // and an intermediate one may carry a flat `data`. Reading either as
      // speaker 1 keeps the work instead of throwing it away.
      if(!Array.isArray(d.data)) d.data = [d.results || []];
      if(d.data.length && !Array.isArray(d.data[0])) d.data = [d.data];
      delete d.results;
      Object.assign(S, d);

      S.units = Math.min(MAX_UNITS, Math.max(1, S.units || S.data.length || 1));
      S.index = Math.min(Math.max(0, S.index|0), tests().length - 1);
      S.open = S.open || {};

      // A restored row can be missing anything the browser dropped when it hit
      // the storage quota. Filling the gaps here keeps every later `r.media`
      // and `r.points` from having to guard itself.
      S.data = allUnits().map(u => (S.data[u] || []).map(r => r && Object.assign(
        {media:[], points:{}, notes:{}, notesTr:{}, notesTrFor:{},
         marked:{}, changes:{},
         comment:"", commentTr:{}, commentTrFor:{}}, r)));

      // A draft written before Admin existed has neither field. An empty pick
      // list must read as "the whole plan", never as "no tests at all".
      if(!Array.isArray(S.pick) || !S.pick.length) S.pick = null;
      S.fromAdmin = !!S.fromAdmin;
      S.selfCheck = !!S.selfCheck;
      S.adminTests = !!S.adminTests;
      return true;
    }
  }catch(e){
    /* Roll back. The draft is copied into `S` before the checks below run, so a
       failure past that point used to leave the app holding a half-restored
       state while reporting that there was nothing to restore: boot then opened
       straight into a checklist nobody was offered the chance to resume. */
    Object.keys(S).forEach(k => { delete S[k]; });
    Object.assign(S, pristine);
  }
  return false;
}
function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  /* The pictures go with it. Left behind they are invisible - no draft names
     them any more - while still holding the phone's storage, and the inspector
     has no way to reach them to clear it. */
  clearShots();
}

function evidenceBytes(){
  let total = 0;
  allUnits().forEach(u => unitRows(u).forEach(r => {
    if(r) (r.media || []).forEach(m => {
      // A photo is a data URL, so its length is its weight. A video is an
      // object URL — a short string — and only `size` says what it costs.
      // Measuring both by url length reported a 40 MB clip as 60 bytes.
      total += m.kind === "video" ? (m.size || 0)
             : m.url ? m.url.length * 0.75 : (m.size || 0);
    });
  }));
  return total;
}
const humanSize = b => b > 1048576 ? (b/1048576).toFixed(1)+" MB"
                                   : Math.round(b/1024)+" KB";

/* ---------- media ---------------------------------------------------------
   1280 px stays. Several points are only worth taking because something small
   has to be read off them - the lot number digit by digit, the barcode under a
   scanner, the brand and part number on a component label, the words on the
   display - and for reading small print it is the pixel count that decides,
   not the JPEG quality. Dropping the long side is what makes those photographs
   useless; dropping the quality from 0.70 to 0.60 takes about a third of the
   weight off with nothing visible on a phone screen. It is worth doing because
   the photographs travel inside the report itself: fifty of them at the old
   setting made a file too heavy to send by mail. */
const MAX_PHOTO_PX = 1280, JPEG_QUALITY = 0.6;
/* Sin uso desde la v12.1: el aviso por video pesado se retiró. Se deja el
   umbral por si vuelve a hacer falta medir el tamaño de un clip.
   A clip past this gets a word of warning, never a refusal. The evidence is
   the point, and an inspector who filmed the only run of an intermittent fault
   must not be told to throw it away - but three minutes of a speaker playing is
   nobody's evidence, and the packet carries it all the way to the customer. */
const BIG_VIDEO_BYTES = 25 * 1048576;

/* A PDF is filed as a photo on purpose. Everything downstream — the evidence
   counts, the packet, the report, the storage in IndexedDB — already knows how
   to carry a photo, and a third kind would have to be taught to all of it. What
   it carries instead is `doc:true`, which the four places that draw a thumbnail
   read to draw a file chip rather than an image. Read whole rather than put
   through the canvas: there is nothing to resize, and a data URL is what
   survives a reload, where a blob URL does not. */
const isPdfFile = f =>
  /pdf$/i.test(f.type || "") || /\.pdf$/i.test(f.name || "");
/* Not `isDoc`: the report already has a local of that name meaning "this test is
   a photo section", and the two would shadow each other exactly where both are
   in scope. */
const isPdfMedia = m => !!(m && m.doc);

function shrink(file){
  return new Promise(resolve => {
    if(isPdfFile(file)){
      const keep = () => resolve({kind:"photo", doc:true, name:file.name,
                                  size:file.size, file,
                                  url:URL.createObjectURL(file)});
      const fr = new FileReader();
      fr.onerror = keep;
      fr.onload = () => resolve({kind:"photo", doc:true, name:file.name,
                                 size:file.size, url:fr.result});
      fr.readAsDataURL(file);
      return;
    }
    if(!file.type.startsWith("image/")){
      resolve({kind:"video", name:file.name, size:file.size, file,
               url:URL.createObjectURL(file)});
      return;
    }
    /* Both failure paths resolve as a video-shaped record rather than hanging:
       a promise that never settles leaves `addMedia` awaiting forever, the file
       input never clears and the photo disappears without a word. Keeping the
       original file means the evidence still travels in the packet even when
       this phone could not decode it. */
    const raw = () => resolve({kind:"photo", name:file.name, size:file.size,
                               file, url:URL.createObjectURL(file)});
    const reader = new FileReader();
    reader.onerror = raw;
    reader.onload = () => {
      const img = new Image();
      img.onerror = raw;
      img.onload = () => {
        const scale = Math.min(1, MAX_PHOTO_PX / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        resolve({kind:"photo", name:file.name, size:file.size,
                 url:c.toDataURL("image/jpeg", JPEG_QUALITY)});
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Reads a barcode out of the photograph that has just been attached, rather
   than from a live camera. The operator has to photograph the code anyway —
   the picture is the evidence — so decoding that same picture asks nothing
   extra of him, and needs no camera stream, no second permission and no
   detection loop running while he holds the phone steady.

   El número lo pone el lector y sólo el lector. Escribirlo a mano quedó
   prohibido a partir de la v13.0 por decisión de HOKLAN: un código tecleado no
   prueba nada, porque el operario puede copiarlo de otra unidad, de la orden
   de producción o de la unidad anterior, y el informe no distinguía un dato
   leído de uno inventado. Leído del código de la propia fotografía, el número
   y la evidencia son la misma cosa.

   Cuando no se lee, la inspección no se detiene: se marca el punto y el
   informe lo dice. Se distinguen dos motivos porque no significan lo mismo:
     "nodet"  — el teléfono no trae lector (iPhone, Firefox). Es un problema
                del equipo del operario, no del producto, y se resuelve
                inspeccionando con Chrome en Android.
     "unread" — hay lector y la foto no se dejó leer: reflejo, desenfoque,
                encuadre, o la etiqueta está mal impresa. Esto último sí es un
                hallazgo del producto.
   Devuelve el motivo, o "" si leyó. */
async function scanFromShot(u, pointId, dataUrl){
  try{
    if(typeof BarcodeDetector === "undefined") return "nodet";
    const fmts = await BarcodeDetector.getSupportedFormats().catch(() => []);
    if(!fmts || !fmts.length) return "nodet";
    const det = new BarcodeDetector({formats: fmts});
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = dataUrl; });
    const found = await det.detect(img);
    if(!found || !found.length) return "unread";
    const val = String(found[0].rawValue || "").trim();
    if(!val) return "unread";
    setCode(u, pointId, val);
    return "";
  }catch(e){ return "unread"; }
}

/* Anota, o borra, la marca de código no leído. Vive en la fila junto al resto
   de lo que la inspección produjo, así que viaja al informe y al respaldo sin
   nada más que hacer. */
function markScan(u, pointId, why){
  const r = row(u);
  r.scanFail = r.scanFail || {};
  if(why) r.scanFail[pointId] = why;
  else delete r.scanFail[pointId];
  save();
}

/* `u` is the speaker the picture belongs to. Evidence of a defect is filed
   against the speaker that has it; general evidence of the test goes on
   speaker 1, which is where the report looks for it. */
async function addMedia(input, u, slot){
  const r = row(u || 0);
  const files = Array.prototype.slice.call(input.files);
  for(let i=0;i<files.length;i++){
    const m = await shrink(files[i]);
    m.uid = String(Date.now())+"-"+i+"-"+Math.random().toString(36).slice(2,7);
    m.at = Date.now();        // stamped on the photo, as inspection reports do
    if(slot) m.slot = slot;
    r.media.push(m);
  }
  input.value = "";
  /* Before the render, so the número ya está en el recuadro cuando el recuadro
     se dibuja. Sólo mientras siga vacío: un código ya leído no se vuelve a
     leer, y así una segunda foto del mismo punto no puede cambiar el dato.

     Se lee de la última foto adjuntada, no de la primera. El operario que
     repite la foto lo hace porque la anterior no se dejó leer; releer aquella
     habría fallado otra vez, siempre, y el punto no se habría podido cerrar
     nunca. */
  if(slot){
    const t = current();
    const p = t && realPoints(t).filter(x => x.id === slot)[0];
    if(p && p.scan && !readingOf(r, slot).trim()){
      const shots = r.media.filter(m => m.slot === slot && m.kind === "photo" &&
                                        m.url && !m.doc);
      const shot = shots[shots.length - 1];
      if(shot) markScan(u || 0, slot, await scanFromShot(u || 0, slot, shot.url));
    }
  }
  if(slot) collapseIfDone(slot);
  render(); save();
  /* El aviso por video pesado se retiró en la v12.1 a petición de HOKLAN:
     saltaba en cada grabación de cada prueba y el operador lo leía como un
     error, cuando el video había quedado guardado. El peso del paquete sigue
     informándose donde corresponde —en la pantalla de descarga, junto al
     tamaño total— y allí no interrumpe nada. */
}
const shotsFor = (r, slot) => r.media.filter(m => m.slot === slot);

/* What goes inside a thumbnail. A document has no picture to show, so it gets
   its icon and its file name — which is the only thing that tells one report
   from another once three of them are sitting side by side. */
const docName = m => String(m.name || "PDF");
const thumbFace = m => isPdfMedia(m)
  ? `<u class="doc"><b>PDF</b><i>${esc(docName(m))}</i></u>`
  : m.kind === "photo" ? `<img src="${m.url}">`
                       : `<video src="${m.url}" muted></video>`;
const thumbTag = m => isPdfMedia(m) ? tr("doc")
  : m.kind === "photo" ? tr("photo") : tr("video");

function dropMedia(uid){
  // The photo belongs to some speaker's record for this test; which one is not
  // worth passing through the DOM, so it is looked up.
  for(const u of allUnits()){
    const r = row(u);
    const i = r.media.findIndex(m => m.uid === uid);
    if(i >= 0){ r.media.splice(i,1); break; }
  }
  render(); save();
}

/* ---------- notes in the three languages -----------------------------------
   The inspector writes in his own language; the report is read in Colombia, in
   the factory and by the customer. So every note is kept verbatim *and* carries
   the other two languages under it. The original is never replaced: a
   translation is an aid, not the quality record.

   Two services, in order. Google is the better translator but is unreachable
   from most factory networks in China, so MyMemory backs it up. If both fail
   the note still travels, on its own line, and the report says the translation
   was unavailable rather than leaving a blank where the note should be. */
const TR_CACHE = {};
const hasCJK = s => /[㐀-䶿一-鿿぀-ヿ]/.test(s);
/* The report is issued in three languages, and the people who read it do not
   share one: the factory writes in Chinese, the office answers in Spanish, the
   customer reads in English. So every note is carried in all three, whichever
   it was written in — the original verbatim, the other two underneath. */
const TR_TARGETS = ["en", "es", "zh"];
/* The app speaks in the codes used everywhere else; the services want their
   own. Asking Google for "zh" returns traditional characters. */
const TR_API = {en:"en", es:"es", zh:"zh-CN"};
const TR_NAME = {en:"notes_en", es:"notes_es", zh:"notes_zh"};

/* What language a note turned out to be written in, as reported by the
   translator itself. Kept because it is the only reliable way to know which of
   the three lines to leave out: printing "Spanish: <the same sentence>" under a
   Spanish note is noise on a document somebody signs. */
const TR_SRC = {};
const normLang = c => {
  c = String(c || "").toLowerCase();
  return c.indexOf("zh") === 0 ? "zh"
       : c.indexOf("es") === 0 ? "es"
       : c.indexOf("en") === 0 ? "en" : "";
};
/* Han characters are the one case that can be settled without asking. */
function srcLangOf(text){
  const t = String(text || "").trim();
  if(!t) return "";
  return TR_SRC[t] || (hasCJK(t) ? "zh" : "");
}

async function translateTo(text, target){
  const t = String(text || "").trim();
  if(!t) return "";
  const key = target + "|" + t;
  if(TR_CACHE[key] !== undefined) return TR_CACHE[key];
  let out = "";
  try{
    const res = await fetch("https://translate.googleapis.com/translate_a/single" +
      "?client=gtx&sl=auto&tl=" + (TR_API[target] || target) +
      "&dt=t&q=" + encodeURIComponent(t));
    if(res.ok){
      const j = await res.json();
      // The payload is an array of sentence fragments; joining them back is
      // what keeps a three-line note from arriving as its first line only.
      if(Array.isArray(j) && Array.isArray(j[0]))
        out = j[0].map(s => (s && s[0]) || "").join("");
      // Slot 2 is the language it detected. Free, and it saves two requests.
      const got = normLang(j && j[2]);
      if(got) TR_SRC[t] = got;
    }
  }catch(e){}
  if(!out){
    try{
      // This service cannot auto-detect, so the source is whatever we already
      // learned, and failing that a guess: Chinese if there are Han characters,
      // otherwise one of the two Latin ones that is not the target.
      const src = TR_API[srcLangOf(t)] ||
        (hasCJK(t) ? "zh-CN" : (target === "en" ? "es" : "en"));
      const res = await fetch("https://api.mymemory.translated.net/get?langpair=" +
        src + "|" + (TR_API[target] || target) +
        "&q=" + encodeURIComponent(t.slice(0,480)));
      if(res.ok){
        const j = await res.json();
        const c = j && j.responseData && j.responseData.translatedText;
        // This service answers its own errors inside the translation field.
        if(c && !/MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(c)) out = c;
      }
    }catch(e){}
  }
  out = String(out || "").trim();
  if(out) TR_CACHE[key] = out;
  return out;
}

/* Each translation is stored under its language, next to the source text it came
   from. Keeping the source is what stops an edited note from keeping the old
   translation attached — the worst possible failure for a document somebody
   signs. */
function trStore(r, kind, pointId, target, value, src){
  if(kind === "note"){
    r.notesTr = r.notesTr || {}; r.notesTrFor = r.notesTrFor || {};
    r.notesTr[pointId] = r.notesTr[pointId] || {};
    r.notesTrFor[pointId] = r.notesTrFor[pointId] || {};
    r.notesTr[pointId][target] = value;
    r.notesTrFor[pointId][target] = src;
  } else {
    r.commentTr = r.commentTr || {}; r.commentTrFor = r.commentTrFor || {};
    r.commentTr[target] = value; r.commentTrFor[target] = src;
  }
}
const trSrc = (r, kind, pointId) => String((kind === "note"
  ? ((r.notes || {})[pointId]) : r.comment) || "");

/* The translation into `target`, but only if it still belongs to the text that
   is there now. Defaults to the language the report is being issued in. */
function trOf(r, kind, pointId, target){
  const lang = target || LANG;
  const src = trSrc(r, kind, pointId);
  const got = kind === "note"
    ? ((r.notesTr || {})[pointId] || {})[lang]
    : (r.commentTr || {})[lang];
  const was = kind === "note"
    ? ((r.notesTrFor || {})[pointId] || {})[lang]
    : (r.commentTrFor || {})[lang];
  return (got && was === src) ? got : "";
}
/* Every language the note was *not* written in, in a fixed order, each with the
   name of that language in whatever language is being read at the time. The one
   it was written in is left out: the original is already on the line above.
   A translation that came back identical to the source is dropped too — that is
   what a translator returns when it was handed its own language. */
function trAll(r, kind, pointId){
  const src = trSrc(r, kind, pointId).trim();
  if(!src) return [];
  const from = srcLangOf(src);
  const out = [];
  TR_TARGETS.forEach(lg => {
    if(lg === from) return;
    const got = String(trOf(r, kind, pointId, lg) || "").trim();
    if(!got || got === src) return;
    out.push({lang:lg, label:tr(TR_NAME[lg]), text:got});
  });
  return out;
}
/* The same thing as one block of plain text, for the boxes on screen. */
function appTrLine(r, kind, pointId){
  return trAll(r, kind, pointId)
    .map(x => x.label + ": " + x.text).join("\n");
}
/* And as the quiet lines the report prints under a note. */
function trSpans(r, kind, pointId){
  return trAll(r, kind, pointId).map(x =>
    `<span class="en"><b>${esc(x.label)}:</b> ${esc(x.text)}</span>`).join("");
}

const TR_TIMER = {};

function enBox(id, text){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = text || "";
  el.classList.toggle("hidden", !text);
}

/* Typing commits the note and asks for its translation once the operator stops
   writing — a request per keystroke would be both useless and rude to the
   service. Never triggers a render: that would close the phone keyboard. */
function noteTyped(u, pointId, text){
  setNote(u, pointId, text);
  queueTr("note", u, pointId);
}
function commentTyped(text){
  const r = row(0);
  r.comment = text;
  save();
  queueTr("comment", 0, null);
}
function queueTr(kind, u, pointId){
  const k = kind + "|" + u + "|" + (pointId || "") + "|" + S.index;
  clearTimeout(TR_TIMER[k]);
  TR_TIMER[k] = setTimeout(() => runTr(kind, u, pointId), 1400);
}
async function runTr(kind, u, pointId){
  const r = row(u);
  const boxId = kind === "note" ? "en_" + u + "_" + pointId : "en_comment";
  const src = trSrc(r, kind, pointId);
  const t = src.trim();
  if(!t){
    TR_TARGETS.forEach(lg => trStore(r, kind, pointId, lg, "", src));
    save(); enBox(boxId, ""); return;
  }
  enBox(boxId, tr("translating"));
  const outs = {};
