  // One at a time, on purpose. The first answer says what language the note was
  // written in, and that spares a request for the language it already is.
  for(let i = 0; i < TR_TARGETS.length; i++){
    const lg = TR_TARGETS[i];
    outs[lg] = srcLangOf(t) === lg ? "" : await translateTo(t, lg);
  }
  TR_TARGETS.forEach(lg => trStore(r, kind, pointId, lg, outs[lg], src));
  save();
  // The operator may have kept typing while the request was in flight; in that
  // case the box belongs to the newer text and a later run will fill it.
  if(trSrc(r, kind, pointId) !== src) return;
  enBox(boxId, appTrLine(r, kind, pointId) || tr("tr_fail"));
}

/* Nothing reaches the report untranslated. Whatever the debounce missed — a
   note typed and followed straight away by FINISH — is caught here, before the
   report or the packet is built. */
async function ensureTranslations(){
  const jobs = [];
  const want = (r, kind, pid) => {
    const src = trSrc(r, kind, pid);
    if(!src.trim()) return;
    TR_TARGETS.forEach(lg => {
      const was = kind === "note"
        ? ((r.notesTrFor || {})[pid] || {})[lg]
        : (r.commentTrFor || {})[lg];
      if(was === src) return;
      if(srcLangOf(src) === lg){ trStore(r, kind, pid, lg, "", src); return; }
      jobs.push(translateTo(src, lg)
        .then(x => trStore(r, kind, pid, lg, x, src)));
    });
  };
  allUnits().forEach(u => unitRows(u).forEach(r => {
    if(!r) return;
    want(r, "comment", null);
    Object.keys(r.notes || {}).forEach(pid => want(r, "note", pid));
  }));
  if(!jobs.length) return;
  try{ await Promise.all(jobs); }catch(e){}
  save();
}

/* ---------- answers -------------------------------------------------------
   The operator has all the speakers on the bench at once, so the checklist is
   walked once and every point is answered for each speaker in turn. One row
   per speaker under the same question. */
function blank(i){
  const t = tests()[i === undefined ? S.index : i];
  return {id:t.id, label:L(t.label), verdict:null, code:null, comment:"",
          commentTr:{}, commentTrFor:{},
          media:[], points:{}, notes:{}, notesTr:{}, notesTrFor:{},
          values:{},
          startedAt:Date.now()};
}

/* ---------- measured values ------------------------------------------------
   A handful of points do not end in yes or no but in a number: the sound
   pressure at one metre, the weight of a woofer. The number is the record —
   "the SPL was fine" six months later means nothing, 96.4 dB means something —
   and it travels next to the photograph of the instrument that produced it, so
   the reading can be checked against the display that showed it.

   Stored per speaker, like every other answer, because five units on the bench
   give five different numbers. */
/* Not named `valueOf`: that is a method every object in JavaScript already has,
   and a global with the same name is a trap waiting for whoever reads this
   next. */
const readingOf = (r, pointId) => ((r && r.values) || {})[pointId] || "";
/* The unit as the operator reads it, and the unit as the spreadsheet stores it.
   dB, g, cm and V are the same word everywhere and were written as plain
   strings; "stations" is not, so a unit may also be an {en, zh, es} pair. The
   screen and the report take the translation; the CSV column always takes the
   English form, because that column is read by consolidate.py and by the
   dashboard, and a value that changes with the phone's language would split one
   measurement into three. */
const unitText = m => (m && L(m.unit)) || "";
const unitKey = m => (m && ((m.unit && m.unit.en) || m.unit)) || "";
function setValue(u, pointId, text){
  const r = row(u);
  r.values = r.values || {};
  // Comma or dot: a Chinese keyboard and a Colombian one disagree about the
  // decimal separator, and the number has to survive both.
  r.values[pointId] = String(text || "").replace(",", ".").replace(/[^\d.]/g, "");
  save();
  syncReady();
}
/* Un código de barras no pasa por `setValue`. Aquélla es una función para
   mediciones y descarta todo lo que no sea dígito o punto, que en un EAN no se
   nota pero en una etiqueta Code 128 —"BAS115-25076411"— borra el guión y las
   letras y deja un número que no existe. Aquí se guarda lo que el lector
   entregó, tal cual. */
function setCode(u, pointId, text){
  const r = row(u);
  r.values = r.values || {};
  r.values[pointId] = String(text || "").trim();
  save();
  syncReady();
}
/* Whether a point that asks for a number still has none. N/A needs none: the
   reference does not have what was going to be measured.

   Un punto de lectura automática nunca bloquea: el número lo pone el lector, no
   el operario, y si el teléfono no supo leerlo no hay nada que pueda escribir.
   Lo que ocurre entonces es que la inspección sigue y el informe lo dice. */
const valueMissing = (r, p) =>
  !!(p.measure) && !p.scan && r.points[p.id] !== "NA" &&
  !readingOf(r, p.id).trim();

/* Un código que se fotografió y no se pudo leer. Se marca al adjuntar la foto y
   viaja hasta el informe. No es un fallo del producto ni del operario: en medio
   teléfono del mundo no existe el lector, y el dato se recupera después desde
   la propia fotografía, que sí quedó guardada.

   Devuelve el motivo — "nodet" o "unread" — y no un booleano: quien pregunta
   quiere saber cuál de los dos, porque uno señala al teléfono y el otro puede
   señalar a la etiqueta. Cadena vacía cuando el código sí se leyó. */
const scanFailed = (r, pointId) => ((r && r.scanFail) || {})[pointId] || "";

function pointValuesMissing(t){
  let n = 0;
  allUnits().forEach(u => realPoints(t).forEach(p => {
    if(valueMissing(row(u), p)) n++;
  }));
  return n;
}

/* The record of one speaker for one test, created on demand. */
function row(u, i){
  const idx = i === undefined ? S.index : i;
  const unit = S.data[u] = S.data[u] || [];
  return unit[idx] || (unit[idx] = blank(idx));
}

/* When each point was first answered, and every time it was changed afterwards.
   Only changes made to a test that had already been closed are kept: inside an
   open test, tapping PASS and then FAIL ten seconds later is not a correction,
   it is the operator deciding. What deserves a line in the report is going back
   with ‹ to a test that was already signed off and altering it — and how long
   passed between the two, because a correction six minutes later and one three
   days later are different events. */
function noteChange(r, pointId, from, to){
  r.marked = r.marked || {};
  r.changes = r.changes || {};
  const now = Date.now();
  if(!r.verdict){
    // Test still open: this is answering, not correcting. The first mark is
    // remembered anyway — it is the clock the change will be measured from.
    if(!r.marked[pointId] && to) r.marked[pointId] = now;
    return;
  }
  if(!from || from === to) return;
  (r.changes[pointId] = r.changes[pointId] || []).push({
    from, to, at: now, was: r.marked[pointId] || null
  });
}

function setPoint(u, pointId, value){
  const r = row(u);
  const next = (r.points[pointId] === value) ? null : value;
  noteChange(r, pointId, r.points[pointId], next);
  r.points[pointId] = next;

  // Answering a point on the last speaker folds its instructions away: they
  // were needed to decide, not afterwards.
  if(next && allUnits().every(x => ANSWERED.indexOf(row(x).points[pointId]) >= 0))
    S.open["p|" + S.index + "|" + pointId] = false;

  const folded = next ? collapseIfDone(pointId) : -1;

  render(); save();
  if(folded >= 0) focusNextGroup(folded);
}

/* Once every point of a section is answered for every speaker, the section
   folds itself up, so what stays on screen is what is still pending. Deleting
   the explicit flag (rather than setting it to false) hands the section back to
   sectionOpen's default rule — otherwise a section the operator had opened by
   hand would stay frozen open forever. A section holding a failure with no
   evidence yet stays open: folding it would hide the box we are demanding. */
function collapseIfDone(pointId){
  const list = sectionsOf(current());
  const at = list.findIndex(s => s.points.some(p => p.id === pointId));
  if(at < 0) return -1;
  const sec = list[at];
  // One definition of "finished", shared with the rule that decides whether a
  // section opens by default. Answered is not the same as finished: a point can
  // still owe its own photograph or its own reading.
  if(secNeedsWork(sec)) return -1;
  delete S.open[secKey(sec.name)];
  return at;               // which one folded, so the view can follow it
}

/* A section that folds takes its height with it, and everything below slides up
   into the space. The page keeps the scroll position it had, so what the
   operator is now looking at is whatever happened to land there — usually the
   middle of the group after next. It reads as if the app had skipped a group.

   So the next group that is still open is brought to the top instead. Searching
   forwards first and only then wrapping around means the normal top-to-bottom
   pass never jumps backwards, and a group left unanswered higher up is still
   reached rather than quietly abandoned. When nothing is left open, the photo
   and video card is what comes next, and that is where it goes. */
function focusNextGroup(from){
  const grps = Array.prototype.slice.call(document.querySelectorAll(".grp"));
  if(!grps.length) return;
  const isOpen = g => !!g.querySelector(".grp-b");
  let el = null;
  for(let i = from + 1; i < grps.length && !el; i++) if(isOpen(grps[i])) el = grps[i];
  for(let i = 0; i <= from && !el; i++) if(isOpen(grps[i])) el = grps[i];
  if(!el) el = document.querySelector(".grp ~ .card") || document.querySelector(".card");
  if(!el) return;
  const y = Math.max(0, el.getBoundingClientRect().top + window.pageYOffset - 10);
  // Smooth so the movement is legible as movement: a jump to another offset is
  // exactly what the operator was reading as a skipped group.
  try{ window.scrollTo({top:y, behavior:"smooth"}); }catch(e){ window.scrollTo(0, y); }
}

function setNote(u, pointId, text){
  const r = row(u);
  r.notes = r.notes || {};
  r.notes[pointId] = text;      // no re-render: it would fight the keyboard
  syncFail(u, pointId);
  save();
}

/* Counts run across every speaker: a point is done when all of them answered. */
function pendingCount(){
  let n = 0;
  realPoints(current()).forEach(p => allUnits().forEach(u => {
    if(ANSWERED.indexOf(row(u).points[p.id]) < 0) n++;
  }));
  return n;
}

/* ---------- taking the operator to what is missing -------------------------
   The alert used to name the gap and leave; on a checklist of two hundred
   points across five speakers, finding it again by hand is a minute of
   scrolling and the reason a test gets closed with the note left blank.

   So the alert is followed by the trip. Whatever holds the gap is opened —
   the section it lives in, the red box that was folded away — and the page
   goes to it and flashes it once, because scrolling alone leaves the operator
   to work out which of the four points on screen is the one being complained
   about. */
function flash(el){
  if(!el) return;
  el.classList.remove("flash");
  void el.offsetWidth;              // restart the animation if it is still on
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 2200);
}
function scrollToEl(el){
  if(!el) return;
  const y = Math.max(0, el.getBoundingClientRect().top + window.pageYOffset - 64);
  try{ window.scrollTo({top:y, behavior:"smooth"}); }catch(e){ window.scrollTo(0, y); }
}
/* `want` is what has to be visible once we arrive: the red evidence box, the
   photo slot of a point, or the point row itself. */
function goToGap(u, pointId, want){
  const sec = sectionsOf(current())
    .find(s => s.points.some(p => p.id === pointId));
  // Opened explicitly, overriding the automatic fold: an answered section that
  // is still missing its photo has to be reopened to be filled in.
  if(sec) S.open[secKey(sec.name)] = true;
  if(want === "fail") S.open[failKey(u, pointId)] = true;
  render();
  const id = u + "_" + pointId;
  const el = document.getElementById(
      want === "fail"  ? "pf_"  + id
    : want === "shot"  ? "psb_" + id
    : want === "photos"? "sb_"  + pointId
    : "pt_" + id) || document.getElementById("pt_" + id);
  scrollToEl(el); flash(el);
}
function goToEvidence(){
  const el = document.getElementById("evcard");
  scrollToEl(el); flash(el);
}

function nextTest(){
  const t = current();
  if(!t){ render(); return; }   // no plan left to advance through; renderTest says so
  const comment = (document.getElementById("comment")||{}).value || "";

  if(t.type === "photos"){
    // Photo tests document the shipment, not one speaker: a single set of
    // pictures covers the lot, so they are recorded once, on speaker 1.
    const r = row(0);
    // A reading is as much a part of the record as the picture, so it blocks
    // the same way — and it is asked for first, because the operator is still
    // standing at the scale.
    const noVal = realPoints(t).filter(p => valueMissing(r, p));
    if(noVal.length){
      alert(fmt("a_values",{n:noVal.length}));
      goToGap(0, noVal[0].id, "photos");
      return;
    }
    /* `!allNA(t)`: una prueba marcada N/A entera no tiene fotos que pedir. Sin
       esto, `no_na` seguía exigiéndolas y la sección quedaba imposible de
       cerrar por los dos caminos a la vez. */
    const missing = realPoints(t).filter(p =>
      shotsFor(r,p.id).length === 0 &&
      ((noNA(t) && !allNA(t)) || r.points[p.id] !== "NA"));
    if(missing.length){
      alert(tr("a_missing_photos") + "\n\n" +
        missing.slice(0,6).map(p => "· " + pLab(p)).join("\n") +
        (missing.length>6 ? "\n"+fmt("a_and_more",{n:missing.length-6}) : "") +
        "\n\n" + tr("a_mark_na"));
      goToGap(0, missing[0].id, "photos");
      return;
    }
    /* Every point answered, and every failure described. The photograph alone
       used to be enough to move on, which is how a picture of a dented corner
       left the bench filed as documentation and never as a defect. */
    const unanswered = realPoints(t)
      .filter(p => ANSWERED.indexOf(r.points[p.id]) < 0);
    if(unanswered.length){
      alert(fmt("a_pending",{n:unanswered.length}));
      goToGap(0, unanswered[0].id, "photos");
      return;
    }
    const noNote = realPoints(t).filter(p => r.points[p.id] === "FAIL" &&
      !((r.notes && r.notes[p.id] || "").trim()));
    if(noNote.length){
      alert(tr("a_fail_evidence") + "\n\n" +
        noNote.slice(0,6).map(p => "· " + pLab(p)).join("\n"));
      goToGap(0, noNote[0].id, "photos");
      return;
    }
    const failed = realPoints(t).filter(p => r.points[p.id] === "FAIL");
    const cTr = row(0).commentTr, cFor = row(0).commentTrFor;
    allUnits().forEach(u => {
      const ru = row(u);
      ru.comment = comment;
      ru.commentTr = cTr; ru.commentTrFor = cFor;
      ru.seconds = Math.round((Date.now()-ru.startedAt)/1000);
      /* DOCUMENTED only while nothing failed. A photo test that found something
         is a failed test, and it has to reach sections III and IV of the report
         like any other — without a code, because these points carry none: the
         written observation is what describes the defect. */
      ru.verdict = failed.length ? "FAIL" : "DOC";
      ru.code = null;
      ru.failedPoints = failed.map(p => ({
        code: p.code || null, label: pLab(p),
        note: (r.notes && r.notes[p.id]) || ""
      }));
    });
    advance(); return;
  }

  const pending = pendingCount();
  if(pending){
    alert(fmt("a_pending",{n:pending}));
    // The first one in reading order, so answering it and pressing NEXT again
    // walks the gaps from the top instead of bouncing around the checklist.
    let first = null;
    realPoints(t).forEach(p => allUnits().forEach(u => {
      if(!first && ANSWERED.indexOf(row(u).points[p.id]) < 0) first = {u, id:p.id};
    }));
    if(first) goToGap(first.u, first.id, "point");
    return;
  }

  // Every failed point must carry its own evidence and its own description.
  // A defect recorded with neither is a code nobody can act on months later.
  const gaps = [];
  let firstGap = null;
  realPoints(t).forEach(p => allUnits().forEach(u => {
    if(!failOpen(row(u), p)) return;
    gaps.push((S.units>1 ? fmt("speaker_n",{n:u+1}) + " · " : "") + pLab(p));
    if(!firstGap) firstGap = {u, id:p.id};
  }));
  if(gaps.length){
    alert(tr("a_fail_evidence") + "\n\n" +
      gaps.slice(0,6).map(s => "· " + s).join("\n") +
      (gaps.length > 6 ? "\n" + fmt("a_and_more",{n:gaps.length-6}) : ""));
    goToGap(firstGap.u, firstGap.id, "fail");
    return;
  }

  const missShots = pointShotsMissing(t);
  if(missShots){
    alert(fmt("a_point_photos",{n:missShots}));
    let first = null;
    realPoints(t).forEach(p => {
      if(!p.photo) return;
      allUnits().forEach(u => {
        const r = row(u);
        if(first || r.points[p.id] === "NA") return;
        if(shotsFor(r, p.id).filter(m => m.kind === "photo").length === 0)
          first = {u, id:p.id};
      });
    });
    if(first) goToGap(first.u, first.id, "shot");
    return;
  }

  const missVals = pointValuesMissing(t);
  if(missVals){
    alert(fmt("a_values",{n:missVals}));
    let first = null;
    realPoints(t).forEach(p => allUnits().forEach(u => {
      if(!first && valueMissing(row(u), p)) first = {u, id:p.id};
    }));
    if(first) goToGap(first.u, first.id, "shot");
    return;
  }

  const miss = missingEvidence(0);
  if(miss.photo || miss.video){
    alert(miss.photo && miss.video ? tr("a_both")
        : miss.video ? tr("a_video") : tr("a_photo"));
    goToEvidence();
    return;
  }

  const cTr = row(0).commentTr, cFor = row(0).commentTrFor;
  allUnits().forEach(u => {
    const r = row(u);
    r.comment = comment;
    r.commentTr = cTr; r.commentTrFor = cFor;
    r.seconds = Math.round((Date.now()-r.startedAt)/1000);
    const failed = realPoints(t).filter(p => r.points[p.id] === "FAIL");
    const applicable = realPoints(t).filter(p => r.points[p.id] !== "NA");
    r.verdict = failed.length ? "FAIL" : applicable.length ? "PASS" : "N/A";
    r.code = failed.length ? failed[0].code : null;
    r.failedPoints = failed.map(p => ({
      code: p.code, label: pLab(p),
      note: (r.notes && r.notes[p.id]) || ""
    }));
  });

  advance();
}

/* Which tests still have no verdict, on any speaker. Walked by index rather
   than with array methods for the same reason unitVerdict is: jumping straight
   to test 11 leaves 0-9 as holes, and holes are skipped. */
function unansweredTests(){
  const n = tests().length, out = [];
  for(let i = 0; i < n; i++){
    let missing = false;
    allUnits().forEach(u => {
      const r = unitRows(u)[i];
      if(!r || !r.verdict) missing = true;
    });
    if(missing) out.push(i);
  }
  return out;
}

function advance(){
  /* La inspección termina cuando no queda nada por responder, no cuando se
     acaba la lista.

     Antes había que caminar hasta el borde para llegar a la pantalla final. Eso
     valía cuando el plan se recorría en orden, pero POTENCIA RMS abre el plan y
     se deja para el final a propósito —el dato lo manda el proveedor por
     correo—, así que lo normal es completarla estando en la posición uno. El
     operario terminaba lo único que le faltaba y la app lo mandaba a la prueba
     dos, y a la tres, y así hasta el final, pasando por pruebas ya resueltas. */
  if(!unansweredTests().length){
    S.screen = "done"; markFinished();
    window.scrollTo(0,0);
    render(); save(); ensureTranslations();
    return;
  }
  /* La siguiente que falte, no la siguiente de la lista. Trabajando en orden es
     lo mismo, porque la de al lado siempre está sin responder; la diferencia
     aparece cuando el operario ha ido saltando, y entonces esto es justo lo que
     quiere: encadenar lo que le queda sin volver a pasar por lo ya resuelto. */
  const left = unansweredTests();
  const next = left.find(i => i > S.index);
  /* Si no queda ninguna por delante, se vuelve a la primera que falta: el plan
     se recorre en círculo hasta que no falte nada. La salida de este bucle es la
     comprobación de arriba, que ya devolvió si la lista estaba vacía.

     Dar la vuelta es el momento en que antes se llegaba al final de la lista, y
     es donde sigue saliendo el aviso de lo que queda. */
  const wrapped = next === undefined;
  S.index = wrapped ? left[0] : next;
  S.screen = "test";
  window.scrollTo(0,0);
  render(); save();
  ensureTranslations();
  if(wrapped) alert(leftTestsMsg(left));
  return;
}

/* El aviso de lo que falta, con los nombres. Un número suelto —«faltan 3»—
   obligaba al operario a abrir el índice para averiguar cuáles eran; ahora se
   los dice aquí y además la app abre la primera. Se cortan en seis, la misma
   regla que el aviso de fotos faltantes, para que el cuadro quepa en el
   teléfono en vez de convertirse en una pantalla de texto. */
function leftTestsMsg(left){
  if(left.length === 1) return fmt("a_one_left",{t: L(tests()[left[0]].label)});
  return fmt("a_left_tests",{n:left.length}) + "\n\n" +
    left.slice(0,6).map(i => "· " + L(tests()[i].label)).join("\n") +
    (left.length > 6 ? "\n" + fmt("a_and_more",{n:left.length-6}) : "") +
    tr("a_left_tail");
}


/* A switch, and it does not advance. Marking a test as not applicable and being
   thrown into the next one gave the operator no chance to see what had just
   happened, and no way back. Now the header shows the state and the same button
   clears it, so a test skipped by mistake costs one tap to recover. NEXT is
   still pressed by hand, which is also what writes the verdict. */
function toggleTestNA(){
  const t = current();
  if(!canTestNA(t)) return;
  const undo = allNA(t);
  if(!confirm(fmt(undo ? "a_na_test_undo" : "a_na_test", {s: L(t.label)}))) return;
  allUnits().forEach(u => {
    const r = row(u);
    // Every point of a skipped test is N/A too. Without this the report showed
    // the test as N/A while the spreadsheet listed each of its points as
    // PENDING — the same test, two answers, in two documents that are supposed
    // to agree.
    realPoints(t).forEach(p => {
      if(undo) delete r.points[p.id]; else r.points[p.id] = "NA";
    });
    if(undo){ r.verdict = null; r.code = null; r.failedPoints = []; }
    else {
      r.verdict = "N/A";
      r.seconds = Math.round((Date.now() - r.startedAt) / 1000);
    }
  });
  // Hand the sections back to the automatic fold rule: closed when the test is
  // N/A, open again the moment it stops being.
  sectionsOf(t).forEach(s => { delete S.open[secKey(s.name)]; });
  window.scrollTo(0, 0);
  render(); save();
}
function prevTest(){
  if(S.index > 0){ S.index--; window.scrollTo(0,0); render(); save(); }
}

/* One speaker's verdict. A speaker whose checklist is not finished is
   INCOMPLETE, never PASS — an empty list must not read as "everything fine". */
function unitVerdict(rows){
  const rs = rows || [];
  // Walked by index, never with .some/.every: jumping straight to test 11 from
  // the index screen leaves 0-9 as *holes*, and array methods skip holes. That
  // read as "no unanswered test found" and reported a green PASS on an
  // inspection where ten tests had never been opened.
  const n = tests().length;
  let missing = false;
  for(let i = 0; i < n; i++){
    const r = rs[i];
    if(r && r.verdict === "FAIL") return "FAIL";
    if(!r || !r.verdict) missing = true;
  }
  return missing ? "INCOMPLETE" : "PASS";
}
/* The verdict is stored as a key, never as text: the report is issued in both
   languages from the same answers, so it has to be translated at print time. */
/* The CSS class for a verdict. Never the verdict itself: "N/A" carries a slash,
   which is not a valid class selector, so a skipped test used to print with no
   colour. DOC is deliberately unstyled — documented is not a verdict. */
const verdictClass = v => v === "PASS" ? "PASS"
  : v === "FAIL" ? "FAIL"
  : v === "N/A" ? "NA"
  : v === "INCOMPLETE" ? "INCOMPLETE" : "";

/* The stored verdict is always the string "N/A" — that is the record. What gets
   printed is the word for it in the language of the document, which in Chinese
   is 不适用 and not a Latin abbreviation nobody there writes. */
const verdictText = v => v === "PASS" ? tr("ok")
  : v === "FAIL" ? tr("fail")
  : v === "INCOMPLETE" ? tr("incomplete")
  : v === "N/A" ? tr("na")
  : v === "DOC" ? tr("documented") : (v || tr("pending"));

const unitRows = i => S.data[i] || [];
const allUnits = () => Array.from({length:S.units}, (_,i) => i);

/* Verdict of the whole inspection: one failed speaker fails the lot. */
function finalVerdict(){
  const vs = allUnits().map(i => unitVerdict(unitRows(i)));
  if(vs.indexOf("FAIL") >= 0) return "FAIL";
  if(vs.indexOf("INCOMPLETE") >= 0) return "INCOMPLETE";
  return "PASS";
}

/* ---------- report -------------------------------------------------------- */
/* Referencia, orden y momento de cierre. Tres datos y en ese orden, porque es
   el orden en que se busca un informe: primero qué producto, luego qué orden,
   y sólo entonces cuál de las revisiones.

   Qué salió y por qué. El código de la cuenta abría el nombre y no aportaba —
   la fábrica ya se deduce de la referencia. El consecutivo diario, que existía
   para desempatar dos revisiones del mismo día, lo reemplaza la hora, que
   desempata mejor: el consecutivo se llevaba en cada teléfono por separado, así
   que dos inspectores de la misma fábrica producían el mismo `_02`. Dos relojes
   no coinciden al minuto.

   La marca PARTIAL se queda. Una inspección que sólo cubrió dos pruebas tiene
   que decirlo en el nombre, o dentro de seis meses nadie abre el archivo para
   averiguar por qué está incompleto.

   La orden lleva el prefijo del idioma en que se generó el archivo: OC en
   español, PO en inglés y chino. Se pega sin espacio —OC004477— porque un
   espacio en un nombre de archivo se convierte en %20 en cuanto se envía por
   correo o por WeChat. */
function fileName(){
  const clean = s => String(s||"").replace(/[^A-Za-z0-9._-]+/g,"-");
  const part = partialScope() ? "PARTIAL" : "";
  /* Nada de separadores fijos pegados a mano: lo que esté vacío desaparece y el
     resto se une igual. Una orden sin escribir dejaba dos guiones seguidos, que
     se leen como un nombre corrupto y no como el dato que falta. */
  return [clean(S.model),
          clean(poPrinted().replace(/\s+/g,"")),
          stampFin(),
          part].filter(Boolean).join("-") + ".html";
}

/* El momento en que se cerró la inspección, no el de la descarga. Descargar el
   paquete dos veces, o volver a descargarlo tras corregir una prueba, no puede
   cambiarle el nombre al archivo: sería otro archivo para la misma inspección.
   `finishedAt` se sella una sola vez, al terminar. */
function stampFin(){
  const d = new Date(S.finishedAt || Date.now()), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}` +
         `-${p(d.getHours())}${p(d.getMinutes())}`;
}

function dayStamp(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
}

/* Cuántas veces se ha nombrado hoy un archivo con esta referencia y esta orden.
   Se decide una vez por inspección y se guarda con ella: descargar el informe
   dos veces no puede cambiarle el nombre, y volver a abrir un borrador tampoco.
   El contador vive aparte, en el teléfono, y sólo conserva el día en curso.

   Sin llamadores desde la v13.9: el nombre del archivo lleva ahora la hora de
   cierre, que desempata mejor. Este contador se llevaba en cada teléfono por
   separado, así que dos inspectores de la misma fábrica revisando la misma
   referencia y la misma orden el mismo día generaban los dos un `_02` — dos
   archivos distintos con el mismo nombre. Se conserva por si algún día se
   quiere volver a un consecutivo, esta vez compartido. */
const SEQ_KEY = "hoklan_qc_seq";
function daySeq(){
  if(S.seq) return S.seq;
  const day = dayStamp();
  const base = String(S.model || "") + "|" + poPrinted();
  let m = {};
  try{ m = JSON.parse(localStorage.getItem(SEQ_KEY) || "{}") || {}; }catch(e){}
  Object.keys(m).forEach(k => { if(!m[k] || m[k].d !== day) delete m[k]; });
  const n = ((m[base] && m[base].n) || 0) + 1;
  m[base] = {d: day, n};
  try{ localStorage.setItem(SEQ_KEY, JSON.stringify(m)); }catch(e){}
  S.seq = n; save();
  return n;
}

/* Report layout follows the pre-shipment inspection format the client already
   receives from third-party inspectors: banner repeated on every page, numbered
   sections, a summary table that fits on the first page, numbered findings
   (R1, R2, …) with their evidence, and a conclusion page. Someone used to those
   reports can read this one without being told how. */
/* The HOKLAN mark, drawn rather than pasted: an SVG prints sharp at any size,
   weighs a few hundred bytes instead of a photograph, and has no black
   background to punch a hole in a white page. */
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96">
  <g fill="#0f3f6b">
    <text x="0" y="70" font-family="Helvetica,Arial,sans-serif"
      font-size="62" font-weight="300" letter-spacing="9">H</text>
    <text x="150" y="70" font-family="Helvetica,Arial,sans-serif"
      font-size="62" font-weight="300" letter-spacing="9">KLAN</text>
  </g>
  <g transform="translate(105,42)">
    <circle r="26" fill="none" stroke="#0f3f6b" stroke-width="6"/>
    <circle r="8" fill="#0f3f6b"/>
    <path d="M -26 0 A 26 26 0 0 1 -8 -24" fill="none" stroke="#fff"
      stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>`;
const LOGO_URL = "data:image/svg+xml;charset=utf-8," +
  encodeURIComponent(LOGO_SVG.replace(/\s+/g," "));

/* El logo, en la primera página. Antes iba `position:fixed`, y al imprimir
   Chrome dibuja los elementos fijos sólo en la primera hoja: la marca de agua
   aparecía una vez y desaparecía, que es peor que no tenerla. */
function watermark(){
  return `<div class="wm" aria-hidden="true">
    <img class="wm-mark" src="${LOGO_URL}" alt="">
  </div>`;
}

/* Identificación breve, delante de cada sección. La primera no la lleva: tiene
   el membrete completo encima. */
function runId(){
  return `<div class="runid"><span><b>HOKLAN QC</b> · ${esc(S.testId)} · ${
    esc(S.model)}</span><span>${esc(poPrinted() || "")}</span></div>`;
}

/* La leyenda diagonal, ahora como fondo repetido del documento. Un fondo sí se
   repite en todas las páginas al imprimir, y `print-color-adjust:exact` —que ya
   estaba— es lo que hace que el navegador lo pinte en vez de descartarlo. */
function wmBg(){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320">' +
    '<text x="20" y="170" transform="rotate(-32 280 160)" ' +
    'font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" ' +
    'letter-spacing="3" fill="#0f3f6b" fill-opacity="0.055">' +
    esc(tr("wm_line")) + '</text></svg>';
  return 'background-image:url("data:image/svg+xml;utf8,' +
         encodeURIComponent(svg).replace(/'/g, "%27") + '");background-repeat:repeat';
}

function shotStamp(ms){
  if(!ms) return "";
  const d = new Date(ms), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ` +
         `${p(d.getHours())}:${p(d.getMinutes())}`;
}

function buildFindings(){
  const out = [];
  allUnits().forEach(u => unitRows(u).forEach((r,i)=>{
    if(!r || r.verdict !== "FAIL") return;
    /* A row can outlive the test it was written against: the draft is kept on
       the phone and the plan is republished from here. When that happens the
       row has no test to read its points from, and reaching for `t.points`
       threw before a single finding was printed — the whole report died on the
       one inspection that had something to report. Skipping the row loses that
       test's findings and keeps every other one, which is the better half of a
       bad choice. `mediaList` already worked this way. */
    const t = tests()[i];
    if(!t) return;
    realPoints(t).forEach(p => {
      if(r.points[p.id] !== "FAIL") return;
      // Only the evidence captured on the point itself. Falling back to the
      // test-level photos would print the same picture under every finding of
      // that test, and the reader could not tell which defect is which.
      const note = ((r.notes && r.notes[p.id]) || "").trim();
      // The translated lines follow whichever note is printed: the point's own
      // if it has one, the test-level comment otherwise.
      const noteTr = note ? trSpans(r, "note", p.id) : trSpans(r, "comment");
      out.push({
        // The plan's label, not the one stored when the operator answered:
        // the report is issued in both languages, and a stored label would
        // print the answering language inside the other one's report.
        unit: u, test: L(t.label), point: pLab(p), code: p.code,
        desc: codeText(p.code), note: note || r.comment, noteTr: noteTr,
        media: shotsFor(r, p.id).filter(m => m.kind === "photo"),
        videos: shotsFor(r, p.id).filter(m => m.kind === "video")
      });
    });
  }));
  return out;
}

/* Every point of a test that passed, one row each, with a column per speaker.

   The obvious layout — repeat the whole checklist once per speaker — multiplies
   by five what is almost always the same answer five times, and turns a claim
   about one unit into a comparison somebody has to do by memory across pages.
   Side by side, a single ✗ in a row of ✓ says immediately that the fault is in
   that cabinet and not in the lot. Two hundred rows whatever the number of
   speakers, instead of two hundred per speaker.

   Photo sections document the shipment, not each unit: their pictures live on
   speaker 1 and their row carries one mark for the lot, said out loud rather
   than left looking like four missing answers. */
/* Every correction recorded on one point, across every unit, in the order they
   happened. A point that was answered once — which is nearly all of them —
   returns an empty list and prints nothing. */
function changesOf(testIndex, pointId){
  const out = [];
  allUnits().forEach(u => {
    const r = unitRows(u)[testIndex];
    const list = r && r.changes && r.changes[pointId];
    if(list) list.forEach(c => out.push(Object.assign({unit:u}, c)));
  });
  return out.sort((a, b) => a.at - b.at);
}
const changeMark = (testIndex, pointId) =>
  changesOf(testIndex, pointId).length ? `<span class="chg">⟳</span>` : "";

/* How long the first answer stood before it was corrected. Minutes, because
   nobody goes back inside of one, and hours once the inspection has been left
   and picked up again. */
function sinceText(from, to){
  if(!from || !to || to < from) return "";
  const mins = Math.round((to - from) / 60000);
  if(mins < 1) return fmt("chg_secs",{n: Math.max(1, Math.round((to-from)/1000))});
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? fmt("dur_hm",{h, m}) : fmt("dur_m",{m});
}

/* The line under the point, one per correction. The verdict is translated, the
   clock is not: a report read in three languages has to show the same hour. */
function changeLines(testIndex, pointId){
  const list = changesOf(testIndex, pointId);
  if(!list.length) return "";
  const word = v => v === "PASS" ? tr("ok") : v === "FAIL" ? tr("fail")
              : v === "NA" ? tr("na") : tr("pending");
  return `<div class="chg-l">${list.map(c => {
    const gap = sinceText(c.was, c.at);
    return esc([
      S.units > 1 ? fmt("speaker_n",{n: c.unit + 1}) : "",
      word(c.from) + (c.was ? " " + clockOnly(c.was) : ""),
      "→",
      word(c.to) + " " + clockOnly(c.at),
      gap ? "· " + gap : ""
    ].filter(Boolean).join(" "));
  }).join("<br>")}</div>`;
}

function pointsTable(b){
  const t = b.t;
  const secs = sectionsOf(t);
  if(!secs.length) return "";
  const many = S.units > 1;
  const isDoc = t.type === "photos";
  const cols = (many && !isDoc) ? S.units : 1;

  // A word when there is room for a word, a symbol when there are five columns.
  const mark = v => {
    if(v === "PASS") return `<span class="p">${many ? "✓" : tr("ok")}</span>`;
    if(v === "FAIL") return `<span class="f">${many ? "✗" : tr("fail")}</span>`;
    if(v === "NA")   return `<span class="na">${tr("na")}</span>`;
    return `<span class="na">—</span>`;
  };

  let rows = "";
  secs.forEach(sec => {
    if(sec.name)
      rows += `<tr><td class="g" colspan="${cols + 1}">${esc(sec.name)}</td></tr>`;
    sec.points.forEach(p => {
      let cells = "";
      if(isDoc){
        /* The answer, now that these points have one. It used to be inferred
           from whether a photograph existed, which printed PASS next to a
           picture of the very defect the inspector had photographed. Older
           inspections carry no answer, so the old rule stays as the fallback. */
        const r0 = unitRows(0)[b.i];
        const rec = r0 ? r0.points[p.id] : "";
        const v = ANSWERED.indexOf(rec) >= 0 ? rec
                : (r0 && shotsFor(r0, p.id).length) ? "PASS" : "";
        cells = `<td class="c" colspan="${cols}">${mark(v)}</td>`;
      } else {
        for(let u = 0; u < cols; u++){
          const r = unitRows(u)[b.i];
          cells += `<td class="c">${mark(r ? r.points[p.id] : "")}</td>`;
        }
      }
      rows += `<tr><td>${esc(pLab(p))}${changeMark(b.i, p.id)}${
        changeLines(b.i, p.id)}</td>${cells}</tr>`;
    });
  });
  if(!rows) return "";

  const head = `<tr><th>${tr("th_point")}</th>${
    (many && !isDoc)
      ? allUnits().map(i => `<th class="c" style="width:44px">${
          fmt("speaker_short",{n:i+1})}</th>`).join("")
      : `<th class="c" style="width:96px">${tr("th_result")}</th>`}</tr>`;

  return `<table class="pts">${head}${rows}</table>${
    isDoc && many ? `<p class="pts-n">${tr("doc_once")}</p>` : ""}`;
}

function reportHtml(){
  const v = finalVerdict();
  const colour = v === "PASS" ? "#17743a" : v === "FAIL" ? "#b3261e" : "#9a6b00";
  const findings = buildFindings();
  const scope = partialScope();
  let shot = 0;   // running photo number across the whole report

  /* The names the packet will give the videos, computed exactly as buildPacket
     computes them — same order, same duplicate counter. Printing the original
     phone name (IMG_4471.MOV) would name a file that exists nowhere. */
  const videoFiles = {};
  (function(){
    const seen = {};
    mediaList().forEach(v => {
      let stem = mediaName(v,1), n = 1;
      while(seen[stem]) stem = mediaName(v, ++n);
      seen[stem] = true;
      if(v.m.kind !== "video") return;
      const ext = (v.m.name && v.m.name.indexOf(".") >= 0)
        ? v.m.name.split(".").pop().toLowerCase().slice(0,4) : "mp4";
      videoFiles[v.m.uid] = stem + "." + ext;
    });
  })();

  const banner = `<div class="bnr">
    <div class="bnr-l"><b>HOKLAN</b><span>QC</span></div>
    ${/* La orden de compra en lugar de la fecha. Es el dato por el que se busca
          un informe; la fecha sigue en la sección I, y allí además como rango
          cuando la inspección cruza la medianoche. */""}
    <div class="bnr-c"><b>${tr("report_title")}</b>
      <span>${tr("test_id")}: ${esc(S.testId)} &nbsp;|&nbsp; ${
        esc(poPrinted() || "—")}</span></div>
    <div class="bnr-r"><span>${tr("overall")}</span><b style="color:${colour}">${verdictText(v)}</b></div>
  </div>`;

  let h = `<!DOCTYPE html><html lang="${LANG==="zh"?"zh-CN":"en"}"><head><meta charset="utf-8">
<title>QC ${esc(S.testId)} ${esc(S.model)}</title><style>
*{box-sizing:border-box}
/* El fondo blanco es explícito a propósito. Sin él el lienzo queda transparente
   y un navegador en modo oscuro pinta texto azul marino sobre negro: en papel
   se veía bien y en pantalla no se leía. */
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  color:#16212e;background:#fff;max-width:900px;margin:0 auto;padding:14px;
  font-size:11pt;${wmBg()}}
/* Márgenes del PDF fijados aquí. La cabecera automática del navegador —la URL y
   el número de página— no se puede quitar desde el archivo: es una casilla del
   diálogo de impresión, y el READ_ME del paquete se lo dice al operador. */
@page{margin:14mm}
/* Identificación al principio de cada sección. No es un membrete repetido por
   página —los navegadores no lo soportan sin reestructurar el documento—, pero
   como cada sección evita partirse, cae cerca de cada corte de hoja y ninguna
   queda sin decir a qué inspección pertenece. */
.runid{display:flex;justify-content:space-between;gap:10px;font-size:7.5pt;
  color:#5b6b7c;border-bottom:1px solid #b9c6d4;padding-bottom:3px;
  margin:0 0 7px;letter-spacing:.2px}

  align-items:center;gap:6px}

.idbox{display:flex;align-items:flex-start;gap:10px}

.att{font-size:8.5pt;color:#0f3f6b;margin-top:6px;padding:5px 8px;
  background:#eef4fa;border-left:3px solid #0f3f6b;
  page-break-inside:avoid;break-inside:avoid}

/* Watermark. Fixed rather than tiled on the body, because a fixed element is
   what browsers repeat on every printed page; a background image would only
   appear on the first one. It sits under the content, never over it: a
   watermark that competes with a defect photo is worse than none. */
.wm{position:absolute;left:0;top:0;width:100%;height:640px;z-index:0;
  pointer-events:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.wm-mark{width:46%;max-width:360px;opacity:.07}
.wm-rows{position:absolute;left:-25%;top:-25%;width:150%;height:150%;
  transform:rotate(-32deg);display:flex;flex-wrap:wrap;
  align-content:space-around;justify-content:space-around;opacity:.055}
.wm-rows span{white-space:nowrap;padding:16px 30px;font-size:12pt;
  font-weight:700;letter-spacing:3.5px;color:#0f3f6b;text-transform:uppercase}
/* Two selectors on purpose: in the exported file the report is made of body
   children, while the in-app preview nests the same markup inside #report. */
body > *:not(.wm), #report > *:not(.wm){position:relative;z-index:1}

@media print{
  body{padding:0;max-width:none;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  ${/* `position:running(top)` era de un estándar de maquetación paginada que
        ningún navegador implementa: se ignoraba en silencio y la cabecera salía
        sólo en la página 1. La identificación va ahora en `.runid`, repetida al
        principio de cada sección. */""}
  .sec,.find,.cell{page-break-inside:avoid}
  .runid{page-break-after:avoid}
  .brk{page-break-before:always}
}
</style></head><body>
${watermark()}
${banner}

<div class="sec"><i>I</i><b>${tr("general_info")}</b></div>
<div class="idbox">
<table>
  <tr><td class="k">${tr("test_id")}</td><td class="v nw">${esc(S.testId)}</td>
      <td class="k">${tr("inspection")}</td><td class="v">${
        /* Rango cuando cruza la medianoche. Con el envejecimiento de ocho horas
           una inspección que empieza de noche termina al día siguiente, y una
           sola fecha con hora de fin 01:25 debajo se lee como un error. */
        esc(dayOnly(S.startedAt) +
            (finishedAt() && dayOnly(finishedAt()) !== dayOnly(S.startedAt)
              ? " → " + dayOnly(finishedAt()) : ""))}</td></tr>
  <tr><td class="k">${tr("reference")}</td><td class="v nw">${esc(S.model)}</td>
      <td class="k">${tr("po")}</td><td class="v">${esc(poPrinted()||"—")}</td></tr>
  ${/* The clock in its own fields. The date above no longer carries the hour:
        it was the same information printed twice, and the two times are what
        the reader compares between one inspection and the next. */""}
  <tr><td class="k">${tr("time_start")}</td><td class="v">${
        esc(clockOnly(S.startedAt))}</td>
      <td class="k">${tr("time_end")}</td><td class="v">${
        finishedAt() ? esc(clockOnly(finishedAt())) : "—"}</td></tr>
  <tr><td class="k">${tr("duration")}</td><td class="v"><b>${
        esc(durationText(S.startedAt, finishedAt()))}</b></td>
      <td class="k">${tr("units_report")}</td><td class="v">${S.units}</td></tr>
  <tr><td class="k">${tr("operator")}</td><td class="v" colspan="3">${
        esc(S.operator)}</td></tr>
  ${/* The paired fields first, the full-width ones after. The result by speaker
        is the only field here that grows — with five speakers it prints five
        verdicts side by side — so it is the one given the whole row. */""}
  <tr><td class="k">${tr("by_unit")}</td><td class="v" colspan="3">${
        allUnits().map(i=>{
        const uv = unitVerdict(unitRows(i));
        return `<span class="${uv==="PASS"?"p":uv==="FAIL"?"f":"na"}">${
          fmt("speaker_n",{n:i+1})}: ${verdictText(uv)}</span>`;
      }).join(" &nbsp;|&nbsp; ")}</td></tr>
  <tr><td class="k">${tr("scope")}</td><td class="v" colspan="3">${
    scope ? `<b class="f">${fmt("scope_part",{n:scope.n, tot:scope.tot})}</b>`
          : tr("scope_full")}</td></tr>
  ${/* Three possible origins now, and they are three different acts. A HOKLAN
        inspector at the factory; the factory checking its own product; and the
        factory running a scope HOKLAN chose and published. The third one used
        to print as "HOKLAN inspection", which is the inaccuracy we found in the
        factory's own report. */""}
  <tr><td class="k">${tr("origin")}</td><td class="v" colspan="3">${
    S.selfCheck ? `<b class="f">${tr("origin_factory")}</b>`
    : S.assigned ? `<b>${tr("origin_assigned")}</b>`
                : tr("origin_hoklan")}</td></tr>
</table>
${refImgForReport()?`<div class="ri"><img src="${refImgForReport()}" alt=""></div>`:""}
</div>
${scope?`<p class="att">${tr("scope_part_note")}</p>`:""}
${/* The origin is already stated as a field in the table above; the paragraph
      that repeated it in prose said the same thing twice. */""}

${runId()}
<div class="sec"><i>II</i><b>${tr("inspection_summary")}</b></div>
<table>
  <tr><th>${tr("th_test")}</th><th class="c" style="width:60px">${tr("ok")}</th>
      <th class="c" style="width:60px">${tr("fail")}</th>
      <th class="c" style="width:60px">${tr("na")}</th>
      <th class="c" style="width:70px">${tr("th_result")}</th>
      <th style="width:110px">${tr("th_remark")}</th></tr>`;

  let rIndex = 0;
  allUnits().forEach(u => {
  // With several speakers the summary stays one table, split by a banner row.
  // Separate tables would break the column alignment the reader compares down.
  if(S.units > 1){
    const uv = unitVerdict(unitRows(u));
    h += `<tr><td colspan="5" style="background:#eef2f6;font-weight:700">
      ${fmt("speaker_n",{n:u+1})}</td>
      <td style="background:#eef2f6" class="${
        uv==="PASS"?"p":uv==="FAIL"?"f":"na"}">${verdictText(uv)}</td></tr>`;
  }
  unitRows(u).forEach((r,i)=>{
    if(!r) return;
    // A row left behind by a plan that has since changed. Same rule as in
    // buildFindings: no test, no row, rather than no report at all.
    const t = tests()[i];
    if(!t) return;
    if(t.type === "photos" && u > 0) return;   // documented once for the lot
    const defs = realPoints(t);
    let ok = 0, bad = 0, na = 0, refs = [];

    /* DOC counted photographs because these points had no answer. They have one
       now, so the counting rule is the same as everywhere else; the old rule
       stays only for an inspection recorded before they did. */
    if(r.verdict === "DOC" && !defs.some(p => ANSWERED.indexOf(r.points[p.id]) >= 0)){
      ok = defs.filter(p => shotsFor(r,p.id).length).length;
      na = defs.filter(p => r.points[p.id] === "NA").length;
    } else {
      defs.forEach(p => {
        const val = r.points[p.id];
        if(val === "PASS") ok++;
        else if(val === "FAIL"){
          bad++;
          // Only a test that was closed as FAIL produces findings, so only
          // those advance the R counter — otherwise this column cites an R
          // number that sections III and IV never print.
          if(r.verdict === "FAIL"){ rIndex++; refs.push("R"+rIndex); }
        }
        else if(val === "NA") na++;
      });
    }

    const label = r.verdict === "DOC" ? tr("documented")
                : r.verdict === "PASS" ? tr("ok")
                : r.verdict === "FAIL" ? tr("fail") : (r.verdict || tr("pending"));
    const cls = r.verdict === "FAIL" ? "f" : r.verdict === "PASS" ? "p" : "na";

    /* How long this row took, printed under the name of the test. Under it and
       not in a column of its own: the table is already six columns wide on a
       portrait page, and a seventh pushes the remark column off the sheet. */
    const rowTime = r.seconds ? secondsText(r.seconds) : "";

    h += `<tr><td>${esc(L(t.label))}${
        rowTime ? `<div class="ttime">${esc(rowTime)}</div>` : ""}</td>
      <td class="c">${ok||"—"}</td><td class="c ${bad?"f":""}">${bad||"—"}</td>
      <td class="c">${na||"—"}</td>
      <td class="c ${cls}">${label}</td>
      <td style="color:#e8720c">${refs.join(" ")}</td></tr>`;

    /* No comment row here any more. It existed because the findings sections
       cover failures only, so a remark about a test that passed had nowhere to
       go; section V now prints it under its test, with its translations. Left
       in both places it was the same paragraph twice, inside a table that is
       meant to be read as a column of results. The Obs. column above still
       carries the R numbers, which is what this table is for. */
  });
  });
  h += `</table>
    <p class="note">${tr("test_time_note")}</p>`;

  /* ---- Códigos que no se pudieron leer ----
     Va aquí arriba, junto al resumen, y no enterrado en el detalle de la prueba
     que lo pidió. El lector del informe pregunta primero qué falta, y un código
     ausente es de lo poco que este informe no puede reponer por sí solo: hay
     que ir a la fotografía. Decirlo tarde equivale a no decirlo.

     No es un hallazgo. Un código ilegible puede ser el producto —etiqueta mal
     impresa— o el teléfono del inspector, y el informe no puede decidirlo; por
     eso se informa aparte y no se cuenta como falla. Si la etiqueta está mal,
     el inspector lo registra como falla del punto, que es donde corresponde. */
  const unread = [];
  allUnits().forEach(u => {
    unitRows(u).forEach((r, i) => {
      const t = tests()[i];
      if(!r || !t) return;
      if(t.type === "photos" && u > 0) return;
      realPoints(t).forEach(p => {
        if(!p.scan || readingOf(r, p.id).trim() || !scanFailed(r, p.id)) return;
        unread.push({test:L(t.label), point:pLab(p), u,
                     why:tr(scanFailed(r, p.id) === "nodet" ? "scan_nodet"
                                                            : "scan_unread")});
      });
    });
  });
  if(unread.length)
    h += `<div class="scanwarn"><b>${tr("rep_scan_t")}</b>
      <p>${tr("rep_scan_i")}</p>
      <table>${unread.map(x => `<tr>
        <td><b>${esc(x.test)}</b> — ${esc(x.point)}${
          S.units>1 ? " · " + fmt("speaker_n",{n:x.u+1}) : ""}</td>
        <td class="w">${esc(x.why)}</td></tr>`).join("")}</table></div>`;

  /* ---- III WHAT WAS FOUND ----
     One line per finding, before any of them is opened. Until this existed the
     reader had to walk several pages of photographs to learn how many there
     were and what they were about; the detail belongs after that question is
     answered, not instead of it. */
  if(findings.length){
    h += `${runId()}<div class="sec"><i>III</i><b>${tr("nc_found")}</b></div>
      <p class="note">${tr("remarks_note")}</p>
      <table class="ncidx">${findings.map((f,k) => `<tr>
        <td class="r">R${k+1}</td>
        ${S.units>1?`<td class="u">${fmt("speaker_n",{n:f.unit+1})}</td>`:""}
        <td><b>${esc(f.test)}</b> — ${esc(f.point)}</td>
        ${/* Photographic points carry no code by design: their description is the
              observation the inspector wrote. An empty cell says that plainly;
              printing "undefined" said something else entirely. */""}
        <td class="cd">${esc(f.code || "—")}</td></tr>`).join("")}</table>`;
  }

  /* ---- IV THE FINDINGS IN FULL ---- */
  if(findings.length){
    h += `${runId()}<div class="sec"><i>IV</i><b>${tr("remarks")}</b></div>`;
    findings.forEach((f,k)=>{
      h += `<div class="find">
        <div class="find-h"><i>R${k+1}</i>
          <span>${S.units>1?`<b style="color:#0f3f6b">${
            fmt("speaker_n",{n:f.unit+1})}</b> · `:""}<b>${esc(f.test)}</b> — ${esc(f.point)}</span>
          <em>${esc(f.code || "")}</em></div>
        <div class="find-b">
          ${f.desc?`<div>${esc(f.desc)}</div>`:""}
          ${f.note?`<div class="note"><b>${tr("notes")}:</b> ${esc(f.note)}${
            f.noteTr}</div>`:""}
          ${f.videos && f.videos.length?`<div class="att">🎥 <b>${
            fmt("video_att",{n:f.videos.length})}</b><br>${
            f.videos.map(m => esc(videoFiles[m.uid] || m.name || "video"))
              .join("<br>")}</div>`:""}
          ${f.media.length?`<div class="grid" style="margin-top:6px">${
            f.media.map(s=>{ shot++; return `<div class="cell">
              <div class="ph"><img src="${s.url}">
                <span class="ts">${shotStamp(s.at)}</span></div>
              <div class="cap">#${shot} R${k+1}</div></div>`; }).join("")}</div>`:""}
        </div></div>`;
    });
  }

  /* ---- V THE TESTS THAT WERE RUN ----
     General evidence, the notes and the videos of each test. The pictures of a
     specific defect were already printed with their finding in IV, and
     printing them twice makes the report look padded and the numbering harder
     to follow — so the same rule applies to a video already named up there.

     Every test appears here, not only the ones that passed, with its result
     beside its name. The bench photo and the video of a section document how
     the test was run, not how it came out: filing them only under the tests
     that passed would drop them exactly where a claim will ask for them. */
  const general = r => (r.media || []).filter(m => m.kind === "photo" && !m.slot);
  const shownVideos = {}, shownPhotos = {};
  findings.forEach(f => {
    (f.videos || []).forEach(m => { shownVideos[m.uid] = true; });
    (f.media  || []).forEach(m => { shownPhotos[m.uid] = true; });
  });

  /* One block per test rather than per speaker. General evidence, the notes and
     the videos all document the test itself, not any one unit — they live on
     speaker 1 because they have to live somewhere — so there is no SPEAKER
     banner here: it would claim the bench photo shows unit 1 in particular.
     Videos are the exception: one attached to a defect on speaker 3 is filed
     against speaker 3, so they are collected across every unit and each says
     which point and which speaker it belongs to. */
  const blocksV = tests().map((t,i) => {
    const r0 = unitRows(0)[i];
    const isDoc = t.type === "photos";
    const photos = !r0 ? []
      : isDoc ? r0.media.filter(m => m.kind === "photo") : general(r0);
    const videos = [];
    allUnits().forEach(u => {
      const r = unitRows(u)[i];
      if(!r) return;
      (r.media || []).forEach(m => {
        if(m.kind === "video" && !shownVideos[m.uid]) videos.push({m, u});
      });
    });
    /* Photos attached to a point that asked for one, on a test that is not a
       photo section. Without this they printed nowhere: the findings section
       shows the pictures of failures and this one only the general evidence, so a
       display word photographed and passed left no trace in the report. */
    const pointShots = [];
    if(!isDoc){
      realPoints(t).forEach(p => {
        if(!p.photo) return;
        allUnits().forEach(u => {
          const r = unitRows(u)[i];
          if(!r) return;
          shotsFor(r, p.id)
            .filter(m => m.kind === "photo" && !shownPhotos[m.uid])
            .forEach(m => pointShots.push({m, p, u}));
        });
      });
    }

    /* The readings of this test, one line per speaker. They are printed as
       text and not only inside the photograph of the instrument, because a
       number in a picture cannot be compared, summed or put in a column. */
    const reads = [];
    realPoints(t).forEach(p => {
      if(!p.measure) return;
      allUnits().forEach(u => {
        const rr = unitRows(u)[i];
        const v = rr ? readingOf(rr, p.id).trim() : "";
        if(!v){
          /* Un código que el lector no pudo descifrar se imprime igual, y dice
             que no se leyó. Omitirlo dejaba el informe sin rastro de que en ese
             renglón faltaba un número, que es justo lo que hay que saber. */
          if(p.scan && rr && scanFailed(rr, p.id))
            reads.push({label:pLab(p), v:"", unit:"", u, no:true});
          return;
        }
        reads.push({label:pLab(p), v, unit:unitText(p.measure), u});
      });
    });

    const note = ((r0 && r0.comment) || "").trim();
    const noteTr = r0 ? trSpans(r0, "comment") : "";
    /* The verdict of the test across every speaker, not the verdict of speaker
       one. A test that passed on unit 1 and failed on unit 2 is a failed test:
       reading r0 alone filed it under the tests that passed, next to a table
       showing its own ✗ two columns to the right. */
    let verdict = null;
    allUnits().forEach(u => {
      const rr = unitRows(u)[i];
      if(!rr || !rr.verdict) return;
      if(rr.verdict === "FAIL") verdict = "FAIL";
      else if(verdict !== "FAIL") verdict = verdict === "PASS" ? "PASS" : rr.verdict;
      if(rr.verdict === "PASS" && verdict !== "FAIL") verdict = "PASS";
    });

    return {t, i, r0, isDoc, photos, pointShots, videos, note, noteTr, reads,
            verdict};
  });

  /* Two different questions, so two different tables. Section II says how each
     test came out; the one below says what backs it up — how many photographs,
     how many clips, what was measured, whether the inspector wrote anything.
     That is the question a claim asks first, and until now the report answered
     it only by making somebody count pictures.

     Every test that was answered has a row here, N/A ones included: a reader
     counting tests in this table has to find all twelve, or it looks as though
     one went missing. Only the tests that left something behind get a block of
     their own further down — there is nothing to detail about a test the
     reference does not have. */
  /* The general evidence of a test that failed — the bench photograph, the clip
     of the section being run — printed at the end of section IV, under the
     findings it belongs to. It documents how the test was performed, not how it
     came out, so it cannot travel with the tests that passed; and dropping it
     would lose exactly the material a claim asks for. */
  const badV = blocksV.filter(b => b.verdict === "FAIL" &&
    (b.photos.length || b.videos.length || b.pointShots.length ||
     b.note || b.reads.length));
  badV.forEach(b => {
    /* The time is worth as much on a test that failed as on one that passed —
       more, in fact: a test that failed in forty seconds and one that failed
       after twenty minutes of trying describe different problems, and the
       report used to read the same either way. */
    const bt = secondsText(testSeconds(b));
    h += `<div class="sec" style="background:#fdf2ee"><i>&nbsp;</i><b>${
      esc(L(b.t.label))}</b>${bt ? `<span style="padding:6px 0 6px 10px;
      font-size:8pt;color:#a8887a;font-style:italic">${esc(bt)}</span>` : ""
      }<em style="margin-left:auto;padding:6px 12px;
      font-style:normal;font-size:8.5pt;color:#8a6a5c">${
      tr("test_evidence")}</em></div>`;

    if(b.reads.length)
      h += `<table class="reads"><tr><th>${tr("th_point")}</th>${
        S.units>1?`<th style="width:110px">${tr("speaker")}</th>`:""
        }<th class="c" style="width:110px">${tr("measured")}</th></tr>${
        b.reads.map(x => `<tr><td>${esc(x.label)}</td>${
          S.units>1?`<td>${fmt("speaker_n",{n:x.u+1})}</td>`:""
          }<td class="c">${x.no ? `<b class="nord">${tr("rep_scan_no")}</b>`
            : `<b>${esc(x.v)}</b> ${esc(x.unit)}`}</td></tr>`).join("")}</table>`;

    if(b.note)
      h += `<p class="note"><b>${tr("notes")}:</b> ${esc(b.note)}${b.noteTr}</p>`;

    if(b.videos.length)
      h += `<div class="att">🎥 <b>${fmt("video_att",{n:b.videos.length})}</b><br>${
        b.videos.map(v => {
          const p = v.m.slot ? realPoints(b.t).find(x => x.id === v.m.slot) : null;
          return esc([videoFiles[v.m.uid] || v.m.name || "video",
                      p ? pLab(p) : "",
                      S.units > 1 && !b.isDoc ? fmt("speaker_n",{n:v.u+1}) : ""]
                     .filter(Boolean).join("  ·  "));
        }).join("<br>")}</div>`;

    const cells = b.pointShots.map(s => ({url:s.m.url, at:s.m.at,
        cap: L(s.p.label) + (S.units > 1 ? " · " + fmt("speaker_n",{n:s.u+1}) : "")}))
      .concat(b.photos.map(s => ({url:s.url, at:s.at, cap: L(b.t.label)})));
    if(cells.length)
      h += `<div class="grid">${cells.map(c => {
        shot++;
        return `<div class="cell"><div class="ph"><img src="${c.url}">
          <span class="ts">${shotStamp(c.at)}</span></div>
          <div class="cap">#${shot} ${esc(c.cap)}</div></div>`;
      }).join("")}</div>`;
  });

  /* Only the tests that came out clean. The ones that failed are already in
     III and IV, with their evidence, and repeating them here made this section
     a second copy of the summary table.

     N/A is excluded too, and that was a real defect: the filter used to be
     "anything that did not fail", so a test the reference cannot even perform
     was printed under the heading TESTS PASSED. A speaker with no SD slot came
     out of the inspection with its SD test certified. Not applicable is not a
     result, and it now has a list of its own below. */
  const okV = blocksV.filter(b =>
    b.verdict && b.verdict !== "FAIL" && b.verdict !== "N/A");
  const naV = blocksV.filter(b => b.verdict === "N/A");

  if(okV.length){
    h += `<div class="brk"></div>${runId()}
      <div class="sec"><i>V</i><b>${tr("tests_ok")}</b></div>`;

    okV.forEach(b => {
      /* Everything the test carries, across every speaker. A test with no
         evidence at all still gets its line: the reader has to be able to see
         that it was run and what it came out at. */
      let shots = 0, clips = 0;
      allUnits().forEach(u => {
        const rr = unitRows(u)[b.i];
        if(!rr) return;
        (rr.media || []).forEach(m => {
          if(m.kind === "photo") shots++; else clips++;
        });
      });
      const bits = [];
      if(shots) bits.push(fmt("n_photos",{n:shots}));
      if(clips) bits.push(fmt("n_videos",{n:clips}));

      const okTime = secondsText(testSeconds(b));

      h += `<table class="okt"><tr>
        <td class="k">${esc(L(b.t.label))}${
          okTime ? `<div class="ttime">${esc(okTime)}</div>` : ""}</td>
        <td class="v">
          <div><span class="${verdictClass(b.verdict === "PASS" ? "PASS" : "N/A")}">${
            verdictText(b.verdict)}</span>${bits.length ? " · " + bits.join(" · ") : ""}</div>
          ${b.reads.map(x => `<div>${esc(x.label)}${
            S.units>1 ? " · " + fmt("speaker_n",{n:x.u+1}) : ""
            }: ${x.no ? `<b class="nord">${tr("rep_scan_no")}</b>`
                      : `<b>${esc(x.v)}</b> ${esc(x.unit)}`}</div>`).join("")}
          ${b.note
            ? `<div><b>${tr("notes")}:</b> ${esc(b.note)}</div>${
                b.noteTr ? `<div class="okt-tr">${b.noteTr}</div>` : ""}`
            : `<div class="okt-no">${tr("no_remarks")}</div>`}
        </td></tr></table>${pointsTable(b)}`;
    });
  }

  /* The photographs and clips of the tests that passed, kept out of the list
     above so it stays readable, and printed together underneath it. */
  const detailV = okV.filter(b => b.photos.length || b.pointShots.length
                 || b.videos.length);

  if(detailV.length){
    detailV.forEach(b => {
      // Only the name here: the result, the readings and the remark were
      // printed in the list above, and repeating them over every block of
      // photographs is what made this section read as a third summary.
      h += `<div class="sec" style="background:#f7f9fb"><i>&nbsp;</i><b>${
        esc(L(b.t.label))}</b></div>`;

      if(b.videos.length)
        h += `<div class="att">🎥 <b>${fmt("video_att",{n:b.videos.length})}</b><br>${
          b.videos.map(v => {
            const p = v.m.slot ? realPoints(b.t).find(x => x.id === v.m.slot) : null;
            return esc([videoFiles[v.m.uid] || v.m.name || "video",
                        p ? pLab(p) : "",
                        S.units > 1 && !b.isDoc ? fmt("speaker_n",{n:v.u+1}) : ""]
                       .filter(Boolean).join("  ·  "));
          }).join("<br>")}</div>`;

      if(b.pointShots.length){
        h += `<div class="grid">${b.pointShots.map(s=>{
          shot++;
          return `<div class="cell"><div class="ph">${isPdfMedia(s.m)
              ? `<u class="doc"><b>PDF</b><i>${esc(docName(s.m))}</i></u>`
              : `<img src="${s.m.url}">`}
            <span class="ts">${shotStamp(s.m.at)}</span></div>
            <div class="cap">#${shot} ${esc(L(s.p.label))}${
              S.units > 1 ? " · " + fmt("speaker_n",{n:s.u+1}) : ""}</div></div>`;
        }).join("")}</div>`;
      }

      if(b.photos.length){
        h += `<div class="grid">`;
        if(b.isDoc){
          realPoints(b.t).forEach(p => {
            shotsFor(b.r0, p.id).forEach(s => {
              shot++;
              h += `<div class="cell"><div class="ph"><img src="${s.url}">
                <span class="ts">${shotStamp(s.at)}</span></div>
                <div class="cap">#${shot} ${esc(pLab(p))}</div></div>`;
            });
          });
        } else {
          const bad = b.r0 && b.r0.verdict === "FAIL";
          b.photos.forEach(s => {
            shot++;
            h += `<div class="cell"><div class="ph"><img src="${s.url}">
              <span class="ts">${shotStamp(s.at)}</span></div>
              <div class="cap">#${shot} ${esc(L(b.t.label))} | <span class="${
                bad?"f":"p"}">${bad?tr("fail"):tr("ok")}</span></div></div>`;
          });
        }
        h += `</div>`;
      }
    });
  }

  /* Videos cannot be embedded in a printable report, so they are listed. This
     runs over every speaker independently of section IV: a video attached to a
     defect on speaker 3 has no general photo next to it and would otherwise
     never be mentioned anywhere. */
  const vids = [];
  allUnits().forEach(u => unitRows(u).forEach(r => {
    if(!r) return;
    (r.media || []).forEach(m => { if(m.kind === "video") vids.push(m); });
  }));
  if(vids.length) h += `<p class="note">${fmt("videos_n",{n:vids.length})}</p>`;

  /* ---- VI TESTS NOT APPLICABLE ----
     A short list, on purpose: there is nothing to detail about a test that was
     not run. What it has to answer is the question a reader of section II asks
     — why does the plan have fourteen tests and the summary only twelve — and
     it answers it without letting any of them borrow the word "passed". */
  if(naV.length){
    h += `${runId()}<div class="sec"><i>VI</i><b>${tr("tests_na")}</b></div>
      <p class="na-note">${tr("tests_na_note")}</p>
      <table class="nal">${naV.map(b => `<tr>
        <td class="nm">${esc(L(b.t.label))}</td>
        <td>${b.note ? esc(b.note) : "—"}</td></tr>`).join("")}</table>`;
  }

  /* ---- CONCLUSION ---- */
  h += `${runId()}<div class="sec"><i>${naV.length ? "VII" : "VI"}</i><b>${
    tr("conclusion")}</b></div>
    ${S.units>1?`<table style="margin-bottom:10px">
      <tr><th>${tr("speaker")}</th><th class="c" style="width:90px">${tr("th_result")}</th>
        <th style="width:180px">${tr("failures")}</th></tr>
      ${allUnits().map(i=>{
        const uv = unitVerdict(unitRows(i));
        const cs = unitRows(i).filter(r=>r&&r.verdict==="FAIL")
          .reduce((a,r)=>a.concat((r.failedPoints||[]).map(p=>p.code)),[]);
        return `<tr><td>${fmt("speaker_n",{n:i+1})}</td>
          <td class="c ${uv==="PASS"?"p":uv==="FAIL"?"f":"na"}">${verdictText(uv)}</td>
          <td>${esc(cs.join(", ")) || "—"}</td></tr>`;
      }).join("")}
    </table>`:""}
    ${/* The verdict alone on the left, everything that qualifies it stacked on
          the right. Wide and shallow: it is the last line of a document, not a
          poster, and the right-hand block can grow — partial scope, factory
          origin — without the box changing shape. */""}
    <div class="concl">
      <b>${verdictText(v)}</b>
      <div class="cx">
        <span>${tr("operator")}: ${esc(S.operator)} · ${
          esc(inspectionDate(S.startedAt))}</span>
        <span>${findings.length ? fmt("concl_fail",{n:findings.length})
                                : tr("concl_pass")}</span>
        ${/* The partial scope is not repeated here. It is stated as a field in
              section I and again in the note under it, and a third time inside
              the conclusion it read as a second verdict. */""}
      </div>
    </div>
    ${/* The signature and nothing else. The note about where the photo
          timestamps come from is a caveat about the evidence, not part of the
          conclusion, and it is already in the READ_ME of the packet — next to
          the photographs it is talking about. Here it only made the last line
          of a signed document look like a disclaimer. */""}
    <div class="foot">HOKLAN QC · KŌHIN v${plan().plan_version}</div>`;

  return h + `</body></html>`;
}

/* The report is drawn at once from what is already translated, then redrawn if
   a pending translation lands: waiting on the network before showing anything
   would leave the operator looking at a blank screen on a bad connection. */
function showReport(){
  S.screen = "report";
  render();
  Promise.all([ensureTranslations(), ensureRefImg()])
    .then(() => { if(S.screen === "report") render(); });
}

/* One tap, one file. The button used to open the print dialog, which is the only
   way a browser can write a real PDF — and on a factory phone that dialog is the
   step where the whole thing falls over: it is slow, it looks nothing like the
   rest of the app, and on some in-app browsers it does nothing at all.

   What comes down instead is the report itself, byte for byte the same document
   that travels as REPORT_ES.html inside the ZIP, built from the same function in
   the same language. Whoever needs a PDF opens that file and prints it, once,
   on a computer — which is where a signed PDF is wanted anyway.

   The dialog version — an off-screen iframe holding its own copy of the report,
   printed from there so the operator never saw the document — was removed once
   nothing called it. It had grown two fallbacks of its own for the browsers that
   refuse to write into an iframe, and all of it was dead weight behind a button
   that goes straight to this function. */
/* Sin llamadores desde la v13.4: era la que colgaba del botón «descargar reporte
   básico», retirado de la pantalla de cierre. Se conserva entera, con su clave
   de idioma `save_report_dl`, porque reponer el botón es una línea en
   `renderDone`. Quien quiera hoy el informe suelto lo baja desde «Ver informe /
   Guardar PDF», que usa `printReport`. */
async function savePdfNow(){
  showSaved(tr("pdf_wait"));
  try{ await Promise.all([ensureTranslations(), ensureRefImg()]); }catch(e){}
  /* Named once and reused. Calling fileName() twice stamped the clock twice,
     and a minute boundary between them meant the message on screen quoted a
     file the operator would not find. */
  const name = fileName();
  saveBlob(new Blob([reportHtml()], {type:"text/html;charset=utf-8"}), name);
  showSaved(fmt("saved_report",{f: name}));
}

/* The PDF has to arrive with the same name as the ZIP, so that a report sent on
   its own and the full packet of the same inspection sit next to each other in
   a folder instead of looking like two unrelated files.

   Browsers take the suggested PDF file name from the document title — there is
   no API for it — so the title is swapped for the packet name, the dialog is
   opened, and the title is put back. It is restored on `afterprint`, plus a
   timeout: that event never fires in some mobile browsers, and leaving the tab
   titled with the packet name would also rename the home-screen shortcut. */
function printReport(){
  /* The real title, captured once and kept. Reading `document.title` on every
     press was the bug: `afterprint` does not fire on several mobile browsers,
     so a second press while the first was still waiting captured the packet
     name as though it were the app's title and put that back — permanently,
     including on the home-screen shortcut. And each press left another
     `afterprint` listener on window, since {once:true} only removes one that
     actually fires. Both go away by remembering the title the first time and
     keeping a single listener. */
  if(!printReport.title) printReport.title = document.title;
  if(printReport.timer) clearTimeout(printReport.timer);
  const prev = printReport.title;
  let restored = false;
  const restore = () => {
    if(restored) return;
    restored = true;
    document.title = prev;
  };
  document.title = packetName();
  if(!printReport.bound){
    printReport.bound = true;
    window.addEventListener("afterprint", () => { document.title = printReport.title; });
  }
  printReport.timer = setTimeout(restore, 120000);
  try{ window.print(); }
  finally{
    // On desktop print() blocks until the dialog closes, so by here the name has
    // already been used and the title can go back immediately. On mobile it
    // returns at once and `afterprint` does the job instead.
    setTimeout(restore, 1500);
  }
}

/* ---------- spreadsheet export --------------------------------------------
   One row per checked point, not one per test. That is what lets Quality
   pivot the data later - "which USB defect is most common across YIS?" - which
   a one-row-per-inspection sheet can never answer.

   CSV with a UTF-8 BOM: Excel needs the BOM or every Chinese character opens
   as mojibake, and CSV avoids the "file format does not match extension"
   warning that a fake .xls throws in current Excel.
--------------------------------------------------------------------------- */
function csvCell(v){
  const s = String(v === null || v === undefined ? "" : v);
  return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function reportCsv(){
  /* Two kinds of column on purpose:
     · *_key  — language-independent identifiers. Group and filter on these,
                otherwise an English CSV and a Chinese one split the same test
                into two rows in the dashboard.
     · label  — human text in whatever language the operator used, for reading. */
  /* `Speaker` and `Speaker result` come before the point columns so the sheet
     can be filtered or pivoted by unit: with 5 speakers the same point_key
     appears 5 times, and without this column they would be indistinguishable
     and would collapse into one another in the dashboard. */
  const head = LANG === "zh"
    ? ["测试编号","型号","订单号","检验员","检验日期","最终结果","检验范围","来源",
       "音箱","音箱数量","音箱结果",
       "test_key","point_key","result_key",
       "测试","分组","检查项","结果","代码","代码说明","实测值","单位",
       "备注","备注（翻译）","照片数"]
    : LANG === "es"
    ? ["Código de prueba","Referencia","OC","Inspector","Fecha","Resultado final",
       "Alcance","Origen","Parlante","Parlantes","Resultado del parlante",
       "test_key","point_key","result_key",
       "Prueba","Sección","Punto","Resultado","Código","Descripción del código",
       "Medición","Unidad","Observaciones","Observaciones (traducción)","Fotos"]
    : ["Test ID","Reference","PO","Operator","Inspection","Final result","Scope",
       "Origin","Speaker","Speakers","Speaker result",
       "test_key","point_key","result_key",
       "Test","Section","Point","Result","Code","Code description",
       "Measurement","Unit","Notes","Notes (translated)","Photos"];

  // The scope travels on every row: a dashboard that groups by test_key has to
  // be able to exclude partial inspections, and it can only do that if the
  // column is on the row it is reading.
  const sc = partialScope();
  const base = [S.testId, S.model, S.po, S.operator,
                inspectionDate(S.startedAt), finalVerdict(),
                sc ? fmt("scope_part",{n:sc.n, tot:sc.tot}) : tr("scope_full"),
                S.selfCheck ? tr("origin_factory")
                  : S.assigned ? tr("origin_assigned") : tr("origin_hoklan")];
  const rows = [head];

  allUnits().forEach(u => {
  const lead = base.concat([u + 1, S.units, unitVerdict(unitRows(u))]);
  unitRows(u).forEach((r,i)=>{
    if(!r) return;
    const t = tests()[i];
    if(!t) return;   // row from a plan that has changed since; see buildFindings
    // Photo tests document the shipment, not each speaker: the pictures live
    // on speaker 1 only, so emitting them again for 2..N would write rows that
    // look pending when the documentation is in fact complete.
    if(t.type === "photos" && u > 0) return;
    let section = "";

    pointsOf(t).forEach(p => {
      if(p.section){ section = L(p.section); return; }

      let key, result, code = "", desc = "", photos = shotsFor(r, p.id).length;
      let note = ((r.notes && r.notes[p.id]) || "").trim();
      if(t.type === "photos"){
        key = r.points[p.id] === "NA" ? "NA" : photos ? "DOC" : "PENDING";
        result = key === "NA" ? tr("na")
               : key === "DOC" ? tr("documented") : tr("pending");
      } else {
        const v = r.points[p.id];
        key = v || "PENDING";
        result = v === "PASS" ? tr("ok") : v === "FAIL" ? tr("fail")
               : v === "NA" ? tr("na") : tr("pending");
        if(v === "FAIL"){ code = p.code || ""; desc = codeText(p.code); }
        // A failed point carries its own count and its own note; anything else
        // reports the test-level evidence.
        if(v !== "FAIL"){ photos = r.media.filter(m => !m.slot).length; note = ""; }
      }

      // Both columns describe the same note: the original as the inspector
      // wrote it, and the other two languages beside it, each named. Whichever
      // note is printed, its own translations go next to it — never another
      // point's. One cell rather than one column per language, so the sheet
      // keeps the shape the consolidator and the dashboard already read.
      const shownNote = note || r.comment || "";
      const shownEn = trAll(r, note ? "note" : "comment", note ? p.id : null)
        .map(x => x.label + ": " + x.text).join("  |  ");

      // The reading in its own column, and the unit beside it rather than
      // inside: "96.4" in a cell can be added up and charted, "96.4 dB" is text.
      rows.push(lead.concat([
        t.id, p.id, key,
        L(t.label), section, pLab(p), result, code, desc,
        p.measure ? readingOf(r, p.id) : "",
        p.measure ? unitKey(p.measure) : "",
        shownNote, shownEn || "", photos
      ]));
    });
  });
  });

  return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}

/* ---------- the packet ----------------------------------------------------
   Everything the inspection produced travels as one file: the report, the
   spreadsheet and the videos. Sending three separate attachments over WeChat
   is how one of them gets lost.
