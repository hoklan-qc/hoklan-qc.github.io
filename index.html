           ------------------------------------------------------------------ */
        {"id":"DSP_MODES","optional":false,"only_factory":["RHY"],"evidence":["video"],
         "skip":["HK-BAS115A1","HK-BAS118A1","HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"DSP MODES","zh":"DSP 模式","es":"MODOS DSP"},
         "steps":[
           {"en":"With audio playing, press the DSP MODE button","zh":"在有音频播放时按下 DSP 模式键","es":"Con audio sonando, pulse la tecla MODOS DSP"},
           {"en":"Step through the whole cycle, listening on each mode","zh":"走完整个循环，逐个模式细听","es":"Recorra el ciclo completo, escuchando en cada modo"},
           {"en":"Write down the names exactly as this panel prints them","zh":"按本面板的印字原样记录各模式名称","es":"Anote los nombres tal como los imprime este panel"},
           {"en":"One clip stepping through the four modes is the evidence","zh":"证据为一段依次切换四个模式的视频","es":"La evidencia es un video recorriendo los cuatro modos"}],
         "points":[
           {"id":"dsp_names","code":"DSP-007","label":{"en":"Panel mode names match the reference","zh":"面板模式名称与型号一致","es":"Los modos del panel corresponden a la referencia"},
            "help":{"en":"Read the four names printed on this panel and photograph them. The fourth one changes with the model - BAJO on the HK-DEL115B1, MONITOR on the HK-EPS112A1 - so read the panel in front of you instead of working from a list. Check they match the order.",
                    "zh":"读取本面板上印的四个模式名称并拍照。第四个随型号而变——HK-DEL115B1 为 BAJO，HK-EPS112A1 为 MONITOR——因此请以眼前的面板为准，不要照搬清单。核对其与订单是否一致。",
                    "es":"Lea los cuatro nombres impresos en este panel y fotografíelos. El cuarto cambia según el modelo —BAJO en el HK-DEL115B1, MONITOR en el HK-EPS112A1—, así que lea el panel que tiene enfrente en vez de trabajar con una lista. Confirme que coinciden con la orden."}},
           {"id":"dsp_led_step","code":"LED-010","label":{"en":"The LED advances one per press","zh":"每按一次指示灯前进一格","es":"El LED avanza uno por pulsación"},
            "help":{"en":"Each press of DSP MODE must move the lit LED one place, skipping none and never lighting two at once.",
                    "zh":"每按一次 DSP 模式键，点亮的指示灯应前进一格，不得跳过，也不得同时亮起两个。",
                    "es":"Cada pulsación de MODOS DSP debe mover el LED encendido un puesto, sin saltarse ninguno y sin encender dos a la vez."}},
           {"id":"dsp_cycle","code":"DSP-005","label":{"en":"The cycle returns to the first mode","zh":"循环可回到第一个模式","es":"El ciclo vuelve al primero"},
            "help":{"en":"Keep pressing until it comes back to the first mode. It must close the cycle, not stall on the last one.",
                    "zh":"持续按键直至回到第一个模式。应能完成循环，而不是停在最后一个上。",
                    "es":"Siga pulsando hasta volver al primer modo. Debe cerrar el ciclo, no quedarse trabado en el último."}},
           {"id":"dsp_audible","code":"AUD-018","label":{"en":"Each mode sounds different","zh":"各模式声音互不相同","es":"Cada modo suena distinto"},
            "help":{"en":"With the same track playing, go through the four modes listening. Each one must change the sound audibly. Four modes that sound the same means the firmware was never loaded, and from the outside it looks identical to a good one.",
                    "zh":"用同一首曲目走完四个模式并细听，每个模式都应使声音发生可闻的变化。四个模式声音一样，说明固件根本没有烧录，而从外观上与正常机器毫无区别。",
                    "es":"Con la misma pista sonando, recorra los cuatro modos escuchando. Cada uno debe cambiar el sonido de forma audible. Cuatro modos que suenan igual es firmware sin cargar, y por fuera se ve idéntico a uno bueno."}},
           {"id":"dsp_memory","code":"AUD-011","label":{"en":"The mode is kept after power off","zh":"关机后保留所选模式","es":"El modo queda guardado al apagar"},
            "help":{"en":"Leave a mode other than the first, switch off and on. It must come back to the same one.",
                    "zh":"停在第一个以外的模式，关机再开机，应回到同一模式。",
                    "es":"Deje un modo distinto del primero, apague y encienda. Debe volver al mismo."}}]},

        {"id":"SIGNAL_LIMIT","optional":false,"only_factory":["RHY"],"evidence":["video"],
         "skip":["HK-BAS115A1","HK-BAS118A1","HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"SIGNAL AND LIMIT LEDS","zh":"信号与限幅指示灯","es":"LEDS SEÑAL Y LÍMITE"},
         "steps":[
           {"en":"With programme playing, watch the two LEDs on the panel","zh":"在有节目声时观察面板上的两个指示灯","es":"Con programa sonando, observe los dos LED del panel"},
           {"en":"Raise the level until LIMIT appears, then lower it","zh":"提高电平直到限幅灯点亮，再降低","es":"Suba el nivel hasta que aparezca LÍMITE y luego bájelo"}],
         "points":[
           {"id":"led_signal","code":"LED-008","label":{"en":"SIGNAL LED lights with signal present","zh":"有信号时信号灯点亮","es":"LED SEÑAL enciende con señal presente"},
            "help":{"en":"With audio playing it must light and follow the programme. Dark while signal is present is a fail.",
                    "zh":"有音频播放时应点亮并随节目变化。有信号却不亮，判定为异常。",
                    "es":"Con audio sonando debe encender y seguir el programa. Apagado con señal presente es falla."}},
           {"id":"led_limit","code":"LED-009","label":{"en":"LIMIT LED lights only on clipping","zh":"仅在削波时限幅灯点亮","es":"LED LÍMITE enciende sólo al saturar"},
            "help":{"en":"Raise the volume until it appears and lower it until it goes out. A LIMIT that is always on, or that never comes on, is no use to the person on stage, who is the only one who looks at it.",
                    "zh":"提高音量直至其点亮，再降低直至熄灭。长亮或永不点亮的限幅灯，对台上唯一会看它的人毫无用处。",
                    "es":"Suba el volumen hasta que aparezca y bájelo hasta que se apague. Un LÍMITE siempre encendido, o que nunca enciende, no le sirve a quien está en tarima, que es el único que lo mira."}}]},

        {"id":"XLR_OUT","optional":false,"only_factory":["RHY"],"evidence":[],
         "skip":["HK-BAS115A1","HK-BAS118A1","HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"XLR OUTPUT","zh":"XLR 输出","es":"SALIDA XLR"},
         "steps":[
           {"en":"Connect the XLR output to a second unit","zh":"将 XLR 输出接到第二台设备","es":"Conecte la SALIDA XLR a un segundo equipo"},
           {"en":"Listen at the second unit, first with programme and then in silence","zh":"在第二台设备上先听节目声，再听静音状态","es":"Escuche en el segundo equipo, primero con programa y luego en silencio"}],
         "points":[
           {"id":"xlr_signal","code":"AUD-013","label":{"en":"Signal comes out of the XLR output","zh":"XLR 输出有信号送出","es":"Sale señal por la SALIDA XLR"},
            "help":{"en":"Connect the output to a second unit and confirm audio arrives at working level. It is the output that gets tested least and complained about most in installations.",
                    "zh":"将输出接到第二台设备，确认音频以可用电平送达。这是最少被测试、却在工程安装中投诉最多的一路输出。",
                    "es":"Conecte la salida a un segundo equipo y confirme que le llega audio con nivel de uso. Es la salida que menos se prueba y la que más se reclama en instalación."}},
           {"id":"xlr_noise","code":"AUX-003","label":{"en":"The output adds no noise","zh":"输出不带杂音","es":"La salida no mete ruido"},
            "help":{"en":"Listen at the second unit with the cabinet silent: no hum and no hiss.",
                    "zh":"在音箱静音时于第二台设备上细听：不应有嗡嗡声或嘶声。",
                    "es":"Escuche en el segundo equipo con la cabina en silencio: no debe haber zumbido ni siseo."}}]},

        {"id":"INPUT_CHANNELS","optional":false,"only_factory":["RHY"],"evidence":["video"],
         "skip":["HK-BAS115A1","HK-BAS118A1","HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"INPUT CHANNELS","zh":"输入通道","es":"CANALES DE ENTRADA"},
         "steps":[
           {"en":"Microphone on XLR into channel 1, then the same on a 1/4 inch plug","zh":"先用 XLR 将麦克风接入通道 1，再改用 6.35 mm 插头","es":"Micrófono por XLR en el canal 1, y después lo mismo con plug de 1/4\""},
           {"en":"Repeat the whole thing on channel 2","zh":"在通道 2 上重复全部步骤","es":"Repita todo en el canal 2"},
           {"en":"Line source into AUX and into the RCA inputs","zh":"将线路音源接入 AUX 及 RCA 输入","es":"Fuente de línea en AUX y en las entradas RCA"},
           {"en":"One clip covering both channels is enough","zh":"一段涵盖两个通道的视频即可","es":"Basta un video que cubra los dos canales"}],
         "points":[
           {"section":{"en":"Channel 1","zh":"通道 1","es":"Canal 1"},
            "help":{"en":"The XLR and the 1/4 inch share one combo socket. Testing only one of them is how a half-dead socket ships.",
                    "zh":"XLR 与 6.35 mm 共用一个两用接口。只测其中一种，正是接口半损却照常出厂的原因。",
                    "es":"El XLR y el plug de 1/4\" comparten un solo conector combo. Probar sólo uno de los dos es como sale un conector medio muerto."}},
           {"id":"ch1_xlr","code":"MIC-001","label":{"en":"Channel 1 — XLR input","zh":"通道 1 — XLR 输入","es":"CANAL 1 — entrada XLR"},
            "help":{"en":"Connect the microphone on XLR and speak. It must come through clean, with no hum. Move the connector inside the socket while you speak: it must not break up.",
                    "zh":"用 XLR 接入麦克风并讲话，声音应干净无嗡声。讲话时晃动接头：不应出现断续。",
                    "es":"Conecte el micrófono por XLR y hable. Debe oírse limpio, sin zumbido. Mueva el conector dentro del jack mientras habla: no debe entrecortarse."}},
           {"id":"ch1_ts","code":"MEC-002","label":{"en":"Channel 1 — 1/4 inch input","zh":"通道 1 — 6.35 mm 输入","es":"CANAL 1 — entrada 1/4\""},
            "help":{"en":"Connect on a 1/4 inch plug in the same combo socket and repeat. A badly soldered combo works on one connector and not the other, and nothing shows from outside.",
                    "zh":"在同一两用接口上改用 6.35 mm 插头并重复测试。焊接不良的两用接口只有一种接头能用，而外观看不出任何异常。",
                    "es":"Conecte por plug de 1/4\" en el mismo conector combo y repita. Un combo mal soldado suena por un conector y no por el otro, y por fuera no se ve nada."}},
           {"id":"ch1_micline","code":"MEC-003","label":{"en":"Channel 1 — MIC / LINE switch","zh":"通道 1 — MIC / LINE 开关","es":"CANAL 1 — switch MIC / LÍNEA"},
            "help":{"en":"On MIC it must amplify the microphone to working level. Move it to LINE and feed a line source: it must come in without clipping. It is the part that most often arrives stuck or wired the wrong way round.",
                    "zh":"置于 MIC 时应将麦克风放大到可用电平；拨到 LINE 并接入线路音源时，应无削波地进入。这是最常出现卡死或接反的部件。",
                    "es":"En MIC debe amplificar el micrófono con nivel de uso. Páselo a LÍNEA y conecte una fuente de línea: debe entrar sin saturar. Es la pieza que más llega pegada o invertida."}},
           {"id":"ch1_vol","code":"AUD-017","label":{"en":"Channel 1 — volume knob","zh":"通道 1 — 音量旋钮","es":"CANAL 1 — perilla de volumen"},
            "help":{"en":"Speak continuously while turning the channel volume from minimum to maximum. It must rise smoothly, with no cuts or crackle.",
                    "zh":"持续讲话，同时将通道音量从最小转到最大。应平滑上升，无中断、无爆音。",
                    "es":"Hable de forma continua mientras gira el volumen del canal de mínimo a máximo. Debe subir suave, sin cortes ni crujidos."}},
           {"section":{"en":"Channel 2","zh":"通道 2","es":"Canal 2"},
            "help":{"en":"The same four checks on the second channel.",
                    "zh":"在第二个通道上做同样的四项检查。",
                    "es":"Las mismas cuatro verificaciones en el segundo canal."}},
           {"id":"ch2_xlr","code":"MIC-001","label":{"en":"Channel 2 — XLR input","zh":"通道 2 — XLR 输入","es":"CANAL 2 — entrada XLR"},
            "help":{"en":"Same as channel 1.","zh":"与通道 1 相同。","es":"Igual que el canal 1."}},
           {"id":"ch2_ts","code":"MEC-002","label":{"en":"Channel 2 — 1/4 inch input","zh":"通道 2 — 6.35 mm 输入","es":"CANAL 2 — entrada 1/4\""},
            "help":{"en":"Same as channel 1.","zh":"与通道 1 相同。","es":"Igual que el canal 1."}},
           {"id":"ch2_micline","code":"MEC-003","label":{"en":"Channel 2 — MIC / LINE switch","zh":"通道 2 — MIC / LINE 开关","es":"CANAL 2 — switch MIC / LÍNEA"},
            "help":{"en":"Same as channel 1.","zh":"与通道 1 相同。","es":"Igual que el canal 1."}},
           {"id":"ch2_vol","code":"AUD-017","label":{"en":"Channel 2 — volume knob","zh":"通道 2 — 音量旋钮","es":"CANAL 2 — perilla de volumen"},
            "help":{"en":"Same as channel 1.","zh":"与通道 1 相同。","es":"Igual que el canal 1."}},
           {"id":"ch_both","code":"MIC-004","label":{"en":"Both channels sound together","zh":"两个通道可同时发声","es":"Los dos canales suenan a la vez"},
            "help":{"en":"With both inputs connected, speak into both. Both must be heard, without one cutting the other and without feedback.",
                    "zh":"两路输入同时接入并同时讲话。两个声音都应听得到，不应互相切断，也不应啸叫。",
                    "es":"Con las dos entradas conectadas, hable por las dos. Deben oírse las dos, sin que una corte a la otra y sin acople."}},
           {"section":{"en":"Channel 3","zh":"通道 3","es":"Canal 3"},
            "help":{"en":"The line channel: AUX and RCA. The RCA sides are checked one at a time.",
                    "zh":"线路通道：AUX 与 RCA。RCA 左右两路需分别检查。",
                    "es":"El canal de línea: AUX y RCA. Los lados del RCA se revisan uno a la vez."}},
           {"id":"ch3_aux","code":"AUX-001","label":{"en":"Channel 3 — AUX 3.5 mm input","zh":"通道 3 — AUX 3.5 mm 输入","es":"CANAL 3 — entrada AUX 3.5 mm"},
            "help":{"en":"Connect the test source on AUX. It must play on both sides, with no background noise.",
                    "zh":"用 AUX 接入测试音源，左右两侧都应出声，且无背景杂音。",
                    "es":"Conecte la fuente de prueba por AUX. Debe sonar por los dos lados, sin ruido de fondo."}},
           {"id":"ch3_rca_l","code":"AUX-002","label":{"en":"Channel 3 — RCA left","zh":"通道 3 — RCA 左","es":"CANAL 3 — RCA izquierdo"},
            "help":{"en":"Connect the left RCA only. Audio must come in, and from the correct side.",
                    "zh":"仅接入左声道 RCA，应有音频进入，且来自正确的一侧。",
                    "es":"Conecte sólo el RCA izquierdo. Debe entrar audio y venir del lado correcto."}},
           {"id":"ch3_rca_r","code":"AUX-002","label":{"en":"Channel 3 — RCA right","zh":"通道 3 — RCA 右","es":"CANAL 3 — RCA derecho"},
            "help":{"en":"Now the right one only. Tested one at a time it shows up when they arrive crossed or summed to mono, which with both plugged in is invisible.",
                    "zh":"改为仅接右声道。分开测试才能发现左右接反或被并成单声道的情况，两路同时接入时完全看不出来。",
                    "es":"Ahora sólo el derecho. Probados por separado se detecta que lleguen cruzados o sumados a mono, cosa que con los dos puestos no se nota."}},
           {"id":"ch3_vol","code":"AUD-017","label":{"en":"Channel 3 — volume knob","zh":"通道 3 — 音量旋钮","es":"CANAL 3 — perilla de volumen"},
            "help":{"en":"It must attenuate the music without touching the level of the microphones on channels 1 and 2.",
                    "zh":"应能衰减音乐，而不影响通道 1、2 上麦克风的音量。",
                    "es":"Debe atenuar la música sin tocar el nivel de los micrófonos de los canales 1 y 2."}}]},

        {"id":"DISPLAY","optional":true,"only_factory":["YIS","RHY","EAG"],

                    "zh":"插入 SD 卡后切换到 SD 模式，阅读显示内容并拍照。本型号没有 SD 卡槽时标记为“不适用”。"}},
           {"id":"word_aux","code":"DSP-007","photo":true,
            "label":{"en":"AUX / LINE — text correct on the display","zh":"AUX / LINE — 屏显文字正确"},
            "help":{"en":"With the cable connected, select the auxiliary input, read the display and photograph it. Some references write AUX and others LINE: either is correct as long as it matches the specification for this model and is spelled properly. Mark N/A if this reference has no auxiliary input.",
                    "zh":"接上音频线后切换到辅助输入，阅读显示内容并拍照。部分型号显示 AUX，部分显示 LINE：只要与本型号规格一致且拼写无误，两者均可。本型号没有辅助输入时标记为“不适用”。"}},
           {/* The DSP mode is the one word on a RHYME display that changes from
                model to model - BAJO on one panel, MONITOR on the next - so it
                is also the one the artwork is most likely to get wrong. Read on
                screen, not on the silkscreen: the two are printed by different
                suppliers and only the screen proves the firmware agrees. */
            "id":"word_dsp","code":"DSP-007","photo":true,"only_factory":["RHY"],
            "label":{"en":"DSP mode — text correct on the display","zh":"DSP 模式 — 屏显文字正确",
                     "es":"Modo DSP — texto correcto en pantalla"},
            "help":{"en":"Step through the DSP modes and photograph the display on each one. Read every name letter by letter and compare it against the specification for this model.",
                    "zh":"逐一切换 DSP 模式，每个模式都拍摄显示屏。逐字母阅读每个名称，并与本型号规格核对。",
                    "es":"Recorra los modos DSP y fotografíe la pantalla en cada uno. Lea cada nombre letra por letra y compárelo con la especificación de este modelo."}}]},

        {"id":"REMOTE","optional":true,"only_factory":["YIS","RHY","EAG"],
         "skip":["HK-BAS115A1","HK-BAS118A1","HK-KAP103","HK-KAP330","HK-BRA130","HK-BRA330"],
         "label":{"en":"REMOTE CONTROL","zh":"遥控器"},
         "steps":[
           {"en":"Check the remote has a battery; remove the insulator if new","zh":"确认遥控器有电池，新品请抽出绝缘片"},
           {"en":"Point at the speaker from about 3 metres","zh":"距离音箱约 3 米对准操作"},
           {"en":"Press each button on the list and confirm on the speaker","zh":"逐个按下列按键，并在音箱上确认反应"},
           {"en":"Repeat some buttons at an angle, not only straight on","zh":"部分按键需侧向角度再测一次，不只正对"}],
         "points":[
           {"section":{"en":"Power and mute","zh":"电源与静音"},
            "help":{"en":"Check the remote has a battery and remove the insulator if new. Point at the speaker from about 3 metres.",
                    "zh":"确认遥控器有电池，新品请抽出绝缘片。距离音箱约 3 米对准操作。"}},
           {"id":"power","code":"RMT-001","label":{"en":"Power on / off","zh":"电源开关"},
            "help":{"en":"Press it to switch the speaker off, then again to switch it on. Both directions must work from 3 metres.",
                    "zh":"按下关闭音箱，再按一次开机。3 米距离下开和关都必须有效。"}},
           {"id":"mute","code":"RMT-002","label":{"en":"MUTE","zh":"静音"},
            "help":{"en":"With music playing, press MUTE: the sound must stop instantly. Press again: it must come back at the same volume.",
                    "zh":"播放音乐时按静音键，声音应立即消失；再按一次应以原音量恢复。"}},
           {"section":{"en":"Source selection","zh":"音源选择"},
            "help":{"en":"Press each source key and confirm the speaker switches to it. Mark N/A for sources this reference does not have.",
                    "zh":"逐个按下音源键，确认音箱切换到对应音源。本型号没有的音源标记为“不适用”。"}},
           {"id":"src_fm","code":"RMT-003","skip_factory":["RHY"],"label":{"en":"FM RADIO","zh":"收音"},
            "help":{"en":"Press it from another source. The speaker must switch straight to radio and the display must show it.",
                    "zh":"在其他音源下按此键，音箱应直接切到收音，屏幕应显示。"}},
           {"id":"src_usb","code":"RMT-004","label":{"en":"USB","zh":"USB"},
            "help":{"en":"With the USB drive inserted, press it from another source. The speaker must switch to USB and start playing.",
                    "zh":"插着 U 盘时从其他音源按此键，音箱应切到 USB 并开始播放。"}},
           {"id":"src_bt","code":"RMT-005","label":{"en":"BLUETOOTH","zh":"蓝牙"},
            "help":{"en":"Press it from another source. The speaker must switch to Bluetooth and become discoverable or reconnect to the phone.",
                    "zh":"在其他音源下按此键，音箱应切到蓝牙并可被搜索或自动回连手机。"}},
           {"id":"src_sd","code":"RMT-006","skip_factory":["RHY"],
            "label":{"en":"SD","zh":"SD 卡"},
            "help":{"en":"With the card inserted, press it from another source. Mark N/A if this reference has no SD slot.",
                    "zh":"插着 SD 卡时从其他音源按此键。本型号没有 SD 卡槽时标记为“不适用”。"}},
           {"id":"src_aux","code":"RMT-007","label":{"en":"AUX","zh":"AUX"},
            "help":{"en":"With the AUX cable connected, press it from another source. The speaker must switch to AUX.",
                    "zh":"连接 AUX 音频线后从其他音源按此键，音箱应切到 AUX。"}},
           {"id":"modes","code":"RMT-012","label":{"en":"Mode button","zh":"模式键"},

                    "zh":"连续按此键，音箱应依次切换所有音源并回到第一个。"}},
           {"section":{"en":"Playback keys","zh":"播放按键"},
            "help":{"en":"With a source playing, press each key and confirm the speaker reacts.",
                    "zh":"在有音源播放时按下每个键，确认音箱有反应。"}},
           {"id":"play_pause","code":"RMT-015","label":{"en":"PLAY / PAUSE","zh":"播放/暂停"},
            "help":{"en":"Press once: the sound must stop. Press again: it must resume from the same point, not from the start.",
                    "zh":"按一次声音应停止；再按一次应从原位置继续，而不是从头播放。"}},
           {"id":"song_next","code":"RMT-013","label":{"en":"Next track","zh":"下一曲"},
            "help":{"en":"Press it three times. The track number must advance one at a time from the remote, just as it does from the panel.",
                    "zh":"连续按三次。曲目编号应逐一递增，与面板操作效果一致。"}},
           {"id":"song_prev","code":"RMT-014","label":{"en":"Previous track","zh":"上一曲"},
            "help":{"en":"Press it three times. The track number must go back one at a time, without jumping or restarting.",
                    "zh":"连续按三次。曲目编号应逐一递减，不应跳号或重头开始。"}},
           {"id":"fast_fwd","code":"RMT-018","label":{"en":"Fast forward","zh":"快进"},
            "help":{"en":"Hold it down during a track. The music must move forward while held and carry on normally when released.",
                    "zh":"播放中长按此键。按住时音乐应快速前进，松开后正常继续播放。"}},
           {"id":"rewind","code":"RMT-019","label":{"en":"Rewind","zh":"快退"},
            "help":{"en":"Hold it down during a track. The music must move backward while held and carry on normally when released.",
                    "zh":"播放中长按此键。按住时音乐应快速后退，松开后正常继续播放。"}},
           {"id":"repeat","code":"RMT-024","label":{"en":"Repeat track","zh":"循环播放"},
            "help":{"en":"Press it and check the repeat icon changes on the display, then let a track end to confirm the mode really applies.",

           {"id":"folder_next","code":"RMT-021","label":{"en":"Folder forward","zh":"下一文件夹"},
            "help":{"en":"Press it and confirm the folder number changes and playback jumps to another folder.",
                    "zh":"按下后确认文件夹编号变化，并跳到另一个文件夹播放。"}},
           {"id":"folder_prev","code":"RMT-022","label":{"en":"Folder back","zh":"上一文件夹"},
            "help":{"en":"Press it and confirm it returns to the previous folder.",
                    "zh":"按下后确认返回上一个文件夹。"}},
           {"id":"keypad","code":"RMT-020","label":{"en":"Numeric keypad","zh":"数字键盘"},
            "help":{"en":"Type a track number, for example 005. The speaker must jump straight to that track. Test every digit from 0 to 9, not just one.",
                    "zh":"输入曲目编号，例如 005，音箱应直接跳到该曲。0 到 9 每个数字键都要测，不能只测一个。"}},
           {"section":{"en":"Volume and audio","zh":"音量与音效"},
            "help":{"en":"Hold VOL + and VOL − and confirm the level moves on the display. Press EQ and check the preset changes.",
                    "zh":"长按音量加/减键，确认屏幕音量数值变化。按 EQ 键确认音效模式切换。"}},
           {"id":"vol_up","code":"RMT-016","label":{"en":"VOL +","zh":"音量 +"},
            "help":{"en":"Press it several times and hold it once. The level must rise step by step on the display and the sound must follow.",
                    "zh":"连按几次并长按一次。屏幕音量应逐级上升，声音应随之变大。"}},
           {"id":"vol_down","code":"RMT-017","label":{"en":"VOL −","zh":"音量 −"},
            "help":{"en":"Press it several times and hold it once. The level must fall step by step, all the way down to zero.",
                    "zh":"连按几次并长按一次。音量应逐级下降，直到降为零。"}},
           {"id":"eq","code":"RMT-023","label":{"en":"EQ button","zh":"EQ 键"},
            "help":{"en":"Press it through every preset. The display must show the name change and the sound must be audibly different between presets.",
                    "zh":"逐一切换所有音效预设。屏幕应显示名称变化，且不同预设之间声音应有明显差异。"}},
           {/* Two headings for one group, because on RHYME the group is not the
                same group: priority, REC and REC PLAY are all filtered out
                there and only VOICE OUT survives. The old heading told the
                RHYME inspector to record a few seconds and play them back on a
                cabinet with no REC key and nowhere to store a recording. */
            "skip_factory":["RHY"],
            "section":{"en":"Microphone and recording","zh":"麦克风与录音"},
            "help":{"en":"Record a few seconds with REC, play it back with REC PLAY. Retest some keys at an angle, not only straight on.",
                    "zh":"用 REC 键录几秒，再用 REC PLAY 播放。部分按键需侧向角度再测一次，不只正对。"}},
           {"only_factory":["RHY"],
            "section":{"en":"Microphone","zh":"麦克风","es":"Micrófono"},
            "help":{"en":"With a microphone connected, press the key and listen to the voice. Retest it at an angle, not only straight on.",
                    "zh":"接上麦克风后按下该键并注意人声变化。需侧向角度再测一次，不只正对。",
                    "es":"Con un micrófono conectado, pulse la tecla y escuche la voz. Pruébela también en ángulo, no sólo de frente."}},
           {/* The three keys below act on functions RHYME's panels do not have:
                 there is no priority key, no REC and nowhere to store a
                 recording. A remote key that the cabinet cannot obey is not a
                 remote fault, so it is filtered out rather than left to be
                 failed. VOICE OUT stays: it acts on the microphone path, which
                 these cabinets do have. */
            "id":"mic_priority","code":"RMT-008","skip_factory":["RHY"],"label":{"en":"Microphone priority","zh":"麦克风优先"},
            "help":{"en":"With music playing, press it and speak into the microphone. The music must drop to about 10% of its level while you speak — the same 90% drop the front panel key has to give — and return afterwards.",
                    "zh":"播放音乐时按下此键并对麦克风说话。说话时音乐应降到原音量的约 10%（与面板优先键相同的约 90% 衰减），停止后恢复。"}},
           {"id":"rec","code":"RMT-009","skip_factory":["RHY"],"label":{"en":"REC — record","zh":"REC — 录音"},
            "help":{"en":"Press REC and speak for a few seconds. The display must show it is recording, and pressing it again must stop the recording.",
                    "zh":"按 REC 并说话几秒。屏幕应显示正在录音，再按一次应停止录音。"}},
           {"id":"rec_play","code":"RMT-010","skip_factory":["RHY"],"label":{"en":"REC PLAY — play the recording","zh":"REC PLAY — 播放录音"},
            "help":{"en":"Press it and confirm the recording you just made plays back clearly through the speaker.",
                    "zh":"按下后确认刚才的录音能通过音箱清晰回放。"}},
           {"id":"voice_out","code":"RMT-011",
            "label":{"en":"VOICE OUT","zh":"VOICE OUT（消原音）"},
            "help":{"en":"Press it while speaking into the microphone and listen for the change in the voice effect. Mark N/A if this reference has no VOICE OUT.",
                    "zh":"对麦克风说话时按下此键，注意人声效果的变化（该键用于消去原唱人声）。遥控器上仍印英文 VOICE OUT。本型号没有此键时标记为“不适用”。"}}]},

        /* ===== KAPPA — HK-KAP103 y HK-KAP330 ================================
           Producto en desarrollo. Las dos referencias comparten esquema de
           funciones, así que comparten plan: `only` las nombra a las dos y no
           hay una sola diferencia entre ellas.

           El esquema es una matriz de ocho botones por tres pulsaciones por
           cuatro modos: noventa y seis combinaciones. Casi todas hacen lo mismo
           en los cuatro modos — B3 recorre efectos igual en Bluetooth que en
           radio — así que probarlas todas serían noventa y seis puntos para
           descubrir tres cosas. Cada botón se prueba una vez, y sólo se repite
           donde el propio esquema dice que el comportamiento cambia: B1 en
           pulsación corta, y B4, B5 y B6, que en radio son canales y en USB son
           canciones.

           Los conectores se nombran como están impresos en la cabina — C4 es
           AUX 2 y C5 es AUX 3 — y no como los llama el esquema, porque el
           operador lee la serigrafía y no el documento. La consideración 7 del
           esquema dice C3, que es la ranura micro SD; se escribió contra C4 y
           C5, que es donde entra el micrófono de verdad.

           Esa misma consideración menciona micrófono inalámbrico, y no es un
           error del documento: la cabina no trae receptor, pero se le puede
           conectar uno externo por C4 o C5 y trabajar inalámbrico. Por eso las
           pruebas se escriben contra el jack y no contra el micrófono — lo que
           se comprueba es la entrada, sirva a un micrófono de cable o a un
           receptor.

           Las pruebas fotográficas no se repiten aquí: PARTES EXTERNAS,
           ACCESORIOS, MATERIAL IMPRESO y PARTES INTERNAS son las mismas de
           siempre y estas referencias las heredan por no llevar etiqueta de
           plan propia.
           ------------------------------------------------------------------ */
        {"id":"KAP_POWER","optional":false,"only_factory":["YIS"],"evidence":[],
         "only":["HK-KAP103","HK-KAP330"],
         "label":{"en":"POWER ON","zh":"开机","es":"ENCENDIDO"},
         "steps":[
           {"en":"Switch S1 on and listen","zh":"打开 S1 开关并注意声音","es":"Ponga el switch S1 en encendido y escuche"},
           {"en":"Note which mode it comes up in","zh":"记下开机后进入的模式","es":"Anote en qué modo arranca"},
           {"en":"Switch off and on again to check it remembers","zh":"关机后再开机，确认是否记忆","es":"Apague y vuelva a encender para comprobar que recuerda"}],
         "points":[
           {"section":{"en":"Switch S1","zh":"S1 开关","es":"Switch S1"},
            "help":{"en":"Whether it comes up, goes off and remembers. What it sounds like on the way up is the next test.",
                    "zh":"本节检查能否开机、关机以及是否记忆模式。开机时的声音由下一项测试负责。",
                    "es":"Si arranca, si apaga y si recuerda. Cómo suena al arrancar es la prueba siguiente."}},
           {"id":"kap_on","code":"PWR-001","tag":"S1",
            "label":{"en":"Switches the cabinet on","zh":"可正常开机","es":"Enciende la cabina"},
            "help":{"en":"Move S1 to ON. The cabinet must come up on its own.",
                    "zh":"将 S1 拨到开。应能自行启动。",
                    "es":"Lleve S1 a encendido. Debe arrancar sola."}},
           {"id":"kap_off","code":"PWR-001","tag":"S1",
            "label":{"en":"Switches it off","zh":"可正常关机","es":"La apaga"},
            "help":{"en":"Move S1 to OFF. It must go off cleanly, with no lights left on and no noise from the driver.",
                    "zh":"将 S1 拨到关。应干净关机，不应有指示灯残亮或喇叭异响。",
                    "es":"Lleve S1 a apagado. Debe apagar limpio, sin luces encendidas ni ruido en el parlante."}},
           {"id":"kap_recall","code":"MOD-004",
            "label":{"en":"It comes back on the last mode used","zh":"开机恢复上次使用的模式","es":"Vuelve al último modo usado"},
            "help":{"en":"Leave it in a mode that is not the default, switch off, wait a few seconds and switch on. It must return to the same mode. If that mode was radio or USB/SD and the source is no longer there, it must fall back to Bluetooth — not to silence and not to a mode nobody chose.",
                    "zh":"停在一个非默认模式，关机，等待几秒后开机。应回到同一模式。若该模式为收音或 USB/SD 而信号源已不在，应退回蓝牙——而不是无声，也不是进入一个没人选择的模式。",
                    "es":"Déjela en un modo que no sea el de arranque, apague, espere unos segundos y encienda. Debe volver al mismo modo. Si ese modo era radio o USB/SD y la fuente ya no está, debe caer en Bluetooth — no en silencio ni en un modo que nadie escogió."}}]},

        /* El arranque de un prototipo es donde primero se nota que el firmware
           cargado no es el que se pidió: el archivo de voz viene de otro
           proyecto, el tono sale recortado porque nadie ajustó su nivel, o
           suena distinto en cada encendido. Va inmediatamente después de
           ENCENDIDO y antes de todo lo demás, porque el resto de las pruebas
           obliga a apagar y encender muchas veces y para entonces el operador
           ya dejó de oírlo. */
        {"id":"KAP_BOOT","optional":false,"only_factory":["YIS"],"evidence":[],
         "only":["HK-KAP103","HK-KAP330"],
         "label":{"en":"START-UP SOUND","zh":"开机声音","es":"SONIDO DE INICIO"},
         "steps":[
           {"en":"Leave the volume at about half before switching on","zh":"开机前将音量置于约一半","es":"Deje el volumen a la mitad antes de encender"},
           {"en":"Switch on in a quiet room, with nothing playing","zh":"在安静环境下开机，不播放任何内容","es":"Encienda en un sitio silencioso y sin nada reproduciéndose"},
           {"en":"Listen to the whole start-up before touching anything","zh":"完整听完开机过程后再操作","es":"Escuche todo el arranque antes de tocar nada"},
           {"en":"Switch off and repeat three times in all","zh":"关机后重复，共三次","es":"Apague y repita, tres veces en total"}],
         "points":[
           {"section":{"en":"Tone and voice","zh":"提示音与语音","es":"Tono y voz"},
            "help":{"en":"The start-up sound is the first thing the customer hears out of the box, and the cheapest way to tell whether the firmware that loaded is the right one.",
                    "zh":"开机声音是客户拆箱后听到的第一个声音，也是判断所载固件是否正确最省事的办法。",
                    "es":"El sonido de arranque es lo primero que el cliente oye al sacarla de la caja, y la forma más barata de saber si el firmware que cargó es el que corresponde."}},
           {"id":"boot_tone","code":"PWR-010","tag":"S1",
            "label":{"en":"The brand tone sounds","zh":"品牌开机音有响","es":"Suena el tono de marca"},
            "help":{"en":"On switching on, the brand tone must play. A cabinet that starts silent has the wrong firmware or no prompt file.",
                    "zh":"开机时应播放品牌音效。开机无声的机器，要么固件不对，要么缺少提示音文件。",
                    "es":"Al encender debe sonar el tono de marca. Una cabina que arranca muda tiene el firmware equivocado o le falta el archivo de voz."}},
           {"id":"boot_voice","code":"PWR-010","tag":"S1",
            "label":{"en":"The spoken message follows it","zh":"随后播报语音提示","es":"Después suena el mensaje de voz"},
            "help":{"en":"After the tone the cabinet must speak. It must be understandable and reach the end of the phrase without cutting off.",
                    "zh":"提示音之后应有语音播报，须清晰可辨，且完整播完不中断。",
                    "es":"Después del tono la cabina debe hablar. Debe entenderse y llegar al final de la frase sin cortarse."}},
           {"id":"boot_seq","code":"PWR-012","tag":"S1",
            "label":{"en":"Same order and same sound all three times","zh":"三次开机顺序与声音一致","es":"El mismo orden y el mismo sonido las tres veces"},
            "help":{"en":"First the tone, then the voice, never overlapping. Switch off and on three times: the three start-ups must be identical. One that varies means the firmware is not reading the files the same way every time.",
                    "zh":"先提示音，后语音，二者不应重叠。关机再开机，共三次：三次开机应完全一致。若有差异，说明固件每次读取提示音文件的方式并不相同。",
                    "es":"Primero el tono y luego la voz, sin solaparse. Apague y encienda tres veces: los tres arranques deben ser iguales. Uno que varía significa que el firmware no está leyendo los archivos igual todas las veces."}},
           {"section":{"en":"Level and cleanliness","zh":"音量与纯净度","es":"Nivel y limpieza"},
            "help":{"en":"Listen to the start-up sound and judge its level against the volume that is set.",
                    "zh":"聆听开机声音，并对照当前设定的音量判断其电平。",
                    "es":"Escuche el sonido de arranque y juzgue su nivel contra el volumen que está puesto."}},
           {"id":"boot_level","code":"PWR-011","tag":"P1",
            "label":{"en":"Level matches the volume that is set","zh":"音量与旋钮设定相符","es":"El nivel corresponde al volumen puesto"},
            "help":{"en":"With the volume at half it must be heard clearly across the room, without startling anyone. One that comes out at full level whatever the knob says is a fault, and so is one that can barely be heard.",
                    "zh":"音量置于一半时，应能在房间内清晰听到，但不应令人受惊。无论旋钮在何位置都以满音量播放的属于缺陷，几乎听不见的同样属于缺陷。",
                    "es":"Con el volumen a la mitad debe oírse con claridad en el cuarto, sin sobresaltar a nadie. Uno que sale a todo volumen sin importar dónde esté la perilla es una falla, y uno que apenas se oye también."}},
           {"id":"boot_clean","code":"AUD-003",
            "label":{"en":"No clipping or distortion","zh":"无削顶或失真","es":"Sin recorte ni distorsión"},
            "help":{"en":"The tone must come out clean, without breaking up or rasping. A start-up sound recorded too hot distorts on every single unit and gets blamed on the speaker.",
                    "zh":"提示音应干净，不破音、不沙哑。录制电平过高的开机音会在每一台机器上都失真，而问题往往被归咎于喇叭。",
                    "es":"El tono debe salir limpio, sin quebrarse ni raspar. Un sonido de arranque grabado con demasiado nivel distorsiona en todas las unidades y la culpa se le echa al parlante."}},
           {"id":"boot_thump","code":"AUD-005",
            "label":{"en":"No thump or click from the speaker","zh":"喇叭无砰声或咔哒声","es":"Sin golpe ni chasquido del parlante"},
            "help":{"en":"Between switching on and the tone there must be no thump, click or crack. That noise is the amplifier reaching the speaker before it is ready, and it shortens the life of the driver.",
                    "zh":"从开机到提示音之间，不应有砰声、咔哒声或爆音。该噪声是功放在尚未就绪时已接通喇叭所致，会缩短单元寿命。",
                    "es":"Entre el encendido y el tono no debe haber golpe, chasquido ni crujido. Ese ruido es el amplificador llegando al parlante antes de estar listo, y le acorta la vida al driver."}}]},

        {"id":"KAP_MODES","optional":false,"only_factory":["YIS"],"evidence":["video"],
         "only":["HK-KAP103","HK-KAP330"],
         "label":{"en":"MODES AND SWITCHING","zh":"模式与切换","es":"MODOS Y CONMUTACIÓN"},
         "steps":[
           {"en":"Press B2 to walk the full cycle of modes","zh":"按 B2 走完一轮模式","es":"Pulse B2 para recorrer el ciclo completo de modos"},
           {"en":"Plug and unplug the USB drive while watching the display","zh":"插拔 U 盘，同时观察显示屏","es":"Conecte y desconecte la memoria USB mirando la pantalla"},
           {"en":"Record one clip covering the whole sequence","zh":"用一段视频录下整个过程","es":"Grabe un video que cubra toda la secuencia"}],
         "points":[
           {"section":{"en":"Mode button B2","zh":"模式键 B2","es":"Botón de modo B2"},
            "help":{"en":"The cabinet has four modes and one key to reach them. What is checked here is not that the key works, but that the cycle closes and that the display says where you are.",
                    "zh":"本机有四种模式，只用一个按键切换。这里检查的不是按键是否有反应，而是循环能否走完一圈，以及显示屏是否指明当前所在模式。",
                    "es":"La cabina tiene cuatro modos y una sola tecla para llegar a ellos. Lo que se comprueba aquí no es que la tecla responda, sino que el ciclo cierre y que la pantalla diga dónde está."}},
           {"id":"kap_b2_cycle","code":"MOD-001","tag":"B2",
            "label":{"en":"Short press changes mode and closes the cycle","zh":"短按可切换模式并完成循环","es":"Pulsación corta cambia de modo y cierra el ciclo"},
            "help":{"en":"Press B2 repeatedly until you are back where you started, without stopping part way. Every mode the cabinet has must appear, in a stable order, and the display must name each one.",
                    "zh":"反复按 B2 直到回到起点，中途不得停止。本机具备的每种模式都应出现，顺序稳定，且显示屏应显示各模式名称。",
                    "es":"Pulse B2 hasta volver al punto de partida, sin detenerse a mitad de camino. Deben aparecer todos los modos que la cabina tenga, en un orden estable, y la pantalla debe nombrar cada uno."}},
           {"section":{"en":"USB and SD in and out","zh":"U 盘与 SD 卡的插入与拔出","es":"Entrada y salida de USB y SD"},
            "help":{"en":"Four of the ten notes on the scheme are about what happens when a source appears or disappears. They are the fiddly part of the firmware and the part a bench test never reaches.",
                    "zh":"功能表十条备注中有四条讲的是信号源出现或消失时的行为。这部分是固件中最琐碎的地方，也是普通台面测试永远碰不到的地方。",
                    "es":"Cuatro de las diez consideraciones del esquema tratan de qué pasa cuando una fuente aparece o desaparece. Es la parte enredada del firmware y la que una prueba de banco nunca alcanza."}},
           {"id":"kap_usb_only","code":"MOD-002",
            "label":{"en":"USB mode does not exist without a drive","zh":"未插 U 盘时无 USB 模式","es":"Sin memoria no existe el modo USB"},
            "help":{"en":"With nothing plugged in, walk the modes with B2. USB must not appear as an empty mode you can land on. A mode that can be selected and plays nothing reads as a fault to the customer.",
                    "zh":"不插任何存储介质，用 B2 走一轮模式。USB 不应作为一个可进入的空模式出现。能选中却没有声音的模式，在客户看来就是故障。",
                    "es":"Sin nada conectado, recorra los modos con B2. USB no debe aparecer como un modo vacío al que se pueda entrar. Un modo que se selecciona y no suena, para el cliente es una falla."}},
           {"id":"kap_usb_auto","code":"MOD-002",
            "label":{"en":"Plugging the drive in switches to USB on its own","zh":"插入 U 盘后自动切换到 USB","es":"Al conectar la memoria entra sola en modo USB"},
            "help":{"en":"With the cabinet playing something else, plug the drive in. It must switch to USB by itself, without pressing anything.",
                    "zh":"在播放其他音源的状态下插入 U 盘。应自动切换到 USB，无需按任何键。",
                    "es":"Con la cabina sonando en otra fuente, conecte la memoria. Debe pasar sola a USB, sin pulsar nada."}},
           {"id":"kap_usb_out","code":"MOD-003",
            "label":{"en":"Removing it falls back to Bluetooth, or to radio","zh":"拔出后退回蓝牙，或退回收音","es":"Al retirarla cae en Bluetooth, o en radio"},
            "help":{"en":"Pull the drive out while it is playing. It must leave USB at once and land on Bluetooth if a phone is connected, and on radio if none is. It must not sit silent on a mode whose source is gone.",
                    "zh":"在播放中拔出 U 盘。应立即退出 USB：若已连接手机则进入蓝牙，否则进入收音。不应停留在信号源已消失的模式上无声。",
                    "es":"Retire la memoria mientras reproduce. Debe salir de USB en el acto y caer en Bluetooth si hay un teléfono conectado, y en radio si no lo hay. No debe quedarse muda en un modo cuya fuente ya no está."}},
           {"id":"kap_bt_bg","code":"MOD-005",
            "label":{"en":"Bluetooth stays paired but silent in other modes","zh":"其他模式下蓝牙保持连接但不出声","es":"El Bluetooth sigue emparejado pero mudo en otros modos"},
            "help":{"en":"With a phone paired, switch to USB and play from the phone. Nothing must come out of the cabinet. Then go back to Bluetooth with B2: it must sound again without pairing a second time. Two sources at once is the failure this catches.",
                    "zh":"在手机已连接的状态下切换到 USB，并用手机播放。音箱不应出声。随后用 B2 切回蓝牙：应无需重新配对即可出声。本项要发现的问题是两个音源同时出声。",
                    "es":"Con un teléfono emparejado, pase a USB y reproduzca desde el teléfono. No debe salir nada por la cabina. Luego vuelva a Bluetooth con B2: debe sonar de nuevo sin volver a emparejar. Lo que este punto atrapa es que suenen dos fuentes a la vez."}},
           {"id":"kap_bt_repair","code":"MOD-005",
            "label":{"en":"Unpairing puts it back in pairing mode","zh":"断开连接后自动进入配对模式","es":"Al desemparejar vuelve a modo de emparejamiento"},
            "help":{"en":"Disconnect the phone from the phone's side. The cabinet must go back to looking for a device on its own, with no button pressed.",
                    "zh":"从手机端断开连接。音箱应自行回到搜索设备的状态，无需按任何按键。",
                    "es":"Desconecte el teléfono desde el teléfono. La cabina debe volver sola a buscar dispositivo, sin pulsar ninguna tecla."}}]},

        {"id":"KAP_BT","optional":false,"only_factory":["YIS"],"evidence":[],
         "only":["HK-KAP103","HK-KAP330"],
         "label":{"en":"BLUETOOTH AND TWS","zh":"蓝牙与 TWS","es":"BLUETOOTH Y TWS"},
         "steps":[
           {"en":"Use B1 for everything in this test","zh":"本测试全部使用 B1 键","es":"Use B1 para todo en esta prueba"},
           {"en":"You need a second cabinet for the TWS points","zh":"TWS 项目需要第二台音箱","es":"Para los puntos de TWS necesita una segunda cabina"}],
         "points":[
           {"section":{"en":"Pairing","zh":"配对","es":"Emparejamiento"},
            "help":{"en":"B1 does three different things depending on how long it is held. Check all three.",
                    "zh":"B1 按压时长不同，功能也不同，共三种。三种都要检查。",
                    "es":"B1 hace tres cosas distintas según cuánto se mantenga pulsado. Compruebe las tres."}},
           {"id":"kap_b1_short","code":"BT-012","tag":"B1",
            "label":{"en":"Short press enters Bluetooth mode","zh":"短按进入蓝牙模式","es":"Pulsación corta entra en modo BT"},
            "help":{"en":"From USB or from radio, one short press must jump straight to Bluetooth. From Bluetooth it does nothing, which is correct.",
                    "zh":"在 USB 或收音模式下，短按一次应直接跳到蓝牙。已在蓝牙模式时无动作，属正常。",
                    "es":"Desde USB o desde radio, una pulsación corta debe saltar directo a Bluetooth. Estando ya en Bluetooth no hace nada, y eso es correcto."}},
           {"id":"kap_pair","code":"BT-006",
            "label":{"en":"Pairs with a phone and says LINK","zh":"可与手机配对并播报 LINK","es":"Empareja con un teléfono y dice LINK"},
            "help":{"en":"Pair a phone. The voice prompt LINK must play on connecting, and the display must show the Bluetooth mode. Read the name the phone lists and check it against the specification, character by character.",
                    "zh":"与手机配对。连接成功时应播报语音提示 LINK，显示屏应显示蓝牙模式。逐字读取手机列表中显示的名称，并与规格核对。",
                    "es":"Empareje un teléfono. Al conectar debe sonar el aviso de voz LINK y la pantalla debe mostrar el modo Bluetooth. Lea el nombre que lista el teléfono y contrástelo con la especificación, carácter por carácter."}},
           {"id":"kap_audio","code":"BT-004",
            "label":{"en":"Audio comes out of the cabinet","zh":"音箱正常出声","es":"El audio sale por la cabina"},
            "help":{"en":"Play music and confirm it comes out of this cabinet and not the phone.",
                    "zh":"播放音乐并确认声音来自本机而非手机。",
                    "es":"Reproduzca música y confirme que sale de esta cabina y no del teléfono."}},
           {"id":"kap_b1_long","code":"BT-012","tag":"B1",
            "label":{"en":"Long press unpairs","zh":"长按断开配对","es":"Pulsación larga desempareja"},
            "help":{"en":"Hold B1. The phone must drop the connection and the cabinet must go back to searching. This is the only way out for a customer whose cabinet keeps grabbing the neighbour's phone.",
                    "zh":"长按 B1。手机应断开连接，音箱应回到搜索状态。对于总是被邻居手机连上的客户来说，这是唯一的解决办法。",
                    "es":"Mantenga B1. El teléfono debe perder la conexión y la cabina volver a buscar. Es la única salida para un cliente cuya cabina se queda enganchada al teléfono del vecino."}},
           {"section":{"en":"TWS","zh":"TWS 串联","es":"TWS"},
            "help":{"en":"Two cabinets playing as a pair. Needs a second unit on the bench: without it these two points cannot be answered and must be marked N/A rather than guessed.",
                    "zh":"两台音箱串联播放，需要工位上有第二台。没有第二台时这两项无法作答，应标记为“不适用”，不要凭推测填写。",
                    "es":"Dos cabinas sonando en pareja. Hace falta una segunda unidad en el puesto: sin ella estos dos puntos no se pueden responder y se marcan N/A en vez de adivinarlos."}},
           {"id":"kap_tws_on","code":"BT-010","tag":"B1",
            "label":{"en":"Double press links a second cabinet","zh":"双击可串联第二台音箱","es":"Pulsación doble enlaza una segunda cabina"},
            "help":{"en":"Double-press B1 on both cabinets and wait for them to find each other. Play music: both must sound together and in step. One lagging behind the other is a fail.",
                    "zh":"在两台音箱上都双击 B1，等待互相连接。播放音乐：两台应同时出声且同步。一台明显滞后即判定为异常。",
                    "es":"Pulse dos veces B1 en las dos cabinas y espere a que se encuentren. Reproduzca música: deben sonar juntas y acompasadas. Una que va detrás de la otra es un fallo."}},
           {"id":"kap_tws_off","code":"BT-010","tag":"B1",
            "label":{"en":"Double press again breaks the pair","zh":"再次双击可解除串联","es":"Pulsación doble otra vez deshace la pareja"},
            "help":{"en":"Double-press again. The two must separate and each go back to playing on its own. A pair that cannot be undone is a pair the customer has to switch off to escape.",
                    "zh":"再次双击。两台应分开，各自恢复独立播放。无法解除的串联，客户只能靠关机摆脱。",
                    "es":"Pulse dos veces otra vez. Deben separarse y cada una volver a sonar por su cuenta. Una pareja que no se puede deshacer es una pareja de la que el cliente sólo sale apagando."}}]},

        {"id":"KAP_USB","optional":false,"only_factory":["YIS"],"evidence":[],

                    "zh":"连续按三次。应逐一后退，而不是跳回第一首。",

            "help":{"en":"Hold B6: the folder number must change and playback must jump to another folder on the drive. Hold B4: it must come back to the previous one, not to the start of the drive.",

                    "zh":"按一次：声音停止，显示屏显示暂停。再按一次：应从原位置继续，而不是从头开始。",
                    "es":"Pulse una vez: el sonido se detiene y la pantalla muestra pausa. Pulse otra vez: continúa desde el mismo punto, no desde el inicio."}}]},

        /* ===== BRAGI — HK-BRA130 y HK-BRA330 ================================
           Producto en desarrollo. Las dos referencias comparten esquema, así
           que comparten plan.

           Escrito contra el esquema de funciones completo: T1 estados, T2
           acciones por botón y gesto, T3 realimentación por evento y T4 reglas
           transversales. Donde una prueba cita una regla — R3, R7, R11 — es
           porque el esquema remite a ella en vez de repetirla.

           Dos decisiones sobre qué se prueba y qué no. La primera: los textos
           de pantalla se escriben literales en la ayuda, con sus rarezas de
           siete segmentos incluidas —AUH, PLAN, bAJO, NO-C, y la N torcida de
           K ON—, porque un inspector que no las tenga por delante las reporta
           como defecto de firmware y tiene razón aparente. La segunda: las
           reglas se prueban por su efecto observable y no por su enunciado; R3
           no es un punto que diga «se cumple la memoria», sino apagar, encender
           y mirar qué sobrevivió.

           Las pruebas fotográficas no se repiten aquí: PARTES EXTERNAS,
           ACCESORIOS, MATERIAL IMPRESO y PARTES INTERNAS son las de siempre y
           estas referencias las heredan por no llevar etiqueta de plan propia.
           ------------------------------------------------------------------ */
