     asked for is an instruction with nowhere to land. Every point of the
     battery capacity test is like that: six pictures of an instrument being set
     up, and not one photograph requested. */
  const asksPhoto = !!p.photo ||
    (typeof current === "function" && current() && current().type === "photos");
  return `<div class="samp">
    <img src="${base}${IMG_EXTS[0]}" data-base="${base}" alt=""
      onclick="zoomSample(this)" onerror="sampleFallback(this)">
    <span>${tr(asksPhoto ? "sample_hint" : "sample_ref")}</span>
  </div>`;
}
/* Same two-format rule as the reference photos, and the same order: .jpg first,
   then .png once. A photo taken with a phone arrives as .jpg and nobody
   converts it before uploading, so asking for .png first spends a request on a
   file that is almost never there. If neither exists the block removes itself
   and the point is answered as usual. */
function sampleFallback(img){
  const base = img.getAttribute("data-base") || "";
  const at = (img.dataset.ext | 0) + 1;
  if(base && at < IMG_EXTS.length){
    img.dataset.ext = at;
    img.src = base + IMG_EXTS[at];
    return;
  }
  if(img.parentNode) img.parentNode.remove();
}
function zoomSample(img){
  if(!img || !img.naturalWidth) return;
  const box = document.createElement("div");
  box.className = "ri-zoom";
  box.onclick = () => box.remove();
  box.innerHTML = `<img src="${esc(img.src)}" alt="">
    <span>${esc(tr("sample_hint"))} · ${esc(tr("tap_close"))}</span>`;
  document.body.appendChild(box);
}

/* The box where the number goes, right under the photo of the instrument that
   produced it. Amber while it is empty, like every other thing the test will
   not close without. `oninput` never renders: it would rebuild the field and
   shut the phone keyboard between one digit and the next. */
function measureBox(p, u, id){
  /* Un código de barras no se escribe: lo pone el lector. El recuadro con
     teclado se cambia por uno que sólo muestra. */
  if(p.scan) return scanBox(p, u);
  const val = readingOf(row(u), p.id);
  return `<div class="meas${val.trim()?" ok":""}">
    ${/* `measure.as` cambia el rótulo del recuadro. Un selector de voltaje no
          se mide, se lee: la posición en la que quedó no es una medición. */""}
    <label for="mv_${id}">${p.measure.as ? esc(L(p.measure.as)) : tr("measured")}</label>
    <input id="mv_${id}" type="text" inputmode="decimal"
      value="${esc(val)}" placeholder="0${(p.measure.step||"1")==="1"?"":".0"}"
      oninput="setValue(${u},'${p.id}',this.value);markMeas('${id}',this.value)"
      autocomplete="off">
    <b>${esc(unitText(p.measure))}</b>
  </div>`;
}
/* El recuadro de un código de barras. No tiene teclado: el número sale del
   lector o no sale, y en ningún caso lo escribe el operario. Tres estados, y
   cada uno dice qué hacer a continuación:

     en espera — todavía no hay foto. El recuadro explica que el número se
                 obtiene al fotografiar, para que nadie lo busque en el teclado.
     leído     — el número, en verde, y bloqueado.
     no leído  — en rojo, con el motivo, y con el aviso de que la prueba
                 continúa igual y que el informe lo va a registrar. No bloquea:
                 detener la inspección por un código ilegible dejaría el resto
                 del producto sin revisar, que es mucho peor que un dato menos.
                 La foto queda guardada, así que el número se recupera de ella.
*/
function scanBox(p, u){
  const r    = row(u);
  const val  = readingOf(r, p.id).trim();
  const why  = scanFailed(r, p.id);
  const has  = shotsFor(r, p.id).some(m => m.kind === "photo" && !m.doc);
  const lab  = p.measure && p.measure.as ? esc(L(p.measure.as)) : tr("scan_lab");

  if(val) return `<div class="meas ok scan">
    <label>${lab}</label><u>${esc(val)}</u><b>${tr("scan_auto")}</b></div>`;

  if(has && why) return `<div class="meas bad scan">
    <label>${lab}</label>
    <div class="scan-msg"><b>${tr("scan_no")}</b>
      <i>${tr(why === "nodet" ? "scan_nodet" : "scan_unread")}</i>
      <em>${tr("scan_goes_on")}</em></div></div>`;

  return `<div class="meas scan">
    <label>${lab}</label><u class="wait">${tr("scan_wait")}</u></div>`;
}

/* Repaints the box in place, since `oninput` cannot render. */
function markMeas(id, val){
  const box = document.getElementById("mv_" + id);
  if(box && box.parentNode)
    box.parentNode.className = "meas" + (String(val||"").trim() ? " ok" : "");
}

function pointRow(p, u, showTag){
  const r = row(u);
  const v = r.points[p.id];
  const shots = shotsFor(r, p.id);
  const note = (r.notes && r.notes[p.id]) || "";
  const noteEn = appTrLine(r, "note", p.id);
  const evOk = shots.length > 0 && note.trim() !== "";

  /* A point marked `photo` in the plan is documented whether it passes or not:
     the display words are judged and photographed in the same gesture, so the
     office can check the spelling later without the speaker in front of it.
     Not shown when the point failed — the red box below already asks for the
     same photo, into the same slot. */
  const wantShot = p.photo && v !== "FAIL";
  const shotMissing = p.photo && v !== "NA" &&
    shots.filter(m => m.kind === "photo").length === 0;
  // Declared before the boxes below, all of which build element ids from it.
  // It used to sit further down: `const` is not hoisted the way `var` is, so
  // the first point that asked for its own photo threw on render and took the
  // whole test screen with it.
  const id = u + "_" + p.id;
  const wantValue = !!p.measure && v !== "NA";
  const shotBox = wantShot || wantValue ? `
    <div class="pshot${shotMissing?" miss":""}" id="psb_${id}">
      ${wantShot?`<button onclick="document.getElementById('ps_${id}').click()">${
        p.gallery ? "🖼" : "📷"} ${tr(p.doc ? "photo_doc"
          : p.gallery ? "photo_pick" : "photo")}</button>
      ${/* `capture` is what makes the phone open the camera and nothing else.
            It is right almost everywhere: the operator has the speaker in front
            of him and photographs it there and then. It is wrong on a point
            whose subject stopped existing hours ago — the battery discharge
            ends when it ends, the screen is photographed when it does, and the
            inspection may be filled in afterwards. Dropping the attribute lets
            the phone offer the gallery as well; it does not take the camera
            away. */""}
      <input id="ps_${id}" class="hidden" type="file"
        accept="image/*${p.doc ? ",application/pdf" : ""}"
        ${p.gallery ? "" : `capture="environment"`} multiple
        onchange="addMedia(this,${u},'${p.id}')">
      <div class="media">${shots.filter(m=>m.kind==="photo").map(m=>`
        <div class="thumb" onclick="zoomMedia('${m.uid}')">${thumbFace(m)}
          <span onclick="event.stopPropagation();dropMedia('${m.uid}')">×</span>
        </div>`).join("")}</div>`:""}
      ${sampleBox(p)}
      ${wantValue?measureBox(p, u, id):""}
      ${shotMissing?`<em>${tr("need_point_photo")}</em>`:""}
    </div>` : "";

  // Once the evidence is complete the box folds into one green line, so a test
  // with four failures does not become four screens of thumbnails. It reopens
  // with a tap. Folding happens on the next render, never while the operator is
  // typing — that would close the phone keyboard.
  const fold = v === "FAIL" && evOk && !failBoxOpen(u, p.id, evOk) ? `
    <div class="pf-c" onclick="toggleFail(${u},'${p.id}',true)">
      <b>✓</b><span>${esc(evSummary(shots, note))}</span><i>▸</i>
    </div>` : "";

  const fail = v === "FAIL" && !fold ? `
    <div class="pf" id="pf_${id}">
      <div class="pf-h">${tr("fail_evidence")}${showTag?
        " · " + fmt("speaker_n",{n:u+1}):""}</div>
      <div class="row">
        <button onclick="document.getElementById('pc_${id}').click()">${
          p.gallery ? "🖼" : "📷"} ${tr(p.gallery ? "photo_pick" : "photo")}</button>
        <button onclick="document.getElementById('pv_${id}').click()">🎥 ${tr("video")}</button>
      </div>
      ${/* The failure box follows the point. If the picture for this point can
            come out of the gallery, so can the picture of what went wrong with
            it — the two are taken at the same moment, in front of the same
            screen. */""}
      <input id="pc_${id}" class="hidden" type="file" accept="image/*"
        ${p.gallery ? "" : `capture="environment"`} multiple
        onchange="addMedia(this,${u},'${p.id}')">
      <input id="pv_${id}" class="hidden" type="file" accept="video/*"
        ${p.gallery ? "" : `capture="environment"`} multiple
        onchange="addMedia(this,${u},'${p.id}')">
      <div class="media">${shots.map(m=>`
        <div class="thumb" onclick="zoomMedia('${m.uid}')">
          ${thumbFace(m)}
          <b>${thumbTag(m)}</b>
          <span onclick="event.stopPropagation();dropMedia('${m.uid}')">×</span>
        </div>`).join("")}</div>
      <textarea placeholder="${tr("notes_fail_ph")}"
        oninput="noteTyped(${u},'${p.id}', this.value)"
        onblur="setTimeout(function(){closeFail(${u},'${p.id}')},180)">${esc(note)}</textarea>
      <div id="en_${id}" class="en-line${noteEn?"":" hidden"}">${
        noteEn?esc(noteEn):""}</div>
      <div id="pfw_${id}" class="${evOk?"pf-ok":"pf-w"}">${
        evOk?tr("fail_ready"):tr("fail_required")}</div>
    </div>` : "";

  return `<div class="pt" id="pt_${id}">
      ${showTag?`<u>${fmt("speaker_n",{n:u+1})}</u>`:""}
      ${p.tag?`<b class="ctl">${esc(p.tag)}</b>`:""}
      <span>${esc(L(p.label))}</span>
      <button class="${v==="PASS"?"on-p":""}" onclick="setPoint(${u},'${p.id}','PASS')">✓</button>
      <button class="${v==="FAIL"?"on-f":""}" onclick="setPoint(${u},'${p.id}','FAIL')">✗</button>
      ${/* `must` retira el N/A de un punto concreto: hay comprobaciones que toda
            unidad tiene que pasar, y ofrecer «no aplica» ahí es ofrecer una
            salida que no existe. */""}
      ${p.must?"":`<button class="na-btn ${v==="NA"?"on-n":""}" onclick="setPoint(${u},'${p.id}','NA')"
        title="${tr("na_title")}">${tr("na")}</button>`}</div>
    ${shotBox}${fail}${fold}`;
}

function renderTest(){
  const t = current();
  /* No tests at all for this reference. Only reachable from a draft whose
     reference was left without a plan by a later publication. Saying so and
     going back beats drawing a checklist of nothing. */
  if(!t){
    S.screen = "setup";
    alert(tr("a_no_plan"));
    return renderSetup();
  }
  const done = S.index, total = tests().length;

  if(t.type === "photos") return renderPhotoTest(t, row(0), done, total);

  const shared = row(0);      // test-level evidence and notes live on speaker 1
  const sharedEn = appTrLine(shared, "comment");
  const pending = pendingCount();
  const naTest = allNA(t);
  const want = evidenceWanted(t);
  const needsPhoto = missingEvidence(0).photo;
  const needsVideo = missingEvidence(0).video;
  // A failure without its photo and its note is as blocking as an unanswered
  // point, so the Next button has to dim for it too.
  let openFails = 0;
  allUnits().forEach(u => realPoints(t).forEach(p => {
    if(failOpen(row(u), p)) openFails++;
  }));
  const ready = pending === 0 && !needsPhoto && !needsVideo && openFails === 0
    && pointShotsMissing(t) === 0 && pointValuesMissing(t) === 0;
  const many = S.units > 1;

  const groups = sectionsOf(t).map(sec => {
    const tot = sec.points.length * S.units;
    let ans = 0, bad = 0;
    allUnits().forEach(u => sec.points.forEach(p => {
      const v = row(u).points[p.id];
      if(ANSWERED.indexOf(v) >= 0) ans++;
      if(v === "FAIL") bad++;
    }));
    const open = sectionOpen(sec.name, sec);
    const badge = bad ? `<em class="bad">${bad} ✗</em>`
                : ans===tot ? `<em class="ok">✓ ${tot}</em>` : `<em>${ans}/${tot}</em>`;
    const rows = sec.points.map(p => {
      const ph = L(p.help);
      const pOpen = pointHelpOpen(p.id);
      // The question is written once; the speakers hang underneath it.
      return `<div class="q">
        ${many?`<div class="q-h">${esc(pLab(p))}</div>`:""}
        ${allUnits().map(u => pointRow(p, u, many)).join("")}
        ${ph?`<button class="p-help ${pOpen?"on":""}"
          onclick="togglePointHelp('${p.id}')">${pOpen?"−":"+"} ${tr("how_to")}</button>`:""}
        ${pOpen&&ph?`<div class="pt-help">${esc(ph)}</div>`:""}
      </div>`;
    }).join("");
    const cls = bad ? "bad" : ans===tot ? "done" : "";
    const safe = String(sec.name).replace(/['"\\]/g,"");
    const hOpen = helpOpen(sec.name);
    return `<div class="grp ${cls}">
      <div class="grp-h">
        <b onclick="toggleSection('${safe}')">${esc(sec.name || tr("checks"))}</b>
        ${badge}
        ${canSectionNA()?`<button class="help-b na-sec${
            secAllNA(sec)?" on":""}" title="${esc(
            secAllNA(sec)?tr("na_undo_title"):tr("na_title"))}"
          onclick="naSection('${safe}')">${tr("na")}</button>`:""}
        ${sec.help?`<button class="help-b ${hOpen?"on":""}"
          onclick="toggleHelp('${safe}')">${hOpen?"−":"+"}</button>`:""}
        <i onclick="toggleSection('${safe}')">${open?"▾":"▸"}</i>
      </div>
      ${hOpen&&sec.help?`<div class="grp-help">${esc(sec.help)}</div>`:""}
      ${open?`<div class="grp-b">${rows}</div>`:""}</div>`;
  }).join("");

  app.innerHTML = `
    ${header(t, done, total)}
    <p class="hint" id="hint" style="margin:0 0 10px">${hintHtml(t)}</p>
    ${/* The picture of the panel, on the checklist itself and not only on the
          start screen. A plan written against B1 to B8 is unreadable without
          it: the operator is holding the cabinet, the points name a button by
          number, and the number is printed nowhere on the product. It is shown
          for development references because those are the ones whose points are
          written that way; if a released reference ever needs it, this is the
          line to widen. */""}
    ${isDevRef(S.model) ? panelRow(t) : ""}
    ${longNotice(t)}
    ${groups}
    ${/* The whole card disappears on a test that asks for nothing. It used to
          stay, saying "nothing is required here" over two buttons — a box that
          explains why it is there, which is the definition of a box that should
          not be. Evidence for those tests belongs to their points, which ask for
          it by name. */""}
    ${!(want.photo || want.video) ? "" : `
    <div class="card" id="evcard">
      <label style="margin-top:0">${tr("evidence")}${needsPhoto||needsVideo?
        ` <span style="color:var(--amber)">${tr("required")}</span>`:""}</label>
      ${naTest?`<p class="hint" style="margin:0 0 8px">${tr("ev_na")}</p>`:""}
      ${/* The list names only what this test actually asks for. A line reading
            "photo — required" struck through with a tick, on a test that never
            wanted one, is how the operator stops reading this box at all. Both
            buttons stay: attaching something nobody asked for is always allowed
            and often the most useful thing in the packet. */""}
      ${(want.photo || want.video) ? `<ul class="ask">
        ${/* `ask` en la prueba reemplaza el texto general del video. El general
              habla de la pantalla y de las manos, que es lo correcto en una
              prueba de funciones; un recorrido del gabinete pide otra cosa. */""}
        ${want.video?`<li><b>${tr("video")}</b> ${t.ask ? esc(L(t.ask)) : tr("ask_video")}${needsVideo
          ? ` <b style="color:var(--amber)">${tr("required")}</b>`
          : naTest ? "" : ` <b style="color:var(--green)">✓</b>`}</li>`:""}
        ${want.photo?`<li><b>${tr("photo")}</b> ${tr("ask_photo")}${needsPhoto
          ? ` <b style="color:var(--amber)">${tr("required")}</b>`
          : naTest ? "" : ` <b style="color:var(--green)">✓</b>`}</li>`:""}
      </ul>` : `<p class="hint" style="margin:0 0 8px">${tr("ev_free")}</p>`}
      ${/* Only the buttons this test actually asks for. A camera button on a test
            that wants a clip is an invitation to answer the wrong way, and the
            operator who takes it leaves the evidence card still demanding the
            video he thought he had just provided. */""}
      <div class="row">
        ${want.photo?`<button onclick="document.getElementById('cam').click()">📷 ${tr("photo")}</button>`:""}
        ${want.video?`<button onclick="document.getElementById('vid').click()">🎥 ${tr("video")}</button>`:""}
      </div>
      <input id="cam" class="hidden" type="file" accept="image/*" capture="environment" multiple onchange="addMedia(this,0)">
      <input id="vid" class="hidden" type="file" accept="video/*" capture="environment" multiple onchange="addMedia(this,0)">
      ${mediaBlock(shared)}
      ${needsPhoto||needsVideo?`<div class="needed">${
        needsPhoto && needsVideo ? tr("need_both")
        : needsVideo ? tr("need_video")
        : (many ? tr("need_photo_n") : tr("need_photo"))}</div>`:""}
    </div>`}
    <div class="card">
      <label style="margin-top:0">${tr("notes")} ${tr("optional")}</label>
      <textarea id="comment" placeholder="${tr("notes_ph")}"
        oninput="commentTyped(this.value)">${esc(shared.comment)}</textarea>
      <div id="en_comment" class="en-line${sharedEn?"":" hidden"}">${
        sharedEn?esc(sharedEn):""}</div>
    </div>
    ${abortBlock()}`;

  const pend = !!t.long && pendingCount() > 0 && done + 1 < total;
  actions.innerHTML = `
    ${done>0?`<button class="skip" style="flex:0 0 52px" onclick="prevTest()">‹</button>`:""}
    ${pend?`<button class="skip" style="flex:1;border-color:var(--amber);color:var(--amber)"
      onclick="leavePending()">${tr("leave_pending")}</button>`:""}
    <button class="primary" id="btn-next" style="flex:${pend?1:4}${ready?"":";opacity:.5"}" onclick="nextTest()">
      ${done+1===total?tr("finish"):tr("next")}</button>
`;
}

/* Marking a whole section as N/A is a HOKLAN admin tool. It exists because a
   targeted inspection often runs one test on a reference that has none of the
   optional hardware, and answering fifteen points one by one with N/A is how a
   checklist stops being read. A factory account does not get it: deciding that
   a section does not apply is a judgement about the plan, not about the unit. */
const canSectionNA = () => S.fromAdmin && !S.selfCheck;

/* Whether the whole section is already N/A, on every speaker. Drives both the
   look of the button and what pressing it does. */
function secAllNA(sec){
  if(!sec || !sec.points.length) return false;
  return allUnits().every(u =>
    sec.points.every(p => row(u).points[p.id] === "NA"));
}

/* A switch, not a one-way action. Marking a whole section N/A by mistake used
   to mean answering every point again by hand to undo it, and nothing on the
   screen said the section had been marked at all — the badge read 12/12, the
   same as a section that had been worked through. */
function naSection(safe){
  const sec = sectionsOf(current())
    .find(s => String(s.name).replace(/['"\\]/g,"") === safe);
  if(!sec) return;
  const undo = secAllNA(sec);
  // It can overwrite answers already given, so it asks — both ways round.
  if(!confirm(fmt(undo ? "a_na_section_undo" : "a_na_section",
                  {s: sec.name || tr("checks")}))) return;
  allUnits().forEach(u => {
    const r = row(u);
    sec.points.forEach(p => {
      if(undo) delete r.points[p.id]; else r.points[p.id] = "NA";
    });
  });
  // Hand the section back to the automatic fold rule now that it is answered.
  delete S.open[secKey(sec.name)];
  render(); save();
  focusNextGroup(sectionsOf(current())
    .findIndex(s => String(s.name).replace(/['"\\]/g,"") === safe));
}

/* Typing a note cannot trigger a full render — the textarea would be rebuilt
   and the phone keyboard would close on every keystroke. So the three things
   that depend on that note are patched in place instead. */
const failOpen = (r,p) => r.points[p.id] === "FAIL" &&
  (shotsFor(r,p.id).length === 0 || !((r.notes && r.notes[p.id]) || "").trim());

/* The evidence every test has to be left with: one photo *and* one clip of it
   being run. Both are demanded because they answer different questions — the
   photo shows the setup and the tools used, the video shows the speaker
   actually working. Evidence of a specific defect carries a slot and is
   accounted for on its own point, so it does not count here. */
/* Every point of the test answered N/A, on every speaker: the reference simply
   does not have this input. N/A is an answer, not a way of skipping — the
   operator still had to go point by point to give it. */
function allNA(t){
  const pts = realPoints(t || current());
  if(!pts.length) return false;
  return allUnits().every(u => pts.every(p => row(u).points[p.id] === "NA"));
}

/* What a test must be left with beyond what its own points ask for. The default
   is one photograph and one clip of the test being run, which is right for a
   speaker: fourteen tests, each a different act, and the clip is how the office
   sees the act rather than its verdict.

   A test can say otherwise with `"evidence"`: a list of what it wants, or an
   empty list for nothing. LESHENG asks for nothing on most of its tests and a
   clip on LOGOS only. There the demand was a formality — a video of somebody
   pressing a button next to a point that already records whether the button
   worked — and a formality collected fifteen times is how an inspector starts
   filming the ceiling to get past the screen. */
function evidenceWanted(t){
  if(!t || t.evidence === undefined) return {photo:true, video:true};
  const want = [].concat(t.evidence);
  return {photo: want.indexOf("photo") >= 0, video: want.indexOf("video") >= 0};
}

function missingEvidence(u){
  const t = current();
  // Nothing to photograph and nothing to film when the function does not exist
  // on this speaker. Demanding evidence anyway is what produces a picture of an
  // unrelated panel filed as proof that a test was run.
  if(allNA(t)) return {photo:false, video:false};
  const want = evidenceWanted(t);
  const gen = row(u || 0).media.filter(m => !m.slot);
  return {photo: want.photo && !gen.some(m => m.kind === "photo"),
          video: want.video && !gen.some(m => m.kind === "video")};
}
function evidenceComplete(){
  const m = missingEvidence(0);
  return !m.photo && !m.video;
}

/* How many `photo` points are still without their picture, across every speaker.
   A point marked N/A needs none: the mode does not exist on this reference. */
function pointShotsMissing(t){
  let n = 0;
  allUnits().forEach(u => realPoints(t).forEach(p => {
    if(!p.photo) return;
    const r = row(u);
    if(r.points[p.id] === "NA") return;
    if(shotsFor(r, p.id).filter(m => m.kind === "photo").length === 0) n++;
  }));
  return n;
}

function openFailCount(t){
  let n = 0;
  allUnits().forEach(u => realPoints(t).forEach(p => {
    if(failOpen(row(u), p)) n++;
  }));
  return n;
}

function hintHtml(t){
  // Said before anything else, because it explains why the checklist below is
  // already full of N/A and how to get it back.
  if(t.optional && allNA(t))
    return `<b style="color:var(--amber)">${tr("na_test_on")}</b>`;
  const pending = pendingCount();
  if(pending) return fmt("remaining",{n:pending});
  const open = openFailCount(t);
  return open ? `<b style="color:var(--red)">${fmt("open_fails",{n:open})}</b>`
              : `<b style="color:var(--green)">${tr("all_done")}</b>`;
}

function syncFail(u, pointId){
  const t = current();
  if(!t || t.type === "photos") return;

  const p = realPoints(t).find(x => x.id === pointId);
  const box = document.getElementById("pfw_" + u + "_" + pointId);
  if(p && box){
    const ok = !failOpen(row(u), p);
    box.className = ok ? "pf-ok" : "pf-w";
    box.textContent = ok ? tr("fail_ready") : tr("fail_required");
  }

  const hint = document.getElementById("hint");
  if(hint) hint.innerHTML = hintHtml(t);

  syncReady();
}

/* The NEXT button on its own, without touching anything the operator may be
   typing in. Typing a measured value cannot trigger a render — the field would
   be rebuilt and the phone keyboard would close on every digit. */
function syncReady(){
  const t = current();
  const btn = document.getElementById("btn-next");
  if(!t || !btn) return;
  let ready;
  if(t.type === "photos"){
    /* The same four conditions nextTest enforces, in the same order. This used
       to check only the photograph and the reading, so on a photographic test
       the button went bright the moment a measurement was typed — and then
       refused to advance, because the point had not been answered or a failure
       had no description. A control that looks ready and is not teaches the
       operator that the button lies. */
    const r = row(0);
    ready = realPoints(t).every(p =>
      (shotsFor(r, p.id).length > 0 ||
       ((!noNA(t) || allNA(t)) && r.points[p.id] === "NA"))
      && !valueMissing(r, p)
      && ANSWERED.indexOf(r.points[p.id]) >= 0
      && !(r.points[p.id] === "FAIL" && !((r.notes && r.notes[p.id] || "").trim())));
  } else {
    ready = pendingCount() === 0 && evidenceComplete() &&
      openFailCount(t) === 0 && pointShotsMissing(t) === 0 &&
      pointValuesMissing(t) === 0;
  }
  btn.style.opacity = ready ? "" : ".5";
}

function renderPhotoTest(t, r, done, total){
  const rEn = appTrLine(r, "comment");
  const items = realPoints(t);
  const missing = items.filter(p =>
    shotsFor(r,p.id).length === 0 &&
    ((noNA(t) && !allNA(t)) || r.points[p.id] !== "NA")).length
    + items.filter(p => valueMissing(r, p)).length
    // Unanswered points and failures without their description block NEXT here
    // too, exactly as they do on an ordinary test.
    + items.filter(p => ANSWERED.indexOf(r.points[p.id]) < 0).length
    + items.filter(p => r.points[p.id] === "FAIL" &&
        !((r.notes && r.notes[p.id] || "").trim())).length;

  const allowNA = !noNA(t);

  /* These points used to record only that a photograph existed. A switch left in
     the wrong position, a dented corner, a logo printed crooked — the picture
     showed all of it and the report said nothing, because there was nowhere to
     say it. Now each one is answered as well as photographed, and a NO CONFORME
     here behaves like one anywhere else: it demands the written description and
     it carries the whole test to FAIL.

     No failure code on these, by decision: the observation carries the meaning.
     The dashboard will not be able to group them, and that is the trade accepted
     — a code invented per point would be a list nobody maintains. */
  const rows = items.map(p => {
    const shots = shotsFor(r,p.id);
    const v = r.points[p.id];
    const na = allowNA && v === "NA";
    const ph = L(p.help);
    const pOpen = pointHelpOpen(p.id);
    const note = (r.notes && r.notes[p.id]) || "";
    const noteEn = appTrLine(r, "note", p.id);
    const evOk = shots.length > 0 && note.trim() !== "";
    const done = ANSWERED.indexOf(v) >= 0 && (na || shots.length > 0);
    return `<div class="shot ${done?"ok":""}" id="sb_${p.id}">
      <div class="shot-head">${p.tag?`<i class="ctl">${esc(p.tag)}</i>`:""}<b>${
        esc(L(p.label))}</b>
        ${shots.length?`<em>${shots.length}</em>`:
          na?`<em class="na">${tr("na")}</em>`:`<em class="miss">${tr("required").replace("— ","")}</em>`}
      </div>
      ${ph?`<button class="p-help ${pOpen?"on":""}"
        onclick="togglePointHelp('${p.id}')">${pOpen?"−":"+"} ${tr("how_to")}</button>`:""}
      ${pOpen&&ph?`<div class="pt-help">${esc(ph)}</div>`:""}
      <div class="pt" style="padding:0;border:none;background:none">
        <span>${tr("th_result")}</span>
        <button class="${v==="PASS"?"on-p":""}" onclick="setPoint(0,'${p.id}','PASS')">✓</button>
        <button class="${v==="FAIL"?"on-f":""}" onclick="setPoint(0,'${p.id}','FAIL')">✗</button>
        ${allowNA && !p.must?`<button class="na-btn ${na?"on-n":""}"
          onclick="setPoint(0,'${p.id}','NA')" title="${tr("na_title")}">${tr("na")}</button>`:""}
      </div>
      ${na?"":`<div class="row">
        <button onclick="document.getElementById('s_${p.id}').click()">📷 ${tr("photo")}</button>
      </div>`}
      <input id="s_${p.id}" class="hidden" type="file" accept="image/*"
        capture="environment" multiple onchange="addMedia(this,0,'${p.id}')">
      <div class="media">${shots.map(m=>`
        <div class="thumb" onclick="zoomMedia('${m.uid}')"><img src="${m.url}">
          <span onclick="event.stopPropagation();dropMedia('${m.uid}')">×</span>
        </div>`).join("")}</div>
      ${sampleBox(p)}
      ${p.measure && !na ? measureBox(p, 0, "0_" + p.id) : ""}
      ${v==="FAIL"?`<div class="pf" id="pf_0_${p.id}">
        <div class="pf-h">${tr("fail_evidence")}</div>
        <textarea placeholder="${tr("notes_fail_ph")}"
          oninput="noteTyped(0,'${p.id}', this.value)">${esc(note)}</textarea>
        <div id="en_0_${p.id}" class="en-line${noteEn?"":" hidden"}">${
          noteEn?esc(noteEn):""}</div>
        <div class="${evOk?"pf-ok":"pf-w"}">${
          evOk?tr("fail_ready"):tr("fail_required")}</div>
      </div>`:""}
    </div>`;
  }).join("");

  app.innerHTML = `
    ${header(t, done, total)}
    <div class="card">
      <label style="margin-top:0">${tr("how_photos")}</label>
      ${/* Steps are filtered like points. Without this a step could ask for
             something no point on the screen records — INTERNAL told RHYME to
             photograph the routing of an FM antenna these cabinets do not have,
             because the point had been filtered out and the step had not. */""}
      <ol class="steps">${t.steps.filter(fits).map(s=>`<li>${esc(L(s))}</li>`).join("")}</ol>
    </div>
    ${/* Here too. A photographic test on a development reference names the
           connectors C1 to C6, and those numbers are printed nowhere on the
           cabinet either — the operator needs the same map he has on every
           other test of the plan. */""}
    ${isDevRef(S.model) ? panelRow(t) : ""}
    <p class="hint" style="margin:0 0 10px">${missing?
      fmt("remaining",{n:missing}) :
      `<b style="color:var(--green)">${tr("all_done")}</b>`}</p>
    ${/* Marcada N/A entera, la sección se recoge. Diecinueve tarjetas idénticas
          diciendo N/A no informan de nada y obligan a bajar por todas para
          llegar al botón. Se vuelve a desplegar deshaciendo el N/A desde el
          encabezado, que es el mismo gesto que la marcó. */""}
    ${allNA(t) ? `<div class="brw">
        <b>${tr("na")} · ${esc(tr("na_folded_t"))}</b>
        <span>${fmt("na_folded",{n:items.length})}</span>
      </div>` : rows}
    <div class="card">
      <label style="margin-top:0">${tr("notes")} ${tr("optional")}</label>
      <textarea id="comment" placeholder="${tr("notes_ph")}"
        oninput="commentTyped(this.value)">${esc(r.comment)}</textarea>
      <div id="en_comment" class="en-line${rEn?"":" hidden"}">${
        rEn?esc(rEn):""}</div>
    </div>
    ${abortBlock()}`;

  actions.innerHTML = `
    ${done>0?`<button class="skip" style="flex:0 0 52px" onclick="prevTest()">‹</button>`:""}
    <button class="primary" id="btn-next" style="flex:4${
      missing?";opacity:.5":""}" onclick="nextTest()">
      ${done+1===total?tr("finish"):tr("next")}</button>
`;
}

function showIndex(){ S.screen = "index"; render(); }

/* Leaves a long test where it is and opens the next one. The same thing the
   index screen does in two taps, named after what the operator is trying to do.
   No verdict is written: the test stays unanswered, the index shows it as such,
   and the block above will not let the inspection close while it is. */
function leavePending(){
  const n = tests().length;
  if(S.index + 1 >= n){ showIndex(); return; }
  S.index++;
  S.screen = "test";
  window.scrollTo(0,0);
  render(); save();
}

/* Shown on a test that is written to take hours, and only while something in it
   is still unanswered. On every other test an unlit NEXT means "you have missed
   something", which is the right message; here it would mean "wait four hours",
   which is not something a dimmed button can say. */
function longNotice(t){
  if(!t || !t.long || pendingCount() === 0) return "";
  return `<div class="brw"><b>${esc(L(t.long.t))}</b>
    <span>${esc(L(t.long.n))}</span></div>`;
}
function goTest(i){
  S.index = i; S.screen = "test";
  window.scrollTo(0,0);   // a new test must start at its first step
  render(); save();
}
/* Stamped the first time the inspection is closed and never again: reaching the
   finish screen twice — because the operator went back to fix a photo — must not
   stretch the duration the report prints. */
function markFinished(){ if(!S.finishedAt) S.finishedAt = Date.now(); }

function finish(){
  S.screen = "done"; markFinished();
  render(); save(); ensureTranslations();
}

function renderIndex(){
  const list = tests().map((t,i)=>{
    const r = (S.data[0]||[])[i];
    // A test counts as failed if it failed on any speaker, and as answered only
    // when every speaker has been answered.
    const total = realPoints(t).length * (t.type === "photos" ? 1 : S.units);
    let status = "—", cls = "";
    const verdicts = allUnits().map(u => ((S.data[u]||[])[i]||{}).verdict);
    if(i === S.index){ status = tr("here"); cls = "now"; }
    else if(r && r.verdict === "DOC"){ status = tr("photos_tag"); cls = "PASS"; }
    else if(verdicts.indexOf("FAIL") >= 0){ status = "FAIL"; cls = "FAIL"; }
    else if(r && r.verdict){ status = r.verdict; cls = verdictClass(r.verdict); }
    else {
      let n = 0;
      if(t.type === "photos"){
        if(r) n = realPoints(t).filter(p => shotsFor(r,p.id).length).length;
      } else {
        allUnits().forEach(u => {
          const ru = (S.data[u]||[])[i];
          if(ru) n += realPoints(t)
            .filter(p => ANSWERED.indexOf(ru.points[p.id])>=0).length;
        });
      }
      if(n) status = n + "/" + total;
    }
    const files = allUnits().reduce((a,u)=>
      a + (((S.data[u]||[])[i]||{}).media||[]).length, 0);
    return `<div class="ix" onclick="goTest(${i})">
      <b>${i+1}</b>
      <span>${esc(L(t.label))}
        <i>${fmt("points_n",{n:total})}${files?" · "+fmt("files_n",{n:files}):""}${
          t.optional?" · "+tr("is_optional"):""}</i></span>
      <em class="${cls}">${esc(status)}</em></div>`;
  }).join("");

  // Where each speaker stands. Read-only: the checklist is walked once, so
  // there is nothing to navigate to here — a tap would only mislead.
  const units = S.units < 2 ? "" : `
    <h2>${tr("by_unit")}</h2>
    <div class="card">${allUnits().map(i=>{
      const rows = unitRows(i);
      const doneN = rows.filter(r => r && r.verdict).length;
      const v = unitVerdict(rows);
      return `<div class="ix" style="cursor:default">
        <b>${i+1}</b>
        <span>${fmt("speaker_n",{n:i+1})}
          <i>${doneN}/${tests().length}</i></span>
        ${/* The class keeps the raw verdict, because that is what the colours
               are keyed on; only the word the operator reads is translated.
               Printing `v` did both jobs with one value and left PASS and FAIL
               in English on a screen that is otherwise entirely in his own
               language. */""}
        <em class="${v==="INCOMPLETE"?"":v}">${
          v === "INCOMPLETE" ? "—" : esc(verdictText(v))}</em></div>`;
    }).join("")}</div>`;

  app.innerHTML = `${langBar(true)}
    ${units}
    <h2>${tr("tests_title")}</h2>
    <p class="hint" style="margin:0 0 12px">${tr("index_hint")}</p>
    <div class="card">${list}</div>
    ${/* The index is the other place you stand inside an inspection, and the one
          you reach when looking for a way out of it. */""}
    ${abortBlock()}`;

  const complete = allUnits().every(i => unitVerdict(unitRows(i)) !== "INCOMPLETE");
  actions.innerHTML = `
    <button class="primary" onclick="goTest(${Math.min(S.index, tests().length-1)})">
      ${tr("back_to_test")}</button>
    ${complete?`<button onclick="finish()">${tr("finish")}</button>`:""}`;
}

function renderDone(){
  const v = finalVerdict();
  const colour = v==="PASS"?"var(--green)":v==="FAIL"?"var(--red)":"var(--amber)";

  // One block per speaker: a lot that failed has to say which unit failed and
  // on what, or the operator has to reopen the report to find out.
  const blocks = allUnits().map(i=>{
    const rows = unitRows(i);
    const uv = unitVerdict(rows);
    const fails = [];
    // Indexed over the plan, not over the stored rows: a test never opened has
    // no row at all, and it has to show as pending rather than vanish.
    const table = tests().map((t,k)=>{
      const r = rows[k];
      if(r && r.verdict === "FAIL") fails.push({r, t});
      // The plan's label, not the one frozen when the operator answered:
      // switching language on this screen has to translate the table too.
      return `<tr><td>${esc(L(t.label))}</td>
        <td class="${verdictClass(r && r.verdict)}">${
          esc(verdictText(r && r.verdict))}</td></tr>`;
    }).join("");
    return `<div class="card">
      ${S.units>1?`<div class="unit-tag">${fmt("speaker_n",{n:i+1})}</div>
        <span class="${uv}" style="font-weight:700">${verdictText(uv)}</span>`:""}
      <table>${table}</table>
      ${fails.length?`<div class="warn"><b>${tr("failures")}</b><br>${fails.map(f=>
        realPoints(f.t).filter(p => f.r.points[p.id] === "FAIL")
          .map(p => esc(p.code) + " — " + esc(pLab(p))).join("<br>")
      ).join("<br>")}</div>`:""}
    </div>`;
  }).join("");

  const files = allUnits().reduce((n,u)=>
    n + unitRows(u).reduce((m,r)=>m+(r?(r.media||[]).length:0),0), 0);
  const all = mediaList();
  const vids = all.filter(m => m.m.kind === "video").length;
  const pics = all.length - vids;

  app.innerHTML = `
    ${langBar(true)}
    ${/* The verdict of the whole inspection, and the largest thing on the
           screen. It was the last place still saying PASS or INCOMPLETE in
           English to an operator working in Chinese. The colour comes from
           `colour`, computed from the raw value, so translating the word
           changes nothing else. */""}
    <div class="big" style="color:${colour};border:2px solid ${colour}">${
      esc(verdictText(v))}</div>
    <div class="card">
      <div class="tag">${esc(S.testId)}</div><div class="tag">${esc(S.model)}</div>
      <div class="tag">${esc(inspectionDate(S.startedAt))}</div>
      <div class="tag">${esc(S.operator)}</div>
      ${S.units>1?`<div class="tag">${fmt("units_tag",{n:S.units})}</div>`:""}
      <p class="hint">${fmt("evidence_total",{n:files,s:humanSize(evidenceBytes())})}</p>
      ${/* El aviso rojo por paquete grande se retiró en la v12.2, junto con el
            del video pesado y por lo mismo: aparecía al terminar una inspección
            correcta y el operador lo leía como un fallo suyo. El peso sigue
            escrito en la línea de arriba, que es donde informa sin alarmar. */""}
      <button class="jump" onclick="showIndex()">${tr("review")}</button>
    </div>
    ${blocks}
    <div class="card">
      <label style="margin-top:0">${tr("packet")}</label>
      <ul class="packet">
        <li><b>REPORT_ES.html</b> ${tr("rm_report_es")}</li>
        <li><b>REPORT_EN.html</b> ${tr("rm_report_en")}</li>
        <li><b>REPORT_ZH.html</b> ${tr("rm_report_zh")}</li>
        <li><b style="word-break:break-all">${esc(packetName())}.csv</b>
          ${tr("rm_csv")}</li>
        ${pics?`<li><b>photos/</b> ${fmt("rm_photos",{n:pics})}</li>`:""}
        ${vids?`<li><b>videos/</b> ${fmt("rm_videos",{n:vids})}</li>`:""}
      </ul>
      <p class="hint" style="margin-top:0">${tr("rm_naming")}</p>
      <p class="hint" style="margin-top:0">${tr("packet_note")}</p>
      ${!CAN_DOWNLOAD?`<p class="hint">${
        fmt("dl_no",{w: IS_WECHAT?tr("in_wechat"):IS_IOS?tr("in_ios"):""})}</p>`:""}
      <button class="jump" onclick="showReport()">${tr("open_report")}</button>
      <div id="saved" class="warn hidden"
        style="background:rgba(20,102,58,.45);border-color:var(--green)"></div>
    </div>`;

  /* Un solo botón desde la v13.4. Al lado del paquete vivía «descargar reporte
     básico», que bajaba el informe suelto, sin fotos ni hoja de cálculo. Dos
     botones de descarga uno junto al otro invitaban a elegir, y el que no había
     que elegir era más corto de leer; una inspección entregada como informe
     suelto llega sin la evidencia que la sostiene.

     El informe suelto no se pierde: sigue a un toque de distancia, en «Ver
     informe / Guardar PDF», que es donde corresponde — se abre para mirarlo, y
     desde ahí se guarda si alguien lo necesita. */
  actions.innerHTML = `
    <button class="packet-dl${PACKET_SAVED ? " done" : ""}" onclick="downloadPacket()">${
      tr(PACKET_SAVED ? "download_done" : "download")}</button>`;
}

function renderReport(){
  // Reuse the report's own stylesheet so the preview matches the PDF exactly.
  const full = reportHtml();
  const css = (full.match(/<style>([\s\S]*?)<\/style>/) || ["",""])[1];
  const body = full.replace(/^[\s\S]*<body>/, "").replace(/<\/body>[\s\S]*$/, "");

  app.innerHTML = `
    ${langBar(true)}
    <div class="card noprint">
      <label style="margin-top:0">${tr("save_pdf")}</label>
      <p class="hint" style="margin-top:0">${tr("pdf_how")}</p>
      <button class="jump" onclick="printReport()">${tr("save_pdf_btn")}</button>
    </div>
    <div id="report"><style>${css}</style>${body}</div>`;
  actions.innerHTML = `
    <button class="primary" onclick="printReport()">${tr("save_pdf")}</button>
    <button onclick="backToDone()">${tr("back")}</button>`;
}
function backToDone(){ S.screen = "done"; render(); }

/* ---------- back to the start screen -------------------------------------- */
function goHome(){
  // An inspection in progress is real work; never discard it on one tap.
  const working = S.screen !== "setup" &&
    S.data.some(u => (u || []).some(r => r));
  /* Terminada y sin descargar no se puede abandonar: no es una pregunta, es un
     bloqueo. Antes era un `confirm` —«¿volver de todas formas?»— y ahí el
     operario apurado pulsaba «sí» y perdía una inspección entera en un toque.
     Ahora la app se queda donde está y sólo dice qué hacer.

     La salida no es esta pantalla: es el botón ámbar, que después de descargar
     se pone verde y deja pasar. Lo pidió HOKLAN sin excepción, sabiendo que una
     inspección terminada por error tampoco se puede descartar desde aquí. */
  if(working && S.screen === "done" && !PACKET_SAVED){
    alert(tr("a_home_nodl"));
    return;
  }
  if(working && !confirm(tr("a_home"))) return;

  clearDraft();
  S.screen = "setup"; S.index = 0; S.units = 1;
  S.data = [[]]; S.open = {};
  S.startedAt = null; S.finishedAt = null; S.mediaDropped = false;
  S.pick = null; S.fromAdmin = false; S.selfCheck = false; S.poLetter = ""; S.poAuto = false;
  goHomeReset();
  window.scrollTo(0,0);
  render();
}

const topBtn = document.getElementById("toTop");
/* HOME is offered only once the inspection is closed.

   Not in Admin: the tabs are already the way back, and a HOME button next to
   them would be a second one that does something slightly different.

   Not while the checklist is open either. That button discards every answer and
   every photograph taken so far, and on a phone held in one hand next to a
   speaker it sits a thumb's width from the buttons the operator is pressing all
   day. There is no reason to leave a test half way: an inspection launched from
   Admin has ABORT, which records what was done, and a factory inspection is
   meant to be finished.

   It comes back on the finish screen, where the work is already done and the
   operator needs a way to start the next unit. Not on the report: that screen
   has its own way back, and a floating button over a document the operator is
   about to print is one more thing that can be pressed by mistake — and it
   lands in the printed page as well. */
function updateTopBtn(){
  const show = S.screen === "done" && !inAdmin();
  topBtn.className = "totop" + (show ? " show" : "");
  topBtn.textContent = tr("home");
}

/* ---------- boot ---------------------------------------------------------- */
document.documentElement.lang = LANG === "zh" ? "zh-CN" : LANG;

/* The answers come back synchronously, exactly as they always have, and the
   screen is drawn from them. Only the photographs are waited for, and only
   after there is something on screen: if the store is slow or unreachable the
   app is already usable, and the worst case is the message that says which
   pictures have to be taken again. It is never a blank page. */
if(restore()){
  /* The restored screen is held back until the pictures are in and the question
     has been answered. Drawing the checklist first would put the operator in
     front of an inspection nobody has agreed to resume yet, with empty frames
     where the photographs are still loading. The start screen is what used to
     be behind that dialog, so that is what stays behind it. */
  const target = S.screen;
  S.screen = "setup";
  render();

  openMediaDb().then(loadShots).then(missing => {
    S.screen = target;
    if(missing) S.mediaDropped = true;
    const lost = S.mediaDropped ? tr("a_lost") : "";
    if(confirm(tr("a_resume") + lost)){
      S.mediaDropped = false;
      /* Rewrites the draft in the new shape. A draft left by the version that
         kept its pictures inside localStorage moves across here, on its own,
         the first time it is opened - so publishing this loses nobody's work. */
      save();
    } else {
      clearDraft(); S.screen="setup"; S.data=[[]]; S.units=1;
      S.index=0; S.mediaDropped=false; goHomeReset();
    }
    render();
  });
} else {
  openMediaDb();
  render();
}

/* Warn before leaving with work that has not been downloaded. The finish screen
   counts: that is where an inspection sits complete and still only inside this
   phone. */
window.addEventListener("beforeunload", e => {
  if(S.screen === "test" || S.screen === "done"){
    e.preventDefault(); e.returnValue = "";
  }
});
updateTopBtn();
</script>
</body>
</html>
