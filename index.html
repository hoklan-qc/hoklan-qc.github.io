<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The published version, readable without running the app: fetching the page
     is enough to tell which build is live. This tag is the single source of
     truth — APP_VERSION reads it — so there is one number to bump, not two.
     It is not printed anywhere: neither on screen nor in the report. This tag
     is where it is meant to be read. -->
<meta name="app-version" content="13.9">
<title>HOKLAN QC</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a1a2c'/><text y='68' x='50' font-size='52' text-anchor='middle' fill='%232ea3f2' font-family='sans-serif' font-weight='bold'>QC</text></svg>">
<style>
:root{
  --bg:#050b14; --panel:rgba(11,24,41,.86); --ink:#e8eef6; --muted:#8fa6bf;
  --accent:#2ea3f2; --border:#1f3f63; --green:#2ecc71; --red:#ff5d55;
  --amber:#f5b942; --grey:#93a5b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  font-size:16px}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:1px}
h2{font-size:19px;margin:0 0 4px;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px;letter-spacing:2px}
/* Advice, not an error: amber and quiet, so it does not read as something the
   operator has done wrong before typing a single digit. */
.brw{background:rgba(196,132,26,.13);border:1px solid rgba(214,158,60,.42);
  border-radius:10px;padding:10px 12px;margin:0 0 14px}
.brw b{display:block;color:#e9b45c;font-size:13px;line-height:1.45;
  font-weight:600}
.brw span{display:block;color:var(--grey);font-size:12.5px;line-height:1.5;
  margin-top:5px}
/* Red inside an amber box on purpose: the amber line is advice, this one is a
   prohibition, and the operator has to be able to tell them apart at a glance. */
.brw u.no{display:block;color:var(--red);font-size:13px;line-height:1.45;
  font-weight:600;text-decoration:none;margin-top:6px}
/* A PDF where a photograph would go. It fills the same tile the pictures use,
   so the evidence strip keeps one shape whatever was attached. */
u.doc{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;width:100%;height:100%;background:#0a1523;text-decoration:none;padding:4px}
u.doc b{color:var(--amber);font-size:11px;letter-spacing:1px;font-weight:600}
u.doc i{font-style:normal;color:var(--grey);font-size:9.5px;line-height:1.25;
  text-align:center;word-break:break-all;max-height:26px;overflow:hidden}
.ri-zoom .doc-open{color:var(--accent);font-size:15px;text-align:center;
  padding:14px 18px;border:1px solid var(--border);border-radius:10px;
  background:var(--panel);max-width:80vw;word-break:break-all}
/* Storage trouble, on the checklist. Amber for the photographs, red for the
   answers: they are not the same size of problem and must not look alike. */
.swarn{background:rgba(196,132,26,.15);border:1px solid rgba(214,158,60,.5);
  border-radius:9px;padding:8px 11px;margin:8px 0 2px}
.swarn.bad{background:rgba(190,40,40,.16);border-color:rgba(230,90,90,.55)}
.swarn b{display:block;color:#e9b45c;font-size:12.5px;font-weight:600}
.swarn.bad b{color:#ff9b9b}
.swarn span{display:block;color:#d8c3a0;font-size:12px;line-height:1.45;
  margin-top:2px}
.swarn.bad span{color:#f0c4c4}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;background:#0c1b2d;color:var(--ink);
  border:1px solid var(--border);border-radius:9px;padding:13px;font-size:16px;
  font-family:inherit;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
button{font-family:inherit;font-size:16px;border-radius:10px;border:1px solid var(--border);
  background:#143253;color:var(--ink);padding:14px;width:100%;font-weight:600}
button:active{transform:scale(.99)}
.primary{background:linear-gradient(90deg,#1c6fb0,#2ea3f2);border-color:#4fb8ff;
  color:#04121e;font-size:17px;padding:17px;letter-spacing:1px}
/* La descarga del paquete, al terminar. Ámbar y con halo: es el único botón de
   la app que no está en la escala azul, porque es la única acción que, si no se
   hace, deja la inspección sin entregar. El halo late para que se distinga del
   botón de al lado incluso de reojo. */
.packet-dl{flex:1;background:linear-gradient(90deg,#d99a1f,#f5b942);
  border:1px solid #ffd479;color:#2a2413;font-size:14px;padding:13px 12px;
  font-weight:700;letter-spacing:.3px;line-height:1.3;
  box-shadow:0 0 0 0 rgba(245,185,66,.55);animation:aura 2.4s ease-out infinite}
@keyframes aura{
  0%{box-shadow:0 0 0 0 rgba(245,185,66,.5)}
  70%{box-shadow:0 0 0 14px rgba(245,185,66,0)}
  100%{box-shadow:0 0 0 0 rgba(245,185,66,0)}}
@media (prefers-reduced-motion:reduce){
  .packet-dl{animation:none;box-shadow:0 0 14px rgba(245,185,66,.45)}}
/* Ya descargado. Verde, quieto y con el visto: el botón deja de pedir atención
   porque ya no hace falta, y de un vistazo se sabe si queda algo por bajar. Se
   puede volver a pulsar — el ZIP se rearma igual — pero nada empuja a hacerlo. */
.packet-dl.done{background:linear-gradient(90deg,#1d6b46,#2f9e68);
  border-color:#57c98f;color:#eafaf1;animation:none;box-shadow:none}
.row{display:flex;margin:0 -5px}
.row>*{flex:1;margin:0 5px}
.bar{height:8px;background:#0c1b2d;border-radius:5px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1c6fb0,#2ea3f2);
  transition:width .25s}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;font-size:15.5px;
  line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;
  height:26px;border-radius:50%;background:var(--accent);color:#04121e;font-weight:700;
  font-size:14px;display:flex;align-items:center;justify-content:center}

/* Tabs. Only on the start screen and inside Admin: offering them mid-checklist
   would put a way to walk out of an unfinished inspection next to the answers. */
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;background:transparent;border:1px solid var(--border);
  color:var(--grey);padding:12px 8px;font-size:14px;letter-spacing:.5px}
.tabs button.on{background:rgba(46,163,242,.16);border-color:var(--accent);
  color:var(--accent)}
/* The reference catalogue used to be fifty-odd tappable rows on a screen of its
   own, with a text filter above them. It is a dropdown now, grouped by factory:
   one control instead of a screen, and no keyboard to reach a code. */
/* One selectable test. The box on the left is drawn, not an <input>: a real
   checkbox cannot be styled consistently across Android and iOS. */
.pk{display:flex;align-items:center;gap:11px;background:#0a1523;padding:11px 12px;
  margin-bottom:6px;text-align:left;font-size:14.5px;font-weight:500}
.pk.on{border-color:var(--accent);background:rgba(46,163,242,.12)}
.pk i{font-style:normal;flex:none;width:22px;height:22px;border-radius:6px;
  border:1px solid var(--border);display:flex;align-items:center;
  justify-content:center;font-size:13px;color:#04121e;background:#0c1b2d}
.pk.on i{background:var(--accent);border-color:var(--accent)}
.pk b{flex:1;font-weight:500}
.pk em{font-style:normal;font-size:10.5px;color:var(--grey);font-weight:700}

.grp{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  margin-bottom:10px;overflow:hidden}
.grp.done{border-color:#2b6b46}
.grp.bad{border-color:#7a3a36}
.grp-h{display:flex;align-items:center;padding:13px 14px;cursor:pointer}
.grp-h b{flex:1;color:var(--ink);font-size:14.5px;font-weight:600}
.grp-h em{font-style:normal;font-size:11px;font-weight:700;padding:3px 9px;
  border-radius:6px;background:#10273f;color:var(--muted);margin-right:8px}
.grp-h em.ok{background:rgba(46,204,113,.18);color:var(--green)}
.grp-h em.bad{background:rgba(255,93,85,.18);color:var(--red)}
.grp-h i{font-style:normal;color:var(--muted);font-size:15px;width:18px;text-align:center}
.grp-b{padding:0 14px 12px}
.help-b{width:28px;height:28px;padding:0;flex:none;margin-right:8px;border-radius:8px;
  background:#14304a;border:1px solid #2b5f92;color:var(--accent);font-size:17px;
  font-weight:700;line-height:1}
.help-b.on{background:var(--accent);color:#04121e;border-color:var(--accent)}
/* Marks the whole section N/A. Amber, not blue: it is not a help control, it
   answers fifteen points at once and deserves to look like a decision. */
.na-sec{width:auto;padding:0 9px;font-size:11.5px;letter-spacing:.5px;
  background:#2a2413;border-color:#6b5320;color:var(--amber)}
/* Applied. Filled instead of outlined, so the state of the section can be read
   from the button itself and pressing it again is visibly an undo. */
.na-sec.on{background:var(--amber);border-color:var(--amber);color:#2a2413;
  font-weight:700}
/* The same decision one level up: the whole test, marked from its own heading.
   Inline with the title so it reads as part of it, and never wider than the
   name it qualifies. */
.na-test{width:auto;display:inline-block;vertical-align:middle;margin-left:10px;
  padding:4px 10px;border-radius:8px;font-size:11.5px;letter-spacing:.5px;
  background:#2a2413;border:1px solid #6b5320;color:var(--amber);
  font-family:inherit;line-height:1.2}
.na-test.on{background:var(--amber);border-color:var(--amber);color:#2a2413;
  font-weight:700}
/* What the assignment code found, right under the field it was typed into. */
.asg{margin:8px 0 2px;padding:11px 12px;border-radius:9px;background:#0d1f33;
  border:1px solid #24466b;color:#cfe0f2;font-size:13.5px;line-height:1.5}
.asg b{display:block;color:var(--accent);font-size:12px;letter-spacing:.5px;
  margin-bottom:3px}
.asg span{display:block}
.asg .w{color:var(--amber);font-size:12.5px;margin-top:4px}
.asg.bad{background:#2b1614;border-color:#7a3a36;color:#f0c8c4}
/* An assignment that arrived. The markup has carried this class all along and
   nothing was ever styled for it, so the one box that means "HOKLAN has told
   you what to inspect" looked exactly like the neutral one — while its three
   failure states were all clearly red. Green, because the answer to the code
   is either an instruction or a problem, and the operator should be able to
   tell which from across the bench. */
.asg.ok{background:#0e2a1c;border-color:#2c6b46;color:#cdeddb}
.asg.ok b{color:var(--green)}
.asg .req{color:var(--amber);font-size:12.5px;margin-top:6px}
/* The unit count when it arrived fixed: the same chip, with nothing next to it
   to press. Reads as a value, not as a control left disabled. */
.units.fixed{pointer-events:none}
.units.fixed button{flex:0 0 auto;min-width:52px}
/* The header of a folded block: what is inside, said as a count, and the arrow.
   Same shape as a section header in the checklist, so it is already understood. */
.fold{display:flex;align-items:center;justify-content:space-between;
  background:#0a1523;border:1px solid #24466b;color:var(--ink);
  border-radius:9px;padding:12px 13px;font-size:14px;text-align:left}
.fold b{font-weight:600;color:var(--accent)}
.fold i{font-style:normal;color:var(--muted);font-size:13px}
.grp-help{margin:0 14px 12px;padding:11px;border-radius:9px;background:#0d1f33;
  border:1px solid #24466b;color:#cfe0f2;font-size:14px;line-height:1.55}
/* Three Han characters where the other two languages have three letters, so the
   type has to come down a notch to keep 不适用 off the border. */
.na-btn{font-size:11.5px !important;letter-spacing:0;font-weight:600}

/* The example photograph: small, quiet, and clearly not evidence. Bordered in
   blue rather than amber or green so it cannot be mistaken for something the
   operator has to complete. */
.samp{display:flex;align-items:center;gap:9px;margin-top:8px;padding:7px 9px;
  border:1px dashed #2b5d8a;border-radius:9px;background:rgba(46,163,242,.05)}
.samp img{width:64px;height:48px;object-fit:cover;border-radius:6px;
  border:1px solid #23507d;flex:none}
.samp span{font-size:11.5px;color:var(--muted);line-height:1.4}

/* A reading, next to the photograph of the instrument that gave it. Amber until
   it is filled in — the same colour every other pending requirement uses. */
.meas{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;
  border:1px solid var(--amber);border-radius:9px;background:rgba(245,185,66,.07)}
.meas.ok{border-color:#2b6b46;background:rgba(46,204,113,.06)}
.meas label{flex:none;margin:0;font-size:11.5px;letter-spacing:.6px;
  color:var(--amber);text-transform:uppercase}
.meas.ok label{color:#7fd1a2}
.meas input{flex:1;min-width:0;margin:0;padding:8px 10px;font-size:17px;
  font-weight:700;text-align:right;letter-spacing:1px}
.meas b{flex:none;font-size:13px;color:var(--muted);min-width:26px}

/* Código de barras: se muestra, no se escribe */
.meas.scan{align-items:center}
.meas.scan u{flex:1;text-align:right;font-size:19px;font-weight:700;
  letter-spacing:2px;text-decoration:none;color:#dff3e6;font-variant-numeric:tabular-nums}
.meas.scan u.wait{font-size:12.5px;font-weight:600;letter-spacing:.4px;
  color:var(--muted);font-style:italic}
/* Acotado a .ok: si no, gana por especificidad sobre .scan-msg b y pinta de
   verde el aviso de que el código no se leyó, que es justo lo contrario */
.meas.ok.scan b{font-size:10px;letter-spacing:.8px;text-transform:uppercase;
  color:#7fd1a2;min-width:0}
.meas.bad{border-color:#a8402f;background:rgba(200,70,50,.10)}
.meas.bad label{color:#ff9b86}
.scan-msg{flex:1;text-align:right;line-height:1.45}
.scan-msg b{display:block;font-size:13px;color:#ff9b86;letter-spacing:.4px;
  text-transform:none;min-width:0}
.scan-msg i{display:block;font-size:11.5px;color:#e0b6ab;font-style:normal}
.scan-msg em{display:block;margin-top:3px;font-size:11px;color:var(--muted);
  font-style:italic}

/* One question, with a row per speaker underneath it */
.q{border-top:1px solid #16304d;padding-top:4px}
.q:first-child{border-top:none}
.q-h{font-size:14.5px;line-height:1.4;color:#e8f1fb;padding:9px 0 3px;
  font-weight:600}
.q .pt{border-top:none;padding:5px 0}
.q .pt u{flex:0 0 76px;margin-right:auto;text-decoration:none;font-size:11px;
  font-weight:700;letter-spacing:.5px;color:var(--accent);background:#0f2c47;
  border:1px solid #23507d;border-radius:5px;padding:5px 0;text-align:center}
.q .pt u + span{display:none}   /* the question is already written above */

.pt{display:flex;align-items:center;gap:0;padding:9px 0;
  border-top:1px solid #16304d}
.pt:first-child{border-top:none}
.pt span{flex:1;font-size:14.5px;line-height:1.35;padding-right:8px}
/* Evidence box for a failed point */
.pf{background:rgba(122,34,28,.28);border:1px solid var(--red);border-radius:9px;
  padding:11px;margin:2px 0 10px}
.pf-h{font-size:12px;font-weight:700;color:#ffc9c5;letter-spacing:.5px;
  margin-bottom:9px}
.pf textarea{min-height:64px;margin-top:9px;font-size:15px}
/* The photo a point demands even when it passes. Quieter than the red defect
   box: it is documentation, not a finding. */
.pshot{margin:0 0 10px;padding:9px 10px;border-radius:9px;background:#0c1b2d;
  border:1px solid var(--border)}
.pshot.miss{border-color:#6b5320;background:#1a1a0d}
.pshot em{display:block;font-style:normal;font-size:12px;color:var(--amber);
  margin-top:7px}
.pshot button{padding:9px;font-size:14px}
.pf-w{background:rgba(245,185,66,.16);border:1px solid var(--amber);
  border-radius:7px;padding:8px 10px;font-size:12.5px;color:#ffe9bd;margin-top:9px}
.pf-ok{background:rgba(30,120,70,.18);border:1px solid var(--green);
  border-radius:7px;padding:8px 10px;font-size:12.5px;color:#b6f0cd;margin-top:9px;
  font-weight:600}
/* Folded evidence: one green line, tappable to reopen */
.pf-c{display:flex;align-items:center;gap:8px;cursor:pointer;
  background:rgba(30,120,70,.16);border:1px solid var(--green);border-radius:9px;
  padding:9px 11px;margin:2px 0 10px}
.pf-c b{color:var(--green);font-size:14px;flex:none}
.pf-c span{flex:1;color:#b6f0cd;font-size:12.5px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-c i{color:var(--green);font-style:normal;font-size:13px;flex:none}
.p-help{width:auto;padding:4px 0 9px;background:none;border:none;
  color:var(--accent);font-size:12.5px;font-weight:600;text-align:left;
  letter-spacing:.3px}
.p-help.on{color:var(--muted)}
.pt-help{color:#cfe0f2;font-size:13.5px;line-height:1.55;
  border-left:2px solid var(--accent);padding:2px 0 11px 10px;margin:0 0 6px 2px}
.pt button{width:42px;padding:9px 0;font-size:16px;font-weight:700;flex:none;
  margin-left:5px;background:#0f2438;border-color:#26466b;color:var(--muted)}
.pt button.on-p{background:#14663a;border-color:var(--green);color:#d8ffe8}
.pt button.on-f{background:#7a221c;border-color:var(--red);color:#ffe3e1}
.pt button.on-n{background:#33414f;border-color:var(--grey);color:#e6edf4}

.shot{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px;margin-bottom:10px}
.shot.ok{border-color:#2b6b46}
.shot-head{display:flex;align-items:center;margin-bottom:9px}
.shot-head b{flex:1;font-size:15px}
/* The marking of the control a point belongs to — B1, P1, C4 — as it is printed
   on the cabinet. A colour of its own so the eye finds it before the sentence:
   the operator is looking at the panel, not at the phone. */
.ctl{flex:none;font-style:normal;font-weight:700;font-size:11.5px;
  letter-spacing:.5px;padding:2px 8px;border-radius:6px;margin-right:9px;
  background:rgba(214,60,168,.18);border:1px solid rgba(232,96,190,.5);
  color:#f08ad4}
/* The panel photograph on the checklist. Wide and tall enough to pick a button
   out of it at arm's length, which a thumbnail is not. */
.panel-ref{padding:12px}
.pr-box{background:#050b14;border:1px solid var(--border);border-radius:9px;
  padding:8px;display:flex;justify-content:center;cursor:zoom-in}
.pr-box img{max-width:100%;max-height:260px;display:block;border-radius:5px}
.shot-head em{font-style:normal;font-size:11px;font-weight:700;padding:3px 8px;
  border-radius:6px;background:rgba(46,204,113,.18);color:var(--green)}
.shot-head em.miss{background:rgba(245,185,66,.18);color:var(--amber)}
.shot-head em.na{background:#33414f;color:#e6edf4}

.jump{background:none;border:none;color:var(--accent);font-size:13px;padding:6px 0;
  width:auto;text-align:left;font-weight:600}
.ix{display:flex;align-items:center;padding:14px 0;border-top:1px solid #16304d}
.ix:first-child{border-top:none}
.ix b{width:26px;color:var(--muted);font-size:13px;flex:none}
.ix span{flex:1;font-size:15px}
.ix i{font-style:normal;font-size:12px;color:var(--muted);display:block;margin-top:2px}
.ix em{font-style:normal;font-size:12px;font-weight:700;padding:4px 9px;
  border-radius:6px;background:#10273f;color:var(--muted);flex:none}
.ix em.PASS{background:rgba(46,204,113,.18);color:var(--green)}
.ix em.FAIL{background:rgba(255,93,85,.18);color:var(--red)}
.ix em.now{background:var(--accent);color:#04121e}

.media{display:flex;flex-wrap:wrap;margin:10px -5px 0}
.thumb{position:relative;width:78px;height:78px;border-radius:9px;overflow:hidden;
  border:1px solid var(--border);background:#0c1b2d;margin:0 5px 10px}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb b{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);
  font-size:10px;text-align:center;padding:2px;font-weight:400}
.thumb span{position:absolute;top:2px;right:2px;background:rgba(255,93,85,.9);
  width:20px;height:20px;border-radius:50%;font-size:13px;display:flex;
  align-items:center;justify-content:center;font-weight:700}

.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 9px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 22%);display:flex;
  max-width:640px;margin:0 auto}
.actions>button{margin:0 5px}
.skip{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 4px;border-bottom:1px solid #16304d}
td:last-child{text-align:right;font-weight:700}
/* Verdict colours. The class comes from verdictClass(), never from the verdict
   itself: the verdict for a skipped test is the string "N/A", and a class with
   a slash in it is not a valid selector — those rows printed with no colour at
   all until this was routed through a mapping. */
.PASS{color:var(--green)} .FAIL{color:var(--red)} .NA{color:var(--grey)}
.INCOMPLETE{color:var(--amber)}
.big{font-size:34px;font-weight:700;text-align:center;padding:20px;border-radius:12px;
  letter-spacing:3px;margin-bottom:14px}
.hint{color:var(--muted);font-size:13px;line-height:1.5;margin-top:10px}
.warn{background:rgba(122,34,28,.5);border:1px solid var(--red);border-radius:9px;
  padding:11px;font-size:14px;margin-top:10px}
.needed{background:rgba(245,185,66,.15);border:1px solid var(--amber);
  border-radius:9px;padding:11px;font-size:14px;margin-top:10px;color:#ffe9bd}
/* Always-reachable way back to the start screen, from anywhere in a long
   inspection. */
.totop{position:fixed;right:14px;width:auto;padding:9px 16px;border-radius:22px;
  bottom:calc(78px + env(safe-area-inset-bottom));background:#14304a;
  border:1px solid var(--accent);color:var(--accent);font-size:13px;
  font-weight:700;letter-spacing:1px;
  box-shadow:0 3px 12px rgba(0,0,0,.5);display:none;z-index:5}
.totop.show{display:block}
.hidden{display:none}
/* The English line under a note. Deliberately quiet: it is a reading aid for
   the office, not something the operator has to check. */
/* Where the app just took you. Two slow pulses: long enough to find with the
   eye, short enough that it is gone by the time you start typing. */
@keyframes flash{
  0%,100%{box-shadow:0 0 0 0 rgba(46,163,242,0)}
  25%,75%{box-shadow:0 0 0 3px rgba(46,163,242,.55)}
}
.flash{animation:flash 1.1s ease-in-out 2;border-radius:12px}
.en-line{font-size:12px;line-height:1.45;color:#8fa6bd;margin-top:6px;
  padding-left:8px;border-left:2px solid rgba(143,166,189,.35);
  white-space:pre-wrap}
/* No-JavaScript fallback */
.nojs{margin-top:60px;background:#10273f;border:1px solid var(--accent);
  border-radius:12px;padding:22px;text-align:center}
.nojs b{display:block;font-size:22px;letter-spacing:3px;color:var(--accent);
  margin-bottom:14px}
.nojs p{font-size:15px;line-height:1.6;color:#e8f1fb;margin:0 0 14px}
.nojs p.sm{font-size:13px;color:var(--muted);margin-bottom:0}
/* What the evidence should show. Stated where the camera button is, not in a
   manual: an instruction the operator reads three weeks before the photo does
   not change the photo. */
.ask{list-style:none;margin:0 0 11px;padding:0}
.ask li{font-size:12.5px;line-height:1.5;color:#bcd0e4;padding:5px 0 5px 11px;
  border-left:2px solid #23507d;margin-bottom:5px}
.ask li b{color:var(--accent);font-weight:600;margin-right:4px}
/* What the packet contains, listed before it is built */
.packet{list-style:none;margin:0 0 10px;padding:0}
.packet li{padding:7px 0 7px 12px;border-left:2px solid var(--accent);
  margin-bottom:6px;font-size:13px;line-height:1.45;color:#cfe0f2}
.packet li b{color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace}
/* How many speakers this inspection covers: 1-5, one tap */
.units{display:flex;gap:7px;margin-top:4px}
.units button{flex:1;padding:12px 0;font-size:17px;font-weight:700;
  background:#0f2438;border:1px solid #26466b;color:var(--muted);margin:0}
.units button.on{background:var(--accent);border-color:var(--accent);color:#04121f}
/* Which speaker is on the bench right now */
.unit-tag{display:inline-block;background:var(--accent);color:#04121f;
  border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;
  letter-spacing:.6px;margin-right:6px}
/* Reference photo: one compact row, so the form still fits on one screen and the
   START button stays within thumb reach. A large picture here would push the
   button below the fold for a glance that lasts a second. */
.refimg{display:flex;gap:11px;align-items:center;background:#0c1b2d;
  border:1px solid var(--border);border-radius:9px;padding:9px;margin-top:9px}
.refimg .ri-thumb{width:58px;height:58px;flex:none;border-radius:7px;
  background:#0a1523;border:1px solid var(--border);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.refimg img{width:100%;height:100%;object-fit:contain;display:none}
.refimg.ok img{display:block}
.refimg.ok .ri-thumb{cursor:zoom-in}
.refimg .ri-txt{min-width:0}
.refimg .ri-txt b{display:block;font-size:13px;font-weight:600}
.refimg .ri-txt span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.refimg.miss{border-style:dashed;background:#0a1523}
/* Enlarged. Tapping anywhere closes it: on a phone, hunting for an × with one
   hand while holding a speaker in the other is not a design. */
.ri-zoom{position:fixed;inset:0;z-index:60;background:rgba(3,8,15,.94);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:22px}
.ri-zoom img,.ri-zoom video{max-width:100%;max-height:76vh;object-fit:contain;
  border-radius:10px}
.ri-zoom span{color:var(--muted);font-size:13px;letter-spacing:1px}

/* The erase sheet. Every row says what it holds before offering to remove it:
   "erase data" with no object is how an afternoon of photographs disappears. */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(3,8,15,.94);
  overflow-y:auto;padding:20px 14px}
.sheet-in{max-width:520px;margin:0 auto}
.sheet h3{margin:0 0 3px;font-size:17px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.5}
.sheet h4{margin:16px 0 7px;font-size:10.5px;letter-spacing:1.2px;
  color:var(--grey);font-weight:600}
.wrow{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--border);border-radius:11px;padding:11px 12px;
  margin-bottom:6px}
.wrow div{flex:1;min-width:0}
.wrow b{display:block;font-size:13px;font-weight:600}
.wrow span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.wrow em{display:block;font-style:normal;font-size:11px;color:var(--amber);
  margin-top:3px}
.wrow button{width:auto;flex:none;padding:7px 11px;font-size:12.5px;
  background:none;border-color:#7a3a36;color:var(--red)}
.wrow.off{opacity:.45}
.wrow.off b,.wrow.off span{color:var(--grey)}
.wrow button[disabled]{border-color:#16304d;color:#3d4f63}
.wall{border-top:1px solid var(--border);margin-top:15px;padding-top:13px}
.wall button{background:rgba(255,93,85,.1);border-color:#7a3a36;
  color:var(--red);font-weight:700}
.wall span{display:block;font-size:11px;color:var(--muted);margin-top:6px;
  text-align:center;line-height:1.45}
.sheet-x{margin-top:12px;background:none;color:var(--muted)}

.tag{display:inline-block;background:#10273f;border:1px solid var(--border);
  border-radius:6px;padding:3px 9px;font-size:12px;color:var(--muted);margin-right:6px}
/* Result of the test-ID lookup: same weight in both directions, so a wrong
   code is as obvious as a right one. */
.code{margin:10px 0 0;padding:11px;border-radius:9px;text-align:center;
  font-size:17px;font-weight:700;letter-spacing:1px}
.code.ok{background:rgba(46,204,113,.15);border:1px solid var(--green);
  color:var(--green)}
.code.bad{background:rgba(255,93,85,.15);border:1px solid var(--red);
  color:var(--red);letter-spacing:0}
input.bad{border-color:var(--red)}
.lang{display:flex;justify-content:center;margin-bottom:14px}
/* Three languages have to fit on a 320 px screen, so the padding is tighter
   than a two-button bar would need. */
.lang button{width:auto;padding:7px 13px;margin:0 3px;font-size:13.5px;
  background:#0c1b2d;color:var(--muted)}
.lang button.on{background:var(--accent);color:#04121e;border-color:var(--accent)}
/* Compact variant for screens where the language switch must not take space
   away from the checklist itself. */
.lang.mini{justify-content:flex-end;margin-bottom:8px}
.lang.mini button{padding:4px 11px;margin:0 0 0 5px;font-size:11.5px;
  border-radius:7px}

#report{background:#fff;color:#16212e;padding:10px;border-radius:10px}
@media print{
  /* Browsers drop background colours when printing unless told otherwise, and
     the watermark is a background: without this it prints blank. */
  body{background:#fff;padding:0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{max-width:none;padding:0}
  .actions,.noprint{display:none !important}
  #report{padding:0;border-radius:0}
}

  "plans": {
    "default": {
      "plan_version": 103,
      "tests": [
        /* ------------------------------------------------------------------
           RHYME: mains-powered cabinets.

           None of these carries a battery. They do not switch on, and nothing
           else in the plan can be checked, until the cabinet is plugged into
           the wall, which is why this test runs first.

           The two BAS references are powered subwoofers and share almost
           nothing else with the rest of the factory: no USB, no Bluetooth, no
           display, no remote, no input channels. They run this test and their
           own three, and are excluded by name from everything that assumes a
           full-range cabinet. Adding a new BAS reference means adding it to
           those skip lists as well as here; grep for HK-BAS115A1 to find them
           all.
           ------------------------------------------------------------------ */
        {/* Los subwoofers ya no la corren: su interruptor se comprueba dentro de
            ENTRADAS, que es la prueba donde se enciende el equipo por primera
            vez en su plan. */
         "id":"POWER_AC","optional":false,"only_factory":["RHY"],"evidence":["photo"],
         "skip":["HK-BAS115A1","HK-BAS118A1"],
         "label":{"en":"AC POWER","zh":"交流供电","es":"ALIMENTACIÓN AC"},
         "steps":[
           {"en":"Connect the power cable and switch the cabinet on","zh":"接上电源线并开机","es":"Conecte el cable de alimentación y encienda la cabina"},
           {"en":"Check the switch, the start-up and the outputs","zh":"检查开关、开机过程与输出","es":"Revise el interruptor, el arranque y las salidas"}],
         "points":[
           {/* El selector de voltaje salió de aquí a su propia prueba, que corre
                antes de PARTES INTERNAS y pide la fotografía. El fusible y el
                cable de alimentación salieron por decisión de HOKLAN. */
            "section":{"en":"Powered on","zh":"通电后","es":"Con la cabina encendida"},
            "help":{"en":"Plug the cabinet in and switch it on.",
                    "zh":"接入市电并开机。",
                    "es":"Conecte la cabina y enciéndala."}},
           {"id":"power_switch","code":"PWR-008","label":{"en":"POWER switch","zh":"电源开关","es":"Interruptor ENCENDIDO"},
            "help":{"en":"It must switch on and off firmly, without stopping halfway. If the switch has a pilot lamp, the lamp must light with it.",
                    "zh":"开关应干脆地开和关，不应停在中间位置。若开关带指示灯，指示灯应随之点亮。",
                    "es":"Debe encender y apagar con firmeza, sin quedarse a medio camino. Si el interruptor tiene piloto, debe encender con él."}},
           {"id":"powers_up","code":"PWR-001","label":{"en":"Cabinet starts on mains power","zh":"接入市电后正常开机","es":"La cabina enciende conectada a la red"},
            "help":{"en":"Connect and switch on. It must start on its own, with no thump or crack from the drivers as it comes up.",
                    "zh":"接电开机，应自行启动，开机瞬间喇叭不应有砰声或爆音。",
                    "es":"Conecte y encienda. Debe arrancar sola, sin golpes ni chasquidos en los parlantes al encender."}},
           {"id":"ac_out","code":"PWR-009","only":["HK-EPS112A1"],
            "label":{"en":"POWERCON AC output","zh":"POWERCON 交流输出","es":"Salida de CA POWERCON"},
            "help":{"en":"Connect a second unit to the AC OUT and confirm it receives power. Turn the connector to its lock: it must latch and must not pull out when the cable is tugged.",
                    "zh":"将第二台设备接到交流输出，确认其得电。将接头旋至锁定位：应能锁住，拉扯电缆时不应脱落。",
                    "es":"Conecte un segundo equipo a la SALIDA DE CA y confirme que recibe corriente. Gire el conector hasta el bloqueo: debe trabar y no salirse al tirar del cable."}}]},

        /* ---------------- RHYME subwoofers: HK-BAS115A1, HK-BAS118A1 -------
           A powered sub has no source, no display and no channels. What it does
           have — and what nobody was checking — is a phase switch and a filtered
           120 Hz output. A sub wired out of phase passes every test in the old
           plan without a single mark and then sounds hollow in the assembled
           system, because it is cancelling the very bass it was bought for.

           El filtro pasa-bajos salió del plan por decisión de HOKLAN: sus dos
           puntos, 80 Hz y 200 Hz, y el código AUD-016 con ellos.
           ------------------------------------------------------------------ */
        {/* Antes era una sola prueba, ENTRADAS Y SALIDAS. Se separó porque son
            dos montajes distintos: la entrada se alimenta desde el mixer y la
            salida necesita una segunda cabina conectada detrás. */
         "id":"SUB_IN","optional":false,"only_factory":["RHY"],"evidence":["video"],
         "only":["HK-BAS115A1","HK-BAS118A1"],
         "label":{"en":"INPUTS","zh":"输入","es":"ENTRADAS"},
         "steps":[
           {"en":"Switch the cabinet on and check the fan and the pilot","zh":"开机并检查风扇与指示灯","es":"Encienda la cabina y compruebe el ventilador y el testigo"},
           {"en":"Play La rubia de oro from the mixer","zh":"用调音台播放《La rubia de oro》","es":"Reproduzca La rubia de oro desde el mixer"},
           {"en":"Feed it into the input jacks, one side at a time","zh":"分别接入左右输入口，一次只接一侧","es":"Llévela a las entradas, un lado a la vez"},
           {"en":"Raise and lower the volume on each side","zh":"在每一侧上下调节音量","es":"Suba y baje el volumen en cada lado"},
           {"en":"One video for the whole test, no photos","zh":"整项测试录制一段视频，无需照片","es":"Un solo video para toda la prueba, sin fotos"}],
         "points":[
           {"section":{"en":"Switching on","zh":"开机","es":"Encendido"},
            "help":{"en":"The first time the cabinet is switched on in this plan.",
                    "zh":"本计划中首次给音箱通电开机。",
                    "es":"El primer encendido de la cabina en este plan."}},
           {"id":"power_switch","code":"PWR-008",
            "label":{"en":"POWER switch — fan turns and the pilot lights green","zh":"电源开关 — 风扇转动且指示灯亮绿","es":"Interruptor ENCENDIDO — el ventilador gira y el testigo enciende en verde"},
            "help":{"en":"Press the switch. It must latch firmly, without stopping halfway. The fan must start turning and the pilot lamp must light green.",
                    "zh":"按下开关。应干脆到位，不应停在中间位置。风扇应开始转动，指示灯应亮起绿色。",
                    "es":"Presione el interruptor. Debe quedar firme, sin pararse a medio camino. El ventilador debe empezar a girar y el testigo debe encender en color verde."}},
           {"section":{"en":"The source and the bench","zh":"信号源与工位","es":"La fuente y el montaje"},
            "help":{"en":"Play the HOKLAN Aging playlist from the mixer. Connect the outputs of the cabinet to a DEL103, which is what makes the phase change audible. One video covers the whole test — no photographs are asked for here.",
                    "zh":"用调音台播放 HOKLAN Aging 歌单。将本机的输出接到一台 DEL103——相位切换要靠它才听得出来。整项测试用一段视频记录，此处不需要照片。",
                    "es":"Reproduzca desde el mixer la lista de música HOKLAN de Aging. Conecte las salidas de la cabina a un DEL103, que es lo que permite oír el cambio de fase. Un solo video cubre toda la prueba — aquí no se piden fotografías."}},
           {"section":{"en":"The two inputs","zh":"两个输入口","es":"Las dos entradas"},
            "help":{"en":"They are hybrid jacks: the same socket takes an XLR plug or a 6.3 mm one. Check one side at a time, never both connected at once.",
                    "zh":"这是复合插孔：同一个孔既可插 XLR，也可插 6.3 mm 插头。一次只接一侧检查，不要两侧同时接入。",
                    "es":"Son jacks híbridos: el mismo conector recibe un plug XLR o uno de 6.3 mm. Revise un lado a la vez, nunca con las dos conectadas."}},
           {/* El barrido de volumen era un punto suelto —«la intensidad sigue al
                volumen»— que se respondía una sola vez, después de haber probado
                las dos entradas. Así no decía de cuál de las dos hablaba: una
                cabina con la entrada derecha muerta en media escala aprobaba el
                punto con la izquierda. Ahora cada entrada lleva su propio
                barrido, dentro de la misma toma, y la sección queda en dos. */
            "id":"in_l","code":"AUX-001",
            "label":{"en":"Input L — hybrid 6.3 mm / XLR","zh":"输入 L — 6.3 mm / XLR 复合口","es":"Entrada izquierda — híbrida 6.3 mm / XLR"},
            "help":{"en":"Feed the mixer into the L input only. Audio must come through. Try both plug types in the same socket: first the XLR, then the 6.3 mm. With the track playing, raise the volume to maximum and bring it back down to minimum: the sound must follow the knob the whole way, with no dead spots and no jumps.",
                    "zh":"仅将调音台接入 L 输入，应有声音传出。同一个孔要试两种插头：先试 XLR，再试 6.3 mm。在播放状态下将音量调到最大再调回最小：声音应全程随旋钮变化，不应有死区或跳变。",
                    "es":"Lleve el mixer sólo a la entrada L. Debe entrar audio. Pruebe los dos tipos de plug en el mismo jack: primero el XLR y luego el de 6.3 mm. Con la pista sonando, suba el volumen al máximo y bájelo al mínimo: el sonido debe seguir a la perilla en todo el recorrido, sin zonas muertas ni saltos."}},
           {"id":"in_r","code":"AUX-001",
            "label":{"en":"Input R — hybrid 6.3 mm / XLR","zh":"输入 R — 6.3 mm / XLR 复合口","es":"Entrada derecha — híbrida 6.3 mm / XLR"},

        /* CONTROLES y AUDIO se retiraron en el plan 97, a petición de HOKLAN.

           normal cada punto pide lo que necesita — foto, medida o juicio — y el
